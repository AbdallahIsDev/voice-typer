# Pre-commit hooks for Voice Typer
#
# Hook installation architecture (XS-34):
#   Husky is the SOLE installer of git hooks. `npm install` in
#   `voice_typer/client/` runs the `prepare` script (`cd ../.. && husky`),
#   which sets `core.hooksPath = .husky/_` and installs husky's wrappers
#   for every file in `.husky/` (currently `pre-commit` and `pre-push`).
#   Husky's `.husky/pre-commit` runs `lint-staged` (biome --write on
#   staged client files) and then delegates to `pre-commit run` for the
#   full hook suite declared below.
#
#   `pre-commit install` (the pre-commit framework's own installer) is
#   NOT used. It writes to `.git/hooks/`, which git ignores because
#   `core.hooksPath` is `.husky/_/`. Running it is harmless (its hook
#   file is never invoked) but misleading — contributors who run it
#   expecting "install the hooks" get no effect. The correct install
#   command is just `npm install` in `voice_typer/client/`.
#
#   `pre-commit run` (without `install`) reads this file directly and
#   invokes the hooks against the working tree. It is the entry point
#   used by husky's pre-commit wrapper.
#
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        # SAFE FIXES ONLY: `--fix` applies ruff's safe, behavior-preserving
        # autofixes. `--unsafe-fixes` was removed because unsafe fixes can
        # rewrite semantics (e.g. deleting "unused" imports that are
        # actually relied on via TYPE_CHECKING side-effects, or restructuring
        # try/except blocks in ways that change which exceptions are caught).
        # The ruff-baseline.json + scripts/ruff_ratchet_check.py ratchet is
        # the safety net for any residual lint debt — unsafe rewrites
        # should be applied by a human, not silently on every commit.
        args: [--fix]
      - id: ruff-format
        args: [--check]

  # XS-35: mypy is a LOCAL hook with `language: system` so it reuses the
  # project venv (`.venv/bin/python -m mypy`) instead of creating a
  # fresh venv via mirrors-mypy. The previous mirrors-mypy config
  # declared `additional_dependencies: [numpy, torch, transformers,
  # pydantic, sounddevice, pystray]`, which caused pre-commit to spin
  # up an isolated venv and reinstall torch (~2GB, 5-10 min) on the
  # first `pre-commit run mypy` invocation. With `language: system`,
  # mypy uses the deps already installed by `uv pip install -e
  # ".[test,dev]"` — no torch reinstall, no isolated venv, ~5s cold.
  #
  # mypy is at `stages: [pre-push]` so it does NOT run on every commit.
  # Contributors who want mypy on every commit can run
  # `pre-commit run mypy --all-files` manually.
  #
  # The entry uses `python -m mypy` (not bare `mypy`) so it works on
  # Windows where `.venv/Scripts/mypy.exe` may not be on PATH but
  # `.venv/Scripts/python.exe` is (via the activated venv). The
  # contributor must activate the project venv before running
  # `pre-commit run mypy` — same convention as the `check-branding`
  # local hook below.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (server, project venv)
        entry: python -m mypy
        language: system
        files: ^voice_typer/server/
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: |
          (?x)(
            ^\.devcontainer/devcontainer\.json$|
            ^voice_typer/client/tsconfig\.web\.json$|
            ^voice_typer/client/tsconfig\.node\.json$
          )
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: biome-check
        name: Biome check (client)
        entry: node scripts/pre-commit-runner.cjs biome-check
        language: system
        files: ^voice_typer/client/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: client-typecheck
        name: TypeScript typecheck (client)
        entry: node scripts/pre-commit-runner.cjs client-typecheck
        language: system
        files: ^voice_typer/client/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: check-branding
        name: Check hardcoded app name
        entry: python scripts/check_branding.py
        language: system
        files: ^voice_typer/(server|client/src)/.*\.(py|ts|tsx|html)$
        pass_filenames: false
      # XZ-14-11: The reserved-hotkey JSON is intentionally duplicated
      # (byte-identical copy) between voice_typer/server/ and
      # voice_typer/client/src/renderer/src/data/ because the @server
      # Vite alias resolved outside the renderer root and crashed Vite's
      # dev server during HMR on locale switch. This hook runs the sync
      # test so any drift between the two copies blocks the commit.
      # If this hook fails, run:
      #   cp voice_typer/server/hotkey_reserved.json \
      #      voice_typer/client/src/renderer/src/data/hotkey_reserved.json
      - id: hotkey-reserved-sync
        name: Hotkey reserved JSON sync (server <-> client copy)
        entry: node scripts/pre-commit-runner.cjs hotkey-reserved-sync
        language: system
        files: ^voice_typer/(server/hotkey_reserved\.json|client/src/renderer/src/data/hotkey_reserved\.json)$
        pass_filenames: false
