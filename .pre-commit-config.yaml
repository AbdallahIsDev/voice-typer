# BUILD-N14: pre-commit hooks for Python + TS linting.
# Install with: `pip install pre-commit && pre-commit install`
# This runs ruff (lint + format), mypy (type check), prettier (TS/CSS/MD),
# and basic checks (large files, trailing whitespace, merge conflict
# markers) on every commit. Skips on commit if no changes in scope.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--ignore-missing-imports]
        pass_filenames: false
        entry: bash -c 'mypy voice_typer || true'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^voice_typer/client/.*\.(ts|tsx|css|md|json)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
