# Pre-commit hooks for Voice Typer
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^voice_typer/server/
        # CR-183: pre-CR-183 this hook passed `args: [--ignore-missing-imports,
        # --no-strict-optional]` which OVERRIDES pyproject.toml's
        # `[tool.mypy]` settings (`ignore_missing_imports = false`,
        # per-module overrides, strict-optional enabled). The result was
        # a contributor's `pre-commit run mypy` passing cleanly while CI
        # mypy failed with errors the pre-commit hook had hidden. The
        # `args:` line is removed entirely so mypy reads pyproject.toml.
        # `additional_dependencies` is populated with the project's
        # runtime deps so mypy can actually resolve imports (pre-CR-183
        # it was `[]`, so mypy couldn't import numpy/torch/etc. and
        # silently emitted `--ignore-missing-imports`-suppressed errors).
        # CQ-058: numpy 2.x stubs use `type` (PEP 695, Python 3.12+), but
        # python_version in pyproject.toml is "3.10". Pin numpy<2 so mypy
        # can parse the stubs under the target language level.
        additional_dependencies: ["numpy<2", torch, transformers, pydantic, sounddevice, pystray]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: |
          (?x)(
            ^\.devcontainer/devcontainer\.json$|
            ^voice_typer/client/tsconfig\.web\.json$|
            ^voice_typer/client/tsconfig\.node\.json$
          )
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: biome-check
        name: Biome check (client)
        entry: bash -c 'cd voice_typer/client && npx biome check'
        language: system
        files: ^voice_typer/client/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: client-typecheck
        name: TypeScript typecheck (client)
        entry: bash -c 'cd voice_typer/client && npm run typecheck'
        language: system
        files: ^voice_typer/client/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: check-branding
        name: Check hardcoded app name
        entry: python scripts/check_branding.py
        language: system
        files: ^voice_typer/(server|client/src)/.*\.(py|ts|tsx|html)$
        pass_filenames: false
      # XZ-14-11: The reserved-hotkey JSON is intentionally duplicated
      # (byte-identical copy) between voice_typer/server/ and
      # voice_typer/client/src/renderer/src/data/ because the @server
      # Vite alias resolved outside the renderer root and crashed Vite's
      # dev server during HMR on locale switch. This hook runs the sync
      # test so any drift between the two copies blocks the commit.
      # If this hook fails, run:
      #   cp voice_typer/server/hotkey_reserved.json \
      #      voice_typer/client/src/renderer/src/data/hotkey_reserved.json
      - id: hotkey-reserved-sync
        name: Hotkey reserved JSON sync (server <-> client copy)
        entry: bash -c 'python -m pytest tests/test_hotkey_reserved_sync.py -q --no-cov'
        language: system
        files: ^voice_typer/(server/hotkey_reserved\.json|client/src/renderer/src/data/hotkey_reserved\.json)$
        pass_filenames: false
