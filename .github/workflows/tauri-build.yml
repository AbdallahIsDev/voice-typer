# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/download-artifact@v8 — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v7   — Node 24 runtime (v4 = Node 20, deprecated)
# See build.yml header for full rationale + breaking-change analysis.
# -----------------------------------------------------------------------------
# Voice Typer — Tauri build (top-level orchestrator workflow)
#
# ADR-0020 Phases 1-5: this is the CROSS-CUTTING top-level workflow that
# fans out to the three per-platform Tauri build workflows owned by
# sub-agents #5 (Windows), #6 (macOS), #7 (Linux). Each per-platform
# workflow is responsible for: Nuitka sidecar build, prewarm build,
# native hotkey compile, `cargo tauri build`, code signing, and artifact
# upload. This workflow just calls them via `workflow_call` and aggregates
# the artifacts.
#
# Per ADR-0020 §15: NO auto-update. This workflow is triggered MANUALLY
# only (`workflow_dispatch`) — it is NOT triggered on push or tag, and it
# does NOT emit a `latest.json` updater manifest. Releases are
# manual-download only, matching today's Electron release model. The
# `validate` job below runs the same fail-fast config-drift gate as the
# per-platform workflows (identifier↔appId parity, bundle.icon↔git
# lockstep, config↔script registry pairs) BEFORE fanning out, so a drift
# regression dies in ~1 minute instead of after the first 30-60 min
# platform build. Each platform's own gate guard lives INSIDE that
# platform's workflow (macOS bundle jobs `if: true`; Linux bundle job
# gated to `workflow_dispatch`/`workflow_call`; Windows matrix job
# dispatch-enabled) — no top-level `if: false` remains anywhere.
#
# Reusable per-platform workflows (must exist in .github/workflows/):
#   - tauri-windows-build.yml  (owned by sub-agent #5)
#   - tauri-macos-build.yml    (owned by sub-agent #6)
#   - tauri-linux-build.yml    (owned by sub-agent #7)
#
# Each per-platform workflow MUST:
#   - accept `workflow_call` trigger
#   - accept input `target` (string, optional — defaults to host triple)
#   - accept input `sign`   (boolean, optional — default false)
#   - upload its installer(s) as a workflow artifact named
#     `tauri-<platform>-installer` for aggregation below
# =============================================================================
name: Tauri Build (all platforms)

on:
  workflow_dispatch:
    inputs:
      # Optional: restrict to a single platform. Defaults to all three.
      platform:
        description: "Platform to build (windows | macos | linux | all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      # Optional: Rust target triple passed through to the per-platform
      # workflows. Leave empty for host-triple build; set to e.g.
      # `aarch64-pc-windows-msvc` for Windows-on-ARM, etc.
      target:
        description: "Rust target triple (empty = host triple)"
        required: false
        default: ""
        type: string
      # Whether to code-sign + notarize. Requires the platform's signing
      # secrets to be present in the repo. See docs/migration/signing-guide.md.
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
      # S5-CR-74: surface python-build-standalone pin as workflow_dispatch
      # inputs so a maintainer can bump the PYBS release per-dispatch WITHOUT
      # editing the workflow file. Passed through to tauri-windows-build.yml's
      # workflow_call inputs (which also accept these as workflow_dispatch
      # inputs with the same defaults). The Linux Tauri workflow auto-fetches
      # the latest PYBS release via the GitHub API (no pin needed); the macOS
      # Tauri workflow uses the system Python via setup-python@v7.
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD) — Windows only"
        required: false
        default: "20241219"
        type: string
      pybs_version:
        description: "CPython version (e.g. 3.12.8) — Windows only"
        required: false
        default: "3.12.8"
        type: string

# A single release build should never be cancelled mid-flight — but two
# manual dispatches for the same platform SHOULD cancel the older one so
# we don't waste macOS-notarization minutes (the slowest job, ~10 min/arch).
concurrency:
  group: tauri-build-${{ github.event.inputs.platform || 'all' }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read   # only the per-platform workflows (on tag dispatch) upload to releases

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Pre-dispatch validation: the same fail-fast config-drift gate the
  # per-platform workflows run inside their build jobs, hoisted into the
  # orchestrator so it runs ONCE, ~1 min, before any 30-60 min platform
  # build is queued. A drift regression (identifier/appId change not
  # mirrored in tauri.conf.json, bundle.icon set out of lockstep with
  # tauri.conf.json, bundle.resources/externalBin diverging from the
  # stub-generator registry, tauri-binaries.json drifting from the
  # canonical triples / Cargo bin name / launcher install paths, per-arch
  # config overrides drifting from the base config) fails here instead of
  # after the first build. Same gate (the full drift file + the identity
  # parity + icons nodes) as tauri-macos-build.yml / tauri-linux-build.yml
  # / tauri-windows-build.yml. The icons tests' autouse fixture runs
  # --clean, which only removes uncommitted stub binaries — safe in a
  # fresh checkout.
  # ──────────────────────────────────────────────────────────────────────────

  validate:
    name: Pre-dispatch config drift gate (fail fast)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Minimal install (pytest + the two non-stdlib imports the drift
      # tests need: yaml for electron-builder.yml, filelock for the icons
      # module's serialize fixture) — mirrors the macOS workflow pattern.
      - name: Install Python deps (fail-fast config drift gate)
        run: uv pip install --system pytest pyyaml filelock

      # Fail-fast gate: version lockstep BEFORE any platform build — every
      # versioned file (pyproject.toml / package.json / electron-builder.yml
      # / src-tauri/tauri.conf.json / src-tauri/Cargo.toml) must carry the
      # SAME version. The release bump commits them together (RELEASING.md §4
      # + drift Pair 11), so a bump that touched only one file breaks CI in
      # seconds here, not after a 30-60 min build. sync_versions.py is
      # stdlib-only (regex/tomllib fallback) — safe in this minimal env.
      - name: Verify version lockstep across layers (fail fast)
        run: python3 scripts/build/sync_versions.py --check

      # Fail-fast gate: run the config drift guards ONCE here, BEFORE the
      # per-platform builds fan out — identifier↔appId + productName +
      # version parity, bundle.icon↔git lockstep, and ALL the
      # config↔script pairs (bundle.resources/externalBin ↔ stub
      # generator registry, tauri-binaries.json ↔ canonical triples +
      # Cargo binary name + launcher install paths, per-arch config
      # overrides ↔ base config, version lockstep, release-bump workflow,
      # update-feed parity). Same guards the per-platform workflows
      # re-run inside their build jobs.
      - name: Verify config drift guards (icons, identity, binaries) (fail fast)
        run: |
          python3 -m pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      # Fail-fast gate: verify EVERY committed file in tauri.conf.json
      # bundle.icon exists AND is structurally valid (the 4 PNGs +
      # icon.ico + icon.icns) before any platform build starts.
      - name: Verify bundle.icon icons are present + valid (fail fast)
        run: python3 scripts/gen_tauri_icons_stub.py --check-icons

  # ──────────────────────────────────────────────────────────────────────────
  # Build matrix: dispatch to per-platform workflows. Every platform call
  # needs: validate — the one-time pre-dispatch drift gate — so a drift
  # regression aborts the fan-out instead of burning build minutes.
  # The `if:` on each per-platform call respects the user's `platform`
  # input; each called workflow enforces its OWN event gate (macOS bundle
  # jobs `if: true`; Linux bundle job `workflow_dispatch`/`workflow_call`;
  # Windows matrix job dispatch-enabled).
  # ──────────────────────────────────────────────────────────────────────────

  build-windows:
    name: Windows (call tauri-windows-build)
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    needs: validate
    uses: ./.github/workflows/tauri-windows-build.yml
    with:
      target: ${{ github.event.inputs.target }}
      sign: ${{ fromJSON(github.event.inputs.sign) }}
      # S5-CR-74: pass through PYBS pin so a maintainer can bump the
      # python-build-standalone release per-dispatch without editing
      # tauri-windows-build.yml's defaults.
      pybs_date: ${{ github.event.inputs.pybs_date }}
      pybs_version: ${{ github.event.inputs.pybs_version }}
    # Per ADR-0020 §15 the per-platform workflow must NOT be triggered on
    # push — each called workflow enforces that itself (its bundle job is
    # gated to workflow_dispatch / this orchestrator's workflow_call).

  build-macos:
    name: macOS (call tauri-macos-build)
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    needs: validate
    uses: ./.github/workflows/tauri-macos-build.yml
    with:
      target: ${{ github.event.inputs.target }}
      sign: ${{ fromJSON(github.event.inputs.sign) }}

  build-linux:
    name: Linux (call tauri-linux-build)
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    needs: validate
    uses: ./.github/workflows/tauri-linux-build.yml
    with:
      target: ${{ github.event.inputs.target }}
      sign: ${{ fromJSON(github.event.inputs.sign) }}

  # ──────────────────────────────────────────────────────────────────────────
  # Aggregate: download every platform's installer artifact into a single
  # `tauri-all-installers` artifact for easy manual download. This job
  # runs even if one platform fails (so partial releases can be inspected).
  # Additionally merges each successful platform leg's updated
  # tauri-binaries.json (each leg records only its own per-arch sha256)
  # into ONE manifest and runs the full-manifest integrity gate — the
  # true release gate asserting every platform's binary is hashed.
  # ──────────────────────────────────────────────────────────────────────────

  aggregate:
    name: Aggregate installers
    needs: [build-windows, build-macos, build-linux]
    if: always()
    runs-on: ubuntu-22.04
    # XS-28: cap the aggregator — it only does artifact downloads + a find
    # + a re-upload (+ the manifest merge). 10 min is plenty; without a cap
    # a hung download-artifact could burn the default 360 min on a stalled
    # run.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows installer
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-windows-installer
          path: aggregated/windows

      - name: Download macOS installer
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-macos-installer
          path: aggregated/macos

      - name: Download Linux installer
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-linux-installer
          path: aggregated/linux

      - name: Fail if no installers were found
        if: needs.build-windows.result != 'success' && needs.build-macos.result != 'success' && needs.build-linux.result != 'success'
        run: |
          echo "::error::All per-platform workflows failed or were skipped. No installer artifacts were aggregated."
          exit 1

      # Each successful platform leg uploads its checkout's updated
      # tauri-binaries.json (its own per-arch sha256 recorded). The Linux
      # matrix fans out per arch (x86_64 + aarch64), so there are two
      # Linux manifests to download.
      - name: Download macOS manifest
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-binaries-manifest-macos
          path: manifests/macos

      - name: Download Windows manifest
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-binaries-manifest-windows
          path: manifests/windows

      - name: Download Linux manifests (x86_64 + aarch64 legs)
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-binaries-manifest-linux-x86_64
          path: manifests/linux-x86_64

      - name: Download Linux manifests (aarch64 leg)
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: tauri-binaries-manifest-linux-aarch64
          path: manifests/linux-aarch64

      # Merge the per-leg manifests on top of the committed base manifest:
      # only non-empty sha256 values are overlaid, so every binary entry
      # keeps its full key set and every other field is preserved verbatim.
      - name: Merge per-platform manifests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          base = json.loads(Path("tauri-binaries.json").read_text(encoding="utf-8"))
          merged_any = False
          for manifest_file in sorted(glob.glob("manifests/*/tauri-binaries.json")):
              leg = json.loads(Path(manifest_file).read_text(encoding="utf-8"))
              for name, entry in leg.get("binaries", {}).items():
                  sha = entry.get("sha256")
                  if not isinstance(sha, dict):
                      continue
                  target = base["binaries"][name]["sha256"]
                  for key, value in sha.items():
                      if value and not target.get(key):
                          target[key] = value
                          merged_any = True
                      elif value and value != target.get(key):
                          log_both = {"key": key, "previous": target.get(key), "new": value}
                          print(
                              f"::warning::manifest merge conflict on {name}.sha256[{key}]: "
                              f"keeping {log_both['previous'][:12]}... (had {log_both['new'][:12]}...)",
                              flush=True,
                          )
          Path("tauri-binaries-merged.json").write_text(
              json.dumps(base, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"merged {len(glob.glob('manifests/*/tauri-binaries.json'))} leg manifest(s)"
                + ("; at least one sha256 overlaid" if merged_any else "; no hashes overlaid"))
          PY

      # Full-manifest release gate: every per-arch sha256 across ALL
      # platforms must be present and valid. Runs only when every
      # platform succeeded; a partial run (some platform failed/skipped)
      # skips the gate so partial artifacts remain inspectable.
      - name: Enforce merged manifest integrity (full release gate)
        if: needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'
        run: |
          cp tauri-binaries-merged.json tauri-binaries.json
          python3 scripts/build/update_tauri_manifests.py --check

      - name: List aggregated installers
        run: |
          echo "::group::Aggregated Tauri installers"
          find aggregated -type f -print0 | sort -z | xargs -0 -I{} sh -c 'printf "  %8s  %s\n" "$(du -h "{}" | cut -f1)" "{}"'
          echo "::endgroup::"

          # Sanity: warn if no installers were found at all (every platform failed).
          count=$(find aggregated -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::warning::No per-platform installer artifacts were found. Either all per-platform workflows were skipped (platform filter), the pre-dispatch drift gate (validate) failed, or all platform builds failed. See docs/migration/cutover-playbook.md for the per-platform readiness gate."
          fi

      - name: Upload aggregated artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-all-installers
          path: aggregated/
          retention-days: 30

      # The merged manifest is what a release engineer commits back into
      # the repo (tauri-binaries.json) so the autostart launcher's
      # integrity gate has the real hashes for every platform.
      - name: Upload merged tauri-binaries.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-binaries-manifest-merged
          path: tauri-binaries-merged.json
          if-no-files-found: error
          retention-days: 30

      - name: Cutover reminder
        run: |
          echo "::notice::Tauri build run complete. Per ADR-0020 §15, no auto-update manifest was generated. Per ADR-0020 Phase 5, do NOT flip the default shipping app from Electron to Tauri on any platform until that platform's cutover gate is met (see docs/migration/cutover-playbook.md)."
