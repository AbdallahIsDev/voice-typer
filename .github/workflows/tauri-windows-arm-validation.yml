#   - download the x64 NSIS installer artifact from a completed
#   - silently install the NSIS bundle (the installer bootstraps
#     the C-CI-14 .NET Process pattern (GUI-subsystem PE; onefile
#     C-CI-2) and the native aarch64 build leg stays disabled BY DESIGN

name: Build Windows ARM validation

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID of a completed tauri-windows-build run whose tauri-windows-installer artifact should be validated (empty = latest successful)"
        required: false
        default: ""
        type: string

# least-privilege default (WR-17 style); the cross-run artifact download
# needs `actions: read`, granted at job level below.
permissions:
  contents: read

concurrency:
  group: tauri-windows-arm-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm-emulation-validation:
    runs-on: windows-11-arm
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # cross-run artifact download (download-artifact run-id)
    steps:
      - name: Checkout (smoke-test scripts)
        uses: actions/checkout@v7

      - name: Resolve source run (input or latest successful x64 build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $input = "${{ github.event.inputs.artifact_run_id }}".Trim()
          if ($input) {
            $runId = $input
            Write-Host "Using caller-supplied run id: $runId"
          } else {
            $runId = gh run list --workflow=tauri-windows-build.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId'
            if (-not $runId) {
              Write-Error "No successful tauri-windows-build run found; dispatch one first (sign=false is fine) or pass artifact_run_id."
              exit 1
            }
            Write-Host "Resolved latest successful x64 build run: $runId"
          }
          "ARTIFACT_RUN_ID=$runId" >> $env:GITHUB_ENV

      - name: Download x64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-windows-installer
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: arm-validation/installer

      - name: Record host + binary architecture evidence (ARM64 host, x64 binaries)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path arm-validation/evidence | Out-Null
          $evidence = "arm-validation/evidence/arch-evidence.txt"
          $procArch = $env:PROCESSOR_ARCHITECTURE
          $osArch = (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          Write-Host "PROCESSOR_ARCHITECTURE=$procArch  OSArchitecture=$osArch"
          "PROCESSOR_ARCHITECTURE=$procArch" | Out-File $evidence -Encoding utf8
          "OSArchitecture=$osArch" | Out-File $evidence -Append -Encoding utf8
          # HARD GATE: the runner must genuinely be ARM64. If GitHub ever
          if ($procArch -notmatch "ARM64" -and $osArch -notmatch "ARM|arm64") {
            Write-Error "Expected an ARM64 runner (PROCESSOR_ARCHITECTURE=ARM64); got $procArch / $osArch. The emulation-validation claim requires real ARM hardware."
            exit 1
          }
          $installer = Get-ChildItem arm-validation/installer -Recurse -Filter *.exe |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer .exe found in the tauri-windows-installer artifact."
            exit 1
          }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer: $($installer.Name) ($([Math]::Round($installer.Length/1MB,1)) MB)"
          Write-Host "SHA256: $hash"
          "INSTALLER=$($installer.Name)" | Out-File $evidence -Append -Encoding utf8
          "INSTALLER_SHA256=$hash" | Out-File $evidence -Append -Encoding utf8
          # NSIS installers are 32-BIT STUBS (machine 0x014C) regardless of
          # the payload architecture — that is the NSIS engine's format, not
          # an arch claim. Assert the expected NSIS stub (0x014C) so a
          # non-NSIS file fails loudly; the x64-ness of the shipped PAYLOAD
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $machineHex = "0x{0:X4}" -f $machine
          "INSTALLER_PE_MACHINE=$machineHex (0x014C=NSIS x86 stub)" | Out-File $evidence -Append -Encoding utf8
          if ($machine -ne 0x014C) {
            Write-Error "Installer PE machine type is $machineHex — expected the NSIS x86 stub (0x014C). Is this actually the NSIS installer artifact?"
            exit 1
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File $evidence -Append -Encoding utf8

      - name: Silent-install the x64 NSIS bundle (bootstraps WebView2)
        shell: pwsh
        run: |
          $evidence = "arm-validation/evidence/arch-evidence.txt"
          $installer = (Get-Content $evidence | Select-String "^INSTALLER_PATH=").Line.Substring("INSTALLER_PATH=".Length)
          Write-Host "Silent-installing: $installer"
          # NSIS /S = fully silent. The Tauri NSIS template bootstraps
          $proc = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru -Wait
          Write-Host "Installer exit code: $($proc.ExitCode)"
          "INSTALLER_EXIT=$($proc.ExitCode)" | Out-File $evidence -Append -Encoding utf8
          if ($proc.ExitCode -ne 0) {
            Write-Error "NSIS silent install failed with exit code $($proc.ExitCode) on the ARM64 host."
            exit 1
          }
          # Locate the install root dynamically (do not hardcode the
          # product dir — NSIS InstallDir may change with branding).
          # Tauri v2 NSIS defaults to per-user installs →
          $installRoot = $null
          foreach ($root in @(
              $env:LOCALAPPDATA,
              "$env:LOCALAPPDATA\Programs",
              $env:ProgramFiles,
              "${env:ProgramFiles(x86)}"
            )) {
            if (-not $root) { continue }
            $hit = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Where-Object Name -like "*Voice*" |
              Where-Object { Test-Path (Join-Path $_.FullName "lausu-tauri.exe") } |
              Select-Object -First 1
            if ($hit) {
              $installRoot = $hit.FullName
              break
            }
          }
          if (-not $installRoot) {
            Write-Error "Could not locate the install directory (lausu-tauri.exe) after silent install. Searched LOCALAPPDATA, LOCALAPPDATA\Programs, ProgramFiles, ProgramFiles(x86)."
            exit 1
          }
          Write-Host "Install root: $installRoot"
          "INSTALL_ROOT=$installRoot" | Out-File $evidence -Append -Encoding utf8

      - name: Sidecar smoke test under emulation (420 s ceiling)
        shell: pwsh
        run: |
          $evidence = "arm-validation/evidence/arch-evidence.txt"
          $installRoot = (Get-Content $evidence | Select-String "^INSTALL_ROOT=").Line.Substring("INSTALL_ROOT=".Length)
          # The frozen Python sidecar is the ARM-compat question: it must
          $sidecar = Get-ChildItem $installRoot -Recurse -Filter "python-sidecar*.exe" | Select-Object -First 1
          if (-not $sidecar) {
            Write-Error "python-sidecar*.exe not found under $installRoot (installed layout changed?)."
            exit 1
          }
          Write-Host "Sidecar: $($sidecar.FullName)"
          "SIDECAR=$($sidecar.Name)" | Out-File $evidence -Append -Encoding utf8
          # Assert the payload really is x64 (the emulation model): the
          # frozen sidecar must be a 0x8664 PE running on the ARM64 host.
          $sidecarBytes = [System.IO.File]::ReadAllBytes($sidecar.FullName)
          $sidecarPeOffset = [BitConverter]::ToInt32($sidecarBytes, 0x3C)
          $sidecarMachine = [BitConverter]::ToUInt16($sidecarBytes, $sidecarPeOffset + 4)
          $sidecarMachineHex = "0x{0:X4}" -f $sidecarMachine
          "SIDECAR_PE_MACHINE=$sidecarMachineHex (0x8664=x64)" | Out-File $evidence -Append -Encoding utf8
          if ($sidecarMachine -ne 0x8664) {
            Write-Error "Sidecar PE machine type is $sidecarMachineHex — expected x64 (0x8664). The shipped payload architecture changed; re-derive the validation model."
            exit 1
          }
          # C-CI-14: GUI-subsystem PEs must be launched via .NET Process +
          # never sets $LASTEXITCODE for GUI-subsystem binaries. On the
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $sidecar.FullName
          $psi.Arguments = "--version"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $exited = $p.WaitForExit(420000)
          if (-not $exited) {
            $p.Kill($true)
            Write-Error "Sidecar --version timed out after 420 s on the ARM64 host (emulation too slow or hang)."
            exit 1
          }
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          Write-Host "Sidecar exit code: $($p.ExitCode)"
          Write-Host "stdout: $stdout"
          Write-Host "stderr: $stderr"
          "SIDECAR_EXIT=$($p.ExitCode)" | Out-File $evidence -Append -Encoding utf8
          "SIDECAR_STDOUT=$($stdout.Trim())" | Out-File $evidence -Append -Encoding utf8
          if ($p.ExitCode -ne 0) {
            Write-Error "Sidecar --version exited $($p.ExitCode) under emulation (see stderr above). The x64 backend does NOT run on Windows-ARM."
            exit 1
          }

      - name: Tauri host launch check (process must spawn + stay alive)
        shell: pwsh
        run: |
          $evidence = "arm-validation/evidence/arch-evidence.txt"
          $installRoot = (Get-Content $evidence | Select-String "^INSTALL_ROOT=").Line.Substring("INSTALL_ROOT=".Length)
          # NOTE: do NOT name this variable `$host` — that is a reserved
          $tauriHost = Get-ChildItem $installRoot -Recurse -Filter "lausu-tauri.exe" | Select-Object -First 1
          if (-not $tauriHost) {
            Write-Error "lausu-tauri.exe not found under $installRoot."
            exit 1
          }
          Write-Host "Launching host: $($tauriHost.FullName)"
          # Redirect stdout/stderr so a startup crash leaves a trace, and
          $outFile = "arm-validation/evidence/host-stdout.txt"
          $errFile = "arm-validation/evidence/host-stderr.txt"
          $p = Start-Process -FilePath $tauriHost.FullName `
            -WorkingDirectory (Split-Path $tauriHost.FullName) `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile `
            -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          "HOST_ALIVE_AFTER_25S=$alive" | Out-File $evidence -Append -Encoding utf8
          if ($alive) {
            $mem = [Math]::Round($p.WorkingSet64/1MB, 1)
            Write-Host "Host alive after 25 s (working set ${mem} MB) — killing tree."
            "HOST_WORKINGSET_MB=$mem" | Out-File $evidence -Append -Encoding utf8
            taskkill /PID $p.Id /T /F 2>$null | Out-Null
          } else {
            # SOFT diagnostics dump: the backend hard gate already passed;
            Write-Host "::warning::Host exited within 25 s (exit code $($p.ExitCode)). Backend hard gate passed; capturing diagnostics."
            "HOST_EXIT_CODE=$($p.ExitCode)" | Out-File $evidence -Append -Encoding utf8
            # Echo every diagnostic to the RUN LOG too — the evidence
            $errDump = Get-Content $errFile -ErrorAction SilentlyContinue | Select-Object -First 40
            $outDump = Get-Content $outFile -ErrorAction SilentlyContinue | Select-Object -First 40
            "── host stderr ──" | Out-File $evidence -Append -Encoding utf8
            $errDump | Out-File $evidence -Append -Encoding utf8
            Write-Host "HOST STDERR:"; $errDump | ForEach-Object { Write-Host $_ }
            "── host stdout ──" | Out-File $evidence -Append -Encoding utf8
            $outDump | Out-File $evidence -Append -Encoding utf8
            Write-Host "HOST STDOUT:"; $outDump | ForEach-Object { Write-Host $_ }
            "── app log tail (~\.lausu\logs) ──" | Out-File $evidence -Append -Encoding utf8
            $appLogDump = Get-ChildItem "$env:USERPROFILE\.lausu\logs" -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object {
                "== $($_.Name) =="
                Get-Content $_.FullName -Tail 30 -ErrorAction SilentlyContinue
              }
            $appLogDump | Out-File $evidence -Append -Encoding utf8
            Write-Host "APP LOGS:"; $appLogDump | ForEach-Object { Write-Host $_ }
            $wv2 = Get-ItemProperty "HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
            "WEBVIEW2_PV=$($wv2.pv)" | Out-File $evidence -Append -Encoding utf8
            Write-Host "WEBVIEW2_PV=$($wv2.pv)"
            Write-Error "Tauri host did not stay alive on the ARM64 runner (see evidence artifact for stderr + app logs + WebView2 state)."
            exit 1
          }

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm-validation-evidence
          path: arm-validation/evidence/
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          $evidence = Get-Content "arm-validation/evidence/arch-evidence.txt" -Raw
          Write-Host "=== Windows-ARM emulation validation evidence ==="
          Write-Host $evidence
          Write-Host ""
          Write-Host "XPLAT-12 acceptance: x64 installer + frozen Python sidecar run on windows-11-arm (Prism emulation)."
