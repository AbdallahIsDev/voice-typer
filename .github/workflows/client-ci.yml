# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5    — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-node@v7  — Node 24 runtime (v4 = Node 20, deprecated)

name: Client CI

on:
  push:
    branches: [main]
    paths:
      - "voice_typer/client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "voice_typer/client/**"
      - ".github/workflows/client-ci.yml"

# Cancel in-progress runs for the same ref so a new push supersedes them.
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

# XS-69 / supply-chain: least-privilege permissions for the client CI.
permissions:
  contents: read

jobs:
  client:
    name: Typecheck + Lint + Test
    # XS-69: pin to ubuntu-22.04 instead of ubuntu-latest so runner image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: voice_typer/client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # never ship in the Tauri installer — only runtime deps are a
      # Hard gate: package.json overrides (each carrying its advisory ID)
      # are the accepted-findings list; `npm audit` reported 0 vulns after
      # overrides (see //overrides_note). Any new HIGH/CRITICAL advisory
      # must fail CI visibly.
      - name: npm audit (high+ only)
        run: npm audit --audit-level=high --omit=dev

      # CI-05 / cache-trap guard: `typecheck:ci` runs `tsc -b --force`,
      - name: Typecheck (cache-busting)
        run: npm run typecheck:ci

      - name: Lint (Biome)
        run: npm run lint

      # WR-16: build the renderer before tests so a broken build config /
      - name: Build (vite / Tauri renderer)
        run: npm run build

      # F2 regression guard: ensure the start/stop sound cues are NOT
      - name: Sound cue distinctness check
        run: python ../../scripts/build/generate_beeps.py --check

      # XS-69: run with --coverage so the vitest.config.ts thresholds
      - name: Test (Vitest + coverage)
        run: npm run test:coverage
