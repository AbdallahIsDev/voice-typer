# =============================================================================
# Voice Typer — Mutation testing (RETIRED)
#
# XS-87: This workflow was previously gated by `if: false` at the job
# level and relied on `mutmut>=2.4` being installed from the dev extra.
# In session XS:
#   - mutmut was removed from the `[dev]` extra in pyproject.toml
#     (handled by XS-FIX-1).
#   - tests/mutmut_config.py was confirmed NOT to exist (the workflow's
#     `config_check` step unconditionally exited 0 because the file was
#     missing — the gate was theatre).
#   - The workflow is now retired: it keeps only a `workflow_dispatch`
#     trigger and a single no-op step that prints a notice pointing at
#     the comprehensive-review.md XS-87 finding. This preserves the
#     historical workflow name (so anyone who has bookmarked the
#     Actions tab page or referenced it in docs lands somewhere with a
#     clear "retired" message) without leaving the dead mutmut job,
#     the missing-config early-exit, or the misleading comment about
#     `dev` extra in pyproject.toml.
#
# To re-enable mutation testing in the future:
#   1. Re-add `mutmut>=2.4` to `[project.optional-dependencies].dev`
#      in pyproject.toml.
#   2. Restore tests/mutmut_config.py with MODULES_TO_MUTATE and
#      TEST_COMMAND.
#   3. Restore the original job body (see git history at commit
#      8629146 for the prior version).
# =============================================================================
name: Mutation testing (mutmut) — RETIRED

on:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retired:
    name: Retired notice
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Print retirement notice
        run: |
          echo "::notice::Mutation testing has been retired. See comprehensive-review.md XS-87."
          echo "Mutation testing has been retired. See comprehensive-review.md XS-87."
          exit 0
