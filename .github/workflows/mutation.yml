# Mutation testing RETIRED (XS-87). Local-only: mutmut stays in the
# after restoring a real mutmut job. Expanded notes: docs/code-notes/ci-workflows.md
name: Mutation testing (mutmut) — RETIRED

on:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retired:
    name: Retired notice
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Print retirement notice
        run: |
          echo "::notice::Mutation testing is local-only. See CONTRIBUTING.md §4.5 (Mutation testing) and review.md XS-87."
          echo "Mutation testing is local-only (runtime cost is too high for CI)."
          echo "  - Config: [tool.mutmut] table in pyproject.toml"
          echo "  - Run locally: mutmut run  (then: mutmut results)"
          echo "  - Docs: CONTRIBUTING.md §4.5 'Mutation testing (local-only)'"
          echo "  - History: review.md XS-87"
          exit 0
