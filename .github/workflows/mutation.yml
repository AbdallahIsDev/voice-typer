# =============================================================================
# Voice Typer — Mutation testing (RETIRED)
#
# XS-87: This workflow was previously gated by `if: false` at the job
# level and relied on `mutmut>=2.4` being installed from the dev extra.
# In session XS:
#   - The XS-FIX-1 note in the prior version of this header claimed mutmut
#     was removed from `[dev]`, but a re-check on 2026-07-24 (WR-16) found
#     it is STILL listed at pyproject.toml:281 (`mutmut>=2.4`, behind the
#     TEST-010 comment at :280). Keeping the dep in `[dev]` is fine — it's
#     only installed when a developer explicitly requests the dev extra
#     (`uv pip install -e .[dev]`), never in CI (no workflow installs the
#     `dev` extra except tauri-* which build sidecars, not tests).
#   - tests/mutmut_config.py was confirmed NOT to exist (the workflow's
#     `config_check` step unconditionally exited 0 because the file was
#     missing — the gate was theatre). Note that the [tool.mutmut] table
#     at pyproject.toml:368 IS present (modern mutmut reads config from
#     pyproject.toml, not from tests/mutmut_config.py), so the missing
#     file is no longer a blocker for mutmut itself — but the workflow
#     still does nothing useful and is kept retired.
#   - The workflow is now retired: it keeps only a `workflow_dispatch`
#     trigger and a single no-op step that prints a notice pointing at
#     the review.md XS-87 finding. This preserves the
#     historical workflow name (so anyone who has bookmarked the
#     Actions tab page or referenced it in docs lands somewhere with a
#     clear "retired" message) without leaving the dead mutmut job,
#     the missing-config early-exit, or the misleading comment about
#     `dev` extra in pyproject.toml.
#
# To re-enable mutation testing in the future:
#   1. Confirm `mutmut>=2.4` is still in `[project.optional-dependencies].dev`
#      in pyproject.toml (it is as of 2026-07-24 — see pyproject.toml:281).
#      There is no need to re-add it.
#   2. If you want the old `config_check` step back, restore
#      tests/mutmut_config.py with MODULES_TO_MUTATE and TEST_COMMAND
#      (modern mutmut prefers pyproject.toml's [tool.mutmut] table —
#      already present at pyproject.toml:368 — but the legacy
#      mutmut_config.py shim is still supported for backwards compat).
#   3. Restore the original job body (see git history at commit
#      8629146 for the prior version).
# =============================================================================
name: Mutation testing (mutmut) — RETIRED

on:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retired:
    name: Retired notice
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Print retirement notice
        run: |
          echo "::notice::Mutation testing has been retired. See review.md XS-87."
          echo "Mutation testing has been retired. See review.md XS-87."
          exit 0
