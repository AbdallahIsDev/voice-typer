name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .
          pip list

      - name: Generate app icon
        run: python scripts/build/generate_icon.py scripts/build/voice-typer.ico

      - name: Build with PyInstaller
        run: pyinstaller scripts/build/voice-typer.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc scripts/build/installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-Setup
          path: VoiceTyper-Setup-*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: VoiceTyper-Setup-*.exe
          tag: ${{ github.ref_name }}
          overwrite: true
