# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (C-CI-1 / C-CI-5): Node 24 majors only
# (checkout@v5, setup-python@v7, setup-node@v7, cache@v5, upload-artifact@v6,
# download-artifact@v6, attest-build-provenance@v4, setup-uv@v7, rust-toolchain@v1).
# See docs/code-notes/ci-workflows.md

name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  # also run on PRs so lint/coverage/audit gates are enforced.
  pull_request:
    branches: [main, master]
    # skip the entire workflow for docs-only / markdown-only PRs
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # weekly schedule for the pip-audit-weekly job (runs full audit
  schedule:
    # 09:00 UTC every Monday — start of week triage.
    - cron: "0 9 * * 1"

# PRs cancel each other; releases keep cancel-in-progress: false (never cancel mid-flight).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs widen contents/issues/checks as needed.
permissions:
  contents: read
  pull-requests: read

jobs:
  # C-CI-2: quality gates only; installers live in tauri-*-build.yml.
  test:
    # schedule runs only pip-audit-weekly
    if: github.event_name != 'schedule'
    # CHECK-W: checks:write for junit-report annotations
    permissions:
      contents: read
      checks: write
    runs-on: ${{ matrix.os }}
    # XS-25: 60m cap — 30m cancelled slow ubuntu legs and broke coverage upload
    timeout-minutes: 60
    strategy:
      # PR: reduced matrix; push: full. BUILD-N03: macos-13 retired → macos-14 (Intel-parity x64 on PR).
      matrix:
        ${{ github.event_name == 'pull_request' && fromJson('{"include":[{"os":"ubuntu-22.04","python-version":"3.12"},{"os":"windows-2022","python-version":"3.13"},{"os":"macos-14","python-version":"3.13","architecture":"x64"}]}') || fromJson('{"os":["windows-2022","ubuntu-22.04","macos-14"],"python-version":["3.10","3.11","3.12","3.13"]}') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth 2 so the pyrefly baseline audit step
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # macos-14 is arm64; PR matrix pins architecture=x64 (Intel-parity via Rosetta).
          architecture: ${{ matrix.architecture }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          # install lint + audit tools.
          uv pip install --system ruff==0.16.0 pip-audit
          # pytest-xdist enables `-n auto --dist=loadgroup` in
          uv pip install --system pytest-xdist
          pip list

      #      shrinks — never edit it to add violations.
      - name: Ruff (F-rules hard-fail)
        # scope expanded from `voice_typer/server/` only to
        run: python -m ruff check voice_typer/ tests/ scripts/ conftest.py --select F --no-fix

      - name: Ruff (ratchet compare against baseline)
        # scope expanded to match the F-rules hard-fail above.
        run: |
          python -m ruff check voice_typer/ tests/ scripts/ conftest.py --output-format=json > ruff-current.json || true
          python scripts/ruff_ratchet_check.py

      # .deb/.rpm bundles must stay LF: .gitattributes enforces
      - name: Linux scripts LF check
        run: python scripts/check_linux_scripts_lf.py

      # i18n key-completeness gate. Runs the i18n completeness suite
      - name: i18n key-completeness gate
        run: |
          python -m pytest tests/test_i18n_completeness.py --timeout=30 --no-cov -q

      #      identified in XS-1).
      - name: Run pyrefly type check
        # bash syntax (if [ ... ], $(), /tmp paths) — must NOT run under
        # PowerShell, the windows-2022 matrix leg's default shell.
        shell: bash
        run: |
          # pin pyrefly==1.1.1 so error counts don't drift
          uv pip install --system pyrefly==1.1.1
          # (known behavior — see XS-1 comment above). The REAL gate is
          # for the audit step to consume. We do NOT fail here on
          echo '{"errors":[]}' > /tmp/pyrefly-empty-baseline.json
          pyrefly check voice_typer/ --baseline /tmp/pyrefly-empty-baseline.json --output-format=json > pyrefly-current.json || true
          # Write the current errors into pyrefly-baseline.json if the
          # file doesn't exist (first run on a fresh checkout).
          if [ ! -f pyrefly-baseline.json ]; then
            cp pyrefly-current.json pyrefly-baseline.json
          fi

      # in the same PR; the ratchet (live count must not exceed the
      - name: Audit pyrefly baseline changes
        # bash syntax (if [ ... ], $(), /tmp paths) — must NOT run under
        # PowerShell, the windows-2022 matrix leg's default shell.
        shell: bash
        run: |
          if [ ! -f pyrefly-current.json ]; then
            echo "::error::pyrefly-current.json not found — Run pyrefly type check step must run before this audit."
            exit 1
          fi
          # Determine the comparison ref
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          git fetch origin ${{ github.base_ref || '' }} 2>/dev/null || true
          # always 0 and the audit could never fire. The diff-set
          # All python reads here MUST pass encoding='utf-8' (or
          if [ -f pyrefly-baseline.json ]; then
            OLD_COUNT=$(python -c "import json; d=json.load(open('pyrefly-baseline.json', encoding='utf-8')); print(len(d.get('errors', []) if isinstance(d, dict) else d))" 2>/dev/null || echo 0)
          else
            OLD_COUNT=$(git show "$BASE_REF:pyrefly-baseline.json" 2>/dev/null | python -c "import sys,json; sys.stdin.reconfigure(encoding='utf-8'); d=json.load(sys.stdin); print(len(d.get('errors', []) if isinstance(d, dict) else d))" 2>/dev/null || echo 0)
          fi
          # Read the LIVE pyrefly output (not the committed
          # baseline) so newly-introduced errors actually trip the gate.
          NEW_COUNT=$(python -c "import json; d=json.load(open('pyrefly-current.json', encoding='utf-8')); print(len(d.get('errors', []) if isinstance(d, dict) else d))" 2>/dev/null || echo 0)
          echo "Pyrefly: baseline floor = $OLD_COUNT errors, live current = $NEW_COUNT errors"
          # Surface a floor RAISE in the checks UI (non-blocking). A PR
          BASE_FLOOR=$(git show "$BASE_REF:pyrefly-baseline.json" 2>/dev/null | python -c "import sys,json; sys.stdin.reconfigure(encoding='utf-8'); d=json.load(sys.stdin); print(len(d.get('errors', []) if isinstance(d, dict) else d))" 2>/dev/null || echo 0)
          if [ "$OLD_COUNT" -gt "$BASE_FLOOR" ]; then
            echo "::warning::Pyrefly baseline floor raised from $BASE_FLOOR (base ref) to $OLD_COUNT (this checkout) — confirm the justification in pyrefly-baseline.json _comment."
          fi
          if [ "$NEW_COUNT" -gt "$OLD_COUNT" ]; then
            echo "::error::Pyrefly error count grew from $OLD_COUNT (baseline) to $NEW_COUNT (live)."
            echo "Each new error must be fixed OR the baseline floor must be raised in pyrefly-baseline.json"
            echo "with justification (platform-only false positive, missing optional dep, etc.)."
            echo ""
            echo "Added entries (in live output, not in base-ref baseline):"
            # Workspace-relative snapshot path (not /tmp): on the
            if [ -f pyrefly-baseline.json ]; then
              cp pyrefly-baseline.json pyrefly-old-baseline.json
            else
              git show "$BASE_REF:pyrefly-baseline.json" > pyrefly-old-baseline.json 2>/dev/null || echo '[]' > pyrefly-old-baseline.json
            fi
            python -c "import json;o=json.load(open('pyrefly-old-baseline.json', encoding='utf-8'));n=json.load(open('pyrefly-current.json', encoding='utf-8'));os_={(d.get('path',''),d.get('line',0),d.get('code','')) for d in (o if isinstance(o,list) else o.get('errors',[]))};ns_={(d.get('path',''),d.get('line',0),d.get('code','')) for d in (n if isinstance(n,list) else n.get('errors',[]))};[print(f'  {e[0]}:{e[1]} [{e[2]}]') for e in sorted(ns_-os_)]" 2>/dev/null || echo "  (could not diff)"
            exit 1
          fi
          echo "Baseline audit passed: $NEW_COUNT live errors ≤ $OLD_COUNT baseline floor"

      - name: Run tests with coverage
        # `\` line continuations are bash-only — under PowerShell each
        shell: bash
        # robustness — see XS-9).
        # MO-89: raised 65 → 78 on a MEASURED total (84.84% on the
        # fails if the three sites drift. Do NOT lower it back without a
        # (pyproject.toml addopts already sets them via WR-1, but defense-
        run: |
          python -m pytest tests/ -n auto --dist=loadgroup -v --tb=short -q \
            --cov=voice_typer --cov-fail-under=78 \
            --cov-report=xml --cov-report=term-missing \
            --junitxml=pytest-results.xml \
            --timeout=120 --timeout-method=thread \
            --strict-markers --strict-config

      # publish test results as PR annotations so a single
      - name: Test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Test results
          report_paths: pytest-results.xml
          require_tests: false

      # CI-ERRORS-AUTO: preserve the JUnit XML so the ci-errors-doc job
      - name: Upload pytest JUnit for CI-errors aggregation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        # Only Linux×3.12 uploads coverage (per-OS deltas drown the signal).
        if: always() && matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      # Coverage ratchet vs coverage-baseline.json on the canonical Linux leg.
      - name: Coverage ratchet check
        # WR-15 / TK-27: always() + --strict so missing coverage.xml fails the gate.
        if: always() && matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        # leg, so losing it must fail the job, not skip it.
        run: python scripts/coverage_ratchet_check.py --strict

      # pinned dependencies NEVER failed the build — the audit was
      # failed the build — pure security theatre. Accepted findings MUST
      - name: pip-audit (fail on findings; weekly sweep handled separately)
        run: |
          # always contains `lausu` itself (a local install, never on
          pip-audit --strict --require-hashes -r requirements-lock.txt

  # workflow — GITHUB_TOKEN pushes never create a new run, so no loop).
  ci-errors-doc:
    name: Write CI-errors.md from JUnit results
    needs: test
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # subdirectory (merge-multiple MUST stay false: every leg
      - name: Download all pytest JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          path: junit/
          pattern: pytest-results-*
        continue-on-error: true

      - name: Write CI-errors.md
        shell: bash
        run: |
          if ls junit/**/*.xml >/dev/null 2>&1; then
            python scripts/ci/write_ci_errors.py junit/**/*.xml
          else
            echo "No JUnit artifacts found — writing empty CI-errors.md"
            python scripts/ci/write_ci_errors.py
          fi

      - name: Commit and push CI-errors.md
        # GITHUB_TOKEN pushes never retrigger workflows (no loop). Non-PR only.
        if: github.event_name != 'pull_request'
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI-errors.md
          if git diff --cached --quiet; then
            echo "CI-errors.md unchanged — nothing to commit"
          else
            git commit -m "docs(ci): update CI-errors.md from latest test run"
            git push
          fi

  # Icon drift check: the committed src-tauri/icons must match what a
  icons-drift:
    name: Icons match `tauri icon` output
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Node 24 matches the other setup-node pins in this workflow
      # (C-CI-5 / Node-24 runtime alignment; icons-drift is not a
      # tauri-*-build.yml job so C-CI-2 does not apply here).
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify src-tauri/icons matches a fresh `tauri icon` + prune
        run: python scripts/build/generate_tauri_icons.py --check

  # Product-namespace drift check: the repo-wide reverse-DNS guard
  product-namespace-drift:
    name: Product namespaces use com.Lausu.*
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The guard needs stdlib + pytest only (no project deps), so a
      # plain pip pytest install keeps the job ~1 min.
      - name: Run product-namespace drift guard
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_product_namespace_consistency.py -q

  # weekly pip-audit sweep — runs the FULL audit (no ignore list)
  pip-audit-weekly:
    if: github.event_name == 'schedule'
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap weekly audit runtime.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          uv pip install --system pip-audit

      - name: Full pip-audit (no ignore list)
        id: audit
        continue-on-error: true
        run: |
          # Same lock-file target as the daily gate (env self-package breaks --strict).
          pip-audit --strict --require-hashes -r requirements-lock.txt > /tmp/audit.txt 2>&1
          echo "findings<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/audit.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Open issue if findings
        if: steps.audit.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "[Weekly pip-audit] New vulnerabilities detected"
          content-filepath: /tmp/audit.txt
          labels: security,dependencies

  # This is best-effort — failures here do NOT block the build
  slow-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap slow-test runtime (these are the manual-script wrappers
    # — slower than the main suite).
    timeout-minutes: 60
    # removed job-level `continue-on-error: true`. Slow-test
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          pip list

      - name: Run slow manual-script wrappers
        # --no-cov: coverage is already collected by the main test job;
        run: |
          set +e
          python -m pytest tests/test_manual_slow.py -v --tb=short --slow --no-cov > /tmp/slow-tests-failure.txt 2>&1
          rc=$?
          cat /tmp/slow-tests-failure.txt
          exit $rc

      # open a tracking issue on failure so slow-test regressions
      # are not buried in CI logs. Mirrors the pip-audit-weekly pattern.
      - name: Open issue on slow-test failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "[slow-tests] Regression detected in tests/test_manual_slow.py"
          content-filepath: /tmp/slow-tests-failure.txt
          labels: testing,regression

  # version sync check
  version-check:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap version-check runtime.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Check version sync
        # --check fails CI on version drift (sync would silently paper over it).
        run: |
          uv pip install --system -e ".[test]"
          python scripts/build/sync_versions.py --check
          python -c "from voice_typer import __version__; print(__version__)"

  # branding consistency check
  branding-check:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap branding-check runtime.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check for hardcoded app name references
        run: |
          python scripts/check_branding.py

  # client-build job
  client-build:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap client-build runtime (npm ci + typecheck + lint + test +
    # build:renderer).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      # never ship in the Tauri installer — only runtime deps are a
      - name: npm audit (high+ only, warn-only)
        working-directory: voice_typer/client
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: Type-check
        working-directory: voice_typer/client
        # typecheck:ci = tsc -b --force (stale tsbuildinfo cannot fake green).
        run: npm run typecheck:ci

      - name: Lint
        working-directory: voice_typer/client
        run: npm run lint

      - name: Test
        working-directory: voice_typer/client
        run: npm run test

      - name: Format check
        working-directory: voice_typer/client
        run: npm run format:check

      # build renderer only (platform-independent). The main +
      - name: Build renderer only
        working-directory: voice_typer/client
        run: npm run build:renderer

      - name: Upload renderer artifact
        uses: actions/upload-artifact@v7
        with:
          name: lausu-renderer-dist
          path: voice_typer/client/out/renderer/

  # build-native matrix job. Compiles each native key-listener
  build-native:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    needs: [test, client-build, version-check]
    strategy:
      matrix:
        include:
          # macOS x64 build (macos-14 = Apple Silicon runner running
          - os: macos-14
            platform: macos-x64
            script: bash scripts/build/compile_native.sh --arch x86_64
            binary: voice_typer/server/native/macos-key-listener
            artifact_name: macos-key-listener-x64
          # macOS arm64 build (macos-14 = Apple Silicon).
          - os: macos-14
            platform: macos-arm64
            script: bash scripts/build/compile_native.sh --arch arm64
            binary: voice_typer/server/native/macos-key-listener
            artifact_name: macos-key-listener-arm64
          - os: windows-2022
            platform: windows
            script: powershell scripts/build/compile_native.ps1
            binary: voice_typer/server/native/windows-key-listener.exe
            artifact_name: windows-key-listener
          - os: ubuntu-22.04
            platform: linux
            script: bash scripts/build/compile_native.sh
            binary: voice_typer/server/native/linux-key-listener
            artifact_name: linux-key-listener
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # cap native-binary compile runtime (Swift / MSVC / gcc).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compile native binary (${{ matrix.platform }})
        run: ${{ matrix.script }}

      - name: Verify binary exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.binary }}" ]; then
            echo "ERROR: binary not found at ${{ matrix.binary }}"
            exit 1
          fi
          echo "Binary compiled successfully:"
          ls -la "${{ matrix.binary }}"
          # record the architecture for the universal-binary merge.
          file "${{ matrix.binary }}" || true

      # smoke test improvements. Each platform has a different
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # Linux CI has no /dev/input/event* — binary should emit
          # "ERROR:No keyboard devices found" and exit 1.
          output=$(./${{ matrix.binary }} '<caps_lock>' 2>&1)
          rc=$?
          echo "$output"
          echo "Exit code: $rc"
          if ! echo "$output" | grep -q "ERROR:"; then
            echo "ERROR: binary did not emit expected ERROR line"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: binary exited with code $rc (expected 1)"
            exit 1
          fi
          echo "Smoke test PASSED (binary emitted ERROR: and exited 1)"

      # improved macOS smoke test. Sets VOICE_TYPER_SKIP_ACCESSIBILITY_CHECK
      - name: Smoke test (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          export VOICE_TYPER_SKIP_ACCESSIBILITY_CHECK=1
          output=$(timeout 3 ./${{ matrix.binary }} '<f2>' 2>&1 || true)
          rc=$?
          echo "$output"
          echo "Exit code (124=timeout, 0=exited): $rc"
          if echo "$output" | grep -q "READY"; then
            echo "Smoke test PASSED (binary emitted READY, event monitors active)"
          else
            echo "ERROR: binary did not emit READY (got: $output)"
            exit 1
          fi

      # improved Windows smoke test. Starts the binary, waits for
      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pwsh scripts/build/smoke_test_windows.ps1 ".\${{ matrix.binary }}" '<caps_lock>'

      # ad-hoc sign the macOS binary so it can be granted Accessibility.
      # applies to both macos-x64 and macos-arm64 builds.
      - name: Codesign (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          codesign --force --sign - "${{ matrix.binary }}"
          echo "Ad-hoc signed: ${{ matrix.binary }}"

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # merge the x64 and arm64 macOS binaries into a universal
  pre-commit:
    name: Pre-commit hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth 0 so check-added-large-files can see the full history
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hygiene hooks
        # We intentionally do NOT use `pre-commit run --all-files` (no
        run: |
          set -euo pipefail
          for hook in \
            trailing-whitespace \
            end-of-file-fixer \
            check-yaml \
            check-json \
            check-merge-conflict \
            check-added-large-files \
            mixed-line-ending; do
            echo "::group::pre-commit run $hook --all-files"
            pre-commit run "$hook" --all-files
            echo "::endgroup::"
          done
  notify:
    name: Notify on failure
    # `always()` so the job runs even when one of `needs` failed. Skipped
    if: always()
    # List every job whose failure should fire a notification. jobs not
    needs: [test, client-build, version-check, branding-check, build-native, pre-commit]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize job results
        id: summarize
        run: |
          set -euo pipefail
          # Build a Markdown summary table of every needed job's result.
          {
            echo "## Job results"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| client-build | ${{ needs.client-build.result }} |"
            echo "| version-check | ${{ needs.version-check.result }} |"
            echo "| branding-check | ${{ needs.branding-check.result }} |"
            echo "| build-native | ${{ needs.build-native.result }} |"
            echo "| pre-commit | ${{ needs.pre-commit.result }} |"
          } >> $GITHUB_STEP_SUMMARY

          # Count only failures (skipped/cancelled are not actionable here).
          FAILURE_COUNT=0
          for r in \
              "${{ needs.test.result }}" \
              "${{ needs.client-build.result }}" \
              "${{ needs.version-check.result }}" \
              "${{ needs.branding-check.result }}" \
              "${{ needs.build-native.result }}" \
              "${{ needs.pre-commit.result }}"; do
            if [ "$r" = "failure" ]; then
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
            fi
          done
          echo "failure_count=$FAILURE_COUNT" >> $GITHUB_OUTPUT

      - name: Emit failure annotation
        if: steps.summarize.outputs.failure_count != '0'
        run: |
          echo "::error::${{ steps.summarize.outputs.failure_count }} upstream jobs failed in this workflow run. See the Job results table in the run summary for per-job status. To wire Slack/Teams/email notifications, see the S5-CR-72 comment in .github/workflows/build.yml."
          # Exit non-zero so the notify job itself shows as a red X in the
          exit 1

      - name: All green
        if: steps.summarize.outputs.failure_count == '0'
        run: |
          echo "::notice::All upstream jobs passed or were skipped — build is green."
