name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[test]"
          pip list

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q

  # BUILD-N08: client-build job — type-check the Electron/React/TS
  # client on every release tag. Without this, TypeScript strict-mode
  # errors and Vite build failures only surface on the developer's
  # machine. The job runs on Linux because it doesn't need a display
  # or native modules — `tsc --noEmit` and `electron-vite build` are
  # pure Node steps.
  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      - name: Type-check
        working-directory: voice_typer/client
        run: npm run typecheck

      - name: Lint
        working-directory: voice_typer/client
        run: npm run lint

      - name: Format check
        working-directory: voice_typer/client
        run: npm run format:check

      - name: Build renderer + main
        working-directory: voice_typer/client
        run: npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-typer-client-dist
          path: voice_typer/client/out/

  build:
    needs: [test, client-build]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[build]"
          pip install .
          pip list

      - name: Generate app icon
        run: python scripts/build/generate_icon.py scripts/build/voice-typer.ico

      - name: Build with PyInstaller
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath dist --workpath build
          echo "PyInstaller output:"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName

      # BUILD-N20: pin Inno Setup to a specific Chocolatey version so a
      # major-version upgrade doesn't silently break the installer
      # script. ISCC syntax changes between major versions.
      - name: Install Inno Setup (pinned)
        run: choco install innosetup --version=6.2.0 --no-progress -y

      - name: Build installer
        run: |
          iscc scripts/build/installer.iss /O"${{ github.workspace }}"
          echo "Installer output:"
          Get-ChildItem -Path "${{ github.workspace }}" -Filter "*.exe" | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-Setup
          path: ${{ github.workspace }}/VoiceTyper-Setup-*.exe

      - name: Get installer filename
        id: installer
        run: |
          $exe = Get-ChildItem -Path "${{ github.workspace }}" -Filter "VoiceTyper-Setup-*.exe" | Select-Object -First 1
          echo "file=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.installer.outputs.file }}
          tag: ${{ github.ref_name }}
          # BUILD-N19: do NOT overwrite an existing release asset —
          # re-running a tagged build silently overwrote the published
          # installer with whatever was last built. Instead, fail loudly
          # so the maintainer can decide whether to delete + re-run.
          overwrite: false
