name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # NEW-CI-001: also run on PRs so lint/coverage/audit gates are enforced.
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # NEW-DOC-012: test on all supported Python versions, not just 3.12.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[test]"
          # NEW-CI-001: install lint + audit tools.
          pip install ruff pip-audit
          pip list

      - name: Run ruff linter
        # NEW-CI-001: ruff is configured in pyproject.toml but was never
        # invoked in CI.  Run it on the server tree (E501 line-length check).
        run: python -m ruff check voice_typer/server/ --select E501

      - name: Run pyrefly type check
        # TEST-036: pyrefly is configured in pyproject.toml but was never
        # run in CI. Run as a separate step after ruff check so type errors
        # are visible alongside lint errors.
        continue-on-error: true
        run: |
          pip install pyrefly
          pyrefly check

      - name: Run tests with coverage
        # NEW-CI-001: run pytest with coverage reporting.
        run: |
          python -m pytest tests/ -v --tb=short -q \
            --cov=voice_typer --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # NEW-CI-001: upload coverage so it's visible in the PR UI.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Run pip-audit
        # NEW-CI-001: scan installed dependencies for known CVEs.
        # Non-blocking (continue-on-error) — we don't want to block
        # every PR on an upstream CVE, but we want visibility.
        continue-on-error: true
        run: pip-audit --strict

  # NEW-CI-002: version sync check — verify all version strings match
  # pyproject.toml before building.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version sync
        run: |
          pip install -e ".[test]"
          # sync_versions.py exits 0 if all in sync, 1 if not.
          # In CI we want to FAIL if not in sync.
          python scripts/build/sync_versions.py
          # Also verify __version__ matches.
          python -c "from voice_typer import __version__; print(__version__)"

  # BUILD-N08: client-build job — type-check the Electron/React/TS
  # client on every release tag. Without this, TypeScript strict-mode
  # errors and Vite build failures only surface on the developer's
  # machine. The job runs on Linux because it doesn't need a display
  # or native modules — `tsc --noEmit` and `electron-vite build` are
  # pure Node steps.
  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      - name: Type-check
        working-directory: voice_typer/client
        run: npm run typecheck

      - name: Lint
        working-directory: voice_typer/client
        run: npm run lint

      - name: Format check
        working-directory: voice_typer/client
        run: npm run format:check

      - name: Build renderer + main
        working-directory: voice_typer/client
        run: npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-typer-client-dist
          path: voice_typer/client/out/

  build:
    needs: [test, client-build, version-check]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[build]"
          pip install .
          pip list

      # NEW-CI-002: verify installer.iss version matches the git tag
      # before building.  If they drift, the installer will claim a
      # different version than the actual release.
      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $installerVersion = (Get-Content scripts/build/installer.iss | Select-String '#define MyAppVersion "([^"]+)"').Matches.Groups[1].Value
          Write-Host "Git tag version: $tagVersion"
          Write-Host "Installer version: $installerVersion"
          if ($tagVersion -ne $installerVersion) {
            Write-Error "Version mismatch! Git tag=$tagVersion, installer.iss=$installerVersion"
            exit 1
          }
          Write-Host "Versions match."

      - name: Generate app icon
        run: python scripts/build/generate_icon.py scripts/build/voice-typer.ico

      - name: Build with PyInstaller
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath dist --workpath build
          echo "PyInstaller output:"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName

      # BUILD-N20: pin Inno Setup to a specific Chocolatey version so a
      # major-version upgrade doesn't silently break the installer
      # script. ISCC syntax changes between major versions.
      - name: Install Inno Setup (pinned)
        run: choco install innosetup --version=6.2.0 --no-progress -y

      - name: Build installer
        run: |
          iscc scripts/build/installer.iss /O"${{ github.workspace }}"
          echo "Installer output:"
          Get-ChildItem -Path "${{ github.workspace }}" -Filter "*.exe" | Select-Object FullName, Length

      # TEST-037: Compute SHA-256 checksums of all release artifacts.
      # Upload the checksums file alongside the installer so users can
      # verify integrity before running the installer.
      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $checksums = @()
          Get-ChildItem -Path "${{ github.workspace }}" -Filter "VoiceTyper-Setup-*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $checksums += "$hash  $($_.Name)"
            Write-Host "$hash  $($_.Name)"
          }
          $checksums | Out-File -FilePath "${{ github.workspace }}/SHA256SUMS.txt" -Encoding utf8
          Write-Host "Checksums written to SHA256SUMS.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-Setup
          path: ${{ github.workspace }}/VoiceTyper-Setup-*.exe

      - name: Get installer filename
        id: installer
        run: |
          $exe = Get-ChildItem -Path "${{ github.workspace }}" -Filter "VoiceTyper-Setup-*.exe" | Select-Object -First 1
          echo "file=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.installer.outputs.file }}
          tag: ${{ github.ref_name }}
          # BUILD-N19: do NOT overwrite an existing release asset —
          # re-running a tagged build silently overwrote the published
          # installer with whatever was last built. Instead, fail loudly
          # so the maintainer can decide whether to delete + re-run.
          overwrite: false

      # TEST-037: Upload SHA-256 checksums alongside the installer.
      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/SHA256SUMS.txt
          tag: ${{ github.ref_name }}
          overwrite: false
