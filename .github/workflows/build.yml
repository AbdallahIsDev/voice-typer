name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # NEW-CI-001: also run on PRs so lint/coverage/audit gates are enforced.
  pull_request:
    branches: [main, master]

# GAP-1: prevent two releases from racing on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # NEW-DOC-012: test on all supported Python versions, not just 3.12.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          # NEW-CI-001: install lint + audit tools.
          uv pip install --system ruff pip-audit
          pip list

      - name: Run ruff linter
        run: python -m ruff check voice_typer/server/ --select E501

      # TEST-036: pyrefly is a fast Rust-based Python type checker.
      # It runs after ruff (cheap) and before pytest (expensive) so a
      # type regression can fail the build before we spend time on the
      # full test suite. Targets voice_typer/ only — tests/ already
      # carries inline `# pyrefly: ignore` annotations and is checked
      # locally via `pyrefly check` (uses project-includes in
      # pyproject.toml).
      #
      # PYREFLY-HARD-GATE: error count driven from 143 → 0.
      # pyrefly is now a hard gate — failures here will block the PR.
      # The baseline file (pyrefly-baseline.json) tracks the remaining
      # 16 platform-specific false positives that are intentionally
      # suppressed (Windows-only APIs, optional imports, etc.).
      - name: Run pyrefly type check
        run: |
          uv pip install --system pyrefly
          pyrefly check voice_typer/

      # S-12: pyrefly baseline audit.  The baseline file tracks
      # intentionally-suppressed platform-specific false positives.
      # This step diffs the current baseline against the base ref
      # (on PRs) or the previous commit (on push) and fails if
      # entries were ADDED without justification — the baseline
      # should only shrink over time.
      - name: Audit pyrefly baseline changes
        run: |
          if [ ! -f pyrefly-baseline.json ]; then
            echo "No baseline file found — skipping audit"
            exit 0
          fi
          # Determine the comparison ref
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          git fetch origin ${{ github.base_ref || '' }} 2>/dev/null || true
          if git show "$BASE_REF:pyrefly-baseline.json" > /dev/null 2>&1; then
            OLD_BASELINE=$(git show "$BASE_REF:pyrefly-baseline.json" | python -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('suppressed', []) if isinstance(d, dict) else d))" 2>/dev/null)
            NEW_BASELINE=$(python -c "import json; d=json.load(open('pyrefly-baseline.json')); print(len(d.get('suppressed', []) if isinstance(d, dict) else d))" 2>/dev/null)
            if [ -n "$OLD_BASELINE" ] && [ -n "$NEW_BASELINE" ] && [ "$NEW_BASELINE" -gt "$OLD_BASELINE" ]; then
              echo "ERROR: pyrefly baseline grew from $OLD_BASELINE to $NEW_BASELINE suppressed entries."
              echo "Each new entry must be justified in a comment. Run 'pyrefly check' locally"
              echo "and update pyrefly-baseline.json with only genuinely platform-specific errors."
              echo ""
              echo "Added entries:"
              git show "$BASE_REF:pyrefly-baseline.json" > /tmp/old_baseline.json 2>/dev/null
              python -c "import json;o=json.load(open('/tmp/old_baseline.json'));n=json.load(open('pyrefly-baseline.json'));os_={(d.get('file',''),d.get('line',0),d.get('code','')) for d in (o if isinstance(o,list) else o.get('suppressed',[]))};ns_={(d.get('file',''),d.get('line',0),d.get('code','')) for d in (n if isinstance(n,list) else n.get('suppressed',[]))};[print(f'  {e[0]}:{e[1]} [{e[2]}]') for e in sorted(ns_-os_)]" 2>/dev/null || echo "  (could not diff)"
              exit 1
            fi
            echo "Baseline audit passed: $NEW_BASELINE suppressed entries"
          else
            echo "No previous baseline to compare against — skipping audit"
          fi

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short -q \
            --cov=voice_typer --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit --strict

  # TASK-013: optional slow-tests job. Runs the @pytest.mark.slow
  # wrappers around the manual diagnostic scripts in tests/manual/.
  # This is best-effort — failures here do NOT block the build
  # (continue-on-error: true) and the job only runs on main-branch
  # pushes (not PRs) to save CI minutes. The job exists to surface
  # regressions in the manual scripts themselves (e.g. a refactor
  # breaking runtime_proof.py's exit-code contract), not to gate
  # releases.
  slow-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          pip list

      - name: Run slow manual-script wrappers
        # --no-cov: coverage is already collected by the main test job;
        # we only care whether the slow wrappers pass here.
        run: |
          python -m pytest tests/test_manual_slow.py -v --tb=short --slow --no-cov

  # NEW-CI-002: version sync check
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Check version sync
        run: |
          uv pip install --system -e ".[test]"
          python scripts/build/sync_versions.py
          python -c "from voice_typer import __version__; print(__version__)"

  # BRAND-001: branding consistency check
  branding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for hardcoded app name references
        run: |
          python scripts/check_branding.py

  # BUILD-N08: client-build job
  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      - name: Type-check
        working-directory: voice_typer/client
        run: npm run typecheck

      - name: Lint
        working-directory: voice_typer/client
        run: npm run lint

      - name: Test
        working-directory: voice_typer/client
        run: npm run test

      - name: Format check
        working-directory: voice_typer/client
        run: npm run format:check

      - name: Build renderer + main
        working-directory: voice_typer/client
        run: npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-typer-client-dist
          path: voice_typer/client/out/

  # GAP-1: build-native matrix job. Compiles each native key-listener
  # binary on its native platform (Swift on macOS, MSVC on Windows, gcc
  # on Linux). The binaries are uploaded as artifacts so the per-platform
  # installer jobs (build-windows, build-macos, build-linux) can download
  # them and bundle them into PyInstaller/electron-builder packages.
  build-native:
    needs: [test, client-build, version-check]
    strategy:
      matrix:
        include:
          - os: macos-13
            platform: macos
            script: bash scripts/build/compile_native.sh
            binary: voice_typer/server/native/macos-key-listener
            artifact_name: macos-key-listener
          - os: windows-2022
            platform: windows
            script: powershell scripts/build/compile_native.ps1
            binary: voice_typer/server/native/windows-key-listener.exe
            artifact_name: windows-key-listener
          - os: ubuntu-22.04
            platform: linux
            script: bash scripts/build/compile_native.sh
            binary: voice_typer/server/native/linux-key-listener
            artifact_name: linux-key-listener
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile native binary (${{ matrix.platform }})
        run: ${{ matrix.script }}

      - name: Verify binary exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.binary }}" ]; then
            echo "ERROR: binary not found at ${{ matrix.binary }}"
            exit 1
          fi
          echo "Binary compiled successfully:"
          ls -la "${{ matrix.binary }}"

      # GAP-1 edge case: smoke test. Each platform has a different
      # expected behavior in CI (no GUI, no input devices, no
      # Accessibility). We treat the "expected failure" as success.
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # Linux CI has no /dev/input/event* — binary should emit
          # "ERROR:No keyboard devices found" and exit 1.
          output=$(./${{ matrix.binary }} '<caps_lock>' 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q "ERROR:"; then
            echo "Smoke test PASSED (binary ran and emitted expected ERROR)"
          else
            echo "ERROR: binary did not emit expected ERROR line"
            exit 1
          fi

      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macOS CI has no Accessibility permission — binary should
          # emit "ERROR:Accessibility permission required" and exit 1.
          output=$(./${{ matrix.binary }} '<f2>' 2>&1 &
          sleep 2
          kill %1 2>/dev/null || true
          wait 2>/dev/null || true)
          echo "$output"
          if echo "$output" | grep -qE "(ERROR:|READY)"; then
            echo "Smoke test PASSED (binary ran and emitted ERROR or READY)"
          else
            echo "ERROR: binary did not emit ERROR or READY"
            exit 1
          fi

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Windows CI: binary runs the WH_KEYBOARD_LL hook. It should
          # start and keep running (timeout = success, crash = failure).
          $proc = Start-Process -FilePath ".\${{ matrix.binary }}" -ArgumentList '<caps_lock>' -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            $code = $proc.ExitCode
            if ($code -eq 0) {
              Write-Host "Smoke test PASSED (binary exited 0)"
            } else {
              Write-Error "Smoke test FAILED (binary crashed with code $code)"
              exit 1
            }
          } else {
            Write-Host "Smoke test PASSED (binary is running)"
            Stop-Process -Id $proc.Id -Force
          }

      # GAP-1: ad-hoc sign the macOS binary so it can be granted Accessibility
      - name: Codesign (macOS only)
        if: matrix.platform == 'macos'
        run: |
          codesign --force --sign - "${{ matrix.binary }}"
          echo "Ad-hoc signed: ${{ matrix.binary }}"

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # GAP-1: build-windows (renamed from "build"). Downloads the Windows
  # native binary from build-native, runs PyInstaller + Inno Setup.
  build-windows:
    needs: [test, client-build, version-check, build-native]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: |
          uv pip install --system ".[build]"
          uv pip install --system .
          pip list

      # GAP-1: download the Windows native binary compiled by build-native
      - name: Download Windows native binary
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: voice_typer/server/native/

      - name: Verify native binary
        shell: pwsh
        run: |
          $bin = "voice_typer/server/native/windows-key-listener.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "Native binary not found: $bin"
            exit 1
          }
          Write-Host "Native binary present: $bin"

      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $installerVersion = (Get-Content scripts/build/installer.iss | Select-String '#define MyAppVersion "([^"]+)"').Matches.Groups[1].Value
          if ($tagVersion -ne $installerVersion) {
            Write-Error "Version mismatch! Git tag=$tagVersion, installer.iss=$installerVersion"
            exit 1
          }

      - name: Generate app icon
        run: python scripts/build/generate_icon.py scripts/build/voice-typer.ico

      - name: Build with PyInstaller
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath dist --workpath build

      - name: Install Inno Setup (pinned)
        run: choco install innosetup --version=6.2.0 --no-progress -y

      - name: Build installer
        run: |
          iscc scripts/build/installer.iss /O"${{ github.workspace }}"

      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $checksums = @()
          Get-ChildItem -Path "${{ github.workspace }}" -Filter "VoiceTyper-Setup-*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $checksums += "$hash  $($_.Name)"
          }
          $checksums | Out-File -FilePath "${{ github.workspace }}/SHA256SUMS.txt" -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-Setup
          path: ${{ github.workspace }}/VoiceTyper-Setup-*.exe

      - name: Get installer filename
        id: installer
        run: |
          $exe = Get-ChildItem -Path "${{ github.workspace }}" -Filter "VoiceTyper-Setup-*.exe" | Select-Object -First 1
          echo "file=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.installer.outputs.file }}
          tag: ${{ github.ref_name }}
          overwrite: false

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/SHA256SUMS.txt
          tag: ${{ github.ref_name }}
          overwrite: false

  # GAP-1: build-macos. Downloads the macOS native binary, runs
  # PyInstaller + electron-builder for .dmg.
  build-macos:
    needs: [test, client-build, version-check, build-native]
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: |
          uv pip install --system ".[build]"
          uv pip install --system .
          pip list

      - name: Download macOS native binary
        uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: voice_typer/server/native/

      - name: Verify native binary
        run: |
          bin="voice_typer/server/native/macos-key-listener"
          if [ ! -f "$bin" ]; then
            echo "ERROR: native binary not found: $bin"
            exit 1
          fi
          chmod +x "$bin"
          echo "Native binary present: $bin"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      - name: Build with PyInstaller
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath dist --workpath build

      - name: Build macOS .dmg with electron-builder
        working-directory: voice_typer/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-macOS
          path: voice_typer/client/dist/*.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: voice_typer/client/dist/*.dmg
          tag: ${{ github.ref_name }}
          file_glob: true
          overwrite: false

  # GAP-1: build-linux. Downloads the Linux native binary, runs
  # PyInstaller + electron-builder for .deb / .rpm / AppImage.
  build-linux:
    needs: [test, client-build, version-check, build-native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: |
          uv pip install --system ".[build]"
          uv pip install --system .
          pip list

      - name: Download Linux native binary
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: voice_typer/server/native/

      - name: Verify native binary
        run: |
          bin="voice_typer/server/native/linux-key-listener"
          if [ ! -f "$bin" ]; then
            echo "ERROR: native binary not found: $bin"
            exit 1
          fi
          chmod +x "$bin"
          echo "Native binary present: $bin"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      - name: Build with PyInstaller
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath dist --workpath build

      - name: Install Linux build deps (fpm for electron-builder)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libarchive-tools

      - name: Build Linux packages with electron-builder
        working-directory: voice_typer/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish never

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-Linux
          path: |
            voice_typer/client/dist/*.deb
            voice_typer/client/dist/*.rpm
            voice_typer/client/dist/*.AppImage

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: voice_typer/client/dist/*
          tag: ${{ github.ref_name }}
          file_glob: true
          overwrite: false
