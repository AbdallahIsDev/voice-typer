# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5             — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-python@v7         — Node 24 runtime; removed `pip-install` input (v5/v6 = Node 20)
#   actions/setup-node@v7            — Node 24 runtime; auto-caching via `packageManager` is opt-in (v4 = Node 20)
#   actions/cache@v5                 — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v5       — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/download-artifact@v5    — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/attest-build-provenance@v4 — Node 24 runtime; wraps actions/attest (v1 = Node 16, deprecated)
#   astral-sh/setup-uv@v6            — Node 24 runtime (v3 = Node 20, deprecated)
#   mikepenz/action-junit-report@v6   — Node 24 runtime (v4 = Node 20, deprecated)
#   codecov/codecov-action@v5          — Node 24 runtime (v4 = Node 20, deprecated)
#   peter-evans/create-issue-from-file@v5 — Node 24 runtime (v4 = Node 20, deprecated)
# Breaking changes already verified safe for this repo:
#   - setup-node@v6+ auto-caches via packageManager field → not used here (explicit `cache: npm`)
#   - setup-python@v7 removed `pip-install` input → not used in any workflow
#   - checkout@v5 blocks unsafe PR checkout for pull_request_target → no pull_request_target used
# =============================================================================

name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  # NEW-CI-001: also run on PRs so lint/coverage/audit gates are enforced.
  pull_request:
    branches: [main, master]
    # CI-02: skip the entire workflow for docs-only / markdown-only PRs
    # (no code to build or test). Frontend code (.ts/.tsx) still triggers
    # because client-build covers it.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # S-2: weekly schedule for the pip-audit-weekly job (runs full audit
  # without the accepted-findings ignore list, opens an issue if new
  # findings appear).
  schedule:
    # 09:00 UTC every Monday — start of week triage.
    - cron: "0 9 * * 1"

# GAP-1: prevent two releases from racing on the same tag.
# CI-08: add a separate concurrency group for PRs so that two pushes to
# the same PR cancel each other (saves CI minutes). Releases keep
# cancel-in-progress: false because a release build should never be
# cancelled mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# XS-54: top-level permissions default — least-privilege. Per-job
# overrides widen where needed (release jobs need contents: write,
# pip-audit-weekly / slow-tests need issues: write).
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    # XS-REVIEW: skip the full test matrix on weekly schedule runs —
    # only pip-audit-weekly should run on schedule.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # XS-25: cap test job runtime — a hung pytest leg should not consume a
    # runner for 6h (the GitHub default).
    timeout-minutes: 30
    strategy:
      # CI-02: PRs run a reduced matrix (one Python per OS) to save CI
      # minutes; the full 4×3 matrix runs on push (branches/tags) where we
      # want maximum coverage before release.
      # BUILD-N03: GitHub deprecated the macos-13 Intel runner in favor
      # of macos-14 (Apple Silicon). The Intel test matrix was the only
      # remaining use of macos-13 — port it to macos-14 with
      # `architecture: x64` so the x86_64-only tests (win32 ABI parity,
      # ctypes.windll, pywin32 stub paths) keep running on an Intel
      # Python interpreter under Rosetta 2 on the arm64 host.
      # XS-24: the PR matrix keeps `architecture: x64` on the macOS-14
      # entry to preserve Intel-parity coverage. The PUSH matrix no
      # longer forces x64 globally — each OS uses its native arch
      # (macOS-14 → arm64, ubuntu/windows → x64), so Apple Silicon now
      # gets native-arm64 Python coverage on push runs. Previously the
      # global `architecture:["x64"]` overrode macOS-14 to Rosetta x64
      # on every push run too, contradicting the old comment.
      matrix:
        ${{ github.event_name == 'pull_request' && fromJson('{"include":[{"os":"ubuntu-22.04","python-version":"3.12"},{"os":"windows-2022","python-version":"3.13"},{"os":"macos-14","python-version":"3.13","architecture":"x64"}]}') || fromJson('{"os":["windows-2022","ubuntu-22.04","macos-14"],"python-version":["3.10","3.11","3.12","3.13"]}') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth 2 so the pyrefly baseline audit step
          # can resolve HEAD~1 (the previous main commit) for push events.
          # The default shallow checkout (depth 1) has no parent commit,
          # so `git show HEAD~1:pyrefly-baseline.json` fails and the
          # audit falls back to OLD_COUNT=0 — which is always < the live
          # error count (~260), failing every push build with a bogus
          # "Pyrefly error count grew from 0 to 260" gate. PR events use
          # origin/<base_ref> instead, so they are unaffected.
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # BUILD-N03 / XS-24: when running on macos-14 (Apple Silicon),
          # setup-python defaults to arm64. The PR matrix's macOS-14
          # entry explicitly sets architecture=x64 to keep testing the
          # Intel interpreter (Rosetta 2 on the runner). The push matrix
          # no longer carries an `architecture` key, so matrix.architecture
          # evaluates to '' there → setup-python uses each OS's native
          # arch (macOS-14 → arm64, ubuntu/windows → x64).
          architecture: ${{ matrix.architecture }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          # NEW-CI-001: install lint + audit tools.
          # TX-41: pin ruff to the exact 0.16.0 release that the
          # pre-commit hook (`.pre-commit-config.yaml` →
          # `astral-sh/ruff-pre-commit` rev `v0.16.0`) uses, so CI and
          # local pre-commit runs lint against identical rule
          # semantics. The pyproject.toml `[project.optional-dependencies].dev`
          # entry allows `>=0.16,<0.17`; CI pins to the floor (0.16.0)
          # for determinism — a patch bump (0.16.1+) here would silently
          # change ruff's rule output vs. the pre-commit hook. Bump only
          # as an atomic coordinated change across all three surfaces.
          uv pip install --system ruff==0.16.0 pip-audit
          # XS-84: pytest-xdist enables `-n auto --dist=loadgroup` in
          # the pytest invocation below — parallelises the 331-file
          # suite across cores for ~2-3x CI speedup per matrix leg.
          uv pip install --system pytest-xdist
          pip list

      # ── RW-11: ruff ratchet ────────────────────────────────────────
      # The previous step was `ruff check voice_typer/server/ --select E501`
      # which bypassed ~99% of the rules configured in pyproject.toml's
      # [tool.ruff.lint] select = ["E","F","W","I","N","UP","B","A","SIM"].
      # Removing --select E501 would have surfaced ~729 errors at the
      # time RW-11 was filed; the codebase has since been driven down to
      # a handful of remaining violations. Rather than re-tighten to a
      # blanket hard-fail (which breaks CI on the first new style nit),
      # we use a ratchet:
      #
      #   1. HARD-FAIL on F-rules (pyflakes — real bugs: unused imports,
      #      undefined names, redefinitions). Zero tolerance.
      #   2. SOFT-FAIL on every other configured rule: capture the
      #      current violation set as JSON and compare against
      #      ruff-baseline.json. CI fails if the total OR any per-rule
      #      count grows above the baseline. The baseline only ever
      #      shrinks — never edit it to add violations.
      #
      # See docs/ruff-ratchet.md for the developer workflow.
      - name: Ruff (F-rules hard-fail)
        # scope expanded from `voice_typer/server/` only to
        # `voice_typer/ tests/ scripts/ conftest.py` so F-rule
        # violations (unused imports, undefined names, redefinitions)
        # in tests/ and scripts/ no longer accumulate without a CI
        # signal. As of 2026-07-21 this step reports 22 F-rule
        # violations across the expanded scope (4 in voice_typer/,
        # 18 in tests/scripts/conftest.py) — those need to be fixed
        # before this gate can pass. The scope
        # (voice_typer/server/) reported 4 violations, so CI was
        # already failing on this step; just makes the
        # failure cover the full surface area.
        run: python -m ruff check voice_typer/ tests/ scripts/ conftest.py --select F --no-fix

      - name: Ruff (ratchet compare against baseline)
        # scope expanded to match the F-rules hard-fail above.
        # The ruff-baseline.json `_target` field was updated to match.
        # Per-rule and total counts were bumped from the
        # server/-only baseline (45 total / 6 rules) to the expanded
        # scope (159 total / 19 rules) so the ratchet catches future
        # growth across the full codebase.
        run: |
          python -m ruff check voice_typer/ tests/ scripts/ conftest.py --output-format=json > ruff-current.json || true
          python scripts/ruff_ratchet_check.py

      # i18n key-completeness gate. Runs the i18n completeness suite
      # explicitly BEFORE the full pytest sweep so a missing-key regression
      # fails the build fast (the full test step also runs this file, but
      # surfacing it as its own step makes the failure obvious in CI logs
      # instead of buried in 2700+ test results). The gate enforces:
      #   1. Every key in en.json exists in every non-English locale file.
      #   2. Locale files have no extra keys not in en.json.
      #   3. Every {placeholder} in en.json values exists in locale values.
      #   4. No locale value is identical to English unless explicitly
      #      allowlisted (ALLOWED_UNTRANSLATED, PRE_EXISTING_UNTRANSLATED,
      #      or RW2_BACKFILLED_PENDING_TRANSLATION — the stopgap set
      #      tracking keys backfilled as English fallback pending native
      #      translation).
      # See tests/test_i18n_completeness.py for the ratchet that ensures
      # RW2_BACKFILLED_PENDING_TRANSLATION only shrinks over time.
      - name: i18n key-completeness gate (RW-2)
        run: |
          python -m pytest tests/test_i18n_completeness.py --timeout=30 --no-cov -q

      # pyrefly is a fast Rust-based Python type checker.
      # It runs after ruff (cheap) and before pytest (expensive) so a
      # type regression can fail the build before we spend time on the
      # full test suite. Targets voice_typer/ only — tests/ already
      # carries inline `# pyrefly: ignore` annotations and is checked
      # locally via `pyrefly check` (uses project-includes in
      # pyproject.toml).
      #
      # pyrefly 1.1.1's `check` command exits 0 even when it
      # reports unsuppressed type errors, so the previous bare
      # `pyrefly check voice_typer/` invocation was theatre (116 type
      # errors silently passed on every PR) AND the audit step
      # compared two committed copies of pyrefly-baseline.json (HEAD
      # vs base ref), so any PR that introduced new errors but didn't
      # touch the baseline passed silently.
      #
      # applied the ratchet fix (option (b)
      # from the finding):
      #   1. This step writes the FULL live pyrefly output to
      #      pyrefly-current.json using an empty `--baseline` override
      #      so no errors are suppressed. The `|| true` is intentional
      #      — pyrefly's exit code is unreliable (this is the bug
      #      identified in XS-1).
      #   2. The "Audit pyrefly baseline changes" step below reads
      #      NEW_COUNT from the LIVE pyrefly-current.json (NOT from a
      #      committed file) and compares against OLD_COUNT (the base
      #      ref's committed pyrefly-baseline.json floor). The gate
      #      fails only when NEW_COUNT > OLD_COUNT. The baseline file
      #      holds the team's accepted error set (currently 156
      #      platform-specific / third-party-stub errors) and only
      #      ever shrinks — shrinking it requires editing
      #      pyrefly-baseline.json in the same PR.
      # This is the ratchet approach: any growth in real type errors
      # trips the gate, but the existing 156 errors don't block every
      # PR (which option (a) — hard-fail on any error — would do).
      - name: Run pyrefly type check
        run: |
          # pin pyrefly==1.1.1 so error counts don't drift
          # between releases. Previously unpinned (`uv pip install
          # --system pyrefly`), which caused CI breakage when a new
          # pyrefly release added different heuristics.
          uv pip install --system pyrefly==1.1.1
          # pyrefly 1.1.1 exits 0 even when it reports errors
          # (known behavior — see XS-1 comment above). The REAL gate is
          # the baseline audit step below, which fails only when the
          # error count GROWS. This step just generates the JSON output
          # for the audit step to consume. We do NOT fail here on
          # existing errors — only the audit step can fail (on growth).
          #
          # Bypass the pyproject.toml `baseline` config by
          # passing `--baseline` with an empty JSON file. Without this
          # override, pyrefly suppresses every error listed in the
          # committed pyrefly-baseline.json — so pyrefly-current.json
          # would only contain NEW (unsuppressed) errors. The audit step
          # below compares the FULL live error count against the base
          # ref's baseline count, so we need the FULL count here (not
          # the suppressed count). The empty baseline file is the
          # explicit "no suppression" signal.
          echo '{"errors":[]}' > /tmp/pyrefly-empty-baseline.json
          pyrefly check voice_typer/ --baseline /tmp/pyrefly-empty-baseline.json --output-format=json > pyrefly-current.json || true
          # Write the current errors into pyrefly-baseline.json if the
          # file doesn't exist (first run on a fresh checkout).
          if [ ! -f pyrefly-baseline.json ]; then
            cp pyrefly-current.json pyrefly-baseline.json
          fi

      # pyrefly baseline audit.  The baseline file tracks
      # intentionally-suppressed platform-specific false positives.
      # This step compares the LIVE pyrefly output (pyrefly-current.json,
      # generated by the previous "Run pyrefly type check" step) against
      # the base ref's committed baseline (pyrefly-baseline.json) and
      # fails if the live error count GROWS beyond the baseline floor.
      #
      # Pre-fix this step compared the committed
      # ``pyrefly-baseline.json`` at HEAD against the same file at the base
      # ref — both readings came from committed files, so a PR that
      # introduced new type errors but didn't touch the baseline passed
      # silently. The fix reads NEW_COUNT from ``pyrefly-current.json``
      # (the live ``pyrefly check`` output written by the previous step)
      # so any new error introduced by the PR actually trips the gate.
      # The OLD_COUNT floor is still the base ref's committed baseline
      # (the team's accepted error set); shrinking the floor requires
      # editing ``pyrefly-baseline.json`` in the same PR.
      - name: Audit pyrefly baseline changes
        run: |
          if [ ! -f pyrefly-current.json ]; then
            echo "::error::pyrefly-current.json not found — Run pyrefly type check step must run before this audit."
            exit 1
          fi
          # Determine the comparison ref
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          git fetch origin ${{ github.base_ref || '' }} 2>/dev/null || true
          # pyrefly-baseline.json's top-level key is `errors`
          # (pyrefly's native output schema). Pre-CR-010 this read
          # `d.get('suppressed', [])` — a key that does not exist in
          # the baseline — so OLD_BASELINE and NEW_BASELINE were both
          # always 0 and the audit could never fire. The diff-set
          # computation below was also reading `d.get('file','')` —
          # the actual schema field is `path`. Both fixed here.
          OLD_COUNT=$(git show "$BASE_REF:pyrefly-baseline.json" 2>/dev/null | python -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('errors', []) if isinstance(d, dict) else d))" 2>/dev/null || echo 0)
          # Read the LIVE pyrefly output (not the committed
          # baseline) so newly-introduced errors actually trip the gate.
          NEW_COUNT=$(python -c "import json; d=json.load(open('pyrefly-current.json')); print(len(d.get('errors', []) if isinstance(d, dict) else d))" 2>/dev/null || echo 0)
          echo "Pyrefly: baseline floor = $OLD_COUNT errors, live current = $NEW_COUNT errors"
          if [ "$NEW_COUNT" -gt "$OLD_COUNT" ]; then
            echo "::error::Pyrefly error count grew from $OLD_COUNT (baseline) to $NEW_COUNT (live)."
            echo "Each new error must be fixed OR the baseline floor must be raised in pyrefly-baseline.json"
            echo "with justification (platform-only false positive, missing optional dep, etc.)."
            echo ""
            echo "Added entries (in live output, not in base-ref baseline):"
            git show "$BASE_REF:pyrefly-baseline.json" > /tmp/old_baseline.json 2>/dev/null || echo '[]' > /tmp/old_baseline.json
            python -c "import json;o=json.load(open('/tmp/old_baseline.json'));n=json.load(open('pyrefly-current.json'));os_={(d.get('path',''),d.get('line',0),d.get('code','')) for d in (o if isinstance(o,list) else o.get('errors',[]))};ns_={(d.get('path',''),d.get('line',0),d.get('code','')) for d in (n if isinstance(n,list) else n.get('errors',[]))};[print(f'  {e[0]}:{e[1]} [{e[2]}]') for e in sorted(ns_-os_)]" 2>/dev/null || echo "  (could not diff)"
            exit 1
          fi
          echo "Baseline audit passed: $NEW_COUNT live errors ≤ $OLD_COUNT baseline floor"

      - name: Run tests with coverage
        # --cov-fail-under=65 moved here from pyproject.toml addopts
        # so local subset runs (e.g. `pytest tests/test_foo.py`) no
        # longer trigger the coverage threshold (the conftest.py
        # --cov-strip shim was dead code that gave a false sense of
        # robustness — see XS-9).
        # -n auto --dist=loadgroup parallelises via pytest-xdist.
        # --junitxml emits pytest-results.xml consumed by the
        # mikepenz/action-junit-report step below for PR annotations.
        # explicit --timeout / --strict-* on the CI invocation too
        # (pyproject.toml addopts already sets them via WR-1, but defense-
        # in-depth — a future edit that drops addopts would silently lose
        # these guards if they lived only in pyproject.toml).
        run: |
          python -m pytest tests/ -n auto --dist=loadgroup -v --tb=short -q \
            --cov=voice_typer --cov-fail-under=65 \
            --cov-report=xml --cov-report=term-missing \
            --junitxml=pytest-results.xml \
            --timeout=120 --timeout-method=thread \
            --strict-markers --strict-config

      # publish test results as PR annotations so a single
      # failing test among 331 files is surfaced directly on the diff
      # instead of buried in -v --tb=short log output. `if: always()` so
      # the report still publishes when the pytest step above fails.
      - name: Test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Test results
          report_paths: pytest-results.xml
          require_tests: false

      - name: Upload coverage to Codecov
        # `if: always()` so coverage is uploaded EVEN WHEN pytest
        # fails — the delta vs. main is the most useful signal on a red
        # run, and Codecov PR comments rely on the upload landing. Without
        # `always()` a single failing test would silently suppress the
        # coverage diff for the entire PR.
        # only the Linux × Python 3.12 leg uploads coverage. The
        # Windows + macOS legs run pytest with --cov but DO NOT upload —
        # their coverage.xml is per-OS noisy (different stub paths, different
        # optional deps installable) and Codecov's per-OS coverage deltas
        # would drown the canonical Linux signal. Documenting here so future
        # maintainers don't try to "fix" the asymmetry by removing the
        # `matrix.os == 'ubuntu-22.04'` filter.
        # fail_ci_if_error flipped to `true` now that
        # CODECOV_TOKEN is wired. Pre-fix the `false` value meant a broken
        # upload (e.g. 401 from a missing token on a fork PR, 502 from
        # Codecov outage, malformed coverage.xml) silently passed — the
        # coverage diff on the PR would just be missing with no signal.
        # With `true`, broken uploads fail the build so the regression is
        # visible. Forks without CODECOV_TOKEN secret: codecov-action@v5
        # supports OIDC-based tokenless upload for public repos, so a
        # missing token degrades to tokenless mode (which still uploads)
        # rather than failing — but if tokenless upload is also broken we
        # want to know.
        if: always() && matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # coverage ratchet. The fixed --cov-fail-under=65 floor
      # only catches catastrophic drops below 65%; this step catches
      # silent erosion (e.g. 70% → 65.01%). Compares the current total
      # coverage % against coverage-baseline.json and fails if current <
      # baseline (epsilon 0.01% for float jitter). Run only on the
      # ubuntu×3.12 leg (the canonical leg for Codecov upload) to avoid
      # matrix fan-out cost and per-OS coverage variance noise.
      - name: Coverage ratchet check
        # WR-15: `if: always()` mirrors the Codecov upload gate above so
        # the ratchet runs against whatever coverage.xml was produced
        # (even on red pytest legs) — same rationale as the upload step.
        if: always() && matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        run: python scripts/coverage_ratchet_check.py

      # pip-audit two-tier policy.
      #
      # Previously this step ran `pip-audit --strict` with
      # `continue-on-error: true`, which meant vulnerability findings in
      # pinned dependencies NEVER failed the build — the audit was
      # theatre. We now split into two tiers:
      #
      #   1. HARD-FAIL on ANY vulnerability. The accepted-findings list is
      #      currently EMPTY (no CVEs have been triaged-and-accepted). If a
      #      finding is reviewed and deliberately accepted, add it here as
      #      `--ignore-vuln <GHSA>` on its own line WITH a justification
      #      comment directly above it (see policy note below).
      #   2. The weekly scheduled job (pip-audit-weekly below) runs the
      #      full audit without --ignore-vuln and posts a reminder issue
      #      if new findings appear — so we can re-triage before they
      #      become blockers.
      #
      # The split prevents two failure modes:
      #   - "ignore everything" (the old continue-on-error: true)
      #   - "block everything" (removing continue-on-error without a
      #     triaged ignore list would break CI on every upstream CVE)
      #
      # the per-PR gate now HARD-FAILS on any finding.
      # The previous `continue-on-error: true` meant vulnerabilities NEVER
      # failed the build — pure security theatre. Accepted findings MUST
      # be listed below as `--ignore-vuln <GHSA>` with a justification
      # comment above each. The weekly pip-audit-weekly job re-runs the
      # full audit (no ignore list) and posts a reminder issue if new
      # findings appear, so triaged-and-accepted CVEs don't slip through.
      #
      # Remaining Work: as of 2026-07-21 the accepted-findings list below
      # is EMPTY. If `pip-audit --strict` reports a finding on the next
      # CI run, triage it: either pin/upgrade the affected dep to clear
      # the CVE, OR add a `--ignore-vuln <GHSA>` line with a tracking
      # issue number in a justification comment.
      - name: pip-audit (fail on findings; weekly sweep handled separately)
        run: |
          # Accepted findings: add `--ignore-vuln <GHSA>` lines here with a
          # justification comment above each. Example:
          #   # requests: low-severity redirect issue, no fix available yet (tracked in #NNN)
          #   --ignore-vuln GHSA-xxxx-xxxx-xxxx
          pip-audit --strict

  # weekly pip-audit sweep — runs the FULL audit (no ignore list)
  # on a schedule so we can re-triage new findings before they become
  # blockers. Posts a GitHub issue if any findings appear.
  pip-audit-weekly:
    if: github.event_name == 'schedule'
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap weekly audit runtime.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          uv pip install --system pip-audit

      - name: Full pip-audit (no ignore list)
        id: audit
        continue-on-error: true
        run: |
          pip-audit --strict > /tmp/audit.txt 2>&1
          echo "findings<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/audit.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Open issue if findings
        if: steps.audit.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "[Weekly pip-audit] New vulnerabilities detected"
          content-filepath: /tmp/audit.txt
          labels: security,dependencies

  # optional slow-tests job. Runs the @pytest.mark.slow
  # wrappers around the manual diagnostic scripts in tests/manual/.
  # This is best-effort — failures here do NOT block the build
  # (continue-on-error: true) and the job only runs on main-branch
  # pushes (not PRs) to save CI minutes. The job exists to surface
  # regressions in the manual scripts themselves (e.g. a refactor
  # breaking runtime_proof.py's exit-code contract), not to gate
  # releases.
  slow-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap slow-test runtime (these are the manual-script wrappers
    # — slower than the main suite).
    timeout-minutes: 60
    # removed job-level `continue-on-error: true`. Slow-test
    # regressions now surface in CI check status. A failure opens a
    # tracking issue (see the issue-on-failure step below) so regressions
    # in tests/manual/ scripts no longer rot invisibly in main-branch
    # run logs. PRs are NOT blocked because this job only runs on main.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          pip list

      - name: Run slow manual-script wrappers
        # --no-cov: coverage is already collected by the main test job;
        # we only care whether the slow wrappers pass here.
        # capture stdout/stderr to /tmp/slow-tests-failure.txt so
        # the issue-on-failure step below can attach the failure log.
        run: |
          set +e
          python -m pytest tests/test_manual_slow.py -v --tb=short --slow --no-cov > /tmp/slow-tests-failure.txt 2>&1
          rc=$?
          cat /tmp/slow-tests-failure.txt
          exit $rc

      # open a tracking issue on failure so slow-test regressions
      # are not buried in CI logs. Mirrors the pip-audit-weekly pattern.
      - name: Open issue on slow-test failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "[slow-tests] Regression detected in tests/test_manual_slow.py"
          content-filepath: /tmp/slow-tests-failure.txt
          labels: testing,regression

  # version sync check
  version-check:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap version-check runtime.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Check version sync
        # pass --check so version drift across pyproject.toml,
        # voice_typer/client/package.json, src-tauri/Cargo.toml, and
        # src-tauri/tauri.conf.json FAILS CI instead of silently
        # syncing (the previous bare invocation made the gate a no-op).
        run: |
          uv pip install --system -e ".[test]"
          python scripts/build/sync_versions.py --check
          python -c "from voice_typer import __version__; print(__version__)"

  # branding consistency check
  branding-check:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap branding-check runtime.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check for hardcoded app name references
        run: |
          python scripts/check_branding.py

  # client-build job
  client-build:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    # pinned to match build-linux runner
    runs-on: ubuntu-22.04
    # cap client-build runtime (npm ci + typecheck + lint + test +
    # build:renderer).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install client dependencies
        working-directory: voice_typer/client
        run: npm ci

      # Supply-chain: audit the production dependency graph for known
      # high+ advisories. `--omit=dev` skips devDependencies (dev deps
      # never ship in the Tauri installer — only runtime deps are a
      # supply-chain risk for end users). `--audit-level=high` exits
      # non-zero only for HIGH/CRITICAL findings (low/moderate are
      # reported but tolerated — matches the pip-audit gate policy in
      # this workflow's pip-audit-weekly job).
      # TODO: switch to hard-fail once the override list (accepted-
      # findings) is verified in production CI.
      - name: npm audit (high+ only, warn-only)
        working-directory: voice_typer/client
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: Type-check
        working-directory: voice_typer/client
        # Use typecheck:ci (tsc -b --force) instead of typecheck
        # so a stale tsbuildinfo cache can't produce a false green.
        run: npm run typecheck:ci

      - name: Lint
        working-directory: voice_typer/client
        run: npm run lint

      - name: Test
        working-directory: voice_typer/client
        run: npm run test

      - name: Format check
        working-directory: voice_typer/client
        run: npm run format:check

      # build renderer only (platform-independent). The main +
      # preload parts are built in each platform job since they may be
      # platform-specific. Sharing the renderer artifact saves ~30s per
      # platform build.
      - name: Build renderer only
        working-directory: voice_typer/client
        run: npm run build:renderer

      - name: Upload renderer artifact
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-renderer-dist
          path: voice_typer/client/out/renderer/

  # build-native matrix job. Compiles each native key-listener
  # binary on its native platform (Swift on macOS, MSVC on Windows, gcc
  # on Linux). The binaries are uploaded as artifacts so the per-platform
  # installer jobs (build-windows, build-macos, build-linux) can download
  # them and bundle them into PyInstaller/electron-builder packages.
  #
  # the two macOS legs pass `--arch x86_64` / `--arch arm64`
  # explicitly so `compile_native.sh` invokes `swiftc -target
  # <arch>-apple-macos11.0` for each leg — previously both legs ran
  # plain `swiftc` which produced an arm64 binary on the Apple-Silicon
  # runner regardless of the matrix leg, so the `lipo -create` step in
  # `build-macos-universal` merged two identical arm64 slices and
  # silently produced a single-arch "universal" binary.
  build-native:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    needs: [test, client-build, version-check]
    strategy:
      matrix:
        include:
          # macOS x64 build (macos-14 = Apple Silicon runner running
          # the x64 compile under Rosetta). CI-04: migrated from the
          # deprecated macos-13 Intel runner.
          # `--arch x86_64` forces `swiftc -target
          # x86_64-apple-macos11.0` so the resulting slice is actually
          # x86_64 (without it, swiftc on the arm64 runner would emit
          # an arm64 binary and the universal merge would silently
          # produce a single-arch fat binary).
          - os: macos-14
            platform: macos-x64
            script: bash scripts/build/compile_native.sh --arch x86_64
            binary: voice_typer/server/native/macos-key-listener
            artifact_name: macos-key-listener-x64
          # macOS arm64 build (macos-14 = Apple Silicon).
          # The two macOS builds are merged into a universal binary by
          # the build-macos-universal job below (lipo -create).
          # `--arch arm64` is redundant on the Apple-Silicon
          # runner (swiftc's default target is arm64) but is passed
          # explicitly so the matrix leg is self-documenting and a
          # future switch to an x86 runner doesn't silently break the
          # arm64 slice.
          - os: macos-14
            platform: macos-arm64
            script: bash scripts/build/compile_native.sh --arch arm64
            binary: voice_typer/server/native/macos-key-listener
            artifact_name: macos-key-listener-arm64
          - os: windows-2022
            platform: windows
            script: powershell scripts/build/compile_native.ps1
            binary: voice_typer/server/native/windows-key-listener.exe
            artifact_name: windows-key-listener
          - os: ubuntu-22.04
            platform: linux
            script: bash scripts/build/compile_native.sh
            binary: voice_typer/server/native/linux-key-listener
            artifact_name: linux-key-listener
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # cap native-binary compile runtime (Swift / MSVC / gcc).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Compile native binary (${{ matrix.platform }})
        run: ${{ matrix.script }}

      - name: Verify binary exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.binary }}" ]; then
            echo "ERROR: binary not found at ${{ matrix.binary }}"
            exit 1
          fi
          echo "Binary compiled successfully:"
          ls -la "${{ matrix.binary }}"
          # RW-12: record the architecture for the universal-binary merge.
          file "${{ matrix.binary }}" || true

      # smoke test improvements. Each platform has a different
      # expected behavior in CI (no GUI, no input devices, no
      # Accessibility). We verify the binary can start and produce the
      # expected output with the expected exit code.
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # Linux CI has no /dev/input/event* — binary should emit
          # "ERROR:No keyboard devices found" and exit 1.
          output=$(./${{ matrix.binary }} '<caps_lock>' 2>&1)
          rc=$?
          echo "$output"
          echo "Exit code: $rc"
          if ! echo "$output" | grep -q "ERROR:"; then
            echo "ERROR: binary did not emit expected ERROR line"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: binary exited with code $rc (expected 1)"
            exit 1
          fi
          echo "Smoke test PASSED (binary emitted ERROR: and exited 1)"

      # improved macOS smoke test. Sets VOICE_TYPER_SKIP_ACCESSIBILITY_CHECK
      # to bypass the Accessibility permission check (which always fails on CI)
      # and verify the binary emits READY within 2s (proving the event tap
      # installed and the run loop started).
      # Uses timeout (3s) to kill the binary after the run loop starts since
      # macOS CI has no real keyboard events to drive the main loop.
      # VOICE_TYPER_SKIP_ACCESSIBILITY_CHECK=1 skips the CGEventTap
      # (which requires Accessibility permission unavailable on CI) so the
      # binary can reach the NSEvent monitors and emit READY.
      - name: Smoke test (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          export VOICE_TYPER_SKIP_ACCESSIBILITY_CHECK=1
          output=$(timeout 3 ./${{ matrix.binary }} '<f2>' 2>&1 || true)
          rc=$?
          echo "$output"
          echo "Exit code (124=timeout, 0=exited): $rc"
          if echo "$output" | grep -q "READY"; then
            echo "Smoke test PASSED (binary emitted READY, event monitors active)"
          else
            echo "ERROR: binary did not emit READY (got: $output)"
            exit 1
          fi

      # improved Windows smoke test. Starts the binary, waits for
      # READY (proving WH_KEYBOARD_LL hook installed), then sends a
      # synthetic CapsLock keystroke via SendInput and verifies the
      # binary's hook callback fires (KEY_DOWN:CapsLock in stdout).
      # See scripts/build/smoke_test_windows.ps1 for the full logic.
      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pwsh scripts/build/smoke_test_windows.ps1 ".\${{ matrix.binary }}" '<caps_lock>'

      # ad-hoc sign the macOS binary so it can be granted Accessibility.
      # applies to both macos-x64 and macos-arm64 builds.
      - name: Codesign (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          codesign --force --sign - "${{ matrix.binary }}"
          echo "Ad-hoc signed: ${{ matrix.binary }}"

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # merge the x64 and arm64 macOS binaries into a universal
  # binary. The universal binary is what build-macos downloads and
  # bundles into the .dmg. This avoids shipping two separate .dmgs
  # (one per architecture) and matches Apple's universal-binary
  # convention for native helper tools.
  build-macos-universal:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    needs: [build-native]
    runs-on: macos-14
    # cap universal-binary merge runtime (lipo is fast).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download x64 binary
        uses: actions/download-artifact@v5
        with:
          name: native-macos-x64
          path: /tmp/macos-x64

      - name: Download arm64 binary
        uses: actions/download-artifact@v5
        with:
          name: native-macos-arm64
          path: /tmp/macos-arm64

      - name: Merge with lipo
        run: |
          mkdir -p voice_typer/server/native
          # verify the two input slices are DIFFERENT arches
          # before merging. Pre-CR-011, both matrix legs ran plain
          # `swiftc` on the arm64 runner and produced identical arm64
          # binaries — `lipo -create` on two identical arm64 slices
          # either errored out ("duplicate architecture") or silently
          # produced a single-arch "universal" binary depending on the
          # Xcode version. The build-native matrix now passes
          # `--arch x86_64` / `--arch arm64` so the slices are
          # guaranteed different — this assertion makes that guarantee
          # explicit so a future regression fails loudly here.
          echo "Input slice arches:"
          lipo -info /tmp/macos-x64/macos-key-listener
          lipo -info /tmp/macos-arm64/macos-key-listener
          X64_ARCH="$(lipo -info /tmp/macos-x64/macos-key-listener | awk '{print $NF}')"
          ARM_ARCH="$(lipo -info /tmp/macos-arm64/macos-key-listener | awk '{print $NF}')"
          if [ "$X64_ARCH" = "$ARM_ARCH" ]; then
            echo "ERROR: both input slices are the same arch ($X64_ARCH) — CR-011 regressed."
            echo "  build-native must pass --arch x86_64 / --arch arm64 to compile_native.sh."
            exit 1
          fi
          lipo -create \
            /tmp/macos-x64/macos-key-listener \
            /tmp/macos-arm64/macos-key-listener \
            -output voice_typer/server/native/macos-key-listener
          chmod +x voice_typer/server/native/macos-key-listener
          # Verify the universal binary contains BOTH architectures.
          UNIVERSAL_INFO="$(lipo -info voice_typer/server/native/macos-key-listener)"
          echo "$UNIVERSAL_INFO"
          file voice_typer/server/native/macos-key-listener
          # CR-011: hard-assert both arches are present in the fat
          # binary. `lipo -info` on a universal binary prints
          # "Architectures in the fat file: <path> are: x86_64 arm64"
          # — both arch names must appear.
          echo "$UNIVERSAL_INFO" | grep -q "x86_64" || {
            echo "ERROR: universal binary is missing x86_64 slice — CR-011 regressed."
            exit 1
          }
          echo "$UNIVERSAL_INFO" | grep -q "arm64" || {
            echo "ERROR: universal binary is missing arm64 slice — CR-011 regressed."
            exit 1
          }
          echo "OK: universal binary contains both x86_64 + arm64 slices."

      - name: Codesign universal binary
        run: |
          codesign --force --sign - voice_typer/server/native/macos-key-listener
          echo "Ad-hoc signed universal binary"

      - name: Upload universal binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-macos
          path: voice_typer/server/native/macos-key-listener
          if-no-files-found: error

  # build-windows (renamed from "build"). Downloads the Windows
  # native binary from build-native, runs PyInstaller + Inno Setup.
  build-windows:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    needs: [test, client-build, version-check, build-native]
    runs-on: windows-2022
    # cap Windows build runtime (PyInstaller + electron-builder
    # NSIS are the slowest steps in the matrix).
    timeout-minutes: 60
    # gate signing-secret exposure behind the `release` environment
    # when triggered by a tag push. PRs / branches get '' (no environment),
    # so WIN_CSC_LINK etc. are not exposed to non-release runs. The
    # `release` environment should be configured with required reviewers
    # in the repo settings to gate signed releases.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      # required for actions/attest-build-provenance to generate signed attestations
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      # cache electron-builder download cache (~200MB of Electron
      # binaries) so it isn't re-fetched on every run.
      - name: Cache electron-builder cache (Windows)
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('voice_typer/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      # cache PyInstaller bundle cache.
      - name: Cache PyInstaller cache (Windows)
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('pyproject.toml') }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: |
          uv pip install --system ".[build]"
          uv pip install --system .
          pip list

      # download the Windows native binary compiled by build-native
      - name: Download Windows native binary
        uses: actions/download-artifact@v5
        with:
          name: native-windows
          path: voice_typer/server/native/

      - name: Verify native binary
        shell: pwsh
        run: |
          $bin = "voice_typer/server/native/windows-key-listener.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "Native binary not found: $bin"
            exit 1
          }
          Write-Host "Native binary present: $bin"

      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # installer.iss was removed (ADR-0020 §13.3 — Inno Setup superseded);
          # the electron-builder NSIS installer inherits its version from
          # voice_typer/client/package.json, so validate the tag against that.
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $installerVersion = (Get-Content voice_typer/client/package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $installerVersion) {
            Write-Error "Version mismatch! Git tag=$tagVersion, package.json=$installerVersion"
            exit 1
          }

      - name: Generate app icon
        run: python scripts/build/generate_icon.py scripts/build/voice-typer.ico

      - name: Build with PyInstaller
        # --distpath voice_typer/dist (CONSISTENT with build-macos
        # and build-linux) so the win.extraResources `from: ../dist` in
        # voice_typer/client/electron-builder.yml resolves to
        # <repo>/voice_typer/dist/. Previously this used `--distpath dist`
        # which produced <repo>/dist/, diverging from the macOS/Linux
        # staging path and breaking cross-platform path consistency.
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath voice_typer/dist --workpath voice_typer/build

      # RW-4: build the Electron UI installer (NSIS) via electron-builder.
      # The PyInstaller backend produced above
      # (voice_typer/dist/VoiceTyper.exe) is embedded into the installer
      # via the `win.extraResources` section of
      # voice_typer/client/electron-builder.yml, which copies ../dist/
      # to <resourcesPath>/voice-typer-backend/ at packaging time. At
      # runtime, index.ts's pythonArgs() looks for the bundled exe first
      # (packaged mode), falling back to the dev-mode venv.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      # CI-05: download the platform-independent renderer built by
      # client-build and only rebuild the platform-specific main + preload.
      - name: Download renderer artifact
        uses: actions/download-artifact@v5
        with:
          name: voice-typer-renderer-dist
          path: voice_typer/client/out/renderer/

      - name: Build main + preload only
        working-directory: voice_typer/client
        run: npm run build:main

      - name: Build Windows .exe installer with electron-builder
        working-directory: voice_typer/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # RW-4 / Wave 3: code-signing env vars (passed through from
          # GitHub Actions secrets). When the secrets are empty (PR builds,
          # forks without secrets configured), electron-builder skips
          # signing — the installer is still produced, just unsigned.
          # Release builds MUST have these secrets set in the repo to
          # produce a signed, SmartScreen-trusted installer.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # CSC_LINK / CSC_KEY_PASSWORD are electron-builder's generic
          # fallback names (used if WIN_CSC_LINK is unset).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload Windows Electron installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Windows-Electron
          path: voice_typer/client/dist/*-setup.exe
          if-no-files-found: error

      # NOTE: the legacy Inno Setup installer steps (choco innosetup + iscc
      # scripts/build/installer.iss) were REMOVED — installer.iss was deleted
      # from the repo (ADR-0020 §13.3: Inno superseded; the electron-builder
      # NSIS installer above is the Windows installer on this legacy path,
      # and the Tauri NSIS bundler is the migration target). The release
      # steps below consume the electron-builder artifact instead.

      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $checksums = @()
          Get-ChildItem -Path "voice_typer/client/dist" -Filter "*-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $checksums += "$hash  $($_.Name)"
          }
          $checksums | Out-File -FilePath "${{ github.workspace }}/SHA256SUMS.txt" -Encoding utf8

      - name: Get installer filename
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "voice_typer/client/dist" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "electron-builder NSIS installer not found"; exit 1 }
          echo "file=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} ${{ steps.installer.outputs.file }} --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} ${{ github.workspace }}/SHA256SUMS.txt --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI-09: SLSA build provenance attestation — generates a signed
      # attestation linking the installer artifact to this workflow run.
      # Users verify with: gh attestation verify <file> --repo owner/repo
      - name: Attest build provenance (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: voice_typer/client/dist/*-setup.exe

  # GAP-1: build-macos. Downloads the macOS native binary, runs
  # PyInstaller + electron-builder for .dmg.
  # RW-12: depends on build-macos-universal (which merges x64 + arm64
  # into a universal binary). CI-04: migrated from the deprecated
  # macos-13 Intel runner to macos-14 (Apple Silicon). The PyInstaller
  # x64 bundle is produced by an x64 Python interpreter installed below
  # (runs under Rosetta), so the .dmg still supports Intel Macs.
  build-macos:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    needs: [test, client-build, version-check, build-macos-universal]
    runs-on: macos-14
    # XS-25: cap macOS build runtime (PyInstaller + electron-builder .dmg).
    timeout-minutes: 60
    # XS-55: gate signing-secret exposure behind the `release` environment
    # when triggered by a tag push. See build-windows for the same gate.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
      # CI-09: required for actions/attest-build-provenance to generate signed attestations
      attestations: write
    steps:
      - uses: actions/checkout@v5

      # CI-03: cache electron-builder download cache.
      - name: Cache electron-builder cache (macOS)
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('voice_typer/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      # CI-03: cache PyInstaller bundle cache.
      - name: Cache PyInstaller cache (macOS)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('pyproject.toml') }}

      - name: Set up Python 3.12 (x64, for x64 PyInstaller bundle)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: |
          uv pip install --system ".[build]"
          uv pip install --system .
          pip list

      - name: Download macOS native binary
        uses: actions/download-artifact@v5
        with:
          name: native-macos
          path: voice_typer/server/native/

      - name: Verify native binary
        run: |
          bin="voice_typer/server/native/macos-key-listener"
          if [ ! -f "$bin" ]; then
            echo "ERROR: native binary not found: $bin"
            exit 1
          fi
          chmod +x "$bin"
          echo "Native binary present: $bin"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      # CI-05: no standalone npm ci here — setup-node restores the
      # node_modules cache that client-build populated, so electron-vite
      # (needed by build:main) is already present. We only re-run the
      # platform-specific main + preload build after downloading the
      # shared renderer, avoiding the redundant ~200MB install per platform.

      # CI-05: download the platform-independent renderer built by
      # client-build and only rebuild the platform-specific main + preload.
      - name: Download renderer artifact
        uses: actions/download-artifact@v5
        with:
          name: voice-typer-renderer-dist
          path: voice_typer/client/out/renderer/

      - name: Build main + preload only
        working-directory: voice_typer/client
        run: npm run build:main

      - name: Build with PyInstaller
        # RW-5: output to voice_typer/dist so the mac.extraResources
        # entry in electron-builder.yml (from: ../dist/voice-typer-backend.app)
        # resolves correctly relative to voice_typer/client/.
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath voice_typer/dist --workpath voice_typer/build

      - name: Stage PyInstaller backend for embedding (macOS)
        # RW-5: PyInstaller spec produces "VoiceTyper" as the output name.
        # electron-builder.yml's mac.extraResources expects the path
        # voice-typer-backend.app/Contents/MacOS/voice-typer. Stage the
        # rename here so the embedded-backend lookup in pythonArgs()
        # (src/main/index.ts) finds the executable at the expected path.
        run: |
          set -euo pipefail
          mkdir -p voice_typer/dist/voice-typer-backend.app/Contents/MacOS
          if [ -d "voice_typer/dist/VoiceTyper.app" ]; then
            # PyInstaller BUNDLE output — replace the placeholder .app
            # directory with the real bundle.
            rm -rf voice_typer/dist/voice-typer-backend.app
            mv voice_typer/dist/VoiceTyper.app voice_typer/dist/voice-typer-backend.app
            echo "Renamed VoiceTyper.app -> voice-typer-backend.app"
          elif [ -f "voice_typer/dist/VoiceTyper" ]; then
            # PyInstaller onefile output (no .app wrapper) — wrap the
            # binary into the .app structure pythonArgs() expects.
            mv voice_typer/dist/VoiceTyper voice_typer/dist/voice-typer-backend.app/Contents/MacOS/voice-typer
            echo "Wrapped onefile VoiceTyper -> voice-typer-backend.app/Contents/MacOS/voice-typer"
          else
            echo "ERROR: PyInstaller macOS output not found at voice_typer/dist/"
            ls -la voice_typer/dist/
            exit 1
          fi
          chmod +x voice_typer/dist/voice-typer-backend.app/Contents/MacOS/voice-typer
          echo "Staged macOS backend:"
          find voice_typer/dist/voice-typer-backend.app -maxdepth 4 -type f -o -type d | head -20

      - name: Build macOS .dmg with electron-builder
        working-directory: voice_typer/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # RW-5: --config electron-builder.yml explicit (the file is picked
        # up by default, but being explicit documents the dependency on
        # the mac.extraResources entry that embeds the PyInstaller backend).
        run: npx electron-builder --mac --config electron-builder.yml --publish never

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-macOS
          path: voice_typer/client/dist/*.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} "voice_typer/client/dist/*.dmg" --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI-09: SLSA build provenance attestation — generates a signed
      # attestation linking the installer artifact to this workflow run.
      # Users verify with: gh attestation verify <file> --repo owner/repo
      - name: Attest build provenance (macOS)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: voice_typer/client/dist/*.dmg

  # GAP-1: build-linux. Downloads the Linux native binary, runs
  # PyInstaller + electron-builder for .deb / .rpm / AppImage.
  build-linux:
    if: github.event_name != 'schedule'  # XS-REVIEW: skip on weekly schedule
    needs: [test, client-build, version-check, build-native]
    runs-on: ubuntu-22.04
    # XS-25: cap Linux build runtime (PyInstaller + electron-builder .deb/.rpm/AppImage).
    timeout-minutes: 60
    # XS-55: gate signing-secret exposure behind the `release` environment
    # when triggered by a tag push. See build-windows for the same gate.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
      # CI-09: required for actions/attest-build-provenance to generate signed attestations
      attestations: write
    steps:
      - uses: actions/checkout@v5

      # CI-03: cache electron-builder download cache.
      - name: Cache electron-builder cache (Linux)
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('voice_typer/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      # CI-03: cache PyInstaller bundle cache.
      - name: Cache PyInstaller cache (Linux)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('pyproject.toml') }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: |
          uv pip install --system ".[build]"
          uv pip install --system .
          pip list

      - name: Download Linux native binary
        uses: actions/download-artifact@v5
        with:
          name: native-linux
          path: voice_typer/server/native/

      - name: Verify native binary
        run: |
          bin="voice_typer/server/native/linux-key-listener"
          if [ ! -f "$bin" ]; then
            echo "ERROR: native binary not found: $bin"
            exit 1
          fi
          chmod +x "$bin"
          echo "Native binary present: $bin"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      # CI-05: no standalone npm ci here — setup-node restores the
      # node_modules cache that client-build populated, so electron-vite
      # (needed by build:main) is already present. We only re-run the
      # platform-specific main + preload build after downloading the
      # shared renderer, avoiding the redundant ~200MB install per platform.

      # CI-05: download the platform-independent renderer built by
      # client-build and only rebuild the platform-specific main + preload.
      - name: Download renderer artifact
        uses: actions/download-artifact@v5
        with:
          name: voice-typer-renderer-dist
          path: voice_typer/client/out/renderer/

      - name: Build main + preload only
        working-directory: voice_typer/client
        run: npm run build:main

      - name: Build with PyInstaller
        # RW-5: output to voice_typer/dist so the linux.extraResources
        # entry in electron-builder.yml (from: ../dist/voice-typer-backend)
        # resolves correctly relative to voice_typer/client/.
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath voice_typer/dist --workpath voice_typer/build

      - name: Stage PyInstaller backend for embedding (Linux)
        # RW-5: PyInstaller spec produces "VoiceTyper" as the output name.
        # electron-builder.yml's linux.extraResources expects the path
        # voice-typer-backend/voice-typer. Stage the rename here so the
        # embedded-backend lookup in pythonArgs() (src/main/index.ts)
        # finds the executable at the expected path.
        run: |
          set -euo pipefail
          mkdir -p voice_typer/dist/voice-typer-backend
          if [ -d "voice_typer/dist/VoiceTyper" ]; then
            # PyInstaller onedir output — move directory contents.
            mv voice_typer/dist/VoiceTyper/* voice_typer/dist/voice-typer-backend/
            rmdir voice_typer/dist/VoiceTyper
            # Rename the executable inside the directory if it's still
            # named "VoiceTyper" to match pythonArgs()'s expectation.
            if [ -f "voice_typer/dist/voice-typer-backend/VoiceTyper" ] && [ ! -f "voice_typer/dist/voice-typer-backend/voice-typer" ]; then
              mv voice_typer/dist/voice-typer-backend/VoiceTyper voice_typer/dist/voice-typer-backend/voice-typer
            fi
            echo "Moved onedir VoiceTyper/ -> voice-typer-backend/"
          elif [ -f "voice_typer/dist/VoiceTyper" ]; then
            # PyInstaller onefile output — move binary into directory.
            mv voice_typer/dist/VoiceTyper voice_typer/dist/voice-typer-backend/voice-typer
            echo "Moved onefile VoiceTyper -> voice-typer-backend/voice-typer"
          else
            echo "ERROR: PyInstaller Linux output not found at voice_typer/dist/"
            ls -la voice_typer/dist/
            exit 1
          fi
          chmod +x voice_typer/dist/voice-typer-backend/voice-typer
          echo "Staged Linux backend:"
          ls -la voice_typer/dist/voice-typer-backend/ | head -20

      - name: Install Linux build deps (fpm for electron-builder)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libarchive-tools

      - name: Build Linux packages with electron-builder
        working-directory: voice_typer/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # RW-5: --config electron-builder.yml explicit (the file is picked
        # up by default, but being explicit documents the dependency on
        # the linux.extraResources entry that embeds the PyInstaller backend).
        run: npx electron-builder --linux --config electron-builder.yml --publish never

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Linux
          path: |
            voice_typer/client/dist/*.deb
            voice_typer/client/dist/*.rpm
            voice_typer/client/dist/*.AppImage

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} "voice_typer/client/dist/*" --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI-09: SLSA build provenance attestation — generates a signed
      # attestation linking the installer artifacts to this workflow run.
      # Users verify with: gh attestation verify <file> --repo owner/repo
      - name: Attest build provenance (Linux)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            voice_typer/client/dist/*.deb
            voice_typer/client/dist/*.rpm
            voice_typer/client/dist/*.AppImage

  # S5-CR-72: centralized failure-notification job. Pre-fix every workflow
  # lacked a top-level notify step — a failed test job, a failed build-windows,
  # a failed build-linux etc. each posted to the GitHub Actions check status
  # but there was no consolidated "the build is broken" signal. Maintainers
  # had to scroll the Actions tab to discover failures.
  #
  # This job runs `if: always()` (so it executes even when upstream jobs
  # fail) and emits a `::error::` annotation summarizing which jobs failed
  # — visible at the top of the workflow run summary page. Skipped jobs
  # (e.g. slow-tests on a PR, pip-audit-weekly on a push) are filtered out
  # so they don't generate noise.
  #
  # To wire a real notification channel (Slack / Microsoft Teams / email),
  # add a step below using `rtCamp/action-slack-notify@v2` (Slack) or
  # `mmellado/teams-notify@v1` (Teams) gated on the same `FAILURE_COUNT > 0`
  # condition. The required webhook URL should be stored as a repo secret
  # (e.g. SLACK_WEBHOOK_URL). The current implementation intentionally
  # ships without a third-party action so the workflow stays usable in
  # air-gapped / sandboxed CI environments.
  # pre-commit hygiene job — runs ONLY the 7 hygiene hooks from
  # pre-commit/pre-commit-hooks repo (trailing-whitespace, end-of-file-fixer,
  # check-yaml, check-json, check-merge-conflict, check-added-large-files,
  # mixed-line-ending). Ruff/mypy/biome intentionally skipped (already in CI
  # via the `test` job's ruff step, or need extra deps not worth the install
  # cost for a hygiene-only gate).
  pre-commit:
    name: Pre-commit hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth 0 so check-added-large-files can see the full history
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hygiene hooks
        # `pre-commit run` accepts at most ONE hook ID as a positional
        # argument — passing 7 IDs (the previous invocation) fails with
        # `unrecognized arguments: end-of-file-fixer check-yaml ...`.
        # Loop over the hygiene hooks instead so a failure in any one
        # hook fails the step (the `|| exit 1` after each invocation).
        # We intentionally do NOT use `pre-commit run --all-files` (no
        # hook ID) because that would also run heavier hooks defined in
        # .pre-commit-config.yaml (ruff, pyrefly, etc.) — this job is a
        # fast hygiene-only gate; the heavy hooks have their own jobs.
        run: |
          set -euo pipefail
          for hook in \
            trailing-whitespace \
            end-of-file-fixer \
            check-yaml \
            check-json \
            check-merge-conflict \
            check-added-large-files \
            mixed-line-ending; do
            echo "::group::pre-commit run $hook --all-files"
            pre-commit run "$hook" --all-files
            echo "::endgroup::"
          done
  notify:
    name: Notify on failure
    # `always()` so the job runs even when one of `needs` failed. Skipped
    # upstream jobs (e.g. build-windows on a schedule run) won't block —
    # the step below filters them out.
    if: always()
    # List every job whose failure should fire a notification. jobs not
    # listed here (pip-audit-weekly, slow-tests) already have their own
    # issue-on-failure step; including them would double-notify.
    needs: [test, client-build, version-check, branding-check, build-native, build-macos-universal, build-windows, build-macos, build-linux, pre-commit]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize job results
        id: summarize
        run: |
          set -euo pipefail
          # Build a Markdown summary table of every needed job's result.
          # GitHub Actions exposes needs.<job>.result as one of:
          #   'success' | 'failure' | 'cancelled' | 'skipped'
          {
            echo "## Job results"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| client-build | ${{ needs.client-build.result }} |"
            echo "| version-check | ${{ needs.version-check.result }} |"
            echo "| branding-check | ${{ needs.branding-check.result }} |"
            echo "| build-native | ${{ needs.build-native.result }} |"
            echo "| build-macos-universal | ${{ needs.build-macos-universal.result }} |"
            echo "| build-windows | ${{ needs.build-windows.result }} |"
            echo "| build-macos | ${{ needs.build-macos.result }} |"
            echo "| build-linux | ${{ needs.build-linux.result }} |"
            echo "| pre-commit | ${{ needs.pre-commit.result }} |"
          } >> $GITHUB_STEP_SUMMARY

          # Count only failures (skipped/cancelled are not actionable here).
          FAILURE_COUNT=0
          for r in \
              "${{ needs.test.result }}" \
              "${{ needs.client-build.result }}" \
              "${{ needs.version-check.result }}" \
              "${{ needs.branding-check.result }}" \
              "${{ needs.build-native.result }}" \
              "${{ needs.build-macos-universal.result }}" \
              "${{ needs.build-windows.result }}" \
              "${{ needs.build-macos.result }}" \
              "${{ needs.build-linux.result }}" \
              "${{ needs.pre-commit.result }}"; do
            if [ "$r" = "failure" ]; then
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
            fi
          done
          echo "failure_count=$FAILURE_COUNT" >> $GITHUB_OUTPUT

      - name: Emit failure annotation
        if: steps.summarize.outputs.failure_count != '0'
        run: |
          echo "::error::${{ steps.summarize.outputs.failure_count }} upstream job(s) failed in this workflow run. See the Job results table in the run summary for per-job status. To wire Slack/Teams/email notifications, see the S5-CR-72 comment in .github/workflows/build.yml."
          # Exit non-zero so the notify job itself shows as a red X in the
          # GitHub Actions UI — the visual signal maintainers scan for.
          # The build is already failed by the upstream job; this exit code
          # just makes the notify job red too so it's not mistaken for "all
          # clear".
          exit 1

      - name: All green
        if: steps.summarize.outputs.failure_count == '0'
        run: |
          echo "::notice::All upstream jobs passed or were skipped — build is green."
