name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .
          pip list

      - name: Generate app icon
        run: python scripts/build/generate_icon.py scripts/build/voice-typer.ico

      - name: Build with PyInstaller
        run: |
          pyinstaller scripts/build/voice-typer.spec --noconfirm --distpath dist --workpath build
          echo "PyInstaller output:"
          Get-ChildItem -Path dist -Recurse | Select-Object FullName

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          iscc scripts/build/installer.iss /O"${{ github.workspace }}"
          echo "Installer output:"
          Get-ChildItem -Path "${{ github.workspace }}" -Filter "*.exe" | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-Setup
          path: ${{ github.workspace }}/VoiceTyper-Setup-*.exe

      - name: Get installer filename
        id: installer
        run: |
          $exe = Get-ChildItem -Path "${{ github.workspace }}" -Filter "VoiceTyper-Setup-*.exe" | Select-Object -First 1
          echo "file=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.installer.outputs.file }}
          tag: ${{ github.ref_name }}
          overwrite: true
