# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5       — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-python@v7   — Node 24 runtime (v5/v6 = Node 20, deprecated)
#   actions/cache@v5           — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-node@v7      — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v5 — Node 24 runtime (v4 = Node 20, deprecated)
#   astral-sh/setup-uv@v6     — Node 24 runtime (v3 = Node 20, deprecated)
#   dtolnay/rust-toolchain@v1  — Node 24 runtime (@stable = untagged, may resolve to Node 20)
# See build.yml header for full rationale + breaking-change analysis.
# =============================================================================

# =============================================================================
# GATE STATUS — ENABLED (Phase 0-L validation runnable via manual dispatch)
# -----------------------------------------------------------------------------
# The bundle `build` job (matrix x86_64 + aarch64, fail-fast: false) is
# ENABLED for Phase 0-L validation: it runs on `workflow_dispatch` (or the
# tauri-build.yml orchestrator's `workflow_call`) ONLY — never on push/PR,
# where only the lightweight smoke-cargo-check job runs (see the trigger
# comment above). The display-dependent smoke tests are documented in
# docs/migration/linux-validation-runbook.md and must pass on a real Linux
# display host (X11 + Wayland) before a release cut (Phase 0-L handoff).
#
# PHASE 0-L VALIDATION HANDOFF (required before CUTOVER, not before running):
#   1. A maintainer dispatches this workflow (or the tauri-build.yml
#      orchestrator with `platform: linux`) — `sign` must stay false
#      (Linux is unsigned by design, ADR-0020 §13.3; sign=true fails fast).
#   2. Follow docs/migration/linux-validation-runbook.md — the 9-point
#      Phase 0-L gate below — on a real Linux display host (X11 + Wayland,
#      both x86_64 and aarch64).
#   3. Only after all 9 checks pass on a real host, consider enabling CI
#      bundle runs on push/PR (ADR-0020 §15 + cutover-playbook.md Step 2).
#
# PHASE 0-L 9-POINT GATE STATUS
# (docs/migration/linux-validation-runbook.md §"9-Point Validation Gate
# Summary" — all 9 must pass on BOTH X11 AND Wayland, on BOTH arches):
#   [ ] 1. externalBin sidecar spawns via Tauri on X11 + Wayland
#            (sidecar.log shows [SIDECAR] server_started port=N)
#   [ ] 2. WS + bearer-token handshake works on X11 + Wayland
#            (log shows WS connected + auth ok)
#   [ ] 3. faster-whisper transcribes inside the Nuitka exe
#            (text in focused field within 5s of releasing the hotkey)
#   [ ] 4. enigo types on X11; clipboard + Ctrl+V fallback (wl-copy) on
#            Wayland
#   [ ] 5. tauri-plugin-notification posts via libnotify on X11 + Wayland
#   [ ] 6. Cooperative {"type":"shutdown"} exits; kill_children cleans
#            (no python-sidecar within 2s of window close)
#   [ ] 7. Prewarm exe registered as systemd user timer
#            (systemctl --user list-timers voice-typer-prewarm.timer)
#   [ ] 8. Native linux-key-listener toggles dictation on X11 (XRecord) +
#            Wayland (libinput/evdev) — F8 starts/stops recording
#   [ ] 9. Single-instance (lockfile) — second launch focuses first, no
#            zombie sidecar
# All 9 pending — host validation has not run yet; tick each off in the
# runbook as it passes on a real Linux display host. Electron remains the
# shipped fallback until the Phase 0-L gate is met (ADR-0020 Phase 5).
# =============================================================================

name: Tauri Linux build (Phase 0-L)

# ADR-0020 Phase 0-L: Linux Nuitka sidecar + prewarm + native listener + Tauri bundle.
# ENABLED for Phase 0-L validation — the bundle `build` job runs on
# `workflow_dispatch` or the tauri-build.yml orchestrator's `workflow_call`
# ONLY (never on push/PR — see the push/PR comment below). The build takes
# 30-60 min per arch and the display-dependent smoke tests are NOT run in CI
# (no display server); they are documented in
# (docs/migration/linux-validation-runbook.md) and must pass on a real Linux
# display host (X11 + Wayland) before a release cut (Phase 0-L handoff).
#
# Matrix: builds BOTH x86_64-unknown-linux-gnu AND aarch64-unknown-linux-gnu in
# parallel. The aarch64 job cross-compiles via qemu-user-static on the x86_64
# runner (binfmt_misc registers qemu-aarch64-static as the ELF handler for
# aarch64 binaries so Nuitka can execute the aarch64 python-build-standalone
# interpreter during compilation). ADR-0020 §4.4 mandates a separate Nuitka
# build per target triple (Nuitka does NOT cross-compile natively).
#
# To dispatch: trigger via workflow_dispatch (arch: x86_64 / aarch64 / both,
# sign must be false — Linux is unsigned by design, ADR-0020 §13.3).
on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (empty = both archs in matrix)"
        required: false
        default: ""
        type: string
      sign:
        description: "Code-sign + notarize the bundle (requires secrets — Linux is unsigned by default per ADR-0020 §13.3)"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      arch:
        description: "Target arch (x86_64, aarch64, or both; default: both)"
        required: false
        default: "both"
        type: choice
        options:
          - x86_64
          - aarch64
          - both
      # TX-23: surface the sign flag on direct dispatch (the tauri-build.yml
      # orchestrator already passes it through as a workflow_call input).
      # Linux bundles are unsigned by design (ADR-0020 §13.3), so sign=true
      # fails fast in the build job rather than silently skipping.
      sign:
        description: "Code-sign + notarize the bundle (Linux: always unsigned — sign=true fails fast)"
        required: false
        default: false
        type: boolean
  # enable push/PR triggers ONLY for the smoke-cargo-check
  # job below (gated by `if:` on that job). The full bundle `build` job is
  # gated to `workflow_dispatch` / the orchestrator's `workflow_call` and is
  # NEVER triggered by push/PR (a plain `if: true` would fire the 30-60 min
  # x2-arch bundle build on every push touching src-tauri/** — ADR-0020 §15).
  # This gives us continuous CI verification that the Tauri Rust host still
  # compiles on every push to main + every PR — catching Cargo dep bumps, Rust
  # toolchain regressions, and tauri.conf.json edits that would break the
  # bundle build BEFORE a maintainer dispatches it. Without this, the entire
  # Tauri migration target (ADR-0020) had ZERO CI coverage.
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "voice_typer/client/src/**"
      - ".github/workflows/tauri-linux-build.yml"
      - "scripts/build/**"
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "voice_typer/client/src/**"
      - ".github/workflows/tauri-linux-build.yml"
      - "scripts/build/**"

# concurrency: cancel in-flight PR builds, keep release builds running.
concurrency:
  group: tauri-linux-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read   # explicit least-privilege top-level default

jobs:
  # lightweight smoke job that runs `cargo check` on the
  # Tauri Rust host for x86_64-unknown-linux-gnu. Runs on EVERY push to main +
  # every PR (gated by the push/PR triggers above with path filters). The full
  # bundle `build` job (`build` below) runs on workflow_dispatch / workflow_call
  # only — this smoke job gives us early signal that the Rust host still
  # compiles, tauri.conf.json is still valid, and Cargo deps still resolve,
  # without paying the 30-60 min Nuitka+Tauri bundle cost. Runs in ~2-3 min on
  # a warm runner.
  smoke-cargo-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    # 15m was too tight once cargo test was added. The first run on a
    # cold cache (no prior successful run ever saved the actions/cache blob)
    # compiles the full Tauri dep tree for BOTH `cargo check --all-targets`
    # and the `cargo test` build — that alone can exceed 15 minutes. Bumped
    # to 60m so cold-cache runs (and slow ubuntu-22.04 runners) complete;
    # warm-cache runs still finish in ~2-3 min as the step comments state.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUST_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          targets: ${{ env.RUST_TARGET }}

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-linux-smoke-${{ env.RUST_TARGET }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-linux-smoke-${{ env.RUST_TARGET }}-
            tauri-linux-x86_64-

      # Install ONLY the system headers `cargo check` needs to resolve the
      # Tauri webkit2gtk / glib / gtk sys crates. We do NOT install
      # nuitka / python-build-standalone / pyinstaller — those are only
      # needed by the full bundle job. This keeps the smoke job fast (~2 min
      # for apt + ~1 min for cargo check on a warm cache).
      - name: Install system deps (apt — headers only)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libssl-dev

      # tauri_build::build() validates externalBin AND
      # resources paths exist at compile time. Neither the sidecar binary
      # (needs Nuitka + python-build-standalone) nor the per-OS native
      # key-listeners / prewarm binaries (need MSVC / clang / the host OS)
      # are built in the smoke job. We create dummy placeholder files for
      # EVERY path declared in tauri.conf.json's `bundle.externalBin` +
      # `bundle.resources` so cargo check can resolve the build script
      # validation regardless of which OS the smoke job runs on.
      #
      # NOTE: `cargo check` reads `tauri.conf.json` directly (NOT the
      # per-platform override like `tauri.linux-x86_64.conf.json` — that
      # merge only happens at `tauri build` time via the Tauri CLI). So
      # the placeholders below MUST cover Windows + macOS + Linux
      # resources, not just Linux ones. Without this, the build script
      # fails with: `resource path 'resources/native/windows-key-listener.exe'
      # doesn't exist`.
      - name: Create dummy sidecar + resource placeholders (for cargo check)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          TRIPLE="${{ env.RUST_TARGET }}"
          mkdir -p bin resources/native resources/linux-scripts
          # 1. Sidecar binary (externalBin entry).
          echo '#!/bin/sh' > "bin/python-sidecar-${TRIPLE}"
          chmod +x "bin/python-sidecar-${TRIPLE}"
          # Also stub the other 6 triples — tauri.conf.json's externalBin
          # entry is `bin/python-sidecar` and Tauri appends the host triple
          # at bundle time, but cargo check only validates the host triple.
          # Stub them anyway for safety (cost is zero).
          for t in \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu; do
            echo '#!/bin/sh' > "bin/python-sidecar-${t}"
            chmod +x "bin/python-sidecar-${t}"
          done
          # 2. Native key-listener binaries (one per OS).
          echo 'placeholder' > resources/native/windows-key-listener.exe
          echo 'placeholder' > resources/native/macos-key-listener
          echo 'placeholder' > resources/native/linux-key-listener
          # 3. Prewarm binaries (one per target triple).
          for p in \
            prewarm-x86_64-pc-windows-msvc.exe \
            prewarm-aarch64-pc-windows-msvc.exe \
            prewarm-x86_64-apple-darwin \
            prewarm-aarch64-apple-darwin \
            prewarm-x86_64-unknown-linux-gnu \
            prewarm-aarch64-unknown-linux-gnu; do
            echo 'placeholder' > "resources/${p}"
          done
          # 4. Linux install scripts (real files, checked in — but stub
          # here in case the checkout is shallow and they're missing).
          for f in \
            install_permissions.py \
            uninstall_permissions.py \
            99-voice-typer.rules \
            00-voice-typer-capslock.conf \
            voice-typer.polkit; do
            [ -f "resources/linux-scripts/${f}" ] || echo 'placeholder' > "resources/linux-scripts/${f}"
          done
          # 5. Tauri icon files (not tracked in git — tauri.conf.json
          # bundles icons at build time). cargo check invokes
          # tauri_build::build() which validates EVERY icon declared in
          # tauri.conf.json exists at compile time. Without these stubs,
          # the smoke job fails with "failed to open icon icons/32x32.png".
          mkdir -p icons
          for icon in 32x32.png 128x128.png 128x128@2x.png icon.png; do
            [ -f "icons/${icon}" ] || python3 -c "
          import struct, zlib
          def _png1x1(path):
              # Create a minimal 1x1 transparent PNG.
              sig = b'\x89PNG\r\n\x1a\n'
              # IHDR chunk: 1x1, 8-bit RGBA
              ihdr_data = struct.pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0)
              ihdr_crc = struct.pack('>I', zlib.crc32(b'IHDR' + ihdr_data) & 0xffffffff)
              ihdr_len = struct.pack('>I', len(ihdr_data))
              ihdr = ihdr_len + b'IHDR' + ihdr_data + ihdr_crc
              # IDAT chunk: raw uncompressed pixel (RGBA=black+transparent)
              raw = zlib.compress(b'\x00\x00\x00\x00')
              idat_crc = struct.pack('>I', zlib.crc32(b'IDAT' + raw) & 0xffffffff)
              idat_len = struct.pack('>I', len(raw))
              idat = idat_len + b'IDAT' + raw + idat_crc
              # IEND chunk
              iend_crc = struct.pack('>I', zlib.crc32(b'IEND') & 0xffffffff)
              iend = struct.pack('>I', 0) + b'IEND' + iend_crc
              with open(path, 'wb') as f:
                  f.write(sig + ihdr + idat + iend)
          _png1x1('icons/${icon}')"
          done
          echo "[smoke] Placeholder stubs created for sidecar + native listeners + prewarm + linux-scripts + icons"

      - name: cargo check (Tauri Rust host)
        working-directory: src-tauri
        run: |
          # Use the per-platform config so cargo parses the same
          # tauri.linux-x86_64.conf.json the bundle build will use — catches
          # drift in the config file before it surfaces at bundle time.
          cargo check --target ${{ env.RUST_TARGET }} --all-targets

      # rustfmt gate: the Rust host must stay uniformly formatted.
      # The rustfmt component is installed by the dtolnay step above
      # (and by the repo's src-tauri/rust-toolchain.toml); the locked
      # style lives in src-tauri/rustfmt.toml. Any drift fails here.
      - name: cargo fmt --check (Tauri Rust host formatting gate)
        working-directory: src-tauri
        run: |
          cargo fmt --check

      # TX-22: run the Rust unit tests — 331 tests across 16 source
      # files previously NEVER executed in CI (cargo check only compiled
      # them, so Rust-side bugs went undetected). `--lib` covers the
      # unit tests in src-tauri/src/*.rs without paying the cost of any
      # integration-test crates. The placeholder stubs above satisfy the
      # tauri-build resource/icon validation at compile time, so the
      # same stub set works for the test build.
      - name: cargo test (Tauri Rust host unit tests)
        working-directory: src-tauri
        run: |
          # voice-typer-tauri is a binary-only crate (no lib target), so
          # `--lib` fails with "no library targets found". `--bin` runs
          # the unit tests in src-tauri/src/*.rs without paying the cost
          # of any integration-test crates.
          cargo test --target ${{ env.RUST_TARGET }} --bin voice-typer-tauri

      - name: Validate tauri.conf.json (parse-only)
        working-directory: src-tauri
        run: |
          # cargo check above does NOT validate the tauri.conf.json schema;
          # tauri-build (the build script) validates it at bundle time.
          # Use Python's json module for a cheap parse-only check that
          # catches malformed JSON (a typo in a recent edit broke the
          # bundle build for 3 days before someone noticed). Schema
          # validation remains deferred to the bundle job.
          python3 -c "import json; json.load(open('tauri.conf.json')); json.load(open('tauri.linux-x86_64.conf.json')); print('tauri.conf.json + tauri.linux-x86_64.conf.json parse OK')"

  build:
    # ENABLED for Phase 0-L validation — runs on workflow_dispatch or the
    # tauri-build.yml orchestrator's workflow_call ONLY, NOT on push/PR.
    # Plain `if: true` would also fire this 30-60 min x2-arch bundle build on
    # every push/PR touching src-tauri/** (the workflow has live push/PR
    # triggers for the smoke-cargo-check job), contradicting ADR-0020 §15.
    # The gate mirrors tauri-macos-build.yml's enablement; the Phase 0-L
    # display-host validation (docs/migration/linux-validation-runbook.md,
    # X11 + Wayland) remains a manual precondition before a release cut.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # job-level permissions widen the top-level `contents: read`
    # default (:71-72) with the two scopes required for SLSA build
    # provenance attestation via actions/attest-build-provenance@v4 —
    # mirrors tauri-windows-build.yml:88-91 and tauri-macos-build.yml:254-257.
    # `id-token: write` lets the job mint an OIDC token for the attestation
    # signing identity; `attestations: write` lets it write the attestation
    # record to the repo. Both are no-ops on PR/fork builds (the `if:` gate
    # on the attestation step below restricts it to workflow_dispatch +
    # inputs.sign — TX-24).
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # Fail fast = false so an aarch64 build failure doesn't hide an x86_64
      # success (and vice versa). ADR-0020 §"Reversibility": each platform's
      # cutover is independent.
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    env:
      # Pin to 3.12 — ADR-0020 §4.4 mandates 3.12.x (CTranslate2 / faster-whisper wheel tags).
      PYTHON_VERSION: "3.12"
      # The arch being built. For aarch64, the script uses qemu-user-static.
      BUILD_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # honor the `sign` workflow_call input. Linux bundles are
      # unsigned by design (ADR-0020 §13.3 — no Linux signing secrets
      # exist), so sign=true is a misconfiguration and must fail fast
      # rather than silently producing an unsigned "release" build.
      - name: Fail fast — sign=true is not supported on Linux
        if: ${{ inputs.sign == 'true' }}
        run: |
          echo "::error::sign=true is not supported on Linux — Linux bundles are unsigned by design (ADR-0020 §13.3). Dispatch with sign=false."
          exit 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # enable uv's own dependency cache so a warm
          # runner re-uses the wheel cache across runs (saves ~2-3 min
          # on the Nuitka-free install step).
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ env.BUILD_ARCH == 'aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}

      # cache the cargo registry + src-tauri/target
      # tree so a warm runner skips re-fetching crates and re-compiling
      # unchanged dependencies. Keyed on arch + Cargo.lock hash so any
      # dep bump cleanly invalidates the cache.
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-linux-${{ env.BUILD_ARCH }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-linux-${{ env.BUILD_ARCH }}-

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install system deps (apt)
        # ADR-0020 §4.4 + §13.3 system deps:
        #   - libwebkit2gtk-4.1-dev: build-time headers for cargo tauri build
        #     (the runtime webkit2gtk-4.1-0 is pulled in transitively).
        #   - libnotify4: runtime toast notification (libnotify).
        #   - libxtst6: XTest extension for pynput/enigo X11 keystroke injection.
        #   - wl-clipboard: provides wl-copy/wl-paste for ADR-0020 §6.6 Wayland
        #     clipboard fallback (voice_typer/server/clipboard.py::_linux_copy).
        #   - xclip: X11 clipboard fallback (pyperclip backend).
        #   - libgtk-3-dev / libayatana-appindicator3-dev / librsvg2-dev: Tauri
        #     tray + appindicator + icon rendering.
        #   - patchelf: required by Nuitka --standalone on Linux.
        #   - qemu-user-static + binfmt-support: cross-arch aarch64 builds.
        #   - gcc-aarch64-linux-gnu: S2-CR-67 cross-compiler for the native
        #     linux-key-listener on aarch64 (so aarch64 users get native
        #     hotkeys instead of falling back to X11 global-shortcut only).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev webkit2gtk-4.1-0 \
            libnotify4 libxtst6 wl-clipboard xclip \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            qemu-user-static binfmt-support file patchelf \
            gcc-aarch64-linux-gnu

      - name: Enable qemu binfmt (aarch64 cross-build only)
        if: env.BUILD_ARCH == 'aarch64'
        run: |
          # Register qemu-aarch64-static as the binfmt_misc handler for aarch64 ELF.
          # This lets Nuitka execute the aarch64 python-build-standalone interpreter
          # during compilation on the x86_64 CI runner.
          sudo update-binfmts --enable qemu-aarch64 || true
          # Verify the handler is registered.
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 || true

      - name: Install Python deps (uv)
        run: |
          uv venv
          uv pip install -e ".[dev,test]"
          uv pip install nuitka zstandard

      - name: Download + extract python-build-standalone cpython-3.12.x+${{ env.BUILD_ARCH }}-unknown-linux-gnu
        run: |
          set -euo pipefail
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          PYBS_DIR="$PWD/.python-build-standalone"
          mkdir -p "$PYBS_DIR"
          # Fetch the latest cpython-3.12.x release for the target triple.
          # The astral-sh/python-build-standalone releases tag is "20240415" etc.
          # We use the GitHub API to find the latest release that has a matching asset.
          # BUILD-N05: the canonical upstream is now astral-sh/python-build-standalone
          # (the project was donated by indygreg to astral-sh in 2024; the indygreg
          # org still serves a redirect but new releases are published under astral-sh).
          API_URL="https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest"
          ASSET_PATTERN="cpython-3.12.*+${TRIPLE}-install_only.tar.gz"
          echo "Querying $API_URL for asset matching $ASSET_PATTERN"
          ASSET_URL=$(curl -fsSL "$API_URL" \
            | python -c "
          import json, sys, re
          data = json.load(sys.stdin)
          triple = '${TRIPLE}'
          pattern = re.compile(r'cpython-3\\.12\\.\\d+\\+' + re.escape(triple) + r'-install_only\\.tar\\.gz\\$')
          for asset in data.get('assets', []):
              if pattern.match(asset['name']):
                  print(asset['browser_download_url'])
                  break
          ")
          if [[ -z "$ASSET_URL" ]]; then
            echo "ERROR: no python-build-standalone asset found for $TRIPLE"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -fsSL "$ASSET_URL" -o /tmp/pybs.tar.gz
          tar -xzf /tmp/pybs.tar.gz -C "$PYBS_DIR"
          # The archive extracts to $PYBS_DIR/python/bin/python3 — normalize.
          ls -la "$PYBS_DIR"
          "$PYBS_DIR/python/bin/python3" --version

      - name: Install faster-whisper + ctranslate2 + websockets into pybs env
        # ADR-0020 §4.4: Nuitka needs faster_whisper + ctranslate2 + websockets
        # installed in the python-build-standalone env so --include-package picks
        # them up. numpy is pulled in transitively by faster-whisper.
        run: |
          set -euo pipefail
          PYBS_PY="$PWD/.python-build-standalone/python/bin/python3"
          "$PYBS_PY" -m pip install --quiet \
            faster-whisper ctranslate2 websockets numpy
          "$PYBS_PY" -c "import faster_whisper, ctranslate2, websockets; print('OK')"

      - name: Build native key-listener (Linux, x86_64)
        if: env.BUILD_ARCH == 'x86_64'
        run: bash scripts/build/build_native_listener_linux.sh

      - name: Cross-compile native key-listener (Linux, aarch64)
        # aarch64 linux-key-listener is now cross-compiled on the
        # x86_64 runner using gcc-aarch64-linux-gnu (installed above). This
        # gives aarch64 users native evdev-based hotkeys (modifier-only
        # hotkeys like bare Caps Lock) instead of falling back to the
        # X11-only Tauri global-shortcut plugin.
        if: env.BUILD_ARCH == 'aarch64'
        run: |
          set -euo pipefail
          SRC="voice_typer/server/native/linux-key-listener.c"
          OUT="src-tauri/resources/native/linux-key-listener"
          mkdir -p "$(dirname "$OUT")"
          aarch64-linux-gnu-gcc -O2 -std=c99 -o "$OUT" "$SRC"
          file "$OUT" | grep -q 'ELF 64-bit LSB.*ARM aarch64' || {
            echo "ERROR: cross-compiled binary is not aarch64 ELF"
            file "$OUT"
            exit 1
          }
          echo "OK: aarch64 linux-key-listener cross-compiled"

      - name: Build Nuitka sidecar (${{ env.BUILD_ARCH }})
        run: bash scripts/build/build_sidecar_linux.sh "$BUILD_ARCH"
        env:
          VOICE_TYPER_PYBS_DIR: ${{ github.workspace }}/.python-build-standalone

      - name: Build Nuitka prewarm (${{ env.BUILD_ARCH }})
        run: bash scripts/build/build_prewarm_linux.sh "$BUILD_ARCH"
        env:
          VOICE_TYPER_PYBS_DIR: ${{ github.workspace }}/.python-build-standalone

      - name: Verify sidecar + prewarm binaries
        run: |
          set -euo pipefail
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          BIN="src-tauri/bin/python-sidecar-${TRIPLE}"
          PREWARM="src-tauri/resources/prewarm-${TRIPLE}"
          LISTENER="src-tauri/resources/native/linux-key-listener"
          test -x "$BIN"      || { echo "MISSING: $BIN";      exit 1; }
          test -x "$PREWARM"  || { echo "MISSING: $PREWARM";  exit 1; }
          # S2-CR-67: native listener is now built for BOTH arches (x86_64
          # via build_native_listener_linux.sh, aarch64 via cross-compile
          # with aarch64-linux-gnu-gcc). Require it for both.
          test -x "$LISTENER" || { echo "MISSING: $LISTENER"; exit 1; }
          # Use objdump -p for cross binaries (ldd can't run aarch64 ELF on
          # x86_64 without qemu running in the right mode); ldd for native.
          if [[ "$BUILD_ARCH" == "aarch64" ]]; then
            LDD="objdump -p"
          else
            LDD="ldd"
          fi
          echo "=== $LDD $BIN ==="
          $LDD "$BIN" | head -20
          echo "=== $LDD $PREWARM ==="
          $LDD "$PREWARM" | head -20
          # Verify glibc baseline (≤ 2.35 for Ubuntu 22.04 compat).
          for f in "$BIN" "$PREWARM"; do
            MAX_GLIBC=$($LDD "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
            echo "$f → $MAX_GLIBC"
            if [[ -n "$MAX_GLIBC" ]]; then
              NUM="${MAX_GLIBC/GLIBC_/}"
              MAJ="${NUM%.*}"; MIN="${NUM#*.}"
              if [[ "$MAJ" -gt 2 || ( "$MAJ" -eq 2 && "$MIN" -gt 35 ) ]]; then
                echo "ERROR: $f requires $MAX_GLIBC but baseline is GLIBC_2.35"
                exit 1
              fi
            fi
          done

      # smoke test the bundled sidecar binary AFTER the static
      # `ldd` / `objdump` checks above. Pre-fix the Tauri Linux workflow
      # never executed the sidecar — a Nuitka flag change that broke the
      # `--version` exit path (argparse exits 0 without acquiring the
      # single-instance lock per ipc_server.py:2796-2815) would only
      # surface during a release cut. The aarch64 binary is executable on
      # the x86_64 runner because qemu-user-static is registered as the
      # binfmt_misc handler (see the "Enable qemu binfmt" step above),
      # so this smoke test covers BOTH arches. Runs in <2s.
      - name: Smoke test sidecar binary (--version)
        run: |
          set -euo pipefail
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          BIN="src-tauri/bin/python-sidecar-${TRIPLE}"
          if [[ ! -x "$BIN" ]]; then
            echo "ERROR: sidecar binary not found at $BIN — cannot smoke test."
            exit 1
          fi
          echo "Invoking: $BIN --version"
          output=$("$BIN" --version 2>&1) || rc=$?
          rc=${rc:-0}
          echo "Output: $output"
          echo "Exit code: $rc"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Sidecar --version exited with code $rc (expected 0). The frozen binary is broken."
            exit 1
          fi
          if ! echo "$output" | grep -Eq 'voice-typer|VoiceTyper|voice_typer'; then
            echo "::error::Sidecar --version output did not contain the project name. Output: $output"
            exit 1
          fi
          echo "Smoke test PASSED: sidecar --version exited 0 with project name in output."

      - name: Install renderer deps + build
        run: |
          cd voice_typer/client
          npm ci
          npm run build:renderer

      # Fail-fast gate: run the config drift guards BEFORE the build —
      # identifier↔appId + productName + version parity, bundle.icon↔git
      # lockstep, and ALL the config↔script pairs (bundle.resources/
      # externalBin ↔ stub generator registry, tauri-binaries.json ↔
      # canonical triples + Cargo binary name + launcher install paths,
      # per-arch config overrides ↔ base config). Same guards the full
      # suite enforces, but a drift regression dies in seconds instead of
      # only after the whole test run. MUST stay BEFORE "Generate Tauri
      # binary stubs" below: the icons module's autouse fixture runs
      # --clean after each test, which removes freshly-generated STUB
      # files (real binaries are preserved by the _is_stub_file heuristic).
      - name: Verify config drift guards (icons, identity, binaries) (fail fast)
        run: |
          python3 -m pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      # generate placeholder BINARY stubs (sidecar / native / prewarm) if
      # they don't already exist. The icons are committed real files, so
      # this step only covers the binaries. The `--check` flag exits 0 iff
      # all stubs are present AND structurally valid (exact canonical stub
      # bytes, or a real binary) and 1 otherwise — a truncated/corrupt
      # stub fails the gate in milliseconds instead of inside cargo tauri
      # build. The `||` falls through to the generation command only when
      # needed, and generate() also REPAIRS corrupt stubs. CLI flags
      # verified by reading scripts/gen_tauri_icons_stub.py (argparse:
      # --check / --clean / no-flag = generate).
      - name: Generate Tauri binary stubs
        run: |
          python3 scripts/gen_tauri_icons_stub.py --check || python3 scripts/gen_tauri_icons_stub.py

      # Fail-fast gate: verify the COMMITTED bundle.icon PNGs (32x32.png,
      # 128x128.png, 128x128@2x.png, icon.png — read from tauri.conf.json)
      # exist AND are structurally valid before the cargo tauri build.
      # Fail-fast gate: verify EVERY committed file in tauri.conf.json
      # bundle.icon exists AND is structurally valid (the 4 PNGs +
      # icon.ico + icon.icns) before the cargo tauri build. The single
      # cross-platform gate (--check-icons) reads the icon list from
      # tauri.conf.json and dispatches each entry to the right validator
      # by extension; tauri-build hard-fails the whole build when the
      # platform's icon is missing or corrupt, and a corrupt file would
      # otherwise only surface minutes into the compile. This gate fails
      # in <1s instead. CLI flags verified by reading
      # scripts/gen_tauri_icons_stub.py (argparse: --check /
      # --check-icons / --clean / no-flag).
      - name: Verify bundle.icon icons are present + valid (fail fast)
        run: python3 scripts/gen_tauri_icons_stub.py --check-icons

      # install tauri-cli explicitly. The runner's pre-installed
      # `cargo-tauri` is unversioned and lags upstream by months; on
      # ubuntu-22.04 it has historically been missing entirely (the
      # `cargo tauri build` step below would fail with `no such command`).
      # macOS already has this step at tauri-macos-build.yml:356; Windows
      # gets the same step in this same WR-17 batch. Pin to ^2.0 so we
      # stay on the Tauri v2 line.
      - name: Install tauri-cli (v2)
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri app (${{ env.BUILD_ARCH }})
        # ADR-0020 Phase 0-L gate: cargo tauri build needs webkit2gtk-4.1-dev +
        # libgtk-3-dev, which we installed above. The build runs headless because
        # the Tauri host doesn't open a window during `cargo tauri build`.
        # Smoke tests that need a display are documented in the runbook
        # (docs/migration/linux-validation-runbook.md) and run manually.
        #
        # fix: the base `tauri.conf.json` `bundle.resources` lists every
        # platform's native binaries PLUS both prewarm arches (a documented
        # superset — required so the Windows/macOS source-inspection tests under
        # tests/tauri/mig15 + mig16 keep passing). On a Linux runner those
        # cross-OS / other-arch files do NOT exist, so `cargo tauri build` would
        # fail at the tauri-build resource-copy step (it canonicalizes each
        # declared resource and hard-fails on any missing file — tauri-build
        # lib.rs copy_resources). We override `resources` PER-ARCH with a
        # `--config` file whose `bundle.resources` array REPLACES the base's
        # (Tauri deep-merges objects but overwrites conflicting values,
        # including arrays — verified against tauri-cli 2.11.4). Both x86_64
        # and aarch64 ship linux-key-listener (x86_64 built natively via
        # compile_native.sh; aarch64 cross-compiled via aarch64-linux-gnu-gcc
        # in the compile step above). Both arches include linux-key-listener
        # in tauri.linux-<arch>.conf.json bundle.resources.
        run: |
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          cd src-tauri
          cargo tauri build --target "$TRIPLE" --config "tauri.linux-${BUILD_ARCH}.conf.json"

      - name: List bundle artifacts
        run: |
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          find "src-tauri/target/$TRIPLE/release/bundle" -type f 2>/dev/null | sort
          find "src-tauri/target/release/bundle" -type f 2>/dev/null | sort

      # the orchestrator (tauri-build.yml::aggregate) downloads the
      # artifact named `tauri-linux-installer`. The .deb is the primary
      # installer for Debian/Ubuntu (the largest Linux install base); we
      # also upload .AppImage and .rpm as separate artifacts for users on
      # other distros (CI-3 — previously .rpm was not uploaded at all).
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: tauri-linux-installer
          path: |
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-${{ env.BUILD_ARCH }}.AppImage
          path: |
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      # previously only .deb + .AppImage were uploaded; .rpm was
      # silently dropped. Fedora/RHEL/openSUSE users couldn't download a
      # native package. Upload it as its own artifact so the Fedora
      # subgraph of Linux users can grab the .rpm without rebuilding.
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-${{ env.BUILD_ARCH }}.rpm
          path: |
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload build logs (Nuitka + cargo)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-${{ env.BUILD_ARCH }}-build-logs
          path: |
            src-tauri/bin/.build-sidecar-*.log
            src-tauri/resources/.build-prewarm-*.log
            src-tauri/target/*/release/.frozen/Cargo.lock
          if-no-files-found: warn

      # generate SHA-256 checksums for the .deb + .AppImage + .rpm
      # installers, mirroring tauri-windows-build.yml:368-393. Linux uses
      # GNU `sha256sum`. The matrix fans out per arch (x86_64, aarch64)
      # so each arch leg produces its own SHA256SUMS.txt — the artifact
      # name is parameterized on BUILD_ARCH to avoid clobbering. Output
      # format is `<hash>  <basename>` so users can verify with
      # `sha256sum -c SHA256SUMS.txt` on any Linux distro.
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          : > SHA256SUMS.txt
          for f in \
              src-tauri/target/*/release/bundle/deb/*.deb \
              src-tauri/target/release/bundle/deb/*.deb \
              src-tauri/target/*/release/bundle/appimage/*.AppImage \
              src-tauri/target/release/bundle/appimage/*.AppImage \
              src-tauri/target/*/release/bundle/rpm/*.rpm \
              src-tauri/target/release/bundle/rpm/*.rpm; do
            [ -f "$f" ] || continue
            hash=$(sha256sum "$f" | awk '{print $1}')
            name=$(basename "$f")
            echo "$hash  $name" >> SHA256SUMS.txt
          done
          echo "Generated SHA256SUMS.txt for $BUILD_ARCH:"
          cat SHA256SUMS.txt
          # Fail loudly if no installers were found (mirrors the Windows
          # workflow's if-no-files-found: error policy on its checksums
          # upload — a silent empty checksums file would give a false
          # sense of verification coverage).
          if [ ! -s SHA256SUMS.txt ]; then
            echo "::error::No .deb/.AppImage/.rpm installers found for $BUILD_ARCH — SHA256SUMS.txt is empty."
            exit 1
          fi

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Tauri-Linux-SHA256SUMS-${{ env.BUILD_ARCH }}
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Record the REAL SHA-256 of this arch leg's built host binary into
      # tauri-binaries.json — the integrity manifest the autostart
      # launcher verifies against at login (fail-closed). Each matrix leg
      # hashes ONLY its own key (x86_64 leg → linux-x86_64, aarch64 leg →
      # linux-aarch64), leaving the other leg's key untouched; the
      # tauri-build.yml aggregate job merges the two manifests. Script is
      # stdlib-only, so it runs with the plain `python3` the gate uses.
      - name: Record Tauri binary SHA-256 (${{ env.BUILD_ARCH }})
        run: |
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          python3 scripts/build/update_tauri_manifests.py \
            --triple "$TRIPLE" --target-dir src-tauri/target

      # Fail-fast release gate: this leg's hash must now be present and
      # valid in the manifest. An empty/malformed value aborts the run.
      - name: Enforce Tauri manifest integrity (${{ env.BUILD_ARCH }})
        run: |
          TRIPLE="${BUILD_ARCH}-unknown-linux-gnu"
          python3 scripts/build/update_tauri_manifests.py --check --triple "$TRIPLE"

      - name: Upload updated tauri-binaries.json
        uses: actions/upload-artifact@v5
        with:
          name: tauri-binaries-manifest-linux-${{ env.BUILD_ARCH }}
          path: tauri-binaries.json
          if-no-files-found: error
          retention-days: 30

      # gate SLSA attestation on a manual signed release build
      # (workflow_dispatch + sign=true) instead of tag pushes — the tag
      # push trigger is commented out, so the old
      # ``startsWith(github.ref, 'refs/tags/v')`` gate never fired.
      # PR/fork builds (which lack the job-level id-token:write
      # permission grant in fork contexts) are excluded.
      - name: Attest build provenance (SLSA)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm
