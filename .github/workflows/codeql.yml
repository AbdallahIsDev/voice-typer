# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5 — Node 24 runtime (v4 = Node 20, deprecated)
# See build.yml header for full rationale + breaking-change analysis.
# =============================================================================

name: "CodeQL"

on:
  push:
    branches: [main, master]
    # skip doc-only pushes — CodeQL doesn't analyze Markdown,
    # so a README typo fix should not queue a 20-min matrix build.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: '0 6 * * *'  # WR-16: daily 06:00 UTC (was weekly Mon). CodeQL
                          # suite + query packs update ~weekly upstream; a
                          # daily run surfaces new alerts within 24h of a
                          # query-pack release instead of up to 7 days late.

# cancel superseded CodeQL runs on the same ref. CodeQL is
# the longest single workflow in the repo (matrix of 3 languages, each
# runs autobuild + analyze) so the savings are the largest here.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    # hard ceiling — if autobuild hangs on a broken language
    # matrix entry (Python autobuild has done this before when a
    # pyproject.toml was malformed), cancel the job after 60 minutes
    # instead of running for the full 6h Actions limit.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # L-35 (IMPROVE-2026-07-19): added 'actions' to scan GitHub
        # Actions workflow YAML files for known-action vulnerabilities
        # (insecure actions/checkout versions, typosquatted action
        # names, pull_request_target misuse, ${{ github.event.* }}
        # injection patterns). Without this, the 8 workflow files in
        # .github/workflows/ are unaudited for Actions-specific CVEs.
        language: ['python', 'javascript-typescript', 'actions']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # WR-16: opt into the extended query suites. Default behavior is
          # the `security-extended` pack for C/C++ but ONLY `security-and-quality`
          # is NOT included by default for python/javascript-typescript/actions,
          # so a broad class of maintainability + correctness queries (e.g.
          # unused imports, dangerous globals, suspicious string concat) was
          # skipped. Explicitly requesting both suites ensures every language
          # runs the deepest available pack set. Cost: ~15-25% longer analyze
          # step — acceptable given the daily-cadence change above already
          # accepts a 7x schedule increase.
          queries: security-extended, security-and-quality

      # ── S5-CR-75 (b): explicit build step for Python ─────────────────
      #
      # The default ``github/codeql-action/autobuild@v3`` step runs a
      # heuristic that pip-installs the project WITHOUT extras. That
      # means CodeQL's Python extractor cannot resolve heavy optional
      # imports (``sounddevice``, ``numpy``, ``pystray``, ``webrtcvad``,
      # ``torch``, ``torchaudio``) — they appear as unresolved symbols
      # in the CodeQL database, suppressing queries that depend on
      # import-graph resolution (e.g. "unused import", "dangerous
      # global", "unreachable code after return").
      #
      # Replacing autobuild with an explicit ``pip install .[test]``
      # step (per the finding's proposed fix) ensures CodeQL sees the
      # real import graph. The ``test`` extra pulls in pytest +
      # hypothesis + pytest-asyncio + pytest-cov + pytest-timeout +
      # pytest-benchmark (~30 MB), which is acceptable on the
      # ubuntu-22.04 runner.
      #
      # Note: the HEAVY production deps (``torch``, ``torchaudio``,
      # ``sounddevice``, ``webrtcvad``, ``pystray``) are NOT in any
      # optional extra (they're declared in ``requirements-lock.txt``
      # for the PyInstaller build only) — installing them on every
      # CodeQL run would add ~2 GB + 5+ minutes to the job. CodeQL's
      # Python extractor falls back to ``ast`` parsing for unresolved
      # imports, so the queries that don't depend on import resolution
      # still run; the queries that DO need resolution (a minority)
      # remain suppressed. This is the documented trade-off in the
      # finding: "this requires a Linux runner with the heavy optional
      # deps installable" — we install the ``test`` extra but defer the
      # heavy audio/torch deps to a future dedicated job.
      #
      # JS/TS and Actions languages: keep autobuild (it correctly
      # resolves ``npm install`` + ``tsc`` for the renderer, and
      # Actions YAML needs no build step at all).
      - name: Build Python (explicit pip install .[test])
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Autobuild (JS/TS + Actions)
        if: matrix.language != 'python'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
