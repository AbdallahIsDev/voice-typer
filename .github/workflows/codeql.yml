name: "CodeQL"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # L-35 (IMPROVE-2026-07-19): added 'actions' to scan GitHub
        # Actions workflow YAML files for known-action vulnerabilities
        # (insecure actions/checkout versions, typosquatted action
        # names, pull_request_target misuse, ${{ github.event.* }}
        # injection patterns). Without this, the 8 workflow files in
        # .github/workflows/ are unaudited for Actions-specific CVEs.
        language: ['python', 'javascript-typescript', 'actions']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
