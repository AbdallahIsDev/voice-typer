name: "CodeQL"

on:
  push:
    branches: [main, master]
    # XS-FIX-4: skip doc-only pushes — CodeQL doesn't analyze Markdown,
    # so a README typo fix should not queue a 20-min matrix build.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

# XS-FIX-4: cancel superseded CodeQL runs on the same ref. CodeQL is
# the longest single workflow in the repo (matrix of 3 languages, each
# runs autobuild + analyze) so the savings are the largest here.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    # XS-FIX-4: hard ceiling — if autobuild hangs on a broken language
    # matrix entry (Python autobuild has done this before when a
    # pyproject.toml was malformed), cancel the job after 60 minutes
    # instead of running for the full 6h Actions limit.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # L-35 (IMPROVE-2026-07-19): added 'actions' to scan GitHub
        # Actions workflow YAML files for known-action vulnerabilities
        # (insecure actions/checkout versions, typosquatted action
        # names, pull_request_target misuse, ${{ github.event.* }}
        # injection patterns). Without this, the 8 workflow files in
        # .github/workflows/ are unaudited for Actions-specific CVEs.
        language: ['python', 'javascript-typescript', 'actions']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
