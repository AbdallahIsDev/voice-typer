# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24,
#   actions/checkout@v5 — Node 24 runtime (v4 = Node 20, deprecated)
#   analysis engine (v4 = Node 24). Keep at the latest v4 release; the
#   components must stay in lockstep (same @v4 tag).

name: "CodeQL"

on:
  push:
    branches: [main, master]
    # skip doc-only pushes — CodeQL doesn't analyze Markdown,
    # so a README typo fix should not queue a 20-min matrix build.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: '0 6 * * *'  # WR-16: daily 06:00 UTC (was weekly Mon). CodeQL
                          # suite + query packs update ~weekly upstream; a

# cancel superseded CodeQL runs on the same ref. CodeQL is
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    # hard ceiling — if autobuild hangs on a broken language
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # L-35 (IMPROVE-2026-07-19): added 'actions' to scan GitHub
        language: ['python', 'javascript-typescript', 'actions']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # WR-16: opt into the extended query suites. Default behavior is
          queries: security-extended, security-and-quality

      # ── S5-CR-75 (b): explicit build step for Python ─────────────────
      - name: Build Python (explicit pip install .[test])
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Autobuild (JS/TS + Actions)
        if: matrix.language != 'python'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
