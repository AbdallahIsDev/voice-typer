# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5       — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v6 — Node 24 runtime (v5 = Node 20, deprecated)
#   astral-sh/setup-uv@v7     — Node 24 runtime (v6 = Node 20, deprecated)

name: Populate model hashes

#     HuggingFace commit SHAs and must be updated manually by a human

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: populate-model-hashes
  cancel-in-progress: false

jobs:
  populate:
    # WR-16: pin to ubuntu-22.04 for parity with build.yml + tauri-*-build.yml
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # We need full history to compute a clean patch against HEAD.
          fetch-depth: 0

      # BUILD-N04: replace setup-python + `pip install` with
      - name: Install uv (with wheel cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      # explicit setup-python@v7 for parity with build.yml /
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot pre-run manifest
        id: pre
        run: |
          cp voice_typer/server/model_hashes.json /tmp/model_hashes.before.json
          cp voice_typer/server/security.py /tmp/security.before.py
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run populate_model_hashes.py
        run: |
          # The script reads the manifest, fetches file lists from the
          python scripts/populate_model_hashes.py

      # WR-16: syntax-check the freshly-rewritten security.py BEFORE
      - name: Verify security.py syntax
        run: |
          python -c "import ast; ast.parse(open('voice_typer/server/security.py').read())"
          echo "security.py parses cleanly."

      - name: Verify tests still pass
        run: |
          uv pip install --system ".[test]"
          python -m pytest tests/test_model_integrity.py \
            tests/test_bugfix_regressions.py::TestModelIntegrityWarnsOnEmptyHashes \
            --no-cov -q --timeout=30

      - name: Generate patch artifact
        if: always()
        run: |
          # WR-16: drop the previous `|| true` on the git-diff line — let
          git diff --no-color > /tmp/model-hashes.patch
          if [ -s /tmp/model-hashes.patch ]; then
            echo "Changes detected — patch is non-empty."
            cp /tmp/model-hashes.patch "${{ github.workspace }}/model-hashes.patch"
          fi
          # WR-16: removed the previous `else` branch that wrote a literal
          # could NEVER fire (the file always existed) — masking the exact
          # changes, model-hashes.patch is never created and the Upload

      - name: Upload patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-hashes-patch
          path: ${{ github.workspace }}/model-hashes.patch
          if-no-files-found: error
          # default 90-day retention is overkill for a patch
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Populate model hashes — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline commit: \`${{ steps.pre.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If the run succeeded and the patch is non-empty, a maintainer must:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download the **model-hashes-patch** artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Review the diff for unexpected file additions/removals." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Apply with \`git am model-hashes.patch\` (or \`git apply\`) and push." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If the run failed, the manifest and \`security.py\` are unchanged." >> "$GITHUB_STEP_SUMMARY"
