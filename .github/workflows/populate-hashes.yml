# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5       — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-python@v7   — Node 24 runtime (v5/v6 = Node 20, deprecated)
#   actions/upload-artifact@v5 — Node 24 runtime (v4 = Node 20, deprecated)
#   astral-sh/setup-uv@v6     — Node 24 runtime (v3 = Node 20, deprecated)
# See build.yml header for full rationale + breaking-change analysis.
# =============================================================================

name: Populate model hashes

# SEC-audit-005 / Task 7: On-demand workflow that re-fetches
# file-level SHA-256 hashes for every HuggingFace repo pinned in
# voice_typer/server/model_hashes.json and rewrites both the JSON
# manifest and the hardcoded fallback dict in voice_typer/server/security.py
# so they stay in lock-step.
#
# When to run:
#   - Manually via the "Run workflow" button (workflow_dispatch).
#   - On every tag push (so release builds always carry fresh hashes).
#
# What it does NOT do:
#   - It does NOT bump the pinned ``revision`` SHAs.  Those are immutable
#     HuggingFace commit SHAs and must be updated manually by a human
#     after security review of the new commit.  The script only refreshes
#     the per-file SHA-256 digests under the existing pinned revision.
#   - It does NOT auto-commit on failure.  If HuggingFace is unreachable
#     the workflow fails and the existing manifest is left untouched.
#
# Artifact:
#   - A git patch (model-hashes.patch) showing the exact changes that
#     would be applied.  Download it from the run summary, review, and
#     apply with `git am` or `git apply`.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: populate-model-hashes
  cancel-in-progress: false

jobs:
  populate:
    # WR-16: pin to ubuntu-22.04 for parity with build.yml + tauri-*-build.yml
    # (repo-wide pinning policy — ubuntu-latest flipped to 24.04 mid-2025 and
    # broke apt-resolvable system deps in adjacent workflows).
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # We need full history to compute a clean patch against HEAD.
          fetch-depth: 0

      # BUILD-N04: replace setup-python + `pip install` with
      # astral-sh/setup-uv@v6 + `uv pip install --system`. The previous
      # setup-python step rebuilt the wheel cache on every run (no
      # caching) and the bare `pip install` re-resolved every transitive
      # dep from scratch (10-20s per run wasted). setup-uv installs uv
      # in <1s and its `enable-cache: true` directive gives us a
      # persistent wheel cache keyed on pyproject.toml so subsequent
      # runs re-use the cache (~5s install step vs ~25s previously).
      - name: Install uv (with wheel cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      # XS-FIX-4: explicit setup-python@v5 for parity with build.yml /
      # tauri-*-build.yml. The `uv pip install --system` step below
      # writes into the system Python, so we need a known Python version
      # pinned (3.12 = the project's target). Without this, the runner's
      # default Python (varies by image age) is used and the wheel cache
      # keyed on pyproject.toml can silently miss when the Python minor
      # version drifts.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot pre-run manifest
        id: pre
        run: |
          cp voice_typer/server/model_hashes.json /tmp/model_hashes.before.json
          cp voice_typer/server/security.py /tmp/security.before.py
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run populate_model_hashes.py
        run: |
          # The script reads the manifest, fetches file lists from the
          # HuggingFace API at each pinned revision, computes SHA-256
          # digests (using the LFS pointer's ``oid`` for LFS-managed
          # files to avoid multi-GB downloads), updates the JSON, and
          # rewrites the security.py fallback to match.
          python scripts/populate_model_hashes.py

      # WR-16: syntax-check the freshly-rewritten security.py BEFORE
      # running the test suite. populate_model_hashes.py rewrites the
      # hardcoded fallback dict via string interpolation; a malformed
      # rewrite (e.g. an unescaped quote in a hash, a truncated file)
      # would leave security.py unparseable and the test step below
      # would surface the failure as an opaque ImportError from a
      # downstream module. Catch it here with a clean ast.parse error
      # pointing at the actual syntax problem.
      - name: Verify security.py syntax
        run: |
          python -c "import ast; ast.parse(open('voice_typer/server/security.py').read())"
          echo "security.py parses cleanly."

      - name: Verify tests still pass
        run: |
          uv pip install --system ".[test]"
          python -m pytest tests/test_model_integrity.py \
            tests/test_bugfix_regressions.py::TestModelIntegrityWarnsOnEmptyHashes \
            --no-cov -q --timeout=30

      - name: Generate patch artifact
        if: always()
        run: |
          # WR-16: drop the previous `|| true` on the git-diff line — let
          # a real git error (e.g. corrupt index, broken HEAD) fail loudly
          # instead of being swallowed into an empty patch. The `[ -s ... ]`
          # test below handles the genuine empty-patch case (no changes).
          git diff --no-color > /tmp/model-hashes.patch
          if [ -s /tmp/model-hashes.patch ]; then
            echo "Changes detected — patch is non-empty."
            cp /tmp/model-hashes.patch "${{ github.workspace }}/model-hashes.patch"
          fi
          # WR-16: removed the previous `else` branch that wrote a literal
          # "(empty patch)" placeholder file. With the placeholder, the
          # `if-no-files-found: error` directive on the Upload step below
          # could NEVER fire (the file always existed) — masking the exact
          # failure mode it was supposed to catch. Now, when there are no
          # changes, model-hashes.patch is never created and the Upload
          # step's `if-no-files-found: error` correctly errors out, which
          # is the intended signal that this run produced no manifest diff.

      - name: Upload patch
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: model-hashes-patch
          path: ${{ github.workspace }}/model-hashes.patch
          if-no-files-found: error
          # XS-FIX-4: default 90-day retention is overkill for a patch
          # artifact that's meant to be downloaded + applied within a
          # day of the workflow run. 30 days covers the longest realistic
          # maintainer-review lag and reduces Actions storage billing.
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Populate model hashes — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline commit: \`${{ steps.pre.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If the run succeeded and the patch is non-empty, a maintainer must:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download the **model-hashes-patch** artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Review the diff for unexpected file additions/removals." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Apply with \`git am model-hashes.patch\` (or \`git apply\`) and push." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If the run failed, the manifest and \`security.py\` are unchanged." >> "$GITHUB_STEP_SUMMARY"
