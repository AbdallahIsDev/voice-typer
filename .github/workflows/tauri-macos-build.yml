# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5             — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-python@v7         — Node 24 runtime (v5/v6 = Node 20, deprecated)
#   actions/cache@v5                 — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-node@v7            — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v5       — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/download-artifact@v5    — Node 24 runtime (v4 = Node 20, deprecated)
#   astral-sh/setup-uv@v6            — Node 24 runtime (v3 = Node 20, deprecated)
#   dtolnay/rust-toolchain@v1         — Node 24 runtime (@stable = untagged, may resolve to Node 20)
# See build.yml header for full rationale + breaking-change analysis.
# =============================================================================

name: Tauri macOS Build (Phase 0-M)

# =============================================================================
# GATE STATUS — ENABLED (Phase 0-M validation runnable via manual dispatch)
# -----------------------------------------------------------------------------
# The three jobs (build-aarch64, build-x86_64, build-tauri-universal) are now
# ENABLED (`if: true`) so the macOS signing + notarization path can actually
# execute. The workflow is triggered MANUALLY via `workflow_dispatch` (or via
# the tauri-build.yml orchestrator's `workflow_call`); push/PR triggers remain
# commented out per ADR-0020 §15 (release builds are manual-trigger-only, no
# auto-update).
#
# PHASE 0-M VALIDATION HANDOFF (required before CUTOVER, not before running):
#   1. A maintainer dispatches this workflow from the Actions UI with
#      `inputs.sign: true` to exercise the full codesign + notarize path
#      with the repo secrets available (MAC_SIGNING_IDENTITY / APPLE_ID /
#      APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID).
#   2. Follow docs/migration/macos-validation-runbook.md to confirm the
#      universal .app launches on both Apple Silicon and Intel Macs and the
#      notarization ticket stamps cleanly (`spctl --assess`, `xcrun stapler
#      validate`).
#   3. Only after the runbook passes on a real macOS host, uncomment the
#      push/PR triggers below to enable CI-driven runs (ADR-0020 §15 +
#      cutover-playbook.md Step 2.1).
# =============================================================================
#
# ADR-0020 Phase 0-M: macOS x86_64 + aarch64-apple-darwin Tauri build.
# Builds BOTH arches of the Nuitka sidecar + prewarm + native key-listener,
# then calls `cargo tauri build --target universal-apple-darwin` to produce
# a universal .app + .dmg.

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (empty = host triple)"
        required: false
        default: ""
        type: string
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    # TX-23: surface the sign flag on direct dispatch (the tauri-build.yml
    # orchestrator already passes it through as a workflow_call input) so
    # a maintainer dispatching this workflow directly from the Actions UI
    # can opt into signing + notarization.
    inputs:
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
  # ADR-0020 §15 + Phase 0-M gate: push/PR triggers stay disabled until the
  # macOS host validation runbook has passed on a real macOS host. The
  # workflow is invoked manually via workflow_dispatch (or via the
  # tauri-build.yml orchestrator's workflow_call). The jobs are enabled
  # (`if: true`) so the manual Phase 0-M validation run can execute.
  # push:
  #   tags:
  #     - "v*-macos"
  #   branches:
  #     - main
  # pull_request:
  #   branches: [main]

concurrency:
  group: tauri-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read   # XS-28: explicit least-privilege top-level default

jobs:
  # ─── Job 1: Apple Silicon (aarch64-apple-darwin) ────────────────────────────
  # Runs natively on a macos-14 runner (Apple Silicon).
  build-aarch64:
    if: true  # ENABLED for Phase 0-M validation (see GATE STATUS block). Run via workflow_dispatch with sign=true to exercise codesign + notarization.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust + targets
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-macos-aarch64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-macos-aarch64-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # XS-26: enable uv's own dependency cache so a warm runner re-uses
          # the wheel cache across runs (mirrors tauri-linux-build.yml).
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          # XS-26: cache npm so a warm runner skips re-installing renderer deps.
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install Xcode command-line tools
        run: |
          xcode-select --install || true
          swiftc --version

      - name: Install Rosetta 2 (for cross-arch x86_64 build)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install Python deps
        run: |
          uv venv
          uv pip install -e ".[dev,test]"
          uv pip install nuitka zstandard

      # Fail-fast arch-leg gate (ADR-0020 Phase 0-M): run the FULL config
      # drift + identifier-parity + icons guards on this arch leg, via the
      # project venv (`uv run --no-sync` — the venv above already has the
      # [dev,test] deps; --no-sync skips uv's re-sync so the editable
      # install is used as-is). Same guards the universal job re-runs
      # before `cargo tauri build`, but a drift regression dies on the
      # cheap 12-min arch leg instead of after the 20-min universal build
      # has queued. The icons module's autouse fixture runs --clean,
      # which only removes uncommitted STUBS (real binaries preserved).
      # version parity before any build step: tauri.conf.json / package.json
      # / Cargo.toml / pyproject.toml must carry the SAME version — a bump
      # that touched only one file fails in seconds. sync_versions.py is
      # stdlib-only (regex/tomllib fallback) → runs in this gate env.
      - name: Verify version lockstep across layers (fail fast, aarch64 leg)
        run: python3 scripts/build/sync_versions.py --check

      - name: Verify config drift guards (fail fast, aarch64 leg)
        run: |
          uv run --no-sync pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      - name: Build sidecar (aarch64)
        run: |
          scripts/build/build_sidecar_macos.sh aarch64
          file src-tauri/bin/python-sidecar-aarch64-apple-darwin

      - name: Build prewarm (aarch64)
        run: |
          scripts/build/build_prewarm_macos.sh aarch64
          file src-tauri/resources/prewarm-aarch64-apple-darwin

      - name: Build native listener (aarch64)
        # S4-CR-31: pre-fix this step called the wrapper
        # `build_native_listener_macos.sh` which invokes `compile_native.sh`
        # with NO --arch arg → defaults to `universal` → builds BOTH arm64
        # + x86_64 slices and lipo's them into a single fat binary ON THE
        # arm64 runner. That fat binary was then uploaded as the aarch64
        # artifact and re-uploaded as the universal binary in the
        # build-tauri-universal job — meaning the x86_64 leg's listener was
        # never used. Worse, when the universal job re-ran the wrapper, it
        # produced ANOTHER universal binary on the arm64 host, but if the
        # Rosetta 2 install failed silently the x86_64 slice would be missing
        # → the universal .dmg ships an arm64-only native listener (Intel
        # Macs crash with "bad CPU type in executable").
        #
        # Fix: invoke `compile_native.sh --arch arm64` directly to build a
        # single-arch arm64 binary. The x86_64 leg builds its own single-arch
        # x86_64 binary; the build-tauri-universal job lipo-creates them
        # into a guaranteed-2-arch universal binary.
        run: |
          bash scripts/build/compile_native.sh --arch arm64
          # compile_native.sh writes to voice_typer/server/native/macos-key-listener.
          # Copy into src-tauri/resources/native/ so the artifact upload path
          # below matches the pre-existing path expectation.
          mkdir -p src-tauri/resources/native
          cp voice_typer/server/native/macos-key-listener src-tauri/resources/native/macos-key-listener
          # Rename the per-arch slice so the build-tauri-universal job can
          # download BOTH arch artifacts without filename collision.
          mv src-tauri/resources/native/macos-key-listener src-tauri/resources/native/macos-key-listener-arm64
          file src-tauri/resources/native/macos-key-listener-arm64
          lipo -info src-tauri/resources/native/macos-key-listener-arm64

      - name: Upload aarch64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-aarch64-binaries
          path: |
            src-tauri/bin/python-sidecar-aarch64-apple-darwin
            src-tauri/resources/prewarm-aarch64-apple-darwin
            src-tauri/resources/native/macos-key-listener-arm64
          if-no-files-found: error
          retention-days: 14

  # ─── Job 2: Intel (x86_64-apple-darwin) ─────────────────────────────────────
  # Built on the SAME macos-14 runner via Rosetta 2 (Apple Silicon host
  # cross-building Intel). This is the only way to get an Intel macOS binary
  # from GitHub Actions today (macos-13 Intel runners are being phased out).
  #
  # Alternative: run this on a separate macos-13 runner if available.
  build-x86_64:
    if: true  # ENABLED for Phase 0-M validation (see GATE STATUS block). Run via workflow_dispatch with sign=true to exercise codesign + notarization.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust + targets
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-macos-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-macos-x86_64-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # XS-26: enable uv's own dependency cache (mirrors tauri-linux-build.yml).
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          # XS-26: cache npm so a warm runner skips re-installing renderer deps.
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install Xcode command-line tools + Rosetta 2
        run: |
          xcode-select --install || true
          softwareupdate --install-rosetta --agree-to-license || true
          swiftc --version

      - name: Install Python deps
        run: |
          uv venv
          uv pip install -e ".[dev,test]"
          uv pip install nuitka zstandard

      # Fail-fast arch-leg gate: same full drift + parity + icons guard
      # as the aarch64 leg above (runs via the project venv; --no-sync
      # keeps the editable install untouched).
      # version parity before any build step (same gate as the aarch64 leg).
      - name: Verify version lockstep across layers (fail fast, x86_64 leg)
        run: python3 scripts/build/sync_versions.py --check

      - name: Verify config drift guards (fail fast, x86_64 leg)
        run: |
          uv run --no-sync pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      - name: Build sidecar (x86_64 via Rosetta 2)
        run: |
          scripts/build/build_sidecar_macos.sh x86_64
          file src-tauri/bin/python-sidecar-x86_64-apple-darwin

      - name: Build prewarm (x86_64 via Rosetta 2)
        run: |
          scripts/build/build_prewarm_macos.sh x86_64
          file src-tauri/resources/prewarm-x86_64-apple-darwin

      # S4-CR-31: pre-fix the x86_64 leg did NOT build the native listener
      # at all — only the aarch64 leg built it (as a single-arch arm64 binary
      # via the wrapper script). The build-tauri-universal job then re-ran
      # the wrapper on the arm64 host, producing ANOTHER arm64 binary and
      # bundling THAT into the "universal" .dmg. Intel Macs got a "bad CPU
      # type in executable" crash when the Tauri host tried to spawn
      # resources/native/macos-key-listener.
      #
      # Fix: build a single-arch x86_64 listener here via `--arch x86_64`.
      # compile_native.sh passes `-target x86_64-apple-macos11.0` to swiftc
      # so the resulting binary runs natively on Intel Macs without Rosetta 2.
      # The build-tauri-universal job lipo-creates this with the arm64 slice
      # from the aarch64 leg into a guaranteed-2-arch universal binary.
      - name: Build native listener (x86_64)
        run: |
          bash scripts/build/compile_native.sh --arch x86_64
          mkdir -p src-tauri/resources/native
          cp voice_typer/server/native/macos-key-listener src-tauri/resources/native/macos-key-listener
          mv src-tauri/resources/native/macos-key-listener src-tauri/resources/native/macos-key-listener-x86_64
          file src-tauri/resources/native/macos-key-listener-x86_64
          lipo -info src-tauri/resources/native/macos-key-listener-x86_64

      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-x86_64-binaries
          path: |
            src-tauri/bin/python-sidecar-x86_64-apple-darwin
            src-tauri/resources/prewarm-x86_64-apple-darwin
            src-tauri/resources/native/macos-key-listener-x86_64
          if-no-files-found: error
          retention-days: 14

  # ─── Job 3: Universal .app + .dmg via cargo tauri build ─────────────────────
  # Depends on both arch jobs having produced their binaries.
  # CRIT-7 note: the universal (universal2) build depends on both arch jobs
  # (build-aarch64 + build-x86_64) via `needs:` below — it only runs when
  # both sidecar legs succeed, then lipo-creates the universal binaries.
  build-tauri-universal:
    if: true  # ENABLED for Phase 0-M validation (see GATE STATUS block above).
    needs: [build-aarch64, build-x86_64]
    runs-on: macos-14
    timeout-minutes: 60
    # WR-17: job-level permissions widen the top-level `contents: read`
    # default (line 59-60) with the two scopes required for SLSA build
    # provenance attestation via actions/attest-build-provenance@v4 —
    # mirrors tauri-windows-build.yml:88-91. `id-token: write` lets the
    # job mint an OIDC token for the attestation signing identity;
    # `attestations: write` lets it write the attestation record to the
    # repo. Both are no-ops on PR/fork builds (the `if:` gate on the
    # attestation step below restricts it to workflow_dispatch +
    # inputs.sign — TX-24).
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # CRIT-7: the `secrets` context is NOT available in step `if:`
      # conditions (GitHub Actions does not populate it there, so the
      # condition never matches and notarization is silently skipped). Map
      # the signing/notarization secrets to job-level env so steps can gate
      # on `env.*` (empty on PR/fork builds without secrets → skip).
      MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust + universal targets
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-macos-universal-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-macos-universal-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # XS-26: enable uv's own dependency cache (mirrors tauri-linux-build.yml).
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          # XS-26: cache npm so a warm runner skips re-installing renderer deps.
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install Node deps + build renderer
        run: |
          cd voice_typer/client
          npm ci
          npm run build:renderer
          cd ../..

      - name: Download aarch64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-aarch64-binaries
          # S4-CR-31: download into a per-arch subdir to avoid filename
          # collision on `macos-key-listener-*` with the x86_64 download.
          path: /tmp/macos-aarch64

      - name: Download x86_64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-x86_64-binaries
          path: /tmp/macos-x86_64

      - name: Place artifacts in src-tauri/
        # S4-CR-31: pre-fix this step RE-BUILT the native listener on the
        # arm64 host via `scripts/build/build_native_listener_macos.sh`,
        # producing an arm64-only binary (or a Rosetta-broken universal)
        # that got bundled into the "universal" .dmg. Now we lipo-create
        # the two per-arch listener artifacts built by build-aarch64 +
        # build-x86_64 into a guaranteed-2-arch universal binary, matching
        # the build-macos-universal job in build.yml (the Electron path).
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin src-tauri/resources src-tauri/resources/native
          mv /tmp/macos-aarch64/python-sidecar-aarch64-apple-darwin src-tauri/bin/
          mv /tmp/macos-x86_64/python-sidecar-x86_64-apple-darwin src-tauri/bin/
          mv /tmp/macos-aarch64/prewarm-aarch64-apple-darwin src-tauri/resources/
          mv /tmp/macos-x86_64/prewarm-x86_64-apple-darwin src-tauri/resources/
          # S4-CR-31: lipo-create the per-arch listener slices into a
          # universal binary. Hard-assert both input slices exist AND are
          # different arches — mirrors the CR-011 assertion in
          # build.yml::build-macos-universal.
          ARM_LISTENER=/tmp/macos-aarch64/macos-key-listener-arm64
          X86_LISTENER=/tmp/macos-x86_64/macos-key-listener-x86_64
          test -x "$ARM_LISTENER" || { echo "MISSING: $ARM_LISTENER"; exit 1; }
          test -x "$X86_LISTENER" || { echo "MISSING: $X86_LISTENER"; exit 1; }
          echo "Input slice arches:"
          lipo -info "$ARM_LISTENER"
          lipo -info "$X86_LISTENER"
          ARM_ARCH="$(lipo -info "$ARM_LISTENER" | awk '{print $NF}')"
          X86_ARCH="$(lipo -info "$X86_LISTENER" | awk '{print $NF}')"
          if [ "$ARM_ARCH" = "$X86_ARCH" ]; then
            echo "ERROR: both input listener slices are the same arch ($ARM_ARCH) — S4-CR-31 fix regressed."
            echo "  build-aarch64 + build-x86_64 must pass --arch arm64 / --arch x86_64 to compile_native.sh."
            exit 1
          fi
          lipo -create "$ARM_LISTENER" "$X86_LISTENER" \
            -output src-tauri/resources/native/macos-key-listener
          chmod +x src-tauri/resources/native/macos-key-listener
          # Verify the universal binary contains BOTH architectures.
          UNIVERSAL_INFO="$(lipo -info src-tauri/resources/native/macos-key-listener)"
          echo "$UNIVERSAL_INFO"
          file src-tauri/resources/native/macos-key-listener
          echo "$UNIVERSAL_INFO" | grep -q "x86_64" || {
            echo "ERROR: universal listener is missing x86_64 slice — S4-CR-31 regressed."
            exit 1
          }
          echo "$UNIVERSAL_INFO" | grep -q "arm64" || {
            echo "ERROR: universal listener is missing arm64 slice — S4-CR-31 regressed."
            exit 1
          }
          echo "OK: universal listener contains both x86_64 + arm64 slices."
          ls -la src-tauri/bin src-tauri/resources src-tauri/resources/native

      # TK-48: run the macOS-gated #[cfg(target_os = "macos")] Rust unit
      # tests (e.g. platform::paths config-dir resolution) on their
      # NATIVE OS. The Linux smoke job (tauri-linux-build.yml) can only
      # execute the Linux-gated branches — the macOS branches were
      # dead-on-arrival in CI before this step. The base tauri.conf.json
      # `bundle.resources`/`externalBin` lists every platform's binaries
      # (a documented superset for the mig15/mig16 source-inspection
      # tests), so tauri-build's compile-time validation needs the
      # other-platform placeholder stubs. Generate them with
      # gen_tauri_icons_stub.py (which never touches the REAL macOS
      # binaries the arch jobs placed above — it only writes files that
      # don't already exist). MUST run BEFORE the drift-gate pytest steps
      # below: the icons module's autouse fixture runs `--clean` after
      # each test, which would remove these stubs.
      - name: Generate other-platform binary stubs (for cargo test)
        run: python3 scripts/gen_tauri_icons_stub.py

      - name: cargo test (Tauri Rust host unit tests — macOS-gated branches)
        shell: bash
        working-directory: src-tauri
        run: |
          # voice-typer-tauri is a binary-only crate — `--bin` runs the
          # unit tests without paying for integration-test crates.
          # Host-native (aarch64-apple-darwin on the arm64 runner) — no
          # --target needed; mirrors the Linux smoke job's step.
          cargo test --bin voice-typer-tauri

      # The universal job needs pytest for the config drift gate below —
      # unlike the arch jobs it does not install the project's [dev,test]
      # deps. Minimal install (pytest + the two non-stdlib imports the
      # drift tests need: yaml for electron-builder.yml, filelock for the
      # icons module's serialize fixture).
      - name: Install Python deps (fail-fast config drift gate)
        run: uv pip install --system pytest pyyaml filelock

      # Fail-fast gate: run the config drift guards BEFORE the build —
      # identifier↔appId + productName + version parity, bundle.icon↔git
      # lockstep, and ALL the config↔script pairs (bundle.resources/
      # externalBin ↔ stub generator registry, tauri-binaries.json ↔
      # canonical triples + Cargo binary name + launcher install paths,
      # per-arch config overrides ↔ base config). Same guards the full
      # suite enforces, but a drift regression dies in seconds instead of
      # only after the whole test run. The icons module's autouse fixture
      # runs --clean after each test, which preserves the REAL binaries
      # the arch jobs placed above (the _is_stub_file heuristic) and
      # touches no committed icons.
      # version parity before any build step (universal job — system python3,
      # same stdlib-only check as the arch legs).
      - name: Verify version lockstep across layers (fail fast)
        run: python3 scripts/build/sync_versions.py --check

      - name: Verify config drift guards (icons, identity, binaries) (fail fast)
        run: |
          python3 -m pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      # Fail-fast gate: verify the COMMITTED icons/icon.icns exists AND is
      # Fail-fast gate: verify EVERY committed file in tauri.conf.json
      # bundle.icon exists AND is structurally valid (the 4 PNGs +
      # icon.ico + icon.icns) before the cargo tauri build. The single
      # cross-platform gate (--check-icons) reads the icon list from
      # tauri.conf.json and dispatches each entry to the right validator
      # by extension; tauri-build hard-fails the whole build when the
      # platform's icon is missing or corrupt, and a corrupt file would
      # otherwise only surface minutes into the compile. This gate fails
      # in <1s instead. CLI flags verified by reading
      # scripts/gen_tauri_icons_stub.py (argparse: --check /
      # --check-icons / --clean / no-flag).
      - name: Verify bundle.icon icons are present + valid (fail fast)
        run: python3 scripts/gen_tauri_icons_stub.py --check-icons

      # The icons (src-tauri/icons/*) are REAL committed files generated
      # once with `tauri icon` from voice_typer/client/scripts/logo.svg —
      # cargo tauri build reads them straight from the checkout. All
      # macOS binaries (sidecar x2, prewarm x2, native listener) were
      # built real by the two arch jobs above, so no stub generation step
      # is needed here at all.
      - name: Build Tauri universal .app + .dmg
        run: |
          cd src-tauri
          cargo install tauri-cli --version "^2.0"
          # XS-28: apply tauri.macos.conf.json — the base tauri.conf.json
          # `bundle.resources` array lists every platform's native binaries
          # (a documented superset for the mig15/mig16 source-inspection tests)
          # and would hard-fail at the tauri-build resource-copy step on a
          # macOS host (Linux/Windows-only files don't exist here).
          cargo tauri build --target universal-apple-darwin --config tauri.macos.conf.json
          cd ..

      # smoke test the bundled sidecar binary AFTER cargo tauri build.
      # Pre-fix the macOS Tauri workflow never executed the sidecar — a Nuitka
      # flag change that broke `--version` (argparse exits 0 without acquiring
      # the single-instance lock per ipc_server.py:2796-2815) would only
      # surface during a release cut. We test the aarch64 sidecar slice since
      # the runner is arm64 (the x86_64 slice requires Rosetta 2 which is
      # already installed for the build-x86_64 leg). Runs in <2s.
      - name: Smoke test sidecar binary (--version, aarch64 slice)
        run: |
          set -euo pipefail
          BIN="src-tauri/bin/python-sidecar-aarch64-apple-darwin"
          if [[ ! -x "$BIN" ]]; then
            echo "ERROR: sidecar binary not found at $BIN — cannot smoke test."
            exit 1
          fi
          echo "Invoking: $BIN --version"
          output=$("$BIN" --version 2>&1) || rc=$?
          rc=${rc:-0}
          echo "Output: $output"
          echo "Exit code: $rc"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Sidecar --version exited with code $rc (expected 0). The frozen binary is broken."
            exit 1
          fi
          if ! echo "$output" | grep -Eq 'voice-typer|VoiceTyper|voice_typer'; then
            echo "::error::Sidecar --version output did not contain the project name. Output: $output"
            exit 1
          fi
          echo "Smoke test PASSED: sidecar --version exited 0 with project name in output."

      # T3 (post-build integration): the real `ps` parent-chain walk
      # (server_platform/macos_bundle_id.py) must resolve the JUST-BUILT
      # universal .app end-to-end — launch a child executable inside the
      # bundle, walk real ps from its pid, require the resolved
      # CFBundleIdentifier to equal tauri.conf.json's identifier — and
      # the built bundle's Contents/Info.plist must round-trip through
      # read_bundle_identifier. Runs in the minimal pytest env (stdlib +
      # pytest only; the walker has no heavy deps). Skips gracefully
      # when the artifact is absent; FAILS the run when the artifact is
      # present but wrong (a bundler-level identity drift that config
      # parity tests cannot see).
      - name: Verify built .app bundle ID (real ps walk, post-build)
        run: |
          python3 -m pytest \
            tests/tauri/test_bundle_identifier_parity.py::TestBuiltBundleIdentifierRoundTrip \
            tests/tauri/test_bundle_identifier_parity.py::TestBuiltAppRealPsWalk \
            -q --no-cov

      # TX-23: honor the `sign` workflow_call input instead of gating
      # purely on secret presence. sign=true + missing secrets = hard
      # fail (a misconfigured release must not silently ship unsigned);
      # sign=false skips signing even when secrets are present.
      - name: Fail fast — sign=true but signing/notarization secrets missing
        if: ${{ inputs.sign == 'true' && (env.MAC_SIGNING_IDENTITY == '' || env.APPLE_ID == '' || env.APPLE_APP_SPECIFIC_PASSWORD == '' || env.APPLE_TEAM_ID == '') }}
        run: |
          echo "::error::sign=true was requested but MAC_SIGNING_IDENTITY / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are missing. Add the secrets to the repository, or dispatch with sign=false."
          exit 1

      - name: Codesign nested Mach-O binaries (S1-CR-37)
        if: ${{ inputs.sign == 'true' && env.MAC_SIGNING_IDENTITY != '' }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Voice Typer.app"
          # S1-CR-37: cargo tauri build signs the main .app executable via
          # config's signingIdentity, but NOT the nested Mach-O binaries
          # under Contents/Resources/ and Contents/MacOS/. Apple's
          # notarization service rejects .app bundles containing unsigned
          # Mach-O binaries with "The binary is not signed". Sign them
          # BEFORE notarization (signing-guide.md §"Signing command").
          BINARIES=(
            "$APP_PATH/Contents/Resources/python-sidecar-aarch64-apple-darwin"
            "$APP_PATH/Contents/Resources/python-sidecar-x86_64-apple-darwin"
            "$APP_PATH/Contents/Resources/prewarm-aarch64-apple-darwin"
            "$APP_PATH/Contents/Resources/prewarm-x86_64-apple-darwin"
            "$APP_PATH/Contents/Resources/native/macos-key-listener"
          )
          for bin in "${BINARIES[@]}"; do
            if [ -f "$bin" ]; then
              echo "[codesign] signing $bin"
              codesign --force --options runtime --timestamp --sign "$MAC_SIGNING_IDENTITY" \
                --entitlements src-tauri/entitlements.plist "$bin"
            else
              echo "::error::Expected binary missing from .app bundle: $bin"
              echo "  The Tauri bundler did not copy this resource. Check tauri.macos.conf.json resources list."
              exit 1
            fi
          done
          # CI-4: Sign top-level .app bundle leaf-to-root with entitlements after signing nested binaries,
          # BEFORE zipping and submitting to notarytool.
          echo "[codesign] signing top-level app bundle (CI-4)"
          codesign --force --options runtime --timestamp --sign "$MAC_SIGNING_IDENTITY" \
            --entitlements src-tauri/entitlements.plist "$APP_PATH"

      - name: Verify codesign (before notarization)
        if: ${{ inputs.sign == 'true' && env.MAC_SIGNING_IDENTITY != '' }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Voice Typer.app"
          codesign --verify --verbose=4 "$APP_PATH"
          spctl --assess --verbose=4 "$APP_PATH"

      - name: Notarize + staple (if secrets present)
        if: ${{ inputs.sign == 'true' && env.MAC_SIGNING_IDENTITY != '' }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Voice Typer.app"
          DMG_PATH="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Voice Typer_1.0.0_universal.dmg"
          # Notarize .app
          ditto -c -k --keepParent "$APP_PATH" /tmp/VoiceTyper.zip
          xcrun notarytool submit /tmp/VoiceTyper.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          # Sign + notarize + staple .dmg
          codesign --force --timestamp --sign "$MAC_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload .dmg
        uses: actions/upload-artifact@v5
        with:
          name: tauri-macos-installer
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      # WR-17: generate SHA-256 checksums for the .dmg + .app bundle,
      # mirroring tauri-windows-build.yml:368-393. macOS uses `shasum -a 256`
      # (BSD coreutils). The .dmg is a single file — direct shasum. The
      # .app bundle is a DIRECTORY (no canonical byte sequence — file mtimes,
      # .DS_Store, __pycache__ all vary across runs), so we hash a
      # deterministic `ditto -c -k --keepParent --norsrc` archive of it
      # instead and annotate the line so a downstream verifier knows what
      # they're checking. Output format is `<hash>  <name>` (GNU sha256sum
      # compatible) so Linux users can `sha256sum -c SHA256SUMS.txt` and
      # macOS users can `shasum -a 256 -c SHA256SUMS.txt`.
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          BUNDLE_DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          BUNDLE_APP="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          : > SHA256SUMS.txt
          for dmg in "$BUNDLE_DMG"/*.dmg; do
            [ -f "$dmg" ] || continue
            hash=$(shasum -a 256 "$dmg" | awk '{print $1}')
            name=$(basename "$dmg")
            echo "$hash  $name" >> SHA256SUMS.txt
          done
          for app in "$BUNDLE_APP"/*.app; do
            [ -d "$app" ] || continue
            name=$(basename "$app")
            # ditto the .app into a deterministic zip + hash the zip.
            ditto -c -k --keepParent --norsrc "$app" "/tmp/${name}.zip"
            hash=$(shasum -a 256 "/tmp/${name}.zip" | awk '{print $1}')
            echo "$hash  ${name}.zip (canonical ditto archive of ${name})" >> SHA256SUMS.txt
            rm -f "/tmp/${name}.zip"
          done
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Tauri-MacOS-SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Record the REAL SHA-256 of the built universal host binary into
      # tauri-binaries.json — the integrity manifest the autostart
      # launcher verifies against at login (fail-closed). The updater
      # hashes the .app bundle's INNER executable (not the .app directory
      # — no canonical byte sequence), via its macOS discovery; the
      # universal Mach-O collapses into the single `macos` key. Script is
      # stdlib-only, so the minimal `uv pip install --system` gate env
      # suffices. Idempotent; leaves every other per-arch key untouched.
      - name: Record Tauri binary SHA-256 (universal)
        run: |
          python3 scripts/build/update_tauri_manifests.py \
            --triple universal-apple-darwin --target-dir src-tauri/target

      # Fail-fast release gate: this leg's hash must now be present and
      # valid in the manifest. An empty/malformed value aborts the run —
      # a release whose integrity gate fail-closes is worse than no build.
      - name: Enforce Tauri manifest integrity (universal)
        run: |
          python3 scripts/build/update_tauri_manifests.py \
            --check --triple universal-apple-darwin

      - name: Upload updated tauri-binaries.json
        uses: actions/upload-artifact@v5
        with:
          name: tauri-binaries-manifest-macos
          path: tauri-binaries.json
          if-no-files-found: error
          retention-days: 30

      # WR-17 / TX-24: SLSA build provenance attestation. Mirrors
      # tauri-windows-build.yml and tauri-linux-build.yml. Gated on a
      # manual signed release build (workflow_dispatch + sign=true) instead
      # of tag pushes — the tag push trigger is commented out, so the old
      # ``startsWith(github.ref, 'refs/tags/v')`` gate never fired. PR/fork
      # builds (which lack the job-level id-token:write permission grant in
      # fork contexts) are excluded. The subject-path covers both the .dmg
      # and the .app so the attestation is verifiable against either
      # artifact the user downloads.
      - name: Attest build provenance (SLSA)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
