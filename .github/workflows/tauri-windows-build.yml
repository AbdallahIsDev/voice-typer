# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v5               — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-python@v7           — Node 24 runtime (v5/v6 = Node 20, deprecated)
#   actions/cache@v5                   — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-node@v7              — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v5         — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/attest-build-provenance@v4 — Node 24 runtime (v1 = Node 16, deprecated)
#   astral-sh/setup-uv@v6              — Node 24 runtime (v3 = Node 20, deprecated)
#   dtolnay/rust-toolchain@v1           — Node 24 runtime (@stable = untagged, may resolve to Node 20)
# See build.yml header for full rationale + breaking-change analysis.
# -----------------------------------------------------------------------------
# Tauri Windows Build (ADR-0020 Phase 0-W / Phase 1-W packaging).
#
# This workflow builds a complete Tauri installer for Windows via:
#   1. Nuitka-freezing the Python backend into python-sidecar.exe
#   2. Nuitka-freezing the prewarm binary
#   3. Compiling the native windows-key-listener.exe from C source
#   4. Running `cargo tauri build` to produce NSIS + MSI installers
#   5. (Optional) Authenticode-signing via WIN_CSC_LINK secret
#
# Trigger: manual (workflow_dispatch) from the GitHub UI.
# Do NOT enable push/PR triggers until Phase 0-W validation passes on a
# real Windows host (see docs/migration/windows-validation-runbook.md).
#
# Authoritative spec:
#   - docs/adr/0020-desktop-runtime-migration-analysis.md §4 (Nuitka),
#     §5 (prewarm), §6.4 (native listener), §7 (Tauri config),
#     §13.1 (Windows Authenticode).
#   - docs/migration/windows-validation-runbook.md (host validation
#     procedure — what to run AFTER this workflow produces the binaries).

name: Tauri Windows Build (Phase 0-W / Phase 1-W)

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (empty = host triple)"
        required: false
        default: ""
        type: string
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
      # S5-CR-74: surface PYBS pin as a workflow_call input so the
      # tauri-build.yml orchestrator can pass through pybs_date / pybs_version
      # from its own workflow_dispatch inputs (allowing per-dispatch PYBS bump
      # without editing the workflow file). Defaults match the runbook's pinned
      # CPython 3.12.8 / 20241219 release.
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD)"
        required: false
        default: "20241219"
        type: string
      pybs_version:
        description: "CPython version (e.g. 3.12.8)"
        required: false
        default: "3.12.8"
        type: string
  workflow_dispatch:
    inputs:
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD)"
        required: false
        default: "20241219"
      pybs_version:
        description: "CPython version (e.g. 3.12.8)"
        required: false
        default: "3.12.8"
  # Do NOT enable push/PR triggers until Phase 0-W passes on a real host.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# CI-08-style concurrency: cancel in-flight PR builds, keep release
# (workflow_dispatch) builds running. Unconditional `cancel-in-progress:
# true` would cancel release builds mid-signing if a push landed while
# notarization was in flight (mirrors tauri-linux-build.yml:54-57).
concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# WR-17: top-level least-privilege default. Mirrors the macOS / Linux
# tauri workflows (tauri-macos-build.yml:59-60, tauri-linux-build.yml:71-72)
# and the repo-wide CI-08 / XS-28 pinning policy. The job-level block at
# :88-91 widens this to `id-token: write` + `attestations: write` ONLY on
# the build job that needs SLSA attestation.
permissions:
  contents: read

env:
  # S5-CR-74: PYBS pin now sourced from BOTH the workflow_call `inputs`
  # context (used when tauri-build.yml passes pybs_date / pybs_version
  # through) AND the workflow_dispatch `github.event.inputs` context (used
  # when this workflow is dispatched directly from the Actions UI). The
  # `inputs` context is populated for both trigger types on Actions runners
  # since 2024, but we keep the github.event.inputs fallback for older
  # self-hosted runner versions.
  PYBS_DATE: ${{ inputs.pybs_date || github.event.inputs.pybs_date || '20241219' }}
  PYBS_VERSION: ${{ inputs.pybs_version || github.event.inputs.pybs_version || '3.12.8' }}
  PYBS_TRIPLE: x86_64-pc-windows-msvc
  RUST_TARGET: x86_64-pc-windows-msvc

jobs:
  tauri-windows-build:
    # MIG-1.5: enabled for manual workflow_dispatch triggers.
    # The real sidecar + native binaries are built inside this job.
    # Stubs (icons, placeholders) are generated by gen_tauri_icons_stub.py
    # before the Tauri build step. See scripts/gen_tauri_icons_stub.py.
    if: true
    runs-on: windows-2022
    # Nuitka + Scons + cl.exe compilation of the Python backend,
    # prewarm, and Tauri build takes 90-110 min on a windows-2022
    # runner. Increased from 90 to 120 in 2026-07-27 to accommodate
    # the full compile + code-sign + upload sequence. If the Nuitka
    # C compilation stage (Scons with cl.exe) consistently exceeds
    # 110 min, consider adding --nofollow-import-to exclusions for
    # scipy/pytest/PIL or enabling Nuitka's ccache (see cache step).
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write   # required for actions/attest-build-provenance
      attestations: write
    env:
      # CRIT-7: the `secrets` context is NOT available in step `if:`
      # conditions (GitHub Actions does not populate it there, so the
      # condition never matches and signing is silently skipped). Map the
      # signing secrets to job-level env so steps can gate on `env.*`
      # (empty on PR/fork builds without secrets → signing steps skip).
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # S10-CC-1: disable clcache at job level so Nuitka/SCons subprocess
      # inherits it. Step-level `$env:CLCACHE_DISABLE = "1"` doesn't
      # propagate to the C compiler subprocess, causing torch module C
      # compilation to hang indefinitely and timeout after 90 min.
      CLCACHE_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (dev env)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Rust toolchain (${{ env.RUST_TARGET }})
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-windows-${{ runner.os }}-

      # Nuitka ccache: persist compiled C objects between builds.
      # Nuitka's C compilation (Scons + cl.exe) is the slowest step
      # (60-90 min). Caching the nuitka-cache directory means only
      # changed Python modules get recompiled on subsequent runs.
      # The key includes a hash of pyproject.toml + requirements-lock.txt
      # so dependency bumps invalidate the cache.
      - name: Cache Nuitka build artifacts (ccache)
        uses: actions/cache@v5
        with:
          path: C:\Users\runner\AppData\Local\nuitka\cache
          key: tauri-windows-nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
          restore-keys: |
            tauri-windows-nuitka-${{ runner.os }}-

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install npm dependencies
        working-directory: voice_typer/client
        run: npm ci

      - name: Install Python dev deps (uv)
        shell: pwsh
        run: |
          $env:UV_LINK_MODE = "copy"
          uv pip install --system ".[dev,test]"
          uv pip install --system nuitka==2.5.4 zstandard ordered-set
          pip list

      - name: Download + verify python-build-standalone
        shell: pwsh
        run: |
          $date = $env:PYBS_DATE
          $pyver = $env:PYBS_VERSION
          $triple = $env:PYBS_TRIPLE
          $archive = "cpython-$pyver+$date-$triple-install_only.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          # The python-build-standalone releases do NOT have a SHA256SUMS.txt aggregate.
          # Instead, each individual asset has its own .sha256 file adjacent to it:
          #   asset:   cpython-3.12.8+20241219-x86_64-pc-windows-msvc-install_only.tar.gz
          #   checksum: cpython-3.12.8+20241219-x86_64-pc-windows-msvc-install_only.tar.gz.sha256
          # See https://github.com/astral-sh/python-build-standalone/releases/expanded_assets/{tag}
          # for the list of all assets and their .sha256 companions.
          $shaUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive.sha256"
          Write-Host "Downloading checksum: $shaUrl"
          Invoke-WebRequest -Uri $shaUrl -OutFile "$archive.sha256"
          # The .sha256 file contains: "<sha256>  <filename>"
          $expected = (Get-Content "$archive.sha256" -Raw).Split(' ', 2)[0].Trim().ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Error "SHA-256 mismatch for $archive`nexpected=$expected`nactual=$actual"
            exit 1
          }
          Write-Host "SHA-256 OK: $actual"
          # Extract to C:\tools\pybs\python (matches runbook §0.7)
          New-Item -ItemType Directory -Force -Path C:\tools\pybs | Out-Null
          tar -xzf $archive -C C:\tools\pybs
          Write-Host "PYBS python:"
          C:\tools\pybs\python\python.exe --version
          # Add PYBS to GITHUB_ENV so subsequent steps can use it.
          echo "PYBS=C:\tools\pybs\python" >> $env:GITHUB_ENV
          # Install the project + Nuitka into the PYBS env (the env that
          # actually gets frozen). --no-warn-script-location suppresses
          # pip noise about Scripts/ not being on PATH (PYBS python is
          # invoked by full path, not via PATH).
          C:\tools\pybs\python\python.exe -m pip install --upgrade --no-warn-script-location pip
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location nuitka==2.5.4 zstandard ordered-set
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location -e ".[dev,test]"
          C:\tools\pybs\python\python.exe -c "import faster_whisper, ctranslate2; print('ctranslate2', ctranslate2.__version__)"

      - name: Build the sidecar with Nuitka (ADR-0020 §4.2)
        shell: pwsh
        run: |
          $env:CLCACHE_DISABLE = "1"
          $PYBS = $env:PYBS
          $SITE = & $PYBS\python.exe -c "import site; print(site.getsitepackages()[-1])"
          Write-Host "PYBS=$PYBS  SITE=$SITE"
          # ctranslate2 ships DLLs directly in ctranslate2/ (not ctranslate2/lib/).
          # Build the data-dir flag conditionally so we don't hard-fail if the
          # layout changes in a future ctranslate2 release.
          $ct2Dir = "$SITE\ctranslate2"
          $dataDirFlag = @()
          if (Test-Path "$ct2Dir\lib") {
            $dataDirFlag = @("--include-data-dir=$ct2Dir\lib=ctranslate2/lib")
          } elseif (Test-Path $ct2Dir) {
            $dataDirFlag = @("--include-data-dir=$ct2Dir=ctranslate2")
          }
          & $PYBS\python.exe -m nuitka `
              --standalone --onefile `
              --assume-yes-for-downloads `
              --enable-plugin=numpy `
              --nofollow-import-to=torch._dynamo `
              --nofollow-import-to=torch._inductor `
              --nofollow-import-to=torch.export `
              --nofollow-import-to=torch._functorch `
              --nofollow-import-to=transformers `
              --nofollow-import-to=scipy._lib.cobyqa `
              --nofollow-import-to=scipy._lib.array_api_extra.testing `
              --nofollow-import-to=sympy `
              --nofollow-import-to=mpmath `
              --nofollow-import-to=pytest `
              --nofollow-import-to=PIL.ImageQt `
              --nofollow-import-to=numpy.distutils `
              --nofollow-import-to=numpy.f2py `
              --include-package=faster_whisper `
              --include-package=ctranslate2 `
              --include-package=voice_typer `
              --include-package=websockets `
              $($dataDirFlag) `
              --windows-console-mode=disable `
              --onefile-tempdir-spec="{CACHE_DIR}/voice-typer/onefile-tmp" `
              --output-filename=python-sidecar-x86_64-pc-windows-msvc.exe `
              --output-dir=src-tauri\bin `
              voice_typer\server\ipc_server.py
          # Verify the binary exists + emits server_started
          if (-not (Test-Path "src-tauri\bin\python-sidecar-x86_64-pc-windows-msvc.exe")) {
            Write-Error "Sidecar binary not built"; exit 1
          }
          $size = (Get-Item "src-tauri\bin\python-sidecar-x86_64-pc-windows-msvc.exe").Length / 1MB
          Write-Host "Sidecar binary size: $([math]::Round($size,1)) MB"

      - name: Build the prewarm binary with Nuitka (ADR-0020 §5)
        shell: pwsh
        run: |
          $env:CLCACHE_DISABLE = "1"
          $PYBS = $env:PYBS
          $SITE = & $PYBS\python.exe -c "import site; print(site.getsitepackages()[-1])"
          $ct2Dir = "$SITE\ctranslate2"
          $dataDirFlag = @()
          if (Test-Path "$ct2Dir\lib") {
            $dataDirFlag = @("--include-data-dir=$ct2Dir\lib=ctranslate2/lib")
          } elseif (Test-Path $ct2Dir) {
            $dataDirFlag = @("--include-data-dir=$ct2Dir=ctranslate2")
          }
          & $PYBS\python.exe -m nuitka `
              --standalone --onefile `
              --assume-yes-for-downloads `
              --enable-plugin=numpy `
              --nofollow-import-to=torch._dynamo `
              --nofollow-import-to=torch._inductor `
              --nofollow-import-to=torch.export `
              --nofollow-import-to=torch._functorch `
              --nofollow-import-to=transformers `
              --nofollow-import-to=scipy._lib.cobyqa `
              --nofollow-import-to=scipy._lib.array_api_extra.testing `
              --nofollow-import-to=sympy `
              --nofollow-import-to=mpmath `
              --nofollow-import-to=pytest `
              --nofollow-import-to=PIL.ImageQt `
              --nofollow-import-to=numpy.distutils `
              --nofollow-import-to=numpy.f2py `
              --include-package=faster_whisper `
              --include-package=ctranslate2 `
              --include-package=voice_typer `
              --include-package=websockets `
              $($dataDirFlag) `
              --windows-console-mode=disable `
              --onefile-tempdir-spec="{CACHE_DIR}/voice-typer/prewarm-onefile-tmp" `
              --output-filename=prewarm-x86_64-pc-windows-msvc.exe `
              --output-dir=src-tauri\resources `
              voice_typer\server\prewarm\__main__.py
          if (-not (Test-Path "src-tauri\resources\prewarm-x86_64-pc-windows-msvc.exe")) {
            Write-Error "Prewarm binary not built"; exit 1
          }

      - name: Build the native windows-key-listener (ADR-0020 §6.4)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build\compile_native.ps1
          if (-not (Test-Path "src-tauri\resources\native\windows-key-listener.exe")) {
            Write-Error "Native listener binary not built"; exit 1
          }

      # S1-CR-99: sign sidecar + prewarm + native listener. Pre-fix the loop
      # only covered python-sidecar + prewarm; the native windows-key-listener.exe
      # was bundled into the NSIS installer UNSIGNED. SmartScreen on Windows 11
      # treats unsigned binaries inside a signed installer as suspicious and
      # pops a "Windows protected your PC" dialog on first launch — defeating
      # the value of signing the outer installer. Adding the native listener
      # to the same foreach loop keeps every Mach-O/PE binary the bundle ships
      # signed with the same Authenticode cert.
      - name: Sign sidecar + prewarm + native listener (optional — ADR-0020 §13.1)
        if: ${{ env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          # Write the PFX (base64-encoded in the secret) to a temp file
          # and sign every binary with signtool + an RFC-3161 timestamp.
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using signtool: $signtool"
          foreach ($exe in @(
                "src-tauri\bin\python-sidecar-x86_64-pc-windows-msvc.exe",
                "src-tauri\resources\prewarm-x86_64-pc-windows-msvc.exe",
                "src-tauri\resources\native\windows-key-listener.exe"
          )) {
            if (-not (Test-Path $exe)) {
              Write-Error "Cannot sign missing binary: $exe"; exit 1
            }
            & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for $exe"; exit 1 }
            & $signtool verify /pa /v $exe
          }
          Remove-Item $pfxPath -Force

      # WR-17: generate placeholder Tauri icons + binary stubs if they
      # don't already exist. cargo tauri build reads the icon list from
      # tauri.conf.json and hard-fails on the first missing icon. The
      # `--check` flag exits 0 if all stubs are present (no-op on a warm
      # checkout that already ran the script) and 1 if any are missing —
      # the `||` falls through to the generation command only when needed.
      # Stub content + CLI flags verified by reading
      # scripts/gen_tauri_icons_stub.py (argparse: --check / --clean / no-flag).
      - name: Generate Tauri icons (stub)
        shell: bash
        run: |
          python scripts/gen_tauri_icons_stub.py --check || python scripts/gen_tauri_icons_stub.py

      # WR-17: install tauri-cli explicitly. The runner's pre-installed
      # `cargo-tauri` is unversioned and lags upstream by months; on
      # windows-2022 it has historically been missing entirely (the
      # `cargo tauri build` step below would fail with `no such command`).
      # macOS already has this step at tauri-macos-build.yml:332; Linux
      # gets the same step in this same WR-17 batch. Pin to ^2.0 so we
      # stay on the Tauri v2 line (Tauri v3 will be a breaking change
      # requiring a manual re-evaluation).
      - name: Install tauri-cli (v2)
        shell: pwsh
        run: cargo install tauri-cli --version "^2.0"

      - name: Build the Tauri app (ADR-0020 §7)
        shell: pwsh
        run: |
          cd src-tauri
          # XS-28: apply tauri.windows-x86_64.conf.json — the base
          # tauri.conf.json `bundle.resources` array lists every platform's
          # native binaries (a documented superset for the mig15/mig16
          # source-inspection tests) and would hard-fail at the tauri-build
          # resource-copy step on a Windows host (macOS/Linux-only files
          # don't exist here).
          cargo tauri build --target x86_64-pc-windows-msvc --config tauri.windows-x86_64.conf.json

      - name: Locate + verify installer artifacts
        id: artifacts
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $standalone = "src-tauri\target\release\voice-typer-tauri.exe"
          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }
          Write-Host "NSIS: $($nsis.FullName)"
          Write-Host "MSI: $($msi.FullName)"
          Write-Host "Standalone: $standalone"
          echo "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Post-build assertion — bundle has no non-Windows binaries
        # tauri.windows-x86_64.conf.json narrows ``bundle.resources``
        # to Windows-only files. If a future regression widens the resource
        # list (or the --config flag silently stops being applied), the
        # NSIS installer would bundle ~5 unnecessary prewarm binaries +
        # 2 unnecessary native binaries (macOS + Linux variants), bloating
        # the installer by ~50-100 MB. This step asserts the bundle
        # directory does NOT contain any non-Windows prewarm or native
        # binaries, failing the build if it does.
        shell: pwsh
        run: |
          # The bundle resources land in src-tauri\target\release\resources\
          # (per-target: target\<triple>\release\resources\ for cross builds).
          # We check both because tauri's resource-copy step uses different
          # paths for cross-target vs host-target builds.
          $resourceDirs = @(
            "src-tauri\target\x86_64-pc-windows-msvc\release\resources",
            "src-tauri\target\release\resources"
          )
          # Forbidden substrings — any resource whose name contains one of
          # these is a non-Windows binary that should not be in the bundle.
          $forbidden = @(
            "prewarm-aarch64-apple-darwin",
            "prewarm-x86_64-apple-darwin",
            "prewarm-x86_64-unknown-linux-gnu",
            "prewarm-aarch64-unknown-linux-gnu",
            "macos-key-listener",
            "linux-key-listener"
          )
          $violations = @()
          foreach ($dir in $resourceDirs) {
            if (-not (Test-Path $dir)) { continue }
            foreach ($file in Get-ChildItem $dir -File -ErrorAction SilentlyContinue) {
              foreach ($bad in $forbidden) {
                if ($file.Name -like "*$bad*") {
                  $violations += "$($file.FullName) (matches forbidden pattern '$bad')"
                }
              }
            }
          }
          if ($violations.Count -gt 0) {
            Write-Error "Windows bundle contains non-Windows binaries:"
            $violations | ForEach-Object { Write-Host "  - $_" }
            Write-Error "Check tauri.windows-x86_64.conf.json bundle.resources list."
            exit 1
          }
          Write-Host "Bundle contains only Windows binaries (assertion passed)"

      - name: Sign the final NSIS installer (optional — ADR-0020 §13.1)
        if: ${{ env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "${{ steps.artifacts.outputs.nsis_path }}"
          & $signtool verify /pa /v "${{ steps.artifacts.outputs.nsis_path }}"
          Remove-Item $pfxPath -Force

      # S1-CR-99: sign the MSI installer. Pre-fix only the NSIS installer
      # was signed — the MSI (produced by `cargo tauri build` via the WiX
      # bundler) shipped unsigned, so enterprises that prefer MSI for SCCM /
      # Intune deployment hit SmartScreen on every install. Tauri does NOT
      # automatically invoke signCommand on the MSI (it only signs the
      # NSIS bundle when `bundle.windows.signCommand` is set); we sign the
      # MSI explicitly here when the secrets are present. Skipped silently
      # if the MSI wasn't produced (e.g. cargo tauri build only emitted NSIS).
      - name: Sign the final MSI installer (optional — ADR-0020 §13.1)
        if: ${{ env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' && steps.artifacts.outputs.msi_path != '' }}
        shell: pwsh
        run: |
          $msi = "${{ steps.artifacts.outputs.msi_path }}"
          if (-not (Test-Path $msi)) {
            Write-Host "MSI not produced by cargo tauri build — skipping MSI signing."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $msi
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for MSI: $msi"; exit 1 }
          & $signtool verify /pa /v $msi
          Remove-Item $pfxPath -Force

      # S1-CR-100: smoke test the bundled sidecar binary after `cargo tauri build`.
      # Pre-fix the Tauri workflows only ran `objdump -p` / `ldd` static checks on
      # the sidecar — no execution. A Nuitka flag change or Cargo dep bump that
      # broke the sidecar's `--version` flag (argparse exit path) would only
      # surface during a release cut. The smoke test here invokes the bundled
      # sidecar with `--version` (which exits 0 via argparse without acquiring
      # the single-instance lock per ipc_server.py:2796-2815) and asserts the
      # output contains the project name + version — proving the binary
      # actually runs on the host OS, not just that it has the right ELF/PE
      # headers. Gated on the sidecar existing (it always does after the build
      # step above) and runs in <2s.
      - name: Smoke test sidecar binary (--version)
        shell: pwsh
        run: |
          $sidecar = "src-tauri\bin\python-sidecar-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            Write-Error "Sidecar binary not found at $sidecar — cannot smoke test."; exit 1
          }
          Write-Host "Invoking: $sidecar --version"
          $output = & $sidecar --version 2>&1
          $rc = $LASTEXITCODE
          Write-Host "Output: $output"
          Write-Host "Exit code: $rc"
          if ($rc -ne 0) {
            Write-Error "Sidecar --version exited with code $rc (expected 0). The frozen binary is broken."; exit 1
          }
          if (-not ($output -match 'voice-typer|VoiceTyper|voice_typer')) {
            Write-Error "Sidecar --version output did not contain the project name. Output: $output"; exit 1
          }
          Write-Host "Smoke test PASSED: sidecar --version exited 0 with project name in output."

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: tauri-windows-installer
          path: ${{ steps.artifacts.outputs.nsis_path }}
          if-no-files-found: error

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Tauri-MSI
          path: ${{ steps.artifacts.outputs.msi_path }}
          if-no-files-found: warn

      - name: Upload sidecar + prewarm + native listener
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Tauri-Sidecar-Binaries
          path: |
            src-tauri/bin/python-sidecar-x86_64-pc-windows-msvc.exe
            src-tauri/resources/prewarm-x86_64-pc-windows-msvc.exe
            src-tauri/resources/native/windows-key-listener.exe
          if-no-files-found: error

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksums = @()
          foreach ($p in @(
                "${{ steps.artifacts.outputs.nsis_path }}",
                "${{ steps.artifacts.outputs.msi_path }}",
                "src-tauri/bin/python-sidecar-x86_64-pc-windows-msvc.exe",
                "src-tauri/resources/prewarm-x86_64-pc-windows-msvc.exe",
                "src-tauri/resources/native/windows-key-listener.exe"
          )) {
            if (Test-Path $p) {
              $hash = (Get-FileHash -Path $p -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path -Leaf $p
              $checksums += "$hash  $name"
            }
          }
          $checksums | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: VoiceTyper-Tauri-SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: error

      - name: Attest build provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.nsis_path }}
            ${{ steps.artifacts.outputs.msi_path }}
