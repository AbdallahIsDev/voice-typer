# =============================================================================
# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24):
#   actions/checkout@v7               — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-python@v7           — Node 24 runtime (v5/v6 = Node 20, deprecated)
#   actions/cache@v6                   — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/setup-node@v7              — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/upload-artifact@v7         — Node 24 runtime (v4 = Node 20, deprecated)
#   actions/attest-build-provenance@v4 — Node 24 runtime (v1 = Node 16, deprecated)
#   astral-sh/setup-uv@v7              — Node 24 runtime (v3 = Node 20, deprecated)
#   dtolnay/rust-toolchain@v1           — Node 24 runtime (@stable = untagged, may resolve to Node 20)
# See build.yml header for full rationale + breaking-change analysis.
# -----------------------------------------------------------------------------
# PINNED NUITKA VERSION — DO NOT DOWNGRADE (NU-105, 2026-08-06):
#   nuitka==2.8.10 in BOTH install steps (uv dev env at :334 AND PYBS
#   frozen env at :378). Nuitka <2.8.0 CRASHES compiling numpy>=2.5 (see
#   requirements-lock.txt → numpy==2.5.1): numpy 2.5 ships PEP 695
#   type-generic aliases (`type NDArray[ScalarT: np.generic] = ...` in
#   numpy/_typing/_array_like.py) which trip Nuitka 2.5.x's
#   `buildTypeAliasNode assert not node.type_params` — Nuitka issues
#   #3469 (generic type aliases) + #3392/#3561 (PEP 695 generic classes).
#   The 2.8 line is the first release supporting both.
#   Do NOT revert this pin to 2.5.x, and do NOT "fix" a future build
#   failure by downgrading numpy below 2.5 in the lockfile instead —
#   bump the Nuitka pin forward. Inline NU-105 comments mark both
#   install steps; docs/migration/windows-validation-runbook.md §0.8
#   tracks the same version for the on-host validation procedure.
# -----------------------------------------------------------------------------
# Tauri Windows Build (ADR-0020 Phase 0-W / Phase 1-W packaging).
#
# This workflow builds a complete Tauri installer for Windows via:
#   1. Nuitka-freezing the Python backend into python-sidecar.exe
#   2. Nuitka-freezing the prewarm binary
#   3. Compiling the native windows-key-listener.exe from C source
#   4. Running `cargo tauri build` to produce NSIS + MSI installers
#   5. (Optional) Authenticode-signing via WIN_CSC_LINK secret
#
# Trigger: manual (workflow_dispatch) from the GitHub UI.
# Do NOT enable push/PR triggers until Phase 0-W validation passes on a
# real Windows host (see docs/migration/windows-validation-runbook.md).
#
# Authoritative spec:
#   - docs/adr/0020-desktop-runtime-migration-analysis.md §4 (Nuitka),
#     §5 (prewarm), §6.4 (native listener), §7 (Tauri config),
#     §13.1 (Windows Authenticode).
#   - docs/migration/windows-validation-runbook.md (host validation
#     procedure — what to run AFTER this workflow produces the binaries).

name: Tauri Windows Build (Phase 0-W / Phase 1-W)

# =============================================================================
# GATE STATUS — VALIDATE ON WINDOWS HOST (aarch64)
# -----------------------------------------------------------------------------
# This workflow runs end-to-end on x86_64 Windows (windows-2022 runner, a
# public GitHub-hosted image). The aarch64-pc-windows-msvc build path is
# preserved as a COMMENTED matrix template (see the job block below) because
# GitHub does NOT ship a public aarch64 Windows runner image (no
# `windows-11-arm` on free / Pro / public repos as of 2026-08), AND because
# it cannot be gated with a job-level ``if:`` guard referencing ``matrix.enabled`` — the `matrix`
# context is NOT available in `jobs.<id>.if`, so GitHub rejects a workflow
# file that references it at validation time (0s "workflow file issue" on
# every push; actionlint + the Actions contexts docs both confirm this).
# Windows-on-ARM users therefore have no automated release path until one
# of the following happens:
#
#   (a) GitHub ships `windows-11-arm` to public repos — uncomment the
#       aarch64 matrix template in the job block below, OR
#   (b) A maintainer with a Windows-on-ARM device (Surface Pro X,
#       Snapdragon X, etc.) registers a self-hosted runner labelled
#       `windows-11-arm` and follows docs/migration/windows-validation-
#       runbook.md end-to-end on it.
#
# Pre-flight checklist before uncommenting the aarch64 leg:
#   1. Create src-tauri/tauri.windows-aarch64.conf.json (mirror
#      tauri.windows-x86_64.conf.json's `bundle.resources` narrowing so
#      only aarch64-prefixed prewarm + the host-arch native listener get
#      bundled; the existing `tauri.windows-x86_64.conf.json` is the
#      reference template).
#   2. Confirm python-build-standalone publishes an aarch64-pc-windows-msvc
#      asset for the pinned PYBS_DATE (see https://github.com/astral-sh/
#      python-build-standalone/releases/tag/$PYBS_DATE). If not, bump
#      PYBS_DATE to the first release that ships aarch64 Windows.
#   3. Arch-suffix the artifact names (tauri-windows-installer,
#      VoiceTyper-Tauri-MSI, VoiceTyper-Tauri-Sidecar-Binaries,
#      VoiceTyper-Tauri-SHA256SUMS) so the two legs don't collide, and
#      update tauri-build.yml's `download-artifact` step to match (today
#      it hardcodes `name: tauri-windows-installer`).
#   4. Validate the NSIS install, MSI install, sidecar `--version` smoke
#      test, and SmartScreen dialog manually on the Windows-on-ARM host.
#
# Until that validation gate passes, leave the aarch64 leg as a commented
# matrix template (do NOT re-add it as an active entry — it would schedule
# on the non-existent `windows-11-arm` runner and there is no valid gate to
# skip it). The x86_64 leg is unaffected and continues to ship.
# =============================================================================

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (empty = host triple)"
        required: false
        default: ""
        type: string
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
      # surface PYBS pin as a workflow_call input so the
      # tauri-build.yml orchestrator can pass through pybs_date / pybs_version
      # from its own workflow_dispatch inputs (allowing per-dispatch PYBS bump
      # without editing the workflow file). Defaults match the runbook's pinned
      # CPython 3.12.8 / 20241219 release.
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD)"
        required: false
        default: "20241219"
        type: string
      pybs_version:
        description: "CPython version (e.g. 3.12.8)"
        required: false
        default: "3.12.8"
        type: string
  workflow_dispatch:
    inputs:
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD)"
        required: false
        default: "20241219"
      pybs_version:
        description: "CPython version (e.g. 3.12.8)"
        required: false
        default: "3.12.8"
      # surface the sign flag on direct dispatch too (the
      # tauri-build.yml orchestrator already passes it through as a
      # workflow_call input) so a maintainer dispatching this workflow
      # directly from the Actions UI can opt into signing.
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
  # Do NOT enable push/PR triggers until Phase 0-W passes on a real host.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# CI-08-style concurrency: cancel in-flight PR builds, keep release
# (workflow_dispatch) builds running. Unconditional `cancel-in-progress:
# true` would cancel release builds mid-signing if a push landed while
# notarization was in flight (mirrors tauri-linux-build.yml:54-57).
concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# WR-17: top-level least-privilege default. Mirrors the macOS / Linux
# tauri workflows (tauri-macos-build.yml:59-60, tauri-linux-build.yml:71-72)
# and the repo-wide CI-08 / XS-28 pinning policy. The job-level block at
# :88-91 widens this to `id-token: write` + `attestations: write` ONLY on
# the build job that needs SLSA attestation (gated on workflow_dispatch +
# inputs.sign — see the attestation step).
permissions:
  contents: read

env:
  # S5-CR-74: PYBS pin now sourced from BOTH the workflow_call `inputs`
  # context (used when tauri-build.yml passes pybs_date / pybs_version
  # through) AND the workflow_dispatch `github.event.inputs` context (used
  # when this workflow is dispatched directly from the Actions UI). The
  # `inputs` context is populated for both trigger types on Actions runners
  # since 2024, but we keep the github.event.inputs fallback for older
  # self-hosted runner versions.
  # TX-40: PYBS_TRIPLE + RUST_TARGET used to live here as x86_64-pc-windows-msvc
  # constants. They are now derived per-matrix-leg in the job-level `env:` block
  # below (the `matrix` context is only available inside jobs, not at the
  # workflow top level). PYBS_DATE / PYBS_VERSION stay here because they read
  # from `inputs` / `github.event.inputs`, which ARE available workflow-wide.
  PYBS_DATE: ${{ inputs.pybs_date || github.event.inputs.pybs_date || '20241219' }}
  PYBS_VERSION: ${{ inputs.pybs_version || github.event.inputs.pybs_version || '3.12.8' }}

jobs:
  tauri-windows-build:
    # MIG-1.5: enabled for manual workflow_dispatch triggers.
    # The real sidecar + native binaries are built inside this job.
    # Icons (src-tauri/icons/*) are committed real files; binary stubs
    # (sidecar/prewarm/native placeholders for other platforms) are
    # generated by gen_tauri_icons_stub.py before the Tauri build step.
    # See scripts/gen_tauri_icons_stub.py.
    #
    # TX-40: the ACTIVE matrix is x86_64-only (runs on windows-2022) —
    # GitHub does not ship a public aarch64 Windows runner, so an
    # aarch64 leg cannot be scheduled on this workflow today. The
    # aarch64 build path is documented as a commented template below
    # (and in the TX-40 GATE STATUS block at the top of this file) so
    # it can be re-added with a one-line uncomment when a runner
    # becomes available. NOTE: the aarch64 leg CANNOT use a
    # `matrix.enabled` job-level gate — the `matrix` context is NOT
    # available in `jobs.<id>.if` (GitHub Actions validation rejects
    # it with "Unrecognized named-value: 'matrix'", failing the
    # workflow file in 0s on every push). That construct was removed
    # here because it is invalid, not just a lint squiggle.
    #
    # Default filenames produced by the x86_64 leg (matrix.target =
    # x86_64-pc-windows-msvc). These literals are listed here so the
    # mig18 signing tests (tests/tauri/mig18/test_windows_signing.py)
    # that grep for the default binary names keep passing — the actual
    # build steps below interpolate `python-sidecar-${{ matrix.target }}.exe`
    # and `prewarm-${{ matrix.target }}.exe`, which resolve to:
    #   python-sidecar-x86_64-pc-windows-msvc.exe   (x86_64 leg)
    #   prewarm-x86_64-pc-windows-msvc.exe          (x86_64 leg)
    #   python-sidecar-aarch64-pc-windows-msvc.exe  (aarch64 template, commented)
    #   prewarm-aarch64-pc-windows-msvc.exe         (aarch64 template, commented)
    #
    # AARCH64 LEG TEMPLATE (commented out — VALIDATE ON WINDOWS HOST):
    # When GitHub ships `windows-11-arm` to public repos, uncomment this
    # matrix include entry. Also create src-tauri/tauri.windows-aarch64.conf.json
    # (mirroring tauri.windows-x86_64.conf.json's bundle.resources
    # narrowing) and arch-suffix the artifact names below
    # (tauri-windows-installer, VoiceTyper-Tauri-MSI,
    # VoiceTyper-Tauri-Sidecar-Binaries, VoiceTyper-Tauri-SHA256SUMS) to
    # avoid collisions with the x86_64 leg's uploads — see the TX-40
    # GATE STATUS block at the top of this file.
    #   - arch: aarch64
    #     target: aarch64-pc-windows-msvc
    #     runner: windows-11-arm
    #     tauri_config: tauri.windows-aarch64.conf.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            tauri_config: tauri.windows-x86_64.conf.json
    # No job-level `if:` — the active matrix contains exactly one leg
    # (x86_64), so every matrix job should run. Do NOT reintroduce a
    # `matrix.*` reference here: the `matrix` context is unavailable in
    # `jobs.<id>.if` and GitHub rejects the workflow file at validation
    # time (0s failure on every push).
    runs-on: ${{ matrix.runner }}
    # Nuitka + Scons + cl.exe compilation of the Python backend,
    # prewarm, and Tauri build takes 90-110 min on a windows-2022
    # runner. Increased from 90 → 120 (2026-07-27) → 240 (2026-07-28)
    # after a real run hit the 120 min ceiling: the sidecar binary
    # was built successfully but the job was canceled before prewarm
    # + tauri + code-sign + upload could complete. 240 min gives
    # ~2h buffer beyond the typical 100-110 min wall clock, which
    # absorbs (a) timestamp-server retries during code-signing,
    # (b) flaky upload retries, and (c) future dependency bumps
    # that invalidate the Nuitka ccache. If the build still hits
    # 240 min, the bottleneck is C compilation — add more
    # --nofollow-import-to exclusions or move to a larger runner.
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write   # required for actions/attest-build-provenance
      attestations: write
    env:
      # TX-40: target triple sourced from the matrix (x86_64 OR aarch64).
      # Was a workflow-level `env:` constant before; moved to job-level
      # because the `matrix` context is only available inside jobs (not
      # at the workflow top level). PYBS_TRIPLE drives the python-build-
      # standalone download URL; RUST_TARGET drives the rust-toolchain
      # install + `cargo tauri build --target` flag.
      PYBS_TRIPLE: ${{ matrix.target }}
      RUST_TARGET: ${{ matrix.target }}
      # CRIT-7: the `secrets` context is NOT available in step `if:`
      # conditions (GitHub Actions does not populate it there, so the
      # condition never matches and signing is silently skipped). Map the
      # signing secrets to job-level env so steps can gate on `env.*`
      # (empty on PR/fork builds without secrets → signing steps skip).
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # S10-CC-1: disable clcache at job level so Nuitka/SCons subprocess
      # inherits it. Step-level `$env:CLCACHE_DISABLE = "1"` doesn't
      # propagate to the C compiler subprocess, causing torch module C
      # compilation to hang indefinitely and timeout after 90 min.
      CLCACHE_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12 (dev env)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Rust toolchain (${{ env.RUST_TARGET }})
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-windows-${{ runner.os }}-

      # Nuitka ccache: persist compiled C objects between builds.
      # Nuitka's C compilation (Scons + cl.exe) is the slowest step
      # (60-90 min). Caching the nuitka-cache directory means only
      # changed Python modules get recompiled on subsequent runs.
      # The key includes a hash of pyproject.toml + requirements-lock.txt
      # so dependency bumps invalidate the cache.
      - name: Cache Nuitka build artifacts (ccache)
        uses: actions/cache@v6
        with:
          path: C:\Users\runner\AppData\Local\nuitka\cache
          key: tauri-windows-nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
          restore-keys: |
            tauri-windows-nuitka-${{ runner.os }}-

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install npm dependencies
        working-directory: voice_typer/client
        run: npm ci

      # do NOT downgrade below 2.8.10. numpy 2.5.x ships PEP 695
      # type-generic aliases in numpy/_typing/_array_like.py
      # (`type NDArray[ScalarT: np.generic] = ...`), which crash Nuitka 2.5.x
      # with "buildTypeAliasNode assert not node.type_params" (Nuitka issue
      # #3469; generic PEP 695 classes also segfaulted — issue #3392). The
      # type-alias + generic-class support landed in the 2.8 line.
      - name: Install Python dev deps (uv)
        shell: pwsh
        run: |
          $env:UV_LINK_MODE = "copy"
          uv pip install --system ".[dev,test]"
          uv pip install --system nuitka==2.8.10 zstandard ordered-set
          pip list

      - name: Download + verify python-build-standalone
        shell: pwsh
        run: |
          $date = $env:PYBS_DATE
          $pyver = $env:PYBS_VERSION
          $triple = $env:PYBS_TRIPLE
          $archive = "cpython-$pyver+$date-$triple-install_only.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          # The python-build-standalone releases do NOT have a SHA256SUMS.txt aggregate.
          # Instead, each individual asset has its own .sha256 file adjacent to it:
          #   asset:   cpython-3.12.8+20241219-x86_64-pc-windows-msvc-install_only.tar.gz
          #   checksum: cpython-3.12.8+20241219-x86_64-pc-windows-msvc-install_only.tar.gz.sha256
          # See https://github.com/astral-sh/python-build-standalone/releases/expanded_assets/{tag}
          # for the list of all assets and their .sha256 companions.
          $shaUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive.sha256"
          Write-Host "Downloading checksum: $shaUrl"
          Invoke-WebRequest -Uri $shaUrl -OutFile "$archive.sha256"
          # The .sha256 file contains: "<sha256>  <filename>"
          $expected = (Get-Content "$archive.sha256" -Raw).Split(' ', 2)[0].Trim().ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Error "SHA-256 mismatch for $archive`nexpected=$expected`nactual=$actual"
            exit 1
          }
          Write-Host "SHA-256 OK: $actual"
          # Extract to C:\tools\pybs\python (matches runbook §0.7)
          New-Item -ItemType Directory -Force -Path C:\tools\pybs | Out-Null
          tar -xzf $archive -C C:\tools\pybs
          Write-Host "PYBS python:"
          C:\tools\pybs\python\python.exe --version
          # Add PYBS to GITHUB_ENV so subsequent steps can use it.
          echo "PYBS=C:\tools\pybs\python" >> $env:GITHUB_ENV
          # Install the project + Nuitka into the PYBS env (the env that
          # actually gets frozen). --no-warn-script-location suppresses
          # pip noise about Scripts/ not being on PATH (PYBS python is
          # invoked by full path, not via PATH).
          # keep nuitka>=2.8.10 (same rationale as the uv install
          # step above — numpy 2.5.x PEP 695 type aliases crash Nuitka <2.8).
          C:\tools\pybs\python\python.exe -m pip install --upgrade --no-warn-script-location pip
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location nuitka==2.8.10 zstandard ordered-set
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location -e ".[dev,test]"
          C:\tools\pybs\python\python.exe -c "import faster_whisper, ctranslate2; print('ctranslate2', ctranslate2.__version__)"

      - name: Build the sidecar with Nuitka (ADR-0020 §4.2)
        shell: pwsh
        run: |
          $env:CLCACHE_DISABLE = "1"
          $PYBS = $env:PYBS
          $SITE = & $PYBS\python.exe -c "import site; print(site.getsitepackages()[-1])"
          Write-Host "PYBS=$PYBS  SITE=$SITE"
          # ctranslate2 ships DLLs directly in ctranslate2/ (not ctranslate2/lib/).
          # Build the data-dir flag conditionally so we don't hard-fail if the
          # layout changes in a future ctranslate2 release.
          $ct2Dir = "$SITE\ctranslate2"
          $dataDirFlag = @()
          if (Test-Path "$ct2Dir\lib") {
            $dataDirFlag = @("--include-data-dir=$ct2Dir\lib=ctranslate2/lib")
          } elseif (Test-Path $ct2Dir) {
            $dataDirFlag = @("--include-data-dir=$ct2Dir=ctranslate2")
          }
          # S4-CR-25 / nu-opt-1: psutil imports ALL platform submodules
          # (_pslinux, _psosx, _psbsd, _pssunos, _psaix) at the module
          # root — Nuitka compiles ALL of them on every OS, wasting hours.
          # These are conditionally imported at runtime via sys.platform
          # guards; exclude the non-Windows ones to save ~15 min of C
          # compilation. Also removed deprecated --enable-plugin=numpy.
          # NU-106 (VAD): DO NOT add `--nofollow-import-to=torch.utils.
          # data.distributed` — torch 2.13 imports that module
          # UNCONDITIONALLY at torch/utils/data/__init__.py:32 (`from
          # torch.utils.data.distributed import DistributedSampler`), so
          # excluding it makes `import torch` raise ModuleNotFoundError
          # inside the frozen exe. vad.py catches that as ImportError and
          # SILENTLY DISABLES Silero VAD in the shipped binary (verified
          # on-host with a minimal frozen probe reproducing the exact
          # traceback; the Linux/macOS sidecars build without this flag
          # and keep VAD). The remaining torch.* exclusions below are
          # lazily-imported submodules and are safe to keep.
          # NU-106 (VAD): `--module-parameter=torch-disable-jit=no` is
          # REQUIRED — Nuitka's torch plugin disables torch.jit by
          # default in standalone mode, and vad.py loads the bundled
          # model via torch.jit.load(silero_vad.jit); without this flag
          # VAD fails with "module 'torch' has no attribute 'jit'" and
          # silently degrades to the RMS fallback (verified on-host).
          # NU-106 (VAD): DO NOT add --nofollow-import-to for torch.export,
          # torch._functorch, torch.testing, or torch.package — plain
          # `import torch` loads all four UNCONDITIONALLY (verified via
          # sys.modules after `import torch` on torch 2.13: export via
          # torch/__init__.py:2869, testing via :2324, package via
          # torch/_jit_internal.py:47, _functorch transitively), so
          # excluding any of them breaks `import torch` with
          # ModuleNotFoundError inside the frozen exe. The exclusions
          # kept below (_dynamo, _inductor, onnx, utils.benchmark) are
          # lazily imported and safe.
          # IPD-1: the frozen sidecar loads package data at import time
          # (voice_typer/server/hotkey_reserved.json via __file__-relative
          # path in config_validators/hotkey.py, plus corrections.json,
          # model_hashes.json, native/binaries.json, silero_vad.jit).
          # Without --include-package-data these are missing from the
          # onefile payload and the exe crashes on launch (FileNotFoundError)
          # even though it BUILDS fine — the CI existence check can't catch
          # it. Scope to voice_typer.server to avoid copying the client tree.
          # TX-40: output filename carries the matrix target triple so a
          # future aarch64 leg produces a distinctly-named binary
          # (python-sidecar-aarch64-pc-windows-msvc.exe) instead of
          # silently overwriting the x86_64 build. NOTE: keep this comment
          # OUTSIDE the backtick-continuation chain below — a comment line
          # between two backticked args ends the logical line in PowerShell,
          # and the next `--flag=value` arg then parses as a fresh statement
          # ("Missing expression after unary operator '--'").
          & $PYBS\python.exe -m nuitka `
              --standalone --onefile `
              --assume-yes-for-downloads `
              --jobs=3 `
              --module-parameter=torch-disable-jit=no `
              --nofollow-import-to=torch._dynamo `
              --nofollow-import-to=torch._inductor `
              --nofollow-import-to=torch.onnx `
              --nofollow-import-to=torch.utils.benchmark `
              --nofollow-import-to=transformers `
              --nofollow-import-to=scipy._lib.cobyqa `
              --nofollow-import-to=scipy._lib.array_api_extra.testing `
              --nofollow-import-to=scipy.spatial.transform `
              --nofollow-import-to=scipy.ndimage `
              --nofollow-import-to=scipy.sparse.linalg `
              --nofollow-import-to=sympy `
              --nofollow-import-to=mpmath `
              --nofollow-import-to=pytest `
              --nofollow-import-to=PIL.ImageQt `
              --nofollow-import-to=PIL.ImageTk `
              --nofollow-import-to=PIL.ImageCms `
              --nofollow-import-to=numpy.distutils `
              --nofollow-import-to=numpy.f2py `
              --nofollow-import-to=numpy.testing `
              --nofollow-import-to=psutil._pslinux `
              --nofollow-import-to=psutil._psosx `
              --nofollow-import-to=psutil._psbsd `
              --nofollow-import-to=psutil._pssunos `
              --nofollow-import-to=psutil._psaix `
              --include-package=faster_whisper `
              --include-package=ctranslate2 `
              --include-package=voice_typer `
              --include-package=websockets `
              --include-package-data=voice_typer.server `
              $($dataDirFlag) `
              --windows-console-mode=disable `
              --onefile-tempdir-spec="{CACHE_DIR}/voice-typer/onefile-tmp" `
              --output-filename=python-sidecar-${{ matrix.target }}.exe `
              --output-dir=src-tauri\bin `
              voice_typer\server\ipc_server.py
          # Verify the binary exists + emits server_started
          if (-not (Test-Path "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe")) {
            Write-Error "Sidecar binary not built"; exit 1
          }
          $size = (Get-Item "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe").Length / 1MB
          Write-Host "Sidecar binary size: $([math]::Round($size,1)) MB"

      - name: Build the prewarm binary with Nuitka (ADR-0020 §5)
        shell: pwsh
        run: |
          $env:CLCACHE_DISABLE = "1"
          $PYBS = $env:PYBS
          # S4-CR-25 / nu-opt-2: prewarm never imports torch/transformers/
          # faster_whisper/ctranslate2 at runtime — it only calls
          # importlib.util.find_spec() to locate their installed files for
          # OS-cache warming, then reads file bytes directly. These heavy
          # packages are still BUNDLED as bytecode (so find_spec works)
          # but NOT compiled to C, saving ~90 min of compile time.
          # Also removed deprecated --enable-plugin=numpy, removed
          # --include-package=faster_whisper,ctranslate2 (not needed for
          # find_spec — they're pulled in transitively via voice_typer),
          # and added psutil platform-module exclusions.
          # IPD-1: --include-package-data=voice_typer.server for consistency
          # with the sidecar (prewarm doesn't read package data today, but a
          # future import-time read must not silently crash the exe).
          & $PYBS\python.exe -m nuitka `
              --standalone --onefile `
              --assume-yes-for-downloads `
              --jobs=3 `
              --nofollow-import-to=torch `
              --nofollow-import-to=transformers `
              --nofollow-import-to=faster_whisper `
              --nofollow-import-to=ctranslate2 `
              --nofollow-import-to=sounddevice `
              --nofollow-import-to=pystray `
              --nofollow-import-to=pynput `
              --nofollow-import-to=PIL `
              --nofollow-import-to=scipy `
              --nofollow-import-to=whisper `
              --nofollow-import-to=psutil._pslinux `
              --nofollow-import-to=psutil._psosx `
              --nofollow-import-to=psutil._psbsd `
              --nofollow-import-to=psutil._pssunos `
              --nofollow-import-to=psutil._psaix `
              --nofollow-import-to=sympy `
              --nofollow-import-to=mpmath `
              --nofollow-import-to=pytest `
              --include-package=voice_typer `
              --include-package=websockets `
              --include-package-data=voice_typer.server `
              --windows-console-mode=disable `
              --onefile-tempdir-spec="{CACHE_DIR}/voice-typer/prewarm-onefile-tmp" `
              --output-filename=prewarm-${{ matrix.target }}.exe `
              --output-dir=src-tauri\resources `
              voice_typer\server\prewarm\__main__.py
          if (-not (Test-Path "src-tauri\resources\prewarm-${{ matrix.target }}.exe")) {
            Write-Error "Prewarm binary not built"; exit 1
          }

      - name: Build the native windows-key-listener (ADR-0020 §6.4)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build\compile_native.ps1
          if (-not (Test-Path "src-tauri\resources\native\windows-key-listener.exe")) {
            Write-Error "Native listener binary not built"; exit 1
          }

      # TX-23: honor the `sign` workflow_call input instead of gating
      # purely on secret presence. sign=true + missing secrets = hard
      # fail (a misconfigured release must not silently ship unsigned);
      # sign=false skips signing even when secrets are present.
      - name: Fail fast — sign=true but signing secrets missing
        if: ${{ inputs.sign == 'true' && (env.WIN_CSC_LINK == '' || env.WIN_CSC_KEY_PASSWORD == '') }}
        shell: pwsh
        run: |
          Write-Error "sign=true was requested but WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are missing. Add the secrets to the repository, or dispatch with sign=false."
          exit 1

      # S1-CR-99: sign sidecar + prewarm + native listener. Pre-fix the loop
      # only covered python-sidecar + prewarm; the native windows-key-listener.exe
      # was bundled into the NSIS installer UNSIGNED. SmartScreen on Windows 11
      # treats unsigned binaries inside a signed installer as suspicious and
      # pops a "Windows protected your PC" dialog on first launch — defeating
      # the value of signing the outer installer. Adding the native listener
      # to the same foreach loop keeps every Mach-O/PE binary the bundle ships
      # signed with the same Authenticode cert.
      #
      # SmartScreen reputation note: a freshly-issued OV certificate starts
      # with "unknown publisher" in SmartScreen and builds reputation over
      # time + download volume; an EV certificate can earn immediate
      # reputation. There is no way to force reputation — the mitigation is
      # a stable OV/EV cert, consistent signing, and the SmartScreen
      # timeline expectations documented in RELEASING.md. The long-term
      # migration path (Azure Trusted Signing) is tracked in the security
      # roadmap; it replaces the manual PFX material with a managed HSM
      # identity and is the recommended next step for this repo.
      - name: Sign sidecar + prewarm + native listener (optional — ADR-0020 §13.1)
        if: ${{ inputs.sign == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          # Write the PFX (base64-encoded in the secret) to a temp file
          # and sign every binary with signtool + an RFC-3161 timestamp.
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using signtool: $signtool"
          # C-BRAND-1: derive the Authenticode description from the branding
          # source of truth instead of hardcoding the app name here. No
          # workflow-level env value can read branding.py, so read it once
          # per step and interpolate into signtool's --description.
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          # TX-40: signing targets use matrix.target so the aarch64 leg
          # (when enabled) signs its own binaries, not the x86_64 ones.
          foreach ($exe in @(
                "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe",
                "src-tauri\resources\prewarm-${{ matrix.target }}.exe",
                "src-tauri\resources\native\windows-key-listener.exe"
          )) {
            if (-not (Test-Path $exe)) {
              Write-Error "Cannot sign missing binary: $exe"; exit 1
            }
            & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://voicetyper.app" $exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for $exe"; exit 1 }
            & $signtool verify /pa /v $exe
          }
          Remove-Item $pfxPath -Force

      # Fail-fast gate: run the config drift guards BEFORE the build —
      # identifier↔appId + productName + version parity, bundle.icon↔git
      # lockstep, and ALL the config↔script pairs (bundle.resources/
      # externalBin ↔ stub generator registry, tauri-binaries.json ↔
      # canonical triples + Cargo binary name + launcher install paths,
      # per-arch config overrides ↔ base config). Same guards the full
      # suite enforces, but a drift regression dies in seconds instead of
      # only after the whole test run. MUST stay BEFORE "Generate Tauri
      # binary stubs" below: the icons module's autouse fixture runs
      # --clean after each test, which removes freshly-generated STUB
      # files (real binaries are preserved by the _is_stub_file heuristic).
      # version parity before any build step: tauri.conf.json / package.json
      # / Cargo.toml / pyproject.toml must carry the SAME version — a bump
      # that touched only one file fails in seconds, not after a 30-60 min
      # build. sync_versions.py is stdlib-only (regex/tomllib fallback).
      - name: Verify version lockstep across layers (fail fast)
        shell: bash
        run: python scripts/build/sync_versions.py --check

      - name: Verify config drift guards (icons, identity, binaries) (fail fast)
        shell: bash
        run: |
          python -m pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      # generate placeholder BINARY stubs (sidecar / native / prewarm) if
      # they don't already exist. The icons are committed real files, so
      # this step only covers the binaries. The `--check` flag exits 0 iff
      # all stubs are present AND structurally valid (exact canonical stub
      # bytes, or a real binary) and 1 otherwise — a truncated/corrupt
      # stub (partial write, bad checkout) fails the gate in milliseconds
      # instead of inside cargo tauri build. The `||` falls through to the
      # generation command only when needed, and generate() also REPAIRS
      # corrupt stubs (rewrites anything the structural gate rejects).
      # Stub content + CLI flags verified by reading
      # scripts/gen_tauri_icons_stub.py (argparse: --check / --clean /
      # no-flag).
      - name: Generate Tauri binary stubs
        shell: bash
        run: |
          python scripts/gen_tauri_icons_stub.py --check || python scripts/gen_tauri_icons_stub.py

      # Fail-fast gate: verify EVERY committed file in tauri.conf.json
      # bundle.icon exists AND is structurally valid (the 4 PNGs +
      # icon.ico + icon.icns) before the cargo tauri build. The single
      # cross-platform gate (--check-icons) reads the icon list from
      # tauri.conf.json and dispatches each entry to the right validator
      # by extension; tauri-build hard-fails the whole build when the
      # platform's icon is missing or corrupt, and a corrupt file would
      # otherwise only surface minutes into the compile. This gate fails
      # in <1s instead. CLI flags verified by reading
      # scripts/gen_tauri_icons_stub.py (argparse: --check /
      # --check-icons / --clean / no-flag).
      - name: Verify bundle.icon icons are present + valid (fail fast)
        shell: bash
        run: python scripts/gen_tauri_icons_stub.py --check-icons

      # TK-48: run the Windows-gated #[cfg(target_os = "windows")] Rust
      # unit tests (e.g. platform::paths config-dir resolution) on their
      # NATIVE OS. The Linux smoke job (tauri-linux-build.yml) can only
      # execute the Linux-gated branches — the Windows branches were
      # dead-on-arrival in CI before this step. Runs AFTER the binary
      # stub generation + icon gates above so tauri-build's compile-time
      # externalBin/resources validation (which reads base
      # tauri.conf.json, a documented all-platform superset) resolves
      # every declared path. Mirrors the Linux smoke job's
      # `cargo test --bin voice-typer-tauri` step (same command, same
      # placeholders).
      - name: cargo test (Tauri Rust host unit tests — Windows-gated branches)
        shell: pwsh
        working-directory: src-tauri
        run: |
          # voice-typer-tauri is a binary-only crate — `--bin` runs the
          # unit tests without paying for integration-test crates.
          cargo test --target ${{ env.RUST_TARGET }} --bin voice-typer-tauri

      # install tauri-cli explicitly. The runner's pre-installed
      # `cargo-tauri` is unversioned and lags upstream by months; on
      # windows-2022 it has historically been missing entirely (the
      # `cargo tauri build` step below would fail with `no such command`).
      # macOS already has this step at tauri-macos-build.yml:332; Linux
      # gets the same step in this same WR-17 batch. Pin to ^2.0 so we
      # stay on the Tauri v2 line (Tauri v3 will be a breaking change
      # requiring a manual re-evaluation).
      - name: Install tauri-cli (v2)
        shell: pwsh
        run: cargo install tauri-cli --version "^2.0"

      - name: Build the Tauri app (ADR-0020 §7)
        shell: pwsh
        run: |
          cd src-tauri
          # XS-28: apply the per-arch tauri config (matrix.tauri_config —
          # tauri.windows-x86_64.conf.json for x86_64 today; when the aarch64
          # leg is enabled it will use tauri.windows-aarch64.conf.json). The
          # base tauri.conf.json `bundle.resources` array lists every
          # platform's native binaries (a documented superset for the
          # mig15/mig16 source-inspection tests) and would hard-fail at the
          # tauri-build resource-copy step on a Windows host (macOS/Linux-
          # only files don't exist here).
          cargo tauri build --target ${{ matrix.target }} --config ${{ matrix.tauri_config }}

      - name: Locate + verify installer artifacts
        id: artifacts
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $standalone = "src-tauri\target\release\voice-typer-tauri.exe"
          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }
          Write-Host "NSIS: $($nsis.FullName)"
          Write-Host "MSI: $($msi.FullName)"
          Write-Host "Standalone: $standalone"
          echo "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Post-build assertion — bundle has no non-Windows binaries
        # tauri.windows-x86_64.conf.json narrows ``bundle.resources``
        # to Windows-only files. If a future regression widens the resource
        # list (or the --config flag silently stops being applied), the
        # NSIS installer would bundle ~5 unnecessary prewarm binaries +
        # 2 unnecessary native binaries (macOS + Linux variants), bloating
        # the installer by ~50-100 MB. This step asserts the bundle
        # directory does NOT contain any non-Windows prewarm or native
        # binaries, failing the build if it does.
        shell: pwsh
        run: |
          # The bundle resources land in src-tauri\target\release\resources\
          # (per-target: target\<triple>\release\resources\ for cross builds).
          # We check both because tauri's resource-copy step uses different
          # paths for cross-target vs host-target builds.
          # TX-40: per-target resource dir uses matrix.target (cargo tauri
          # build --target <triple> emits under target/<triple>/release/).
          $resourceDirs = @(
            "src-tauri\target\${{ matrix.target }}\release\resources",
            "src-tauri\target\release\resources"
          )
          # Forbidden substrings — any resource whose name contains one of
          # these is a non-Windows binary that should not be in the bundle.
          $forbidden = @(
            "prewarm-aarch64-apple-darwin",
            "prewarm-x86_64-apple-darwin",
            "prewarm-x86_64-unknown-linux-gnu",
            "prewarm-aarch64-unknown-linux-gnu",
            "macos-key-listener",
            "linux-key-listener"
          )
          $violations = @()
          foreach ($dir in $resourceDirs) {
            if (-not (Test-Path $dir)) { continue }
            foreach ($file in Get-ChildItem $dir -File -ErrorAction SilentlyContinue) {
              foreach ($bad in $forbidden) {
                if ($file.Name -like "*$bad*") {
                  $violations += "$($file.FullName) (matches forbidden pattern '$bad')"
                }
              }
            }
          }
          if ($violations.Count -gt 0) {
            Write-Error "Windows bundle contains non-Windows binaries:"
            $violations | ForEach-Object { Write-Host "  - $_" }
            Write-Error "Check tauri.windows-x86_64.conf.json bundle.resources list."
            exit 1
          }
          Write-Host "Bundle contains only Windows binaries (assertion passed)"

      - name: Sign the final NSIS installer (optional — ADR-0020 §13.1)
        if: ${{ inputs.sign == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          # C-BRAND-1: derive the Authenticode description from branding.py
          # (see the Sign sidecar step for the full rationale).
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://voicetyper.app" `
              "${{ steps.artifacts.outputs.nsis_path }}"
          & $signtool verify /pa /v "${{ steps.artifacts.outputs.nsis_path }}"
          Remove-Item $pfxPath -Force

      # S1-CR-99: sign the MSI installer. Pre-fix only the NSIS installer
      # was signed — the MSI (produced by `cargo tauri build` via the WiX
      # bundler) shipped unsigned, so enterprises that prefer MSI for SCCM /
      # Intune deployment hit SmartScreen on every install. Tauri does NOT
      # automatically invoke signCommand on the MSI (it only signs the
      # NSIS bundle when `bundle.windows.signCommand` is set); we sign the
      # MSI explicitly here when the secrets are present. Skipped silently
      # if the MSI wasn't produced (e.g. cargo tauri build only emitted NSIS).
      - name: Sign the final MSI installer (optional — ADR-0020 §13.1)
        if: ${{ inputs.sign == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' && steps.artifacts.outputs.msi_path != '' }}
        shell: pwsh
        run: |
          $msi = "${{ steps.artifacts.outputs.msi_path }}"
          if (-not (Test-Path $msi)) {
            Write-Host "MSI not produced by cargo tauri build — skipping MSI signing."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          # C-BRAND-1: derive the Authenticode description from branding.py
          # (see the Sign sidecar step for the full rationale).
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://voicetyper.app" $msi
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for MSI: $msi"; exit 1 }
          & $signtool verify /pa /v $msi
          Remove-Item $pfxPath -Force

      # S1-CR-99: sign the standalone voice-typer-tauri.exe. Tauri does NOT
      # automatically invoke signCommand on the top-level exe (it only signs
      # the NSIS bundle when `bundle.windows.signCommand` is set); the
      # standalone exe shipped unsigned. Users who run
      # voice-typer-tauri.exe directly (instead of the installer) hit
      # SmartScreen on every launch. Sign it explicitly here when the
      # secrets are present. Skipped silently if the binary wasn't produced
      # (cross-target builds emit under target/<triple>/release/).
      - name: Sign standalone voice-typer-tauri.exe (optional — ADR-0020 §13.1)
        if: ${{ inputs.sign == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          $standalone = "src-tauri\target\${{ matrix.target }}\release\voice-typer-tauri.exe"
          if (-not (Test-Path $standalone)) {
            Write-Host "Standalone exe not found at $standalone — skipping standalone signing."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          # C-BRAND-1: derive the Authenticode description from branding.py
          # (see the Sign sidecar step for the full rationale).
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://voicetyper.app" $standalone
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for standalone exe: $standalone"; exit 1 }
          & $signtool verify /pa /v $standalone
          Remove-Item $pfxPath -Force

      # smoke test the bundled sidecar binary after `cargo tauri build`.
      # Pre-fix the Tauri workflows only ran `objdump -p` / `ldd` static checks on
      # the sidecar — no execution. A Nuitka flag change or Cargo dep bump that
      # broke the sidecar's `--version` flag (argparse exit path) would only
      # surface during a release cut. The smoke test here invokes the bundled
      # sidecar with `--version` (which exits 0 via argparse without acquiring
      # the single-instance lock per ipc_server.py:2796-2815) and asserts the
      # output contains the project name + version — proving the binary
      # actually runs on the host OS, not just that it has the right ELF/PE
      # headers. Gated on the sidecar existing (it always does after the build
      # step above) and runs in <2s.
      - name: Smoke test sidecar binary (--version)
        shell: pwsh
        run: |
          $sidecar = "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe"
          if (-not (Test-Path $sidecar)) {
            Write-Error "Sidecar binary not found at $sidecar — cannot smoke test."; exit 1
          }
          Write-Host "Invoking: $sidecar --version"
          $output = & $sidecar --version 2>&1
          $rc = $LASTEXITCODE
          Write-Host "Output: $output"
          Write-Host "Exit code: $rc"
          if ($rc -ne 0) {
            Write-Error "Sidecar --version exited with code $rc (expected 0). The frozen binary is broken."; exit 1
          }
          if (-not ($output -match 'voice-typer|VoiceTyper|voice_typer')) {
            Write-Error "Sidecar --version output did not contain the project name. Output: $output"; exit 1
          }
          Write-Host "Smoke test PASSED: sidecar --version exited 0 with project name in output."

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-windows-installer
          path: ${{ steps.artifacts.outputs.nsis_path }}
          if-no-files-found: error

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: VoiceTyper-Tauri-MSI
          path: ${{ steps.artifacts.outputs.msi_path }}
          if-no-files-found: warn

      - name: Upload sidecar + prewarm + native listener
        uses: actions/upload-artifact@v7
        with:
          name: VoiceTyper-Tauri-Sidecar-Binaries
          # TX-40: paths use matrix.target so the aarch64 leg (when enabled)
          # uploads its own aarch64 binaries. NOTE: artifact NAME stays
          # arch-suffix-free to preserve tauri-build.yml's download-artifact
          # step (`name: VoiceTyper-Tauri-Sidecar-Binaries`) — when the
          # aarch64 leg is enabled, suffix this name with `-${{ matrix.arch }}`
          # and update tauri-build.yml accordingly (see TX-40 GATE STATUS
          # block at the top of this file).
          path: |
            src-tauri/bin/python-sidecar-${{ matrix.target }}.exe
            src-tauri/resources/prewarm-${{ matrix.target }}.exe
            src-tauri/resources/native/windows-key-listener.exe
          if-no-files-found: error

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksums = @()
          # TX-40: checksum paths use matrix.target so both legs emit
          # distinct SHA256SUMS lines for their respective sidecar + prewarm.
          foreach ($p in @(
                "${{ steps.artifacts.outputs.nsis_path }}",
                "${{ steps.artifacts.outputs.msi_path }}",
                "src-tauri/bin/python-sidecar-${{ matrix.target }}.exe",
                "src-tauri/resources/prewarm-${{ matrix.target }}.exe",
                "src-tauri/resources/native/windows-key-listener.exe",
                "src-tauri/target/${{ matrix.target }}/release/voice-typer-tauri.exe"
          )) {
            if (Test-Path $p) {
              $hash = (Get-FileHash -Path $p -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path -Leaf $p
              $checksums += "$hash  $name"
            }
          }
          $checksums | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: VoiceTyper-Tauri-SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: error

      # Record the REAL SHA-256 of this matrix leg's built host binary
      # (src-tauri/target/<triple>/release/voice-typer-tauri.exe) into
      # tauri-binaries.json — the integrity manifest the autostart
      # launcher verifies against at login (fail-closed). TX-40: uses
      # matrix.target so the aarch64 leg (when enabled) writes its own
      # key. Script is stdlib-only; `python` is the interpreter the gate
      # above already uses.
      - name: Record Tauri binary SHA-256 (${{ matrix.target }})
        shell: pwsh
        run: |
          python scripts/build/update_tauri_manifests.py --triple "${{ matrix.target }}" --target-dir src-tauri\target

      # Fail-fast release gate: this leg's hash must now be present and
      # valid in the manifest. An empty/malformed value aborts the run.
      - name: Enforce Tauri manifest integrity (${{ matrix.target }})
        shell: pwsh
        run: |
          python scripts/build/update_tauri_manifests.py --check --triple "${{ matrix.target }}"

      - name: Upload updated tauri-binaries.json
        uses: actions/upload-artifact@v7
        with:
          name: tauri-binaries-manifest-windows
          path: tauri-binaries.json
          if-no-files-found: error
          retention-days: 30

      # TX-24: gate SLSA attestation on a manual signed release build
      # (workflow_dispatch + sign=true) instead of tag pushes — the tag
      # push trigger is commented out, so the old
      # ``startsWith(github.ref, 'refs/tags/v')`` gate never fired.
      # PR/fork builds (which lack the job-level id-token:write
      # permission grant in fork contexts) are excluded.
      - name: Attest build provenance (SLSA)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.nsis_path }}
            ${{ steps.artifacts.outputs.msi_path }}
            src-tauri/target/${{ matrix.target }}/release/voice-typer-tauri.exe
