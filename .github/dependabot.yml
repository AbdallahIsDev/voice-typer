version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/voice_typer/client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # XS-73: group ALL github-actions updates into a single PR. Without
    # this block, each action (actions/checkout, actions/setup-node,
    # actions/setup-python, github/codeql-action, etc.) gets its own PR
    # — ~10 actions across 9 workflows = PR flooding on Monday mornings.
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      rust-deps:
        patterns:
          - "*"
