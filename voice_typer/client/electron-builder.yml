# BUILD-N07 / BUILD-N16: electron-builder distribution config.
# NEW-DOC-014: added code signing + auto-update config.
appId: com.voicetyper.app
productName: Voice Typer
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
# S1-CR-148 / S5-CR-51: the `publish: github` block was removed because
# it was dead config — per docs/migration/signing-guide.md:431 and
# ADR-0020 §15, NO runtime code consumes it (no `electron-updater`
# integration exists, and the Tauri path uses `tauri-plugin-updater`
# instead, which is gated by `src-tauri/capabilities/migrate-runtime.json`
# — also not granted today). Leaving the block in place misled future
# maintainers into thinking auto-update was wired up. When auto-update
# is actually implemented (either via `electron-updater` on the
# Electron path or `tauri-plugin-updater` on the Tauri path), re-add
# the appropriate publish config at that time.

directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.nvmrc,.python-version,.pre-commit-config.yaml}'

win:
  icon: resources/icon.png
  target:
    - nsis
  signAndEditExecutable: true
  # RW-4 / Wave 3: embed the PyInstaller backend (VoiceTyper.exe) inside the
  # Windows installer. CI's build-windows job runs
  # `pyinstaller --distpath voice_typer/dist` from the repo root, so the
  # PyInstaller output lands at <repo>/voice_typer/dist/. electron-builder
  # runs from voice_typer/client/, so the `from:` path is `../dist`
  # (resolves to <repo>/voice_typer/dist/) — CONSISTENT with the mac: and
  # linux: sections below (Wave 3 path-consistency fix; previously this
  # used `../../dist` which resolved to <repo>/dist/, diverging from the
  # macOS/Linux staging path of <repo>/voice_typer/dist/).
  # The bundle is copied to <resourcesPath>/voice-typer-backend/ at install
  # time. At runtime, index.ts's pythonArgs() checks
  # process.resourcesPath/voice-typer-backend/VoiceTyper.exe first
  # (packaged mode), then falls back to the dev-mode venv at
  # <config_dir>/venv/Scripts/pythonw.exe.
  extraResources:
    - from: ../dist
      to: voice-typer-backend
      filter: ["**/*"]
  # Code signing uses standard electron-builder env vars:
  # WIN_CSC_LINK / CSC_LINK, WIN_CSC_KEY_PASSWORD / CSC_KEY_PASSWORD.
  # These are passed through from GitHub Actions secrets in the
  # build-windows job (see .github/workflows/build.yml). When the secrets
  # are empty (e.g. PR builds), electron-builder skips signing.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  # S2-CR-70 (SA-6): deleteAppDataOnUninstall prompts NSIS to remove the
  # per-user AppData directory (which on Windows is %APPDATA%/voice-typer —
  # the canonical config dir per voice_typer/server/_paths.py) when the
  # user uninstalls via "Add/Remove Programs". This reclaims the
  # HuggingFace model cache (potentially GBs), the venv (hundreds of MB),
  # the history DB, logs, and crash-recovery snapshots — all of which
  # live under the config dir.
  #
  # The user is prompted to confirm during the NSIS uninstall wizard, so
  # users who want to reinstall and keep their models can decline.
  # electron-builder's NSIS implementation wires this to NSIS's
  # `RmDir /r "$APPDATA\${APP_ID}"` step in the generated uninstaller.
  #
  # See docs/migration/windows-validation-runbook.md for the manual
  # validation steps (install → check %APPDATA%/voice-typer exists →
  # uninstall → check %APPDATA%/voice-typer is gone).
  deleteAppDataOnUninstall: true
  # S5-CR-83 (SA-12): the NSIS installer still does NOT clean up the
  # autostart entries the app creates at runtime via
  # voice_typer/server/server_platform/autostart_windows.py:
  #   - HKCU\Software\Microsoft\Windows\CurrentVersion\Run\VoiceTyper_<hash>
  #     (per-install hash suffix from SHA-256 of sys.executable — see
  #     _run_key_name() in autostart_windows.py). This is a REGISTRY
  #     value, NOT a file in AppData, so deleteAppDataOnUninstall above
  #     does NOT remove it.
  #   - Scheduled task "VoiceTyperAutostart<hash>" registered via
  #     `schtasks /Create /TN ... /XML` (see _register_app_autostart_task
  #     in autostart_windows.py). This lives in Task Scheduler, also
  #     NOT under AppData.
  # When the user uninstalls Voice Typer via "Add/Remove Programs", the
  # NSIS uninstaller leaves these entries orphaned — on next login the
  # OS tries to launch the (now-deleted) binary and either silently
  # no-ops (Task Scheduler) or shows a "file not found" error dialog
  # (HKCU Run key).
  #
  # LINUX is handled (prerm removes ~/.config/autostart/voice-typer.desktop
  # for every non-system user — see ../../scripts/linux/prerm:38-57 and
  # ../../scripts/linux/prerm.rpm:40-58). Windows + macOS are the
  # remaining gap.
  #
  # The fix path (deferred — needs a custom .nsh file that is NOT yet
  # in this repo's file tree, so wiring `nsis.include` here today would
  # break the build by pointing at a non-existent file):
  #   1. Create voice_typer/client/build/nsis-uninstall-autostart.nsh
  #      that:
  #        - Enumerates HKCU\...\Run values matching "VoiceTyper_*"
  #          and deletes them via DeleteRegValue.
  #        - Runs `Get-ScheduledTask VoiceTyperAutostart* |
  #          Unregister-ScheduledTask` via nsExec::ExecToLog with
  #          powershell -Command (schtasks doesn't accept wildcards
  #          in /TN, so PowerShell is required for the wildcard match).
  #      The .nsh must be a `!macro` invoked from the uninstaller
  #      section (NSIS `un.onUninstSuccess` or `Section "Uninstall"`).
  #   2. Uncomment the `include:` line below to wire the .nsh into the
  #      NSIS template electron-builder generates:
  #        include: build/nsis-uninstall-autostart.nsh
  #   3. Add a regression test in
  #      voice_typer/client/src/main/__tests__/electron-builder-yml.test.ts
  #      asserting the `include:` line points at an existing file.
  #
  # Until the .nsh file lands, this gap is tracked as a Low-severity
  # packaging issue (S5-CR-83). The Python runtime DOES clean up its
  # own autostart entries when the user explicitly disables autostart
  # from Settings (see _disable_autostart_windows in
  # autostart_windows.py) — the orphan scenario only occurs when the
  # user uninstalls the app WITHOUT first disabling autostart in the
  # Settings UI.

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: ${env.MAC_SIGNING_IDENTITY}
  notarize: true
  # RW-5: embed the PyInstaller-built Python backend into the .dmg so the
  # macOS installer ships a complete app (Electron UI + Python backend).
  # Without this, the .dmg contains only Electron and the app silently
  # fails to start (no venv exists on a fresh user install).
  # The backend is built by CI (build-macos job) and staged at
  # voice_typer/dist/voice-typer-backend.app by the rename step.
  # pythonArgs() in src/main/index.ts launches the executable at
  # Contents/MacOS/voice-typer inside this .app bundle.
  extraResources:
    - from: ../dist/voice-typer-backend.app
      to: voice-typer-backend.app
      filter: ["**/*"]
  # S5-CR-83 (SA-12): the .dmg installer does NOT include an uninstaller
  # script that removes the per-user LaunchAgent the app creates at
  # runtime via voice_typer/server/server_platform/autostart_macos.py:
  #   ~/Library/LaunchAgents/com.voicetyper.plist
  # (see _enable_autostart_macos in autostart_macos.py — it writes the
  # plist, chmods it to 0o600, and `launchctl load`s it).
  #
  # macOS apps are typically uninstalled by dragging the .app bundle
  # from /Applications to the Trash — there is no uninstall hook in
  # the standard "drag to install" .dmg flow. So the LaunchAgent plist
  # remains orphaned after uninstall: on next login launchd tries to
  # spawn the (now-deleted) Python interpreter listed in the plist's
  # ProgramArguments, fails silently, and logs to
  # ~/Library/Logs/voice-typer-autostart.log (the plist's
  # StandardOutPath / StandardErrorPath — see _enable_autostart_macos).
  #
  # LINUX is handled (prerm removes ~/.config/autostart/voice-typer.desktop
  # — see ../../scripts/linux/prerm:38-57). Windows + macOS are the
  # remaining gap.
  #
  # The fix path (deferred — needs an uninstall.command script that is
  # NOT yet in this repo's file tree, and the dmg: format does NOT
  # support electron-builder `afterRemove` / `uninstallerHooks`):
  #   1. Ship a voice_typer/client/build/uninstall-autostart.command
  #      script alongside the .app bundle (extraResources) that:
  #        - `launchctl bootout gui/$(id -u)/com.voicetyper`
  #        - `launchctl remove com.voicetyper` (legacy fallback)
  #        - `rm -f ~/Library/LaunchAgents/com.voicetyper.plist`
  #      OR (lighter-weight alternative): document the cleanup in the
  #      README / macOS install guide and surface a "Disable autostart
  #      before uninstalling" notice in the Settings → General panel.
  #   2. Add a regression test in
  #      voice_typer/client/src/main/__tests__/electron-builder-yml.test.ts
  #      asserting the extraResources entry for the .command script is
  #      present (once the script is added).
  #
  # Until the .command script lands, this gap is tracked as a
  # Low-severity packaging issue (S5-CR-83). The Python runtime DOES
  # clean up its own LaunchAgent when the user explicitly disables
  # autostart from Settings (see _disable_autostart_macos in
  # autostart_macos.py) — the orphan scenario only occurs when the
  # user uninstalls the app WITHOUT first disabling autostart in the
  # Settings UI.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux — general options shared across all Linux targets.
# v26+: `linux`, `deb`, `rpm`, and `appImage` are all valid top-level keys.
# The `linux` section holds shared options (category, target, icon); per-format
# overrides (depends, afterInstall, afterRemove) go in the format-specific keys.
linux:
  icon: resources/icon.png
  category: Utility
  target:
    - AppImage
    - deb
    - rpm
  # RW-5: embed the PyInstaller-built Python backend into .deb/.rpm/AppImage
  # so the Linux installers ship a complete app (Electron UI + Python
  # backend). Without this, the installers contain only Electron and the
  # app silently fails to start (no venv exists on a fresh user install).
  # The backend is built by CI (build-linux job) and staged at
  # voice_typer/dist/voice-typer-backend/ by the rename step.
  # pythonArgs() in src/main/index.ts launches the executable at
  # voice-typer inside this directory.
  extraResources:
    - from: ../dist/voice-typer-backend
      to: voice-typer-backend
      filter: ["**/*"]
# GAP-3: Linux zero-command setup. The postinst/prerm scripts install
# the udev rule, add the user to the input group, and configure Caps Lock
# neutralization. The user only types their sudo password once (prompted
# by apt/dnf themselves, not by us).
# R6-F8: `python3` is NOT listed in `deb.depends` or `rpm.depends`. The
# Python backend is bundled as a standalone PyInstaller / Nuitka executable
# (see the linux.extraResources block above) — it embeds its own CPython
# interpreter, so the system `python3` package is unnecessary bloat and a
# needless install-time dependency. Removing it also avoids pulling in a
# distro Python that could shadow or conflict with the bundled one
# (e.g. user has python3.13 installed but PyInstaller bundled 3.11).
deb:
  depends:
    - libnotify4
    - libxtst6
  # CR-26: the postinst/prerm scripts live at <repo>/scripts/linux/, NOT at
  # voice_typer/client/resources/linux/ (which does not exist). electron-builder
  # resolves these paths relative to its cwd (voice_typer/client/), so we use
  # ../../scripts/linux/... to reach the actual scripts. Without this fix, the
  # .deb/.rpm installers either fail to build or ship without the udev rule /
  # input-group setup that the native hotkey listener needs.
  # S5-CR-83 (Linux side — HANDLED, SA-12): prerm removes the per-user
  # autostart .desktop entry at ~/.config/autostart/voice-typer.desktop
  # for every non-system user (see ../../scripts/linux/prerm:38-57).
  # The Windows (nsis:) and macOS (mac:) sections document their
  # respective gaps in the comments above — Linux is the only platform
  # where the uninstall autostart cleanup is fully wired today.
  afterInstall: ../../scripts/linux/postinst
  afterRemove: ../../scripts/linux/prerm
rpm:
  depends:
    - libnotify
    - libXtst
  # CR-26: same path correction as the deb: section above.
  # S5-CR-83 (Linux side — HANDLED, SA-12): prerm.rpm removes the
  # per-user autostart .desktop entry (see ../../scripts/linux/prerm.rpm:40-58).
  # Functionally identical to the Debian prerm — only runs on uninstall
  # ($1 = 0), not on upgrade ($1 = 1).
  afterInstall: ../../scripts/linux/postinst.rpm
  afterRemove: ../../scripts/linux/prerm.rpm
