# BUILD-N07 / BUILD-N16: electron-builder distribution config.
# NEW-DOC-014: added code signing + auto-update config.
appId: com.voicetyper.app
productName: Voice Typer
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
# NEW-DOC-014: publish config for auto-update via GitHub releases.
# When a new release is published, the app's auto-updater checks this
# provider for newer versions. The `provider: github` uses the
# GITHUB_TOKEN environment variable set by CI.
publish:
  provider: github
  owner: AbdallahIsDev
  repo: voice-typer
  releaseType: release

directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.nvmrc,.python-version,.pre-commit-config.yaml}'

win:
  icon: resources/icon.png
  target:
    - nsis
  # NEW-DOC-014: Windows code signing config.
  # These use env vars so secrets aren't committed. When the env vars
  # are not set, electron-builder skips signing (unsigned build).
  signingHashAlgorithms: [sha256]
  certificateFile: ${env.WIN_CERT_FILE}
  certificatePassword: ${env.WIN_CERT_PASSWORD}
  publisherName: ${env.WIN_PUBLISHER_NAME}
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  # NEW-DOC-014: macOS notarization + signing config.
  identity: ${env.MAC_SIGNING_IDENTITY}
  notarize:
    teamId: ${env.APPLE_TEAM_ID}
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  icon: resources/icon.png
  category: Office
  target:
    - AppImage
    - deb
    - rpm
  maintainer: voice-typer@example.com
  vendor: Voice Typer
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
AppImage:
  artifactName: ${productName}-${version}-linux-${arch}.AppImage
# GAP-3: Linux zero-command setup. The postinst/prerm scripts install
# the udev rule, add the user to the input group, and configure Caps Lock
# neutralization. The user only types their sudo password once (prompted
# by apt/dnf themselves, not by us).
deb:
  depends:
    - libnotify4
    - libxtst6
    - python3
  afterInstall: ../../scripts/linux/postinst
  afterRemove: ../../scripts/linux/prerm
rpm:
  depends:
    - libnotify
    - libXtst
    - python3
  afterInstall: ../../scripts/linux/postinst.rpm
  afterRemove: ../../scripts/linux/prerm.rpm
