<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
      Set <html lang> AND <html dir> from the saved UI locale BEFORE
      the bubble React tree mounts so:

        - screen readers announce the waveform / REC / Ready /
          Transcribing labels in the user's UI locale (not the
          browser default), and
        - RTL locales (currently Arabic) flip the pill's
          logical-property utilities (`ms-*` / `me-*`) on the
          very first paint, avoiding a visible LTR→RTL snap
          when the React effect that flips `document.documentElement.dir`
          runs ~50-200ms after first paint.

      The bubble window is a SEPARATE BrowserWindow from the main
      app, so `setLocale()` running in the main renderer does NOT
      propagate `document.documentElement.lang` / `.dir` here — the
      bubble renderer must apply its own `lang` + `dir` from the
      same `voice-typer-ui-locale` localStorage key the main window
      uses. The bubble's i18n setup (in `bubble-components.tsx`)
      also calls `setLocale()` at runtime, but the inline script
      runs first so first-paint content is announced correctly and
      laid out in the correct writing direction.

      Same shape + comments as `index.html`'s inline script (kept
      in sync). The strict CSP meta tag below forbids inline scripts;
      the production build must add a `sha256-...` hash for this block
      to the CSP `script-src` directive (electron-vite's html plugin
      computes the hash at build time). In dev, `cspEmissionPlugin`
      rewrites the CSP to permit `unsafe-inline` for `script-src`.
  -->
  <script>
    (() => {
      // `let`/`const` instead of `var` (block-scoped, no global leak).
      let locale, SUPPORTED, tag;
      try {
        locale = localStorage.getItem("voice-typer-ui-locale");
        if (typeof locale !== "string" || locale === "") return;
        SUPPORTED = { ar: "ar", de: "de", en: "en", es: "es", fr: "fr", hi: "hi", ru: "ru", zh: "zh" };
        tag = SUPPORTED[locale];
        if (tag) {
          document.documentElement.lang = tag;
          // RTL locales (currently Arabic) flip the pill's writing
          // direction. The bubble's logical-property utilities
          // (`ms-*`, `me-*`) cascade from this `dir` attribute, so
          // setting it at first paint avoids a LTR→RTL snap.
          document.documentElement.dir = tag === "ar" ? "rtl" : "ltr";
        }
      } catch {
        // localStorage unavailable (sandboxed frame, Tauri webview, etc.)
        // — fall through to the hardcoded lang="en" / dir="ltr" defaults.
      }
    })();
  </script>

  <!--
      Content Security Policy for the bubble window.
      Same hardening as index.html.  This meta tag is the STRICT production
      CSP — cspEmissionPlugin (electron.vite.config.ts) rewrites it at serve
      time to add 'unsafe-eval' + 'unsafe-inline' for Vite HMR.  The bubble
      renders waveform data only; no remote resources are ever needed.

      connect-src is 'self' only — the bubble has no update-check
      surface, so granting `https://api.github.com` would be dead attack
      surface AND a latent C-DATA-1 violation. The previous grant was
      removed for strict offline compliance.

      NOTE: `frame-ancestors 'none'` is intentionally NOT in this meta
      tag — the CSP spec ignores `frame-ancestors` delivered via <meta>
      (only HTTP headers honor it) and the browser logs a console warning
      for it. It is enforced via the HTTP-header CSP set by the Electron
      main process (`bootstrap.ts::_buildCsp` → onHeadersReceived).
    -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self';" />

  <!--
    First module script: apply the saved theme before React mounts
    (same FOUC-prevention pattern as renderer/index.html).
  -->
  <script type="module" src="/src/theme-bootstrap.ts"></script>

  <script type="module">
    import { APP_NAME } from "./src/branding.ts";

    document.title = `${APP_NAME} — Bubble`;
  </script>

  <title>Voice Typer — Bubble</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
    }

    body {
      font-family: 'Inter Variable', system-ui, sans-serif;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="bubble-root"></div>
  <script type="module" src="/src/bubble-main.tsx"></script>
</body>

</html>
