<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
      SEC-012: Content Security Policy.  Restricts resource loading
      to the app's own origin (Electron's file:// or http://localhost:5173
      in dev).  No remote scripts, no remote styles.

      - script-src includes 'unsafe-inline' and 'unsafe-eval' because
        Vite's dev server injects inline scripts (React Refresh preamble,
        HMR client) and uses eval-based sourcemaps.  In production the
        HTTP header (set in main/index.ts) omits them, restoring the
        strict 'self'-only policy.
      - style-src 'self' 'unsafe-inline' — Tailwind 4 injects styles
        at runtime; 'unsafe-inline' for styles is low-risk (no script
        execution from CSS in modern browsers).
      - img-src 'self' data: — data: URIs for inline icons.
      - connect-src 'self' — no remote fetch from the renderer.
      - frame-ancestors 'none' — this page can't be framed.
      - form-action 'none' — no form submissions.
    -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' https://api.github.com; form-action 'none'; base-uri 'self';" />
  <title>Voice Typer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
