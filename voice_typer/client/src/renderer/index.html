<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
      BG-19 / BG-R19 finding 12: set <html lang> from the saved UI locale
      BEFORE React mounts so screen readers announce content in the
      correct language on first paint.  Without this, the hardcoded
      lang="en" above means a user who switched the UI to (e.g.) French
      still hears the initial render announced as English until the
      React effect that flips document.documentElement.lang runs (which
      can be 100-200ms after first paint — long enough for AT to read
      the first heading in the wrong language).

      The inline script reads localStorage for
      `voice-typer-ui-locale` (the same key i18n.ts persists the active
      locale to) and maps the locale code to a BCP-47 language tag.
      Unknown / missing values fall through to the existing lang="en"
      attribute (the SSR / first-run default).

      This script is inline because it must execute synchronously
      BEFORE the first React paint; the strict CSP meta tag below
      forbids inline scripts, so the production build must add a
      'sha256-...' hash for this block to the CSP `script-src`
      directive (electron-vite's html plugin computes the hash at
      build time).  In dev, cspEmissionPlugin (see comment below)
      rewrites the CSP to permit 'unsafe-inline' for script-src so the
      inline block runs.

      NOTE: the script must NOT throw if localStorage is unavailable
      (Electron sandboxed frames, Tauri webview restrictions).  All
      access is wrapped in try/catch and falls back silently to
      lang="en".
  -->
  <script>
    (() => {
      var locale, SUPPORTED, tag;
      try {
        locale = localStorage.getItem("voice-typer-ui-locale");
        if (typeof locale !== "string" || locale === "") return;
        // Map our 8 supported locale codes (ar, de, en, es, fr, hi, ru, zh)
        // to BCP-47 language tags.  We don't add a region subtag because
        // the app's translations are region-neutral (e.g. "fr" not
        // "fr-FR"); screen readers will use the user's OS-level region
        // for date/number formatting anyway.
        SUPPORTED = { ar: "ar", de: "de", en: "en", es: "es", fr: "fr", hi: "hi", ru: "ru", zh: "zh" };
        tag = SUPPORTED[locale];
        if (tag) document.documentElement.lang = tag;
      } catch {
        // localStorage unavailable (sandboxed frame, Tauri webview, etc.)
        // — fall through to the hardcoded lang="en" attribute.
      }
    })();
  </script>

  <!--
      SEC-012 / RW-3: Content Security Policy.  Restricts resource loading
      to the app's own origin (Electron's file:// or http://localhost:5173
      in dev).  No remote scripts, no remote styles.

      This meta tag is the STRICT production CSP.  The cspEmissionPlugin in
      electron.vite.config.ts rewrites it at serve time to a permissive CSP
      that adds 'unsafe-eval' and 'unsafe-inline' for script-src (Vite HMR +
      React Refresh preamble + eval sourcemaps) and ws://localhost:* to
      connect-src for the HMR websocket.  The production build leaves this
      strict policy in place — no inline scripts and no eval in the bundle.

      Belt-and-suspenders: main/index.ts also sets CSP via onHeadersReceived
      (HTTP headers take precedence over meta tags per the CSP spec).

      Fail-safe: if cspEmissionPlugin fails to fire in dev, HMR breaks
      visibly (loud failure).  If it fails in prod, the meta tag is already
      strict (safe failure).

      - script-src 'self' — only same-origin scripts.
      - style-src 'self' 'unsafe-inline' — Tailwind 4 injects styles at
        runtime; 'unsafe-inline' for styles is low-risk (no script
        execution from CSS in modern browsers).
      - img-src 'self' data: — data: URIs for inline icons.
      - connect-src 'self' https://api.github.com — backend + update check.
      - frame-ancestors 'none' — this page can't be framed.
      - form-action 'none' — no form submissions.
    -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'none'; form-action 'none'; base-uri 'self';" />

  <!--
      PVT-018 FOUC fix: apply the cached theme BEFORE React mounts.
      This is the FIRST <script type="module"> in the document so it
      executes before main.tsx → ReactDOM.createRoot().render().
      The bootstrap reads localStorage for the last-known theme_mode /
      theme_preset / custom_theme, toggles the .dark class on
      <html>, and calls applyThemeVars() so preset CSS variable
      overrides are in place before the first paint.  Without this,
      dark-mode / themed installs saw a white-flash-of-unstyled-content
      on every launch.  See src/renderer/src/theme-bootstrap.ts.
  -->
  <script type="module" src="/src/theme-bootstrap.ts"></script>

  <script type="module">
    import { APP_NAME } from "./src/branding.ts";

    document.title = APP_NAME;
  </script>

  <title>Voice Typer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
