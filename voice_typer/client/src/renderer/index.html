<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SEC-012: Content Security Policy.  Restricts resource loading
      to the app's own origin (Electron's file:// or http://localhost:5173
      in dev).  No remote scripts, no inline event handlers, no remote
      styles.  Vite injects module scripts with nonces in dev mode;
      the 'self' source covers the production file:// build.

      Notes:
      - default-src 'self' is the base; everything else inherits.
      - script-src 'self' allows Vite's modulepreload + script tags.
      - style-src 'self' 'unsafe-inline' — Tailwind 4 injects styles
        at runtime; 'unsafe-inline' for styles is low-risk (no script
        execution from CSS in modern browsers).
      - img-src 'self' data: — data: URIs for inline icons.
      - connect-src 'self' — no remote fetch from the renderer
        (all backend calls go through the preload bridge → main → TCP).
      - frame-ancestors 'none' — this page can't be framed.
      - form-action 'none' — no form submissions.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';      form-action 'none'; base-uri 'self';" />
    <title>Voice Typer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
