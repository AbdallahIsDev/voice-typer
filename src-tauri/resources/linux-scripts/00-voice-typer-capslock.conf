# Voice Typer — neutralize Caps Lock toggle
#
# This file tells the X server to ignore Caps Lock as a caps-state toggle,
# so it can be used as a hotkey without affecting text capitalization.
# Installed by the Voice Typer package.
#
# Placement: /etc/X11/xorg.conf.d/00-voice-typer-capslock.conf
# This persists across reboots and applies to all X11 sessions.
#
# X11-ONLY — this XKB config is read by the Xorg server and is
# IGNORED on Wayland sessions (GNOME/Mutter, KDE/KWin, Sway, wlroots).
# Wayland compositors are configured separately by install_permissions.py
# via gsettings (GNOME) / kxkbrc (KDE) / sway config (Sway).
# On a Wayland-only system this file is a harmless no-op, but we still
# install it because:
#   1. XWayland apps inherit Xorg XKB settings (so Caps Lock is still
#      neutralized for X11 apps running under XWayland).
#   2. The same install may boot into an X11 session later (multi-target
#      systems, Xorg fallback on broken Wayland drivers, etc.).

Section "InputClass"
    Identifier "Voice Typer Caps Lock Neutralization"
    MatchIsKeyboard "on"
    Option "XkbOptions" "caps:none"
EndSection
