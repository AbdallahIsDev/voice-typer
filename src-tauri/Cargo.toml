[package]
name = "voice-typer-tauri"
version = "1.0.0"
description = "Tauri v2 host for Voice Typer — Rust shell + Python sidecar (ADR-0020)"
authors = ["Abdallah IsDev <noreply@github.com>"]
license = "MIT"
repository = "https://github.com/AbdallahIsDev/voice-typer"
edition = "2021"
rust-version = "1.77"

# ADR-0020 §4.1: the binary name uses the Rust target triple suffix
# because Tauri's `externalBin` mechanism requires it. The actual
# per-triple binaries are placed under `src-tauri/bin/` and selected
# at runtime by Tauri based on `std::env::consts::ARCH` + `OS`.
[[bin]]
name = "voice-typer-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri v2 core
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-tray = "2.0"

# ADR-0020 §6.2: enigo for cross-platform keystroke injection
# (short-text paste path). Used by the paste_text event handler.
enigo = "0.2"

# ADR-0020 §1 + §10: WebSocket client + tokio runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"

# ADR-0020 §3: HMAC token generation + comparison
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# ADR-0020 §13.1: Windows-only deps for the focus-restore dance
# (AttachThreadInput + SetForegroundWindow). Other platforms use
# enigo directly.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
]}

[profile.release]
# ADR-0020 §13: smaller release binary for the Tauri host
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
