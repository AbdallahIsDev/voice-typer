[package]
name = "voice-typer-tauri"
version = "1.0.0"
description = "Tauri v2 host for Voice Typer — Rust shell + Python sidecar (ADR-0020)"
authors = ["Abdallah IsDev <noreply@github.com>"]
license = "MIT"
repository = "https://github.com/AbdallahIsDev/voice-typer"
edition = "2021"
rust-version = "1.77"

# ADR-0020 §4.1: the binary name is the base name; Tauri's `externalBin`
# mechanism appends the target triple at runtime to find the right
# per-platform binary (e.g. `python-sidecar-x86_64-pc-windows-msvc.exe`).
[[bin]]
name = "voice-typer-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
# Tauri v2 core — tray support is built into the core crate in v2
# (NOT a separate tauri-plugin-tray crate). The "tray-icon" feature
# enables the tray API.
#
# MED-RR / RUST-9: the ``devtools`` feature is intentionally NOT in
# the default feature set.  It's gated behind the optional ``dev``
# feature below so release builds don't expose the WebView devtools
# API to end users.  Devs who need devtools run
# ``cargo tauri build --features dev`` or
# ``cargo tauri dev --features dev``.
#
# ADR-0020 §6.5 + Task 1: the system-tray icon lives in Tauri v2 CORE
# behind the ``tray-icon`` feature (NOT a separate tauri-plugin-tray
# crate). ``TrayIconBuilder`` / ``tauri::menu`` are only available when
# this feature is enabled.
tauri = { version = "2", features = ["tray-icon", "image-png", "config-json5"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# XE-4-4: tauri-plugin-clipboard-manager removed — the renderer uses
# the web-API navigator.clipboard.writeText() for all writes (paste
# path was removed in FZ-19/PVT-051), and the capability grant
# `clipboard-manager:allow-read-text` was a clipboard-exfiltration
# vector (compromised renderer could read system clipboard WITHOUT a
# user gesture, unlike the web API). The plugin registration in
# main.rs was already removed; this drops the crate from the build.
tauri-plugin-single-instance = "2"
# ADR-0020 §6 + MIG-1.1: tauri-plugin-dialog for the save-file dialog
# used by `export_history` / `export_vocabulary` Rust commands. The TS
# bridge invokes these commands (no JS-side dialog API call).
tauri-plugin-dialog = "2"

# ADR-0020 §6.2: enigo was previously used for cross-platform keystroke
# injection (paste_text event handler). The paste_text command was deleted
# as dead production code — the Python sidecar owns the paste path end-to-end.
# The enigo dep was removed; grep -r 'use enigo' src/ returns 0 matches.

# ADR-0020 §1 + §10: WebSocket client + tokio runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
tokio-tungstenite = { version = "0.27", features = ["connect"] }
futures-util = "0.3"

# ADR-0020 §3: per-launch bearer token (32 random bytes hex-encoded).
# The token is generated via `rand::rng().fill_bytes()` and
# passed to the sidecar via `VOICE_TYPER_IPC_TOKEN`. Despite the ADR's
# "HMAC" wording, the Rust host treats it as a bearer token (the
# sidecar's `ipc_server.py` validates the literal string match). The
# `hmac`+`sha2` crates are therefore NOT needed in the host.
rand = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Platform primitives for `src/platform/process.rs`:
# - `libc::setsid()` in the POSIX reaper's `pre_exec` closure so the
#   reaper detaches into its own session/process group. Without this,
#   a terminal Ctrl-C (SIGINT to the host's process group) would kill
#   the reaper at the same time as the host — before the reaper could
#   kill the sidecar — defeating the kill-on-parent-exit guarantee
#   for terminal-initiated shutdowns.
libc = "0.2"

# ADR-0020 §6.3 + §10: Win32 APIs used by the Tauri host on Windows.
# Target-gated so the `windows` crate is NOT pulled into Linux/macOS
# builds (keeps the dependency graph clean for the non-Windows MIG-1.6
# / MIG-1.7 spikes).
# Features: `Win32_UI_WindowsAndMessaging` (foreground/window APIs),
# `Win32_Foundation` (`HWND` — wraps `*mut c_void`, NOT isize),
# `Win32_System_Threading` (`AttachThreadInput`, `GetCurrentThreadId`).
# NOTE: `BOOL` is NOT re-exported from `Win32_Foundation` in windows-rs
# 0.61+ — it moved to `windows_core::BOOL`. However `AttachThreadInput`
# actually takes a plain Rust `bool` in 0.61.3+, so pass `true`/`false`
# directly, never `BOOL::from(...)`.
# NOTE: if the version selected here conflicts with whatever Tauri v2's
# transitive `windows` requirement resolves to, `cargo check` on the
# Windows host will surface the resolution failure — bump the major.minor
# to match Tauri's resolved version in that case.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    # Job Object APIs for kill-on-parent-exit on the release
    # sidecar. `Win32_System_JobObjects` provides `CreateJobObjectW`,
    # `SetInformationJobObject`, `AssignProcessToJobObject`. See
    # `src/platform/process.rs`.
    "Win32_System_JobObjects",
    # CreateJobObjectW is gated behind Win32_Security in windows
    # 0.61.x (it takes a SECURITY_ATTRIBUTES parameter).
    "Win32_Security",
] }

[profile.release]
# ADR-0020 §13: smaller release binary for the Tauri host
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# MED-RR / RUST-9: optional dev feature that enables the Tauri devtools
# API.  NOT enabled by default — release builds must not expose devtools
# to end users.  Devs run ``cargo tauri dev --features dev`` to get
# devtools during development.
[features]
default = []
dev = ["tauri/devtools"]

# GT-D3-6: project-wide clippy lint gate.
[lints.clippy]
all = "warn"
cast_possible_truncation = "warn"
unwrap_used = "warn"
expect_used = "warn"
