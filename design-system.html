<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design System — lausu renderer</title>
<style>
/* Fonts: the same Inter Variable faces the renderer loads (index.css @font-face). */
@font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;font-display:swap;src:url("voice_typer/client/src/renderer/public/fonts/InterVariable.woff2") format("woff2")}
@font-face{font-family:"Inter Variable";font-style:italic;font-weight:100 900;font-display:swap;src:url("voice_typer/client/src/renderer/public/fonts/InterVariable-Italic.woff2") format("woff2")}

/* ── Palette scales — Tailwind-style 50→950, verbatim from index.css.
   One neutral scale spans both schemes in strict lightness order;
   theme presets override SEMANTIC tokens only, never the raw scale. ── */
:root{
--gray-50:oklch(1 0 0);
--gray-100:oklch(0.967 0.001 286.375);
--gray-200:oklch(0.93 0 0);
--gray-300:oklch(0.85 0 0);
--gray-400:oklch(0.705 0.015 286.067);
--gray-500:oklch(0.48 0.016 285.938);
--gray-600:oklch(0.274 0.006 286.033);
--gray-700:oklch(0.22 0 0);
--gray-800:oklch(0.187 0 271.152);
--gray-900:oklch(0.168 0 0);
--gray-950:oklch(0.141 0.005 285.823);
--brand-50:oklch(0.97 0.014 254.604);
--brand-100:oklch(0.94 0.05 264);
--brand-200:oklch(0.87 0.11 264);
--brand-300:oklch(0.76 0.16 264);
--brand-400:oklch(0.63 0.21 264);
--brand-500:oklch(0.488 0.243 264.376);
--brand-600:oklch(0.424 0.199 265.638);
--brand-700:oklch(0.36 0.17 266);
--brand-800:oklch(0.3 0.14 266);
--brand-900:oklch(0.25 0.11 266);
--brand-950:oklch(0.2 0.09 266);
}
/* ── Semantic tokens — light scheme (mirrors index.css :root).
   Generic, location-free names; no aliases, no duplicate values. ── */
:root,.tokens-light{
--background:var(--gray-50);
--surface:var(--gray-50);
--surface-subtle:var(--gray-100);
--surface-hover:var(--gray-200);
--muted:var(--gray-100);
--foreground:var(--gray-950);
--text-secondary:var(--gray-500);
--muted-foreground:var(--gray-500);
--primary:var(--brand-500);
--primary-foreground:var(--brand-50);
--accent:var(--brand-500);
--accent-foreground:var(--brand-50);
--accent-soft:oklch(0.424 0.199 265.638 / 0.1);
--accent-muted:oklch(0.546 0.245 262.881 / 0.4);
--destructive:oklch(0.55 0.25 27);
--destructive-foreground:oklch(0.97 0 0);
--success:oklch(0.62 0.17 149);
--warning:oklch(0.7 0.16 70);
--info:oklch(0.62 0.14 240);
--border:oklch(0 0 0);
--input:oklch(0.62 0.004 286.32);
--ring:var(--brand-500);
--chart-1:oklch(0.809 0.105 251.813);
--chart-2:oklch(0.623 0.214 259.815);
--chart-3:oklch(0.546 0.245 262.881);
--chart-4:var(--brand-500);
--chart-5:var(--brand-600);
--radius:0.625rem;
}
/* ── Semantic tokens — dark scheme (mirrors index.css .dark). Surfaces
   split here; destructive/charts identical to light, inherited above. ── */
.dark,.tokens-dark{
--background:var(--gray-800);
--surface:var(--gray-700);
--surface-subtle:var(--gray-900);
--surface-hover:var(--gray-700);
--muted:var(--gray-600);
--foreground:var(--gray-50);
--text-secondary:var(--gray-300);
--muted-foreground:var(--gray-400);
--primary:var(--brand-600);
--primary-foreground:var(--brand-50);
--accent:var(--brand-600);
--accent-foreground:var(--brand-50);
--accent-soft:oklch(0.424 0.199 265.638 / 0.15);
--accent-muted:oklch(0.546 0.245 262.881 / 0.6);
--success:oklch(0.7 0.16 149);
--warning:oklch(0.78 0.15 70);
--info:oklch(0.7 0.13 240);
--border:oklch(1 0 0);
--input:oklch(0.52 0.004 286.32);
--ring:oklch(0.552 0.016 285.938);
}
/* ── Base layout ── */
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(100% * var(--font-scale,1));color-scheme:light}
html.dark{color-scheme:dark}
body{margin:0;background:var(--background);color:var(--foreground);
 font-family:"Inter Variable",Inter,system-ui,-apple-system,sans-serif;
 font-size:.875rem;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
*:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
a{color:var(--primary)}

.page{max-width:1160px;margin:0 auto;padding:0 24px 64px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

header.topbar{position:sticky;top:0;z-index:20;
 background:color-mix(in oklch,var(--background) 92%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid color-mix(in oklch,var(--border) 10%,transparent)}
.topbar-inner{max-width:1160px;margin:0 auto;padding:14px 24px;
 display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
.brand span{font-size:.75rem;color:var(--muted-foreground)}

section.doc{margin-top:40px;display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sec-head h2{font-size:1rem;font-weight:650}
.sec-head p{font-size:.8125rem;color:var(--text-secondary)}
.hr{height:1px;background:color-mix(in oklch,var(--border) 10%,transparent);border:0;margin:0}
.note{font-size:.75rem;color:var(--muted-foreground)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ── Mode switch (reuse segmented look) ── */
.mode-switch{display:inline-flex;position:relative;gap:0;
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 background:var(--surface-subtle);border-radius:9999px;padding:3px}
.mode-switch button{border:0;background:transparent;color:var(--muted-foreground);
 font:inherit;font-size:.75rem;font-weight:550;padding:6px 14px;border-radius:9999px;
 cursor:pointer;position:relative;z-index:1;transition:color .15s}
.mode-switch button:hover{color:var(--foreground)}
.mode-switch button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
.mode-switch button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}

/* ── Compare (side-by-side) view ── */
#compare{display:none}
body.compare #single{display:none}
body.compare #compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.scope{min-width:0;border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 border-radius:var(--radius-lg);padding:20px;background:var(--background);color:var(--foreground)}
.scope-label{position:sticky;top:64px;z-index:5;display:inline-flex;align-items:center;gap:6px;
 font-size:.7rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
 color:var(--muted-foreground);background:var(--surface-subtle);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 border-radius:9999px;padding:4px 12px;margin-bottom:12px}
.scope-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
@media (max-width:960px){body.compare #compare{grid-template-columns:1fr}}
/* ── Token swatch grid ── */
.tok-groups{display:flex;flex-direction:column;gap:20px}
.tok-group h3{font-size:.75rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground)}
.tok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tok{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--radius-lg);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);background:var(--surface-subtle)}
.chip{height:44px;border-radius:var(--radius-lg);border:1px solid color-mix(in oklch,var(--border) 12%,transparent)}
.tok-name{font-size:.78rem;font-weight:600}
.tok-val{font-size:.68rem;color:var(--muted-foreground);word-break:break-all;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tok-desc{font-size:.68rem;color:var(--text-secondary)}

/* ── Typography ── */
.type-card{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--radius-lg);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);background:var(--surface-subtle)}
.type-row{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:baseline}
.type-row .meta{font-size:.7rem;color:var(--muted-foreground);
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-display{font-size:1.75rem;font-weight:650;letter-spacing:-.02em;color:var(--foreground)}
.t-h1{font-size:1.5rem;font-weight:650;color:var(--foreground)}
.t-h2{font-size:1.125rem;font-weight:600;color:var(--foreground)}
.t-body{font-size:.875rem;color:var(--text-secondary)}
.t-label{font-size:.875rem;font-weight:500;color:var(--foreground)}
.t-caption{font-size:.75rem;color:var(--muted-foreground)}
.t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.75rem;color:var(--foreground)}

/* ── Radius + border scale ── */
.radius-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.radius-item{display:flex;flex-direction:column;gap:8px;align-items:center;padding:14px 8px;
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 background:var(--surface-subtle);font-size:.7rem;color:var(--muted-foreground);text-align:center}
.radius-box{width:64px;height:44px;background:var(--primary);opacity:.9}
.borders{display:flex;gap:12px;flex-wrap:wrap}
.border-swatch{width:120px;height:56px;border-radius:var(--radius-lg);background:var(--surface-subtle);
 display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
 font-size:.65rem;color:var(--muted-foreground)}

/* ── Button ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
 border:1px solid transparent;border-radius:var(--radius-lg);padding:6px 12px;
 font-family:inherit;font-size:.875rem;font-weight:500;line-height:1.3;
 cursor:pointer;user-select:none;white-space:nowrap;
 transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s,opacity .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{cursor:not-allowed;pointer-events:none;opacity:.5}
.btn:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{background:color-mix(in oklch,var(--primary) 80%,transparent)}
.btn-secondary{background:var(--muted);color:var(--foreground)}
.btn-secondary:hover{background:color-mix(in oklch,var(--muted),var(--foreground) 5%)}
.btn-outline{border-color:color-mix(in oklch,var(--border) 5%,transparent);background:var(--background)}
.btn-outline:hover{background:var(--muted);color:var(--foreground)}
:is(.dark,.tokens-dark) .btn-outline{background:transparent}
:is(.dark,.tokens-dark) .btn-outline:hover{background:color-mix(in oklch,var(--input) 30%,transparent)}
.btn-ghost{background:transparent;color:inherit}
.btn-ghost:hover{background:var(--muted);color:var(--foreground)}
:is(.dark,.tokens-dark) .btn-ghost:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.btn-destructive{background:color-mix(in oklch,var(--destructive) 10%,transparent);color:var(--destructive)}
.btn-destructive:hover{background:color-mix(in oklch,var(--destructive) 20%,transparent)}
:is(.dark,.tokens-dark) .btn-destructive{background:color-mix(in oklch,var(--destructive) 20%,transparent)}
:is(.dark,.tokens-dark) .btn-destructive:hover{background:color-mix(in oklch,var(--destructive) 30%,transparent)}
.btn-destructive-solid{background:var(--destructive);color:var(--destructive-foreground);border-color:transparent}
.btn-destructive-solid:hover{background:color-mix(in oklch,var(--destructive) 85%,transparent)}
.btn-warning{background:color-mix(in oklch,var(--warning) 15%,transparent);color:var(--warning)}
.btn-warning:hover{background:color-mix(in oklch,var(--warning) 25%,transparent)}
.btn-warning-solid-label{color:var(--foreground)}
.btn-link{background:transparent;color:var(--primary);border-radius:var(--radius-lg);padding:6px 8px}
.btn-link:hover{text-decoration:underline;text-underline-offset:4px}
.btn-xs{padding:4px 10px;gap:4px;font-size:.75rem}
.btn-sm{padding:6px 12px;gap:4px}
.btn-lg{padding:8px 16px;gap:8px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-lg)}
.btn-icon-xs{width:24px;height:24px;padding:0}
.btn-icon-sm{width:32px;height:32px;padding:0}
.btn-icon-lg{width:40px;height:40px;padding:0}
.btn-clearall{background:transparent;border-color:color-mix(in oklch,var(--border) 5%,transparent);color:var(--muted-foreground);gap:8px}
.btn-clearall:hover{background:var(--destructive);color:var(--destructive-foreground);border-color:var(--destructive)}
.btn .glyph{font-size:.9em;line-height:1}
/* ── Input / textarea ── */
.input{height:32px;width:100%;min-width:0;border-radius:var(--radius-lg);
 border:1px solid transparent;background:color-mix(in oklch,var(--input) 50%,transparent);
 padding:6px 12px;font-family:inherit;font-size:.875rem;color:var(--foreground);
 transition:color .15s,box-shadow .15s,background-color .15s,border-color .15s}
.input::placeholder{color:var(--muted-foreground)}
.input:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring);outline:none}
.input[data-focus="pointer"]:focus{border-color:color-mix(in oklch,var(--ring) 60%,transparent);box-shadow:none}
.input:disabled{opacity:.5;pointer-events:none}
.input[aria-invalid="true"]{border-color:var(--destructive);
 box-shadow:0 0 0 1px color-mix(in oklch,var(--destructive) 20%,transparent)}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.select-trigger{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;
 height:32px;min-width:150px;border-radius:9999px;border:1px solid color-mix(in oklch,var(--border) 5%,transparent);
 background:var(--background);padding:0 12px;font-size:.8125rem;color:var(--muted-foreground);cursor:pointer}
.select-trigger:hover{color:var(--foreground)}

/* ── Switch ── */
.switch{position:relative;display:inline-flex;flex-shrink:0;width:44px;height:20px;
 border:2px solid transparent;border-radius:9999px;cursor:pointer;
 background:color-mix(in oklch,var(--input) 90%,transparent);
 transition:background-color .15s,border-color .15s}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:inherit}
.switch .thumb{position:absolute;top:0;left:0;pointer-events:none;
 width:24px;height:16px;border-radius:9999px;background:var(--background);
 box-shadow:0 1px 2px rgb(0 0 0 / .15);transition:transform .15s,background-color .15s}
.switch:has(input:checked){background:var(--primary);
 border-color:color-mix(in oklch,var(--primary) 30%,transparent)}
.switch:has(input:checked) .thumb{transform:translateX(calc(100% - 8px));background:var(--background)}
:is(.dark,.tokens-dark) .switch .thumb{background:var(--foreground)}
:is(.dark,.tokens-dark) .switch:has(input:checked) .thumb{background:var(--primary-foreground)}
.switch:has(input:focus-visible){border-color:var(--ring);box-shadow:0 0 0 1px var(--ring);outline:none}
.switch:has(input:disabled){opacity:.5;pointer-events:none}
.switch.sm{width:28px;height:16px}
.switch.sm .thumb{width:16px;height:12px}
.switch.sm:has(input:checked) .thumb{transform:translateX(calc(100% - 8px))}

/* ── Checkbox ── */
.checkbox{position:relative;display:inline-grid;place-content:center;flex-shrink:0;
 width:16px;height:16px;border-radius:4px;cursor:pointer;background:transparent;
 border:1px solid color-mix(in oklch,var(--border) 15%,transparent);
 transition:background-color .15s,border-color .15s}
.checkbox input{position:absolute;inset:0;opacity:0;margin:0;cursor:inherit}
.checkbox:has(input:checked){background:var(--accent);border-color:var(--accent)}
.checkbox:has(input:checked)::after{content:"";width:9px;height:5px;
 border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.checkbox:has(input:focus-visible){border-color:var(--ring);box-shadow:0 0 0 1px var(--ring);outline:none}
.checkbox:has(input:disabled){opacity:.5;pointer-events:none}
/* ── Keycaps (Kbd / HotkeyChips — gap only, NEVER a "+" separator) ── */
kbd{display:inline-block;border:1px solid color-mix(in oklch,var(--border) 15%,transparent);
 background:var(--surface-subtle);color:var(--foreground);border-radius:var(--radius-lg);
 padding:4px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-size:.75rem;line-height:1.2}
.kbd-group{display:inline-flex;align-items:center;gap:4px}
kbd.in-tooltip{background:color-mix(in oklch,var(--foreground) 10%,transparent);color:var(--foreground);
 border-color:transparent}
.kbd-alt{font-size:.75rem;color:var(--muted-foreground)}

/* ── SegmentedControl ── */
.seg{position:relative;display:inline-flex;align-items:center;
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 background:var(--surface-subtle);border-radius:var(--radius-lg);padding:2px}
.seg-ind{position:absolute;top:2px;bottom:2px;left:0;width:0;z-index:0;
 background:var(--background);border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 border-radius:var(--radius-lg);transition:left .15s ease,width .15s ease;box-sizing:border-box}
.seg-btn{position:relative;z-index:1;border:0;background:transparent;cursor:pointer;
 color:var(--muted-foreground);font-family:inherit;font-size:.8125rem;font-weight:500;
 padding:8px 12px;white-space:nowrap;transition:color .15s}
.seg-btn:hover{color:var(--foreground)}
.seg-btn[aria-checked="true"]{color:var(--foreground)}
.seg-btn:focus-visible{outline:none;box-shadow:0 0 0 1px var(--ring);border-radius:var(--radius-lg)}
.seg.pill{border-radius:9999px;padding:3px}
.seg.pill .seg-btn{font-size:.6875rem;letter-spacing:.05em;padding:5px 10px;border-radius:9999px}
.seg.pill .seg-btn[aria-checked="true"]{background:var(--primary);color:var(--primary-foreground)}

/* ── Cards / banner / skeleton ── */
.card{border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 background:var(--surface-subtle);border-radius:var(--radius-lg);padding:16px;
 display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font-size:.875rem;font-weight:600;color:var(--foreground)}
.card p{font-size:.8125rem;color:var(--text-secondary)}
.banner{display:flex;align-items:center;gap:12px;
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 background:var(--surface-subtle);border-radius:var(--radius-lg);padding:12px 14px}
.banner .b-icon{flex-shrink:0;color:var(--muted-foreground);font-size:1rem}
.banner .b-text{flex:1;font-size:.8125rem;color:var(--foreground)}
.banner .b-close{flex-shrink:0;border:0;background:transparent;color:var(--muted-foreground);
 width:26px;height:26px;border-radius:var(--radius-lg);cursor:pointer;font-size:.9rem;line-height:1}
.banner .b-close:hover{background:color-mix(in oklch,var(--foreground) 10%,transparent);color:var(--foreground)}
.banner .b-close:focus-visible{outline:none;box-shadow:0 0 0 1px var(--ring)}
.skeleton{border-radius:var(--radius-lg);background:var(--surface-subtle);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── Sidebar nav states ── */
.nav-demo{display:flex;flex-direction:column;gap:4px;background:var(--surface-subtle);
 border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;max-width:340px}
.nav-row{display:flex;align-items:center;gap:10px;width:100%;text-align:start;
 padding:8px 10px;border-radius:var(--radius-lg);border:1px solid transparent;
 background:transparent;color:var(--muted-foreground);font:inherit;font-size:.875rem;cursor:pointer}
.nav-row .dot{width:14px;height:14px;border-radius:4px;background:currentColor;opacity:.6;flex-shrink:0}
.nav-row.is-hover{background:color-mix(in oklch,var(--foreground) 5%,transparent);color:var(--foreground)}
.nav-row.is-active{background:var(--background);color:var(--foreground);
 border-color:color-mix(in oklch,var(--border) 10%,transparent);font-weight:500}
.nav-row.is-parent-active{color:var(--foreground);font-weight:500;background:transparent}
.nav-state-tag{margin-inline-start:auto;font-size:.65rem;color:var(--muted-foreground)}
/* ── Status tokens: pills + toast ── */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;
 padding:4px 12px;font-size:.75rem;font-weight:550;border:1px solid transparent}
.pill-success{background:color-mix(in oklch,var(--success) 14%,transparent);color:var(--success)}
.pill-warning{background:color-mix(in oklch,var(--warning) 16%,transparent);color:var(--warning)}
.pill-info{background:color-mix(in oklch,var(--info) 14%,transparent);color:var(--info)}
.pill-destructive{background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive)}
.pill-neutral{background:var(--muted);color:var(--muted-foreground)}
.toast{display:flex;gap:10px;align-items:flex-start;max-width:360px;
 background:var(--surface);color:var(--foreground);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 border-radius:var(--radius-lg);padding:12px 14px;box-shadow:0 8px 28px rgb(0 0 0 / .18)}
.toast .t-icon{flex-shrink:0;font-size:.95rem;line-height:1.4}
.toast.success .t-icon{color:var(--success)}
.toast.warning .t-icon{color:var(--warning)}
.toast.info .t-icon{color:var(--info)}
.toast.error .t-icon{color:var(--destructive)}
.toast .t-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.toast .t-title{font-size:.8125rem;font-weight:600}
.toast .t-desc{font-size:.75rem;color:var(--muted-foreground)}
.toast .t-actions{display:flex;gap:8px;margin-top:6px}
.t-btn{border:0;border-radius:var(--radius-lg);padding:4px 10px;font:inherit;font-size:.72rem;
 font-weight:600;cursor:pointer;background:var(--primary);color:var(--primary-foreground)}
.t-btn:hover{opacity:.9}
.t-btn.cancel{background:var(--muted);color:var(--foreground)}
.t-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ring)}
.t-close{flex-shrink:0;background:var(--surface);color:var(--foreground);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 width:22px;height:22px;border-radius:9999px;cursor:pointer;font-size:.7rem;line-height:1}

/* ── Dialog (ConfirmDialog) ── */
.dlg-demo{position:relative;border-radius:var(--radius-lg);overflow:hidden;
 background:color-mix(in oklch,#000 45%,transparent);padding:28px 16px;
 display:flex;align-items:center;justify-content:center}
.dlg{width:min(400px,100%);background:var(--surface);color:var(--foreground);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 border-radius:var(--radius-lg);padding:22px;box-shadow:0 16px 48px rgb(0 0 0 / .3);
 display:flex;flex-direction:column;gap:16px;animation:scaleIn .16s cubic-bezier(.16,1,.3,1) both}
.dlg h3{font-size:1rem;font-weight:650}
.dlg p{font-size:.8125rem;color:var(--muted-foreground)}
.dlg-footer{display:flex;justify-content:flex-end;gap:8px}
.btn-dialog-cancel{background:transparent;border-color:transparent;color:var(--muted-foreground)}
.btn-dialog-cancel:hover{background:color-mix(in oklch,var(--foreground) 5%,transparent);color:var(--foreground)}
/* ── Focus demos ── */
.focus-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--radius-lg);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);background:var(--surface-subtle)}
.focus-card .lbl{font-size:.7rem;font-weight:650;letter-spacing:.06em;
 text-transform:uppercase;color:var(--muted-foreground)}

/* ── Motion ── */
.motion-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.motion-item{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--radius-lg);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);background:var(--surface-subtle)}
.motion-item .m-name{font-size:.78rem;font-weight:600}
.motion-item .m-meta{font-size:.66rem;color:var(--muted-foreground);
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.motion-item .m-why{font-size:.7rem;color:var(--text-secondary)}
.m-box{height:36px;border-radius:var(--radius-lg);background:var(--accent-muted);
 display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--foreground)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(4px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}
.anim-fade-in-up{animation:fadeInUp .22s cubic-bezier(.16,1,.3,1) both}
.anim-fade-in{animation:fadeIn .18s ease-out both}
.anim-scale-in{animation:scaleIn .16s cubic-bezier(.16,1,.3,1) both}
.glow-demo{position:relative}
.glow-demo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 opacity:.5;box-shadow:0 0 32px color-mix(in oklch,var(--destructive) 40%,transparent);
 animation:glowPulse 2.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ── Theme presets ── */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.preset{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-lg);
 border:1px solid color-mix(in oklch,var(--border) 10%,transparent);background:var(--surface-subtle);
 font-size:.8rem}
.preset .sw{width:26px;height:26px;border-radius:50%;flex-shrink:0;
 border:1px solid color-mix(in oklch,var(--border) 15%,transparent)}

footer.doc-footer{margin-top:56px;padding-top:20px;
 border-top:1px solid color-mix(in oklch,var(--border) 10%,transparent);
 display:flex;flex-direction:column;gap:6px;font-size:.72rem;color:var(--muted-foreground)}
footer.doc-footer code{color:var(--text-secondary)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <b>Design System</b>
      <span>lausu renderer — tokens &amp; components, verbatim from source</span>
    </div>
    <div class="mode-switch" role="group" aria-label="Theme mode">
      <button type="button" data-mode="light" aria-pressed="true">Light</button>
      <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
      <button type="button" data-mode="compare" aria-pressed="false">Compare</button>
    </div>
  </div>
</header>
<div class="page">
  <main id="single"></main>

</div>

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function renderTokens(mode){
 const groups=GROUPS.map(([title,items])=>`<div class="tok-group"><h3>${esc(title)}</h3><div class="tok-grid">`+
  items.map(([n,l,d,desc])=>`<div class="tok"><span class="chip" style="background:var(${n})"></span>`+
   `<span class="tok-name">${n}</span><span class="tok-val">${esc(mode==="dark"?d:l)}</span>`+
   `<span class="tok-desc">${esc(desc)}</span></div>`).join("")+`</div></div>`).join("");
 return sec(`<h2>Color tokens</h2><p>oklch values verbatim from <code>renderer/src/index.css</code>.
  <code>--radius</code> = <code>0.625rem</code> (10px). Swatches resolve the live variable for the active mode.</p>`,
 `<div class="tok-groups">${groups}</div>`);
}
function renderTypography(){

 return sec(`<h2>Typography</h2><p><strong>Inter Variable</strong> (weights 100–900) is <code>font-sans</code>; <code>--font-heading</code> aliases it.

 `<div class="type-card">${rows}</div>`);
}
function renderRadius(){
 const radii=[["lg","10px","= --radius · the ONE non-circular radius (buttons, inputs, cards, dialogs)"],
  ["full","circular","exemption: radio, switch, pills, avatars, icon discs"],
  ["sm","4px","compact exemption: 16px checkbox only (rounded-lg would render it circular)"]];
 const boxes=radii.map(([n,px,note])=>`<div class="radius-item"><span class="radius-box" style="border-radius:${n==="full"?"9999px":n==="sm"?"4px":px}"></span>

 const borders=[[ "/5","color-mix(in oklch,var(--border) 5%,transparent)","button outlines, Clear All"],
  ["/10","color-mix(in oklch,var(--border) 10%,transparent)","cards, dialogs, segmented control"],
  ["/15","color-mix(in oklch,var(--border) 15%,transparent)","keycaps, checkboxes"]]
  .map(([n,v,use])=>`<div class="border-swatch" style="border:1px solid ${v}">border-border${n} · ${use}</div>`).join("");
 return sec(`<h2>Radius & borders</h2><p>STANDARDIZED: every non-circular control and panel uses <code>rounded-lg</code> (10px, <code>--radius: 0.625rem</code>),

 `<div class="radius-grid">${boxes}</div><div class="borders">${borders}</div>`);
}

 return sec(`<h2>Segmented control</h2><p><code>role="radiogroup"</code> with a sliding indicator. Tabs variant = bordered card

 </div>
 <p class="note">Left: tabs variant (click to switch). Right: pill variant (fixed width/height indicator).</p></div>`);

function renderCards(){
 return sec(`<h2>Cards, banners & skeletons</h2><p>Card = <code>rounded-lg border border-border/10 bg-surface-subtle</code>.
  The "no model" state is a compact in-flow banner, not a centered empty block (C-MODELS-5). Skeletons mirror real layout (C-SKELETON-1).</p>`,
 `<div class="stack">
  <div class="banner" role="status" data-banner>
   <span class="b-icon" aria-hidden="true">◈</span>
   <span class="b-text">No speech model is selected. Select a model below.</span>
   <button type="button" class="b-close" aria-label="Dismiss" data-banner-close>✕</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
   <div class="card"><h4>Fastest Mini</h4><p>Local · int8 · 75 MB · low VRAM</p>
    <div class="row" style="gap:8px"><span class="pill pill-neutral">Multilingual</span><span class="pill pill-info">Fast</span></div></div>
   <div class="card"><h4>Skeleton loading</h4>
    <span class="skeleton" style="height:14px;width:70%"></span>
    <span class="skeleton" style="height:14px;width:45%"></span>
    <span class="skeleton" style="height:32px;width:96px"></span></div>
  </div>
 </div>`);
}
function renderNav(){
 const row=(cls,label,tag)=>`<button type="button" class="nav-row ${cls}"><span class="dot" aria-hidden="true"></span>${label}<span class="nav-state-tag">${tag}</span></button>`;
 return sec(`<h2>Sidebar nav states</h2><p>Consistent hierarchy (C-UI-3 / C-SIDEBAR-9): idle = muted text only · hover = <code>foreground/5</code> + primary text ·
  active <em>leaf</em> = <code>bg-surface</code> + border/10 · active <em>parent</em> = stronger text only, never a background.</p>`,
 `<div class="nav-demo">
  ${row("","Home","idle")}
  ${row("is-hover","History","hover")}
  ${row("is-active","Models","active leaf")}
  ${row("is-parent-active","Settings ▾","active parent")}
 </div>`);
}
function renderStatus(){
 const pills=[["pill-success","● Success"],["pill-warning","▲ Warning"],["pill-info","ℹ Info"],
  ["pill-destructive","✕ Error"],["pill-neutral","○ Idle"]]
  .map(([c,l])=>`<span class="${c}">${l}</span>`).join("");
 const toast=(type,icon,title,desc,actions)=>`<div class="toast ${type}">
  <span class="t-icon" aria-hidden="true">${icon}</span>
  <span class="t-body"><span class="t-title">${title}</span><span class="t-desc">${desc}</span>${actions}</span>
  <button type="button" class="t-close" aria-label="Close">✕</button></div>`;
 return sec(`<h2>Status, pills & toasts</h2><p>Status tokens (<code>--success/-warning/-info/-destructive</code>) drive pill/ toast icon colours.
  Toast surface = <code>--surface</code>, description = <code>--muted-foreground</code>, action = solid primary, cancel = muted fill (index.css sonner block).</p>`,
 `<div class="stack"><div class="row">${pills}</div>
  <div class="row" style="align-items:flex-start;gap:12px">
   ${toast("success","✓","Model downloaded","fastest-mini.en was installed successfully.",
    `<span class="t-actions"><button type="button" class="t-btn">Open Models</button><button type="button" class="t-btn cancel">Dismiss</button></span>`)}
   ${toast("error","✕","Transcription failed","Cloud provider returned 401 — check your API key.","")}
   ${toast("info","ℹ","Update available","Version 2.4.0 is ready to install.","")}
  </div></div>`);
}
function renderDialog(){
 return sec(`<h2>Dialog (ConfirmDialog)</h2><p>Surface = <code>--surface</code> + <code>border-border/10</code>, enters with scaleIn 160ms.
  Cancel is tertiary: <code>text-muted-foreground</code> → hover foreground/5 + primary text. Confirm (destructive) is solid red + near-white label.</p>`,
 `<div class="dlg-demo"><div class="dlg" role="alertdialog" aria-label="Demo confirm dialog">
  <h3>Delete history?</h3>
  <p>This permanently removes all 128 transcriptions. This action cannot be undone.</p>
  <div class="dlg-footer">
   <button type="button" class="btn btn-dialog-cancel">Cancel</button>
   <button type="button" class="btn btn-destructive-solid">Delete</button>
  </div>
 </div></div>`);
}
function renderFocus(){
 return sec(`<h2>Focus indicators</h2><p>Never removed (C-FOCUS-1): components replace the default outline with a <strong>1px full-opacity <code>ring-ring</code></strong>
  (C-FOCUS-2/5, pinned by <code>focus-ring-contrast.test.tsx</code>); everything else falls back to <code>outline: 2px solid var(--ring)</code>.
  Text inputs suppress the ring for pointer focus only (C-FOCUS-3). Use <kbd>Tab</kbd> below — the indicators must stay visible.</p>`,
 `<div class="row" style="gap:12px;align-items:stretch">
  <div class="focus-card"><span class="lbl">Button</span>
   <span class="row"><button type="button" class="btn btn-default">Focusable</button>
   <button type="button" class="btn btn-ghost">Ghost</button></span></div>
  <div class="focus-card" style="min-width:240px"><span class="lbl">Input — click vs Tab</span>
   <input class="input" type="text" placeholder="Click (tint) then Tab (ring)…"></div>
  <div class="focus-card"><span class="lbl">Switch / checkbox</span>
   <span class="row"><label class="switch"><input type="checkbox" checked aria-label="Focus demo switch"><span class="thumb"></span></label>
   <label class="checkbox"><input type="checkbox" aria-label="Focus demo checkbox"></label></span></div>
 </div>`);
}
function renderMotion(){
 const items=[
  ["fadeInUp","animate-fade-in-up","220ms cubic-bezier(.16,1,.3,1)","Page mount: fade + drift + unblur","anim-fade-in-up"],
  ["fadeIn","animate-fade-in","180ms ease-out","In-place content swap","anim-fade-in"],
  ["scaleIn","animate-scale-in","160ms cubic-bezier(.16,1,.3,1)","Modal/dialog enter","anim-scale-in"],
  ["slideUp","animate-slide-up","220ms cubic-bezier(.16,1,.3,1)","Snackbar slide-up","anim-fade-in"],
  ["glowPulse","animate-glow-pulse","2.5s ease-in-out infinite","Mic idle glow (compositor-only)","glow-demo"],
  ["pulse / skeleton","animate-pulse","2s ease-in-out infinite","Skeleton shimmer",""]
 ].map(([name,cls,meta,why,extra])=>`<div class="motion-item">
  <span class="m-name">${name}</span><span class="m-meta">${cls} · ${meta}</span>
  <span class="m-box ${extra} ${cls.startsWith("anim")?cls:""}" style="${extra==="glow-demo"?"border-radius:9999px":""}">demo</span>
  <span class="m-why">${why}</span></div>`).join("");
 return sec(`<h2>Motion</h2><p>Also: <code>press-scale</code> (active → scale .95), <code>bubbleEnter/Exit</code>, <code>pulseRing</code> (1.8s recording ring),
  collapsible up/down for the Settings submenu. <code>prefers-reduced-motion</code> collapses every animation to 0.01ms app-wide.</p>`,
 `<div class="motion-grid">${items}</div>`);
}
const PRESETS=[["default","var(--primary)"],["amoled","oklch(0 0 0)"],["nord","oklch(0.5 0.06 240)"],
 ["dracula","oklch(0.5 0.16 320)"],["sepia","oklch(0.6 0.08 50)"],["custom","var(--primary)"],
 ["monokai","oklch(0.75 0.15 100)"],["ayu","oklch(0.7 0.14 70)"],["github","oklch(0.5 0.12 260)"],
 ["catppuccin","oklch(0.65 0.12 330)"],["tokyo-night","oklch(0.55 0.14 280)"],["solarized","oklch(0.6 0.1 200)"]];
function renderPresets(){
 const cells=PRESETS.map(([name,sw])=>`<div class="preset"><span class="sw" style="background:${sw}"></span>${name}</div>`).join("");
 return sec(`<h2>Theme presets</h2><p>12 presets (<code>renderer/src/themes/</code>): the default stylesheet theme, custom, and 10 lazy-loaded presets.
  Each overrides the same variable set for BOTH light and dark; swatches below are the preset metadata colours from <code>themes/index.ts</code>.</p>`,
 `<div class="preset-grid">${cells}</div>`);
}
function renderFooter(){
 return `<footer class="doc-footer">
  <span>Sources: <code>voice_typer/client/src/renderer/src/index.css</code> (tokens, motion, sonner) · <code>components/ui/button.tsx</code> · <code>components/ui/input.tsx</code> · <code>components/ui/switch.tsx</code> · <code>components/ui/checkbox.tsx</code> · <code>components/ui/segmented-control.tsx</code> · <code>components/common/Kbd.tsx</code> · <code>components/common/ConfirmDialog.tsx</code> · <code>themes.ts</code> / <code>themes/index.ts</code>.</span>
  <span>Layout uses parent-level <code>gap-*</code> for inter-child spacing (C-UI-10). No <code>+</code> between shortcut keys (C-UI-1). This page is documentation, not shipped app code.</span>
  <span><strong>Sync rule (AGENTS.md C-DESIGN-1):</strong> this file and the live renderer design system MUST be updated together, in both directions — never one without the other.</span>
 </footer>`;
}
const SECTIONS=mode=>[
 renderTokens(mode),renderTypography(),renderRadius(),renderButtons(),renderForms(),
 renderKeycaps(),renderSegmented(),renderCards(),renderNav(),renderStatus(),renderDialog(),
 renderFocus(),renderMotion(),renderPresets(),renderFooter()
].join("");
let mode="light";
function positionIndicators(root){
 root.querySelectorAll("[data-seg]").forEach(segEl=>{
  const active=segEl.querySelector('.seg-btn[aria-checked="true"]');
  const ind=segEl.querySelector(".seg-ind");
  if(!active||!ind)return;
  if(segEl.classList.contains("pill")){ind.style.display="none";return;}
  ind.style.display="";
  ind.style.left=active.offsetLeft+"px";
  ind.style.width=active.offsetWidth+"px";
 });
}
function renderAll(){
 const single=document.getElementById("single");
 const compare=document.getElementById("compare");
 if(mode==="compare"){
  single.innerHTML="";
  compare.innerHTML=
   `<div class="scope tokens-light"><span class="scope-label">Light</span>${SECTIONS("light")}</div>`+
   `<div class="scope tokens-dark"><span class="scope-label">Dark</span>${SECTIONS("dark")}</div>`;
 }else{
  compare.innerHTML="";
  single.innerHTML=SECTIONS(mode);
 }
 positionIndicators(document);
}
function setMode(next){
 mode=next;
 document.documentElement.classList.toggle("dark",mode==="dark");
 document.body.classList.toggle("compare",mode==="compare");
 document.querySelectorAll(".mode-switch button").forEach(b=>
  b.setAttribute("aria-pressed",String(b.dataset.mode===mode)));
 renderAll();
 try{history.replaceState(null,"","#"+mode);}catch(e){/* file:// may deny */}
}
document.addEventListener("click",e=>{
 const modeBtn=e.target.closest(".mode-switch button");
 if(modeBtn){setMode(modeBtn.dataset.mode);return;}
 const segBtn=e.target.closest(".seg-btn");
 if(segBtn){
  const segEl=segBtn.closest("[data-seg]");
  segEl.querySelectorAll(".seg-btn").forEach(b=>b.setAttribute("aria-checked","false"));
  segBtn.setAttribute("aria-checked","true");
  positionIndicators(segEl);
  return;
 }
 if(e.target.closest("[data-banner-close]")){
  e.target.closest("[data-banner]")?.remove();
 }
});
/* Pointer-modality focus (C-FOCUS-3): pointerdown marks inputs, Tab clears it. */
document.addEventListener("pointerdown",e=>{
 e.target.closest(".input")?.setAttribute("data-focus","pointer");
},true);
document.addEventListener("keydown",e=>{
 if(e.key==="Tab")document.querySelectorAll('.input[data-focus="pointer"]')
  .forEach(el=>el.removeAttribute("data-focus"));
});
window.addEventListener("resize",()=>positionIndicators(document));
const initial=(location.hash||"").replace("#","");
setMode(["light","dark","compare"].includes(initial)?initial:"light");
</script>
