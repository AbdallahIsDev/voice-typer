[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
# BUILD-N22: although we use setuptools as the build backend, we also
# declare a hatch/uv compatibility hint for tools that auto-detect the
# build system. uv reads [tool.uv] for resolution preferences.

[tool.uv]
# BUILD-N22: pin a default Python for uv users so `uv sync` reproduces
# the same environment as the CI matrix.
python-preference = "managed"
# BUILD-N25 / TASK-8: previously this block declared
# `supported-python-versions = ["3.10","3.11","3.12","3.13","3.14"]`,
# but that is not a real uv field — uv 0.5+ rejects it with a TOML
# parse warning. uv honors `[project].requires-python` (">=3.10") for
# version gating, which already allows 3.10-3.14 and beyond. We use
# `environments` below to cap the *resolution* envelope at <3.15 so
# that optional extras whose upstream wheels stop at 3.14 (e.g.
# `qwen-asr`, NVIDIA CUDA wheels) don't make `uv sync` fail for a
# Python the user isn't even running. This matches the project's
# documented support window (3.10-3.14, per BUILD-N25).
environments = [
    "python_version >= '3.10' and python_version < '3.15'",
]

[project]
name = "voice-typer"
version = "1.0.0"
description = "Background voice-to-text utility with system tray"
requires-python = ">=3.10"
# NEW-DOC-012: added standard project metadata fields.
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Abdallah IsDev", email = "noreply@github.com"},
]
keywords = [
    "voice-to-text",
    "speech-to-text",
    "asr",
    "whisper",
    "dictation",
    "accessibility",
    "offline",
    "tray",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Accessibility",
]
dependencies = [
    # faster-whisper is the primary ASR backend (transcription.py,
    # parakeet_engine.py, qwen_engine.py). The <2.0 cap guards against the
    # pre-1.0 → 1.0 API churn (the `BatchedInferencePipeline` redesign);
    # 2.x is expected to introduce a similar breaking-change wave.
    # The `>=1.0` floor matches the first stable release of the new API.
    "faster-whisper>=1.0,<2.0",
    # CR-DEP-2: sounddevice is the cross-platform PortAudio binding used by
    # audio_processor.py + microphone_watcher.py. The <1.0 cap reflects
    # that 1.x has not been released yet (upstream is on 0.5.x); a 1.0
    # release would signal a major API redesign that needs validation.
    # The `>=0.5` floor matches the first release with the `Stream` callback
    # signature we depend on.
    "sounddevice>=0.5,<1.0",
    # BUILD-N03 (2026-08-03): numpy 2.x is required — Python 3.13 has no
    # numpy 1.x wheels (1.26.4 is the last 1.x and only supports <=3.12),
    # so the old <2.0 cap forced uv to source-build numpy 1.26.4 on the
    # 3.13 CI legs, and that build segfaults at import on Windows
    # ("Windows fatal exception: access violation" in numpy.core.getlimits
    # during the mock_heavy_imports fixture's app.py import). numpy 2.x is
    # verified API-compatible with this codebase (no removed 1.x aliases
    # in use) and installs official wheels on every supported Python.
    # The <3 cap is the standard major-version guard (mirrors the
    # scipy <2.0 / faster-whisper <2.0 caps) — numpy 3.0 is not announced,
    # but a major bump is permitted to break 2.x APIs (e.g. the future
    # removal of deprecated aliases this codebase may still rely on).
    "numpy>=2.0,<3",
    # scipy.signal is used by audio_filters/ for the resampler
    # + biquad filters. The <2.0 cap is the standard major-version guard —
    # scipy 2.x is not yet on any announced roadmap but the project's
    # backward-compat policy permits breaking changes at major bumps.
    # The `>=1.10` floor matches the first release with the `sosfiltfilt`
    # `padtype='even'` fix we use in noise_suppressor.py.
    "scipy>=1.10,<2.0",
    # pyperclip is the cross-platform clipboard bridge used by
    # clipboard.py on Linux/BSD (Win/Mac use native ctypes calls instead).
    # The <2.0 cap guards against the upstream maintainer's announced 2.x
    # redesign (qtpy-style plugin backends). The `>=1.8` floor matches the
    # first release with the Wayland `wl-copy` fallback we depend on.
    "pyperclip>=1.8,<2.0",
    # pin pystray to the 0.19 minor series. tray.py:_apply_state
    # reaches into pystray's private `_icon_handle` attribute to work
    # around a Win32 DestroyIcon bug (WinError 1402) on rapid icon
    # updates. The private attribute has been stable across 0.19.x but
    # is NOT part of the public API — a 0.20+ release could rename or
    # remove it, silently breaking the workaround. The tight pin
    # `>=0.19,<0.20` ensures the workaround stays effective until an
    # upstream `reset_icon_handle()` API lands (TODO file upstream
    # issue for public reset_icon_handle() API).
    #
    # SUPPLY-CHAIN NOTE: pystray 0.19.5 (Dec 2022, >3 years old)
    # is licensed LGPL-3.0-or-later and has had no upstream releases for
    # >3 years. The LGPL §4d re-linking obligation may not be satisfied
    # when statically bundled into the Nuitka/PyInstaller frozen binary
    # — see `docs/migration/signing-guide.md` for the open compliance
    # gap. Alternative libraries (e.g. `trayicon`, `system-tray`) were
    # evaluated but lack Linux SNI support. Track upstream activity at
    # https://github.com/moses-palmer/pystray — a fork or replacement
    # is queued as a CR follow-up (TODO XS-76).
    "pystray>=0.19,<0.20",
    # floor raised to >=10.3.0 — 13 CVEs affect Pillow <10.3.0.
    "Pillow>=10.3.0,<13.0",
    # pynput is the cross-platform hotkey + keyboard-event
    # listener used by keyboard_ownership.py + native_hotkeys.py.
    # The <2.0 cap is critical: pynput 2.x (released 2024) rearchitected
    # the listener backend — the `Listener.thread` attribute, the
    # `keyboard.Listener._on_release` hook, and the win32 `KeyboardEvent`
    # shape all changed. Our keyboard_ownership watchdog depends on
    # `Listener.thread` to detect a wedged listener; a 2.x bump would
    # silently break the watchdog (it would never fire).
    # The `>=1.7` floor matches the first release with the `mouse.Listener`
    # `suppress=True` flag we use for the bubble-drag capture path.
    "pynput>=1.7,<2.0",
    # torch + transformers + qwen-asr REMOVED 2026-08-15 (Phase 1d):
    # qwen_engine.py migrated to the ONNX-only backend
    # (qwen_onnx_model.py — pre-exported andrewleech/qwen3-asr-*-onnx
    # via onnxruntime, no torch). Parakeet + VAD were already ONNX
    # (Phase 1b/1c). torch>=2.0,<3.0, transformers>=5.14.1,<6.0 and the
    # `qwen-asr` extra were the LAST torch-family deps; nothing imports
    # them anymore (verified `grep -rn "^import torch" voice_typer/` →
    # 0 hits). The installer is now torch-free.
    # Phase 1b (§3.3 Option B-1): onnx-asr provides the
    # `load_model(name, path=..., quantization=..., providers=...)`
    # function + `recognize(audio, *, sample_rate=...)` adapter used by
    # the rewritten parakeet_engine.py (onnx-asr 0.12.0 exports ONLY
    # `load_model` / `load_vad` — there is no `Model` class). The
    # `>=0.12.0` floor matches the first release with the `quantization`
    # kwarg + the `recognize(audio, *, sample_rate=...)` signature
    # (older 0.11.x had a positional-only `recognize(audio, sr)` and no
    # quantization support — breaks parakeet_engine.py:_load_impl). No
    # upper cap yet (the API is stable; a future 1.0 redesign would
    # need re-validation of the `_select_providers` mapping).
    "onnx-asr>=0.12.0",
    # Phase 1a + §5.3 (companion plan): onnxruntime is declared
    # explicitly because after the slim-core / runtime-pack split
    # (plan-runtime-pack-split.md §3.3 + §5.3), faster-whisper moves to
    # the runtime-pack and the slim core loses the transitive
    # onnxruntime dep. The slim core's VAD (silero_vad.onnx via ORT
    # InferenceSession) and Parakeet (via onnx-asr which wraps ORT) both
    # need ORT directly, so the slim core MUST declare it explicitly.
    # The `>=1.20` floor matches the first release with the
    # `RunOptions.set_terminate()` API used by parakeet_engine.py's
    # `request_abort()` path (added in 1.20 — verified against ORT
    # changelog). The lockfile currently resolves to 1.28.0 (pulled
    # transitively by faster-whisper per requirements-lock.txt:1048);
    # declaring it explicitly here keeps the slim core working after
    # faster-whisper is moved to the pack. NOTE: this is the CPU wheel
    # only — GPU users install `onnxruntime-gpu` separately (see §6.1
    # for why onnxruntime-gpu does NOT bundle NVIDIA DLLs and
    # nvidia_dll_paths.py is still required).
    # onnxruntime 1.24+ stopped shipping cp310 wheels (its `requires-python`
    # metadata still claims >=3.10, which is stale), so the lockfile resolver
    # must be told the real floor. Without the upper bound, `uv pip compile
    # --universal` pins a 1.24+ release for the `python_version < '3.11'`
    # branch (trusting the stale metadata), and `pip install --require-hashes`
    # then fails on Python 3.10 with "No matching distribution found".
    "onnxruntime>=1.20,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20; python_version >= '3.11'",
    # tokenizers is imported directly by the Qwen3-ASR ONNX backend
    # (qwen_onnx_model.py — ``Tokenizer.from_file`` for the ASR prompt
    # decode). It is pulled transitively by the declared
    # ``transformers>=5.14.1`` dep, but the ONNX path (PLAN_ONNX_INTEGRATION
    # §4.3 C-2) intends to be the torch-free Qwen option, so the direct
    # import gets a direct declaration (E13 — declare what you import;
    # survives the eventual transformers removal at Phase 1d).
    "tokenizers>=0.21,<1",
    # psutil is used by _another_voice_typer_alive
    # (ARCH-012) and is required for process scanning on all platforms.
    "psutil>=5.9,<8.0",
    # huggingface_hub is used by asr_setup.py,
    # parakeet_engine.py, service.py, and transcription.py for
    # snapshot_download. Previously imported with # type: ignore
    # but not declared — cold pip install succeeded but first model
    # load crashed with ModuleNotFoundError.
    "huggingface_hub>=1.24.0,<2.0",
    # Volume ducking on Windows — pycaw wraps the Win32
    # IAudioSessionManager2 COM interface (used by WinVolumeBackend to
    # duck other apps' audio while Voice Typer is dictating).
    # Lazy-imported in WinVolumeBackend — safe on other platforms.
    #
    # `<20240407` upper bound caps at the next yearly release
    # tag. pycaw uses date-based versioning (YYYYMMDD); a calendar-bump
    # could include COM-binding changes that break the duck-session
    # lifecycle. Re-validate the `ISAudioSessionControl` shim on each
    # upstream release.
    #
    # SUPPLY-CHAIN NOTE: pycaw had a multi-year dormant stretch (last
    # commit Mar 2023), but it is NOT abandoned — a date-based release
    # (20251023, per volume_backends/windows.py which handles BOTH the
    # pre- and post-20251023 API generations) landed in Oct 2025,
    # reviving the project. This comment used to claim "abandonment"
    # as fact; the pin below (<20240407) deliberately EXCLUDES that
    # revival (conservative — re-validate the ISAudioSessionControl
    # shim before widening), and the WinVolumeBackend shim already
    # supports the new API either way. Track
    # upstream at https://github.com/AndreMiras/pycaw — alternative
    # (direct ctypes bindings to the COM interface) is queued as a CR
    # follow-up (TODO XS-76).
    "pycaw>=20230407,<20251024; sys_platform == 'win32'",
    # comtypes is the generic Python ↔ COM bridge required
    # by pycaw (transitively) and directly by
    # microphone_watcher_win32.py (IMMNotificationClient callback).
    # Lazy-imported — safe on other platforms.
    #
    # `<2.0` upper bound — comtypes 2.x is in active development
    # by the upstream maintainers (github.com/enthought/comtypes) and
    # introduces breaking changes to the `GUID` / `IUnknown` runtime
    # coercion. The `>=1.1` floor matches the first release with the
    # `comtypes.client.GetEvents` sink we depend on.
    "comtypes>=1.1,<2.0; sys_platform == 'win32'",
    # Volume ducking on macOS (CoreAudio via pyobjc).
    # Lazy-imported in MacVolumeBackend — safe on other platforms.
    # pyobjc 11+ has no wheels for Python 3.10/3.11 on macOS; use 9.x floor
    # for older Python, 11.0+ for Python 3.12+ (which needs the newer ABI).
    #
    # `<12.0` upper bound on every pyobjc-* dep — pyobjc 12.x is
    # expected to drop support for macOS 11 (Big Sur), which is still
    # in our support matrix (see docs/PLATFORM_STATUS.md). Bump the cap
    # ONLY after the platform-support matrix is updated. The pyobjc-*
    # packages share a coordinated release train — all four deps MUST
    # stay on the same major to avoid ABI mismatches at the framework-
    # bridge boundary (pyobjc-core's `objc.pyobjc_id` ABI is consumed
    # by every pyobjc-framework-* package).
    "pyobjc-core>=9.0,<12.0; sys_platform == 'darwin' and python_version < '3.12'",
    "pyobjc-core>=11.0,<13.0; sys_platform == 'darwin' and python_version >= '3.12'",
    "pyobjc-framework-CoreAudio>=9.0,<12.0; sys_platform == 'darwin' and python_version < '3.12'",
    "pyobjc-framework-CoreAudio>=11.0,<13.0; sys_platform == 'darwin' and python_version >= '3.12'",
    # NEW-XPLAT-004: pystray on macOS uses Cocoa (AppKit) via pyobjc.
    # Without pyobjc-framework-Cocoa installed, pystray.Icon() raises
    # ImportError at runtime and the tray silently fails.  Adding the
    # explicit dep here so a fresh ``pip install voice-typer`` on
    # macOS gets a working tray out of the box.
    "pyobjc-framework-Cocoa>=9.0,<12.0; sys_platform == 'darwin' and python_version < '3.12'",
    "pyobjc-framework-Cocoa>=11.0,<13.0; sys_platform == 'darwin' and python_version >= '3.12'",
    # CoreFoundation symbols (CFRunLoopRun / CFRunLoopStop / CFRunLoopGetCurrent)
    # are used by microphone_watcher_coreaudio.py for the event-driven
    # CoreAudio device-list listener. These symbols ship inside
    # pyobjc-core, not as a separate pyobjc-framework-CoreFoundation
    # package. pyobjc-core is already declared above.

    # permissions.py:734 imports AXIsProcessTrustedWithOptions from
    # ApplicationServices for the pre-flight accessibility-trust probe.
    # Without this dep, the try/except ImportError at permissions.py
    # silently falls back to PermissionState.UNKNOWN — the user is never
    # told accessibility permission is missing until the native hotkey
    # listener fails at runtime. Adding the explicit dep makes the probe
    # actually work on a fresh `pip install voice-typer[macos]`.
    "pyobjc-framework-ApplicationServices>=9.0,<12.0; sys_platform == 'darwin' and python_version < '3.12'",
    "pyobjc-framework-ApplicationServices>=11.0,<13.0; sys_platform == 'darwin' and python_version >= '3.12'",
    # ADR 0007: RNNoise is now a default dependency (was optional).
    # BSD-licensed, ~2MB, <1ms per frame. Required for the NoiseSuppressor
    # filter in the audio filter chain.
    # Excluded on macOS ARM64 (no prebuilt wheel — see deepfilternet extra).
    #
    # `<1.0` upper bound — pyrnnoise is a thin ctypes wrapper over
    # the upstream RNNoise C library; a 1.0 release would signal a
    # re-architecture (the wrapper currently exposes `RNNModel.from_file`
    # + `RNNoise.process_frame` — a 1.0 redesign could rename either).
    # The `>=0.4` floor matches the first release with the macOS x86_64
    # wheel our CI matrix needs.
    "pyrnnoise>=0.4,<1.0; platform_machine != 'arm64' or sys_platform != 'darwin'",
    # ADR-0020 §14: websockets is required for the Tauri sidecar
    # transport. The Electron path uses raw TCP and does not need this
    # dep, but it is small (~200 KB) and pure-Python, so it's safe to
    # install everywhere. Lazy-imported in sidecar_ws.py so the
    # Electron-only path doesn't pay the import cost.
    "websockets>=12.0,<17.0",
    # keyring is used by credential_store.py to store API keys
    # (OpenAI / Groq / Deepgram / LLM) in the OS-native credential
    # backend (Windows Credential Manager, macOS Keychain, libsecret on
    # Linux) instead of plaintext in config.json. Cross-platform — the
    # library auto-selects the right backend at runtime. When no backend
    # is available (e.g. headless Linux without gnome-keyring-daemon),
    # credential_store falls back to the existing plaintext-in-config.json
    # behavior with 0o600 perms on POSIX.
    "keyring>=25.0,<26.0",
    # _text_encryption.py imports Fernet / InvalidToken from
    # cryptography.fernet for the opt-in at-rest encryption of the
    # history ``text`` column. The ``>=42`` floor matches the first
    # release of the current py.typed API surface we consume
    # (Fernet.generate_key / encrypt / decrypt + InvalidToken); no
    # upper cap — that API has been stable across every major since.
    # The module degrades to plaintext if the import fails, but it is
    # a base dependency so a normal install always provides it.
    "cryptography>=42",
]

[project.urls]
# standard project URLs for PyPI / GitHub sidebar.
Homepage = "https://github.com/AbdallahIsDev/voice-typer"
Repository = "https://github.com/AbdallahIsDev/voice-typer"
Issues = "https://github.com/AbdallahIsDev/voice-typer/issues"
Changelog = "https://github.com/AbdallahIsDev/voice-typer/blob/main/CHANGELOG.md"

[project.scripts]
voice-typer = "voice_typer.server.ipc_server:main"

[project.optional-dependencies]
# include modern test deps so CI is brittle-free.
# pytest-asyncio: for async tests (cloud engine urlopen mocks).
# pytest-timeout: hard cap on individual test runtime.
# pytest-cov: coverage reporting.
# pytest-mock: MagicMock fixture.
test = [
    "pytest>=7,<10",
    # pytest-mock removed — verified zero usages of `mocker` fixture
    # across tests/ (tests use monkeypatch + unittest.mock.patch instead).
    "pytest-asyncio>=0.23,<2",
    "pytest-timeout>=2.3,<3",
    "pytest-cov>=4.1,<8",
    # hypothesis for property-based testing
    "hypothesis>=6.0,<7",
    # pytest-benchmark for performance benchmarks
    "pytest-benchmark>=4.0,<6",
    # pytest-xdist so the 309-file test suite can run in
    # parallel on multi-core CI runners (cuts the per-leg wall time
    # from ~25 min to ~5-7 min on a 4-core runner). Local single-
    # core invocations are unaffected — pytest-xdist only activates
    # when ``-n auto`` (or similar) is passed. CI's pytest step
    # passes ``-n auto`` explicitly (see .github/workflows/build.yml).
    "pytest-xdist>=3.5,<4",
]
# PyInstaller spec file lives at scripts/build/voice-typer.spec
# but the tool itself wasn't declared. Make it an optional extra so
# `pip install .[build]` produces a buildable environment.
build = [
    "pyinstaller>=6.0,<7",
    "setuptools>=68.0,<85",
    # Explicit floor so `pip install .[build]` never resolves an
    # unbounded `wheel` (which has no upper bound anyway, but a floor
    # pins the bdist_wheel behavior we depend on for the installer).
    "wheel>=0.38",
]
# Windows volume ducking — kept as alias for explicit pip install .[windows]
# include pywin32 so shortcut creation uses the native COM
# approach (WScript.Shell via win32com.client) instead of falling back
# to the slower, less robust PowerShell path. pywin32 is ~10 MB which
# is acceptable for the Windows installer payload.
# pycaw + comtypes are NO LONGER duplicated here — they are
# declared in [project].dependencies with `sys_platform == 'win32'`
# markers, which is the single source of truth. This alias now contains
# only pywin32 (the one Windows-only dep that's NOT in
# [project].dependencies because it's only needed for shortcut creation,
# not for the core volume-ducking path).
windows = [
    "pywin32>=306,<313; sys_platform == 'win32'",
]
# macOS volume ducking — kept as alias for explicit pip install .[macos]
# all pyobjc-* deps are NO LONGER duplicated here — they are
# declared in [project].dependencies with `sys_platform == 'darwin'`
# markers, which is the single source of truth. This alias is now an
# empty list (kept for backward-compat with `pip install .[macos]`).
macos = []
# dbus-python is soft-guard-imported in tray.py (Linux Wayland
# StatusNotifierItem detection) but was undeclared. It stays OPTIONAL, not
# a core dep: dbus-python ships as sdist-only on PyPI and needs system
# libdbus headers (libdbus-1-dev) to build — forcing it on every Linux
# install would break minimal/container installs, and tray.py already
# degrades gracefully when it's absent. Install explicitly on Linux
# desktops that want proper SNI tray detection: pip install .[linux]
linux = ["dbus-python>=1.3,<2; sys_platform == 'linux'"]
# ADR 0007: Noise filtering — RNNoise is now a default dep (above).
# noisereduce is removed (post-capture denoise deleted per ADR 0007 §3.8).
# DeepFilterNet is offered as a premium alternative to RNNoise (requires torch).
deepfilternet = [
    "deepfilternet>=0.5,<1",
]
# dev tooling for local contributors.
dev = [
    # TX-41: ruff version-skew fix. Previously `ruff>=0.6,<1`, which let
    # `pip install -e ".[dev]"` resolve to the latest 0.16.x patch (e.g.
    # 0.16.1) while `.pre-commit-config.yaml` pinned the pre-commit hook
    # to `v0.16.0` and CI (build.yml) installed ruff unpinned. The three
    # surfaces (dev extra, pre-commit, CI) ran different ruff versions,
    # so a contributor could see lint failures locally that CI didn't
    # catch (or vice-versa). The range is narrowed to `>=0.16,<0.17` so
    # the dev extra accepts any 0.16.x patch but rejects a minor bump
    # (0.17) that could change rule semantics. CI installs the exact
    # `ruff==0.16.0` to match the pre-commit hook pin; both surfaces are
    # therefore deterministic and align with the floor of this range.
    "ruff>=0.16,<0.17",
    "mypy>=1.10,<3",
    "pre-commit>=3.7,<5",
    # TEST-010: mutmut for mutation testing
    "mutmut>=2.4,<4",
    # pin pyrefly to the exact 1.1.1 release used by CI
    # (see `.github/workflows/build.yml` → "Run pyrefly type check" step,
    # which installs `pyrefly==1.2.0` via `uv pip install --system`).
    # Without this pin, a local `pip install -e ".[dev]"` would pull the
    # latest pyrefly release, whose error heuristics may differ from
    # CI's, causing local-vs-CI drift on the baseline-audit gate. The
    # baseline file (`pyrefly-baseline.json`) is regenerated against a
    # specific pyrefly version and is meaningful ONLY when compared
    # across runs of the same version. Per the Critical Architecture
    # Rules, this pin must NEVER be loosened to a `>=` range — bump it
    # only as an atomic coordinated change (pyproject.toml + build.yml
    # + regenerated baseline).
    "pyrefly==1.2.0",
]

# ── pyrefly (fast Rust-based Python type checker) ─────────────────────
# TEST-036: pyrefly IS run in CI as a soft gate. See
# `.github/workflows/build.yml` → "Run pyrefly type check" step. The CI
# invocation is `pyrefly check voice_typer/` and uses
# `continue-on-error: true` while the existing ~276 errors are cleaned
# up. Tests are NOT checked in CI (they carry inline
# `# pyrefly: ignore` annotations) but remain in `project-includes`
# below so contributors can run `pyrefly check` locally to type-check
# the whole project.
#
# What is checked:
#   - All `.py` files under `voice_typer/` and `tests/`.
#   - Python 3.12 language level (matches the CI matrix baseline at
#     `python-version: "3.12"` in build.yml).
#
# Severity model:
#   - Pyrefly's built-in defaults are used (no per-rule overrides).
#   - All diagnostics default to `error` severity; suppress specific
#     sites with `# pyrefly: ignore [<rule>]` rather than weakening the
#     global config so that new regressions stay loud.
#   - Platform-only imports (e.g. `pycaw` on Windows, `webrtc-audio-
#     processing` on Linux) emit `missing-import` on non-native
#     runners; these are expected and the surrounding `try/except
#     ImportError` already guards them at runtime.
#
# Local usage:
#   pyrefly check               # uses project-includes below
#   pyrefly check voice_typer/  # mirrors the CI invocation
[tool.pyrefly]
python-version = "3.12"
project-includes = ["voice_typer", "tests"]
project-excludes = ["voice_typer/client/**", "build/**", "dist/**"]
# PYREFLY-002: baseline file containing suppressed type errors. The
# baseline captures known platform-specific false positives (e.g.
# O_NOFOLLOW on Windows, WNOHANG on Linux, optional import errors for
# win32gui/comtypes/qwen_asr, and None-narrowing limitations through
# threading locks). Only NEW errors (not in the baseline) will be
# reported as failures, allowing the codebase to stay clean without
# inline `# pyrefly: ignore` suppression comments.
baseline = "pyrefly-baseline.json"
# PYREFLY-001: local stubs for platform-only deps (pycaw, comtypes, pyobjc)
# These are never installed on the CI runner's platform, so pyrefly
# reports missing-import. The stubs declare the import surface with
# permissive types so type-checking proceeds on the real code paths.
# (XS-91: the previous comment also listed ``webrtc`` but no
# ``webrtcvad.pyi`` / ``webrtc-audio-processing.pyi`` stub is
# checked in — ``webrtcvad`` is a C-extension that pyrefly resolves
# via the active-interpreter site-packages search path, not via a
# local stub. Removed the stale reference.)
#
# TASK-13: extended `search-path` to also include the project venv's
# site-packages. The directive reported 73 false-positive
# `missing-import` (Class A) errors for third-party deps (numpy, torch,
# scipy.signal, huggingface_hub, PIL, pynput.*, sounddevice, pyperclip,
# transformers, psutil, faster_whisper, ctranslate2, pystray, win32gui,
# win32com.client, qwen_asr). Those are NOT real code bugs — pyrefly
# simply wasn't searching the venv. (On Windows pyrefly auto-queries the
# interpreter for site-packages, but on the Linux CI runner the
# interpreter query fails with EACCES on `/app/.venv/bin/python3`, so
# pyrefly falls back to the bare config search path.)
#
# NOTE on key name: the task brief suggested `extra-paths`, but pyrefly
# 1.x emits `WARN Extra keys found in config: extra-paths` and silently
# ignores it. The valid key (per `pyrefly check --help` →
# `--search-path`) is `search-path`. Verified empirically: adding the
# venv to `search-path` drops missing-imports from 73 → 2 (win32gui,
# win32com.client — all platform-only / optional, already in
# `pyrefly-baseline.json`). With the baseline applied, missing-imports
# drop to 0. (qwen_asr + torch + transformers removed 2026-08-15.)
#
# Note: the hardcoded `.venv/lib/python3.12/site-packages`
# entry was REMOVED from `search-path`. Rationale: pyrefly 1.x
# auto-discovers the active interpreter's site-packages via
# `sysconfig.get_paths()` when the active interpreter is a real venv
# (and the `python-version = "3.12"` setting above pins the language
# level).  The hard-coded relative path was fragile — it broke on
# non-3.12 interpreters, on CI runners where the venv lives at a
# different relative location, and on contributor machines using
# `.venv`-less setups (uv/pipx/pip install -e .).  Only the local
# stubs directory is kept (it ships with the repo and is the single
# source of truth for platform-only deps that pyrefly can't probe).
search-path = [
    "voice_typer/stubs",
]

# TEST-010: mutmut configuration for mutation testing.
# To run mutation testing locally (expensive — don't run in CI):
#   mutmut run --paths-to-mutate=voice_typer/server/text_cleanup.py,voice_typer/server/config.py
# Full configuration is the [tool.mutmut] table below.
[tool.mutmut]
paths_to_mutate = "voice_typer/server/text_cleanup.py,voice_typer/server/config.py,voice_typer/server/tray.py,voice_typer/server/tray_menu.py"
test_command = "pytest -x -q tests/test_text_cleanup.py tests/config tests/test_tray.py tests/test_tray_menu.py"

[tool.setuptools.packages.find]
include = ["voice_typer*"]
# WR-19: exclude voice_typer.client (the JS/TS Electron/Tauri frontend)
# from Python packaging — the directory contains no .py files but the
# `voice_typer*` glob would otherwise match it, producing bogus wheel
# manifest entries and "package init file not found" setuptools warnings.
exclude = ["voice_typer.client*"]

# NEW-DEAD-003: removed the dead HugeIcons font reference (the
# ``assets/fonts/*.ttf`` entry, ~1.9 MB).  The file was referenced as
# package-data but no Python source file ever loaded it — the new
# Electron app uses ``@hugeicons/react`` from npm instead.  The
# ``assets/icons/`` directory referenced 19 SVG files that were also
# unused; that directory doesn't even exist in the current source
# tree (likely removed in an earlier refactor but the package-data
# reference lingered).  Dropping the reference saves 1.9 MB in the
# built wheel and installer.
[tool.pytest.ini_options]
testpaths = ["tests"]
# PERF-007: prevent pytest from crawling into irrelevant directories
# during test collection. Without this, pytest walks .venv/, build/,
# voice_typer/client/node_modules/ etc. checking every .py file for
# test functions — on a 544-file suite the extra stat() calls add up.
# ``.hypothesis`` MUST be listed here: hypothesis writes its example
# database (``.hypothesis/examples/*``) under the repo root, and the
# hypothesis pytest plugin emits a ``UserWarning: Skipping collection
# of '.hypothesis' directory`` on EVERY run when this entry is absent
# (the warning fires whenever ``norecursedirs`` is set explicitly and
# does not include the plugin's own default ignore for ``.hypothesis``).
# Adding ``.hypothesis`` suppresses the warning and prevents pytest
# from attempting to collect the binary ``.hypothesis/examples/`` blobs
# as Python test modules (which would error with SyntaxError on import).
norecursedirs = [".venv", "dist", "build", "node_modules", "voice_typer/client", ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", "voice_typer.egg-info", ".hypothesis"]
# CQ-018: -v --tb=short for readable CI output; previously -q was too terse
# for diagnosing failures in long test suites.
# TEST-011: --cov=voice_typer --cov-fail-under=65 for coverage threshold.
# COV-002: clipboard.py now at 100% coverage (was 40%) via
# tests/clipboard/win32/ (110 new tests mocking ctypes.windll
# on Linux). Global coverage is 65.23% — kept threshold at 65% to avoid
# breaking CI. Aspirational target: 70%. The three modules previously
# cited as blockers now EXCEED 70%:
#   - streaming.py:      88%  (was the #1 blocker; raised via the
#                              tests/test_streaming_*.py suite)
#   - transcription.py:  75%  (raised via tests/test_transcription_*.py)
#   - tray.py:           85%  (raised via tests/test_tray*.py)
# The remaining bottleneck is 0%-coverage modules (e.g. the optional
# cloud-engine adapters under voice_typer/server/cloud_engines.py that
# require API keys to exercise, and platform-specific GUI shells that
# don't run headless). Raising the global threshold above 70% requires
# either stubbing those adapters for tests or excluding them from
# ``[tool.coverage.run].source`` — both are deferred to a separate
# coverage-focused pass.
# Per-module status of pure-python modules called out in the backlog:
#   - config.py:        76%  ✓ (>75% target)
#   - text_cleanup.py:  90%  ✓ (>75% target)
#   - platform_utils.py:82%  ✓ (>75% target)
#   - clipboard.py:    100%  ✓ (was 40%; all 4 target modules now above 75%)
#
# ADR-0020 round-2 fix: the --cov / --timeout flags require pytest-cov /
# pytest-timeout. When those plugins are NOT installed (e.g. a bare
# `pip install pytest` CI job, or a `pip install .` without [test]
# extras), pytest merges these ini addopts into its argv and errors
# before collecting with "unrecognized arguments: --timeout=60
# --timeout-method=thread --cov=voice_typer". To make `pytest` work
# out-of-the-box on a minimal install while still enforcing coverage /
# timeouts in CI (where [test] is installed), keep the flags here AND
# have the root conftest.py register NO-OP stand-in options for the
# missing plugins (see conftest.py — the stand-ins are skipped when the
# real plugin is present, so real coverage/timeout behavior is intact).
# This way:
#   - CI (with [test]): coverage enforced at 65% + 60s test timeout.
#   - Minimal install (no [test]): `pytest` runs without unknown-arg errors.
# WR-1: --strict-markers + --strict-config convert unknown marker typos (e.g.
# `@pytest.mark.rela_pynput` instead of `real_pynput`) and ini-parse errors
# from silent warnings into hard failures at collection time. Without
# --strict-markers, a typo silently disables the autouse-fixture opt-out
# logic in tests/conftest.py:mock_heavy_imports, causing the test to run
# with heavy imports mocked even when the author intended to use real libs.
# WR-1: --timeout=60 --timeout-method=thread activates pytest-timeout
# (declared in [test] extras but never previously wired into addopts). A
# single hung test now fails loudly with `Failed: Timeout >60.0s` instead
# of silently consuming the job-level 30-minute timeout-minutes budget.
# 60s is generous: the longest legitimate test (test_stalled_auth_connection_
# times_out) was patched down to 0.5s in WR-10, so no in-tree test should
# approach the cap.
# Note: removed --cov-fail-under=65 from addopts so local subset runs
# (e.g. `pytest tests/test_foo.py`) don't trip the coverage gate. The
# threshold is still enforced in CI (build.yml pytest step passes
# --cov-fail-under=65 explicitly) and in [tool.coverage.report].fail_under.
# LOCAL RUNS NOTE: `--cov=voice_typer` is intentional for CI parity — it
# instruments every `voice_typer/**` import so the CI coverage report
# matches what a contributor would see locally. The trade-off is that
# `--cov` adds ~15-25% overhead to every test run (line-tracing
# bytecode instrumentation in pytest-cov). For tight local iteration
# loops (TDD on a single module, debugging a flaky test), pass
# `--no-cov` to skip coverage entirely, or `-o addopts=""` to drop ALL
# addopts (also drops --timeout / --strict-markers — prefer `--no-cov`
# for the surgical case). Do NOT remove `--cov=voice_typer` from
# addopts — CI's `pytest tests/ --cov-fail-under=65` step relies on
# the addopts `--cov=voice_typer` to scope the report; removing it
# would silently drop CI coverage enforcement.
# PERF-007: --import-mode=importlib avoids the legacy "prepend" mode
# which copies test files to a temp dir and adjusts sys.path for every
# single file — on a 544-file suite this adds ~1-2s of pure I/O overhead
# at collection time. importlib mode uses importlib.import_module() instead,
# which is both faster and avoids subtle __file__ / __name__ mismatches.
# Safe for this project because no test relies on the "prepend" path
# rewriting behaviour (all imports use the voice_typer namespace package).
addopts = "-v --tb=short --strict-markers --strict-config --timeout=60 --timeout-method=thread --import-mode=importlib --cov=voice_typer"
# ADR-0020 round-2 fix: async tests (tests/tauri/*, tests/test_cloud_engines.py)
# use `async def test_*` without explicit @pytest.mark.asyncio markers.
# `asyncio_mode = "auto"` makes pytest-asyncio treat every async test as
# an asyncio test automatically. Without this, 13 of 38 tauri tests error
# with "async def functions are not natively supported".
asyncio_mode = "auto"
# WR-1: explicitly pin the asyncio fixture loop scope to silence the
# DeprecationWarning emitted by pytest-asyncio 0.24+ when this key is
# unset. The default `function` scope is correct for the project's async
# tests (each test gets its own event loop).
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # NEW-TEST-003: previously ``ignore::ResourceWarning`` was blanket-
    # ignored, hiding real file-handle / socket leaks.  The tray app is
    # a 24/7 long-running process — a 1 KB leak per dictation cycle
    # compounds to ~1 MB/day.  ResourceWarning is the canonical signal
    # for these leaks.  We now only ignore the specific
    # PytestUnraisableExceptionWarning (which fires when __del__ raises
    # during GC and is not actionable), and let ResourceWarning surface
    # so we can fix the underlying leaks.
    # If a specific ResourceWarning is known-noise from a third-party
    # library, add a targeted filter here (e.g.
    # "ignore::ResourceWarning:sounddevice").
    # CQ-006 (removed): the `voice_typer.server.settings is deprecated`
    # filter was deleted — the settings module no longer exists, so the
    # filter was dead config. RULE: when you delete a module, remove its
    # warning filter in the same PR so pyproject.toml never references
    # code that no longer exists.
    # Phase 1c (2026-XX-XX): the `ignore::DeprecationWarning:torch.jit._serialization`
    # filter was REMOVED. The filter was added when `vad.py` loaded
    # Silero VAD via `torch.jit.load(silero_vad.jit)`, which triggered a
    # DeprecationWarning from `torch/jit/_serialization.py`. After the
    # Phase 1a migration, `vad.py` uses `onnxruntime.InferenceSession`
    # (verified via `grep -rn "torch.jit.load" voice_typer/` → 0 hits in
    # the runtime code; the only remaining `torch.jit.load` call is in
    # `scripts/build/export_silero_vad_onnx.py:114`, a build-time script
    # that is NOT imported by pytest). The filter is now dead config —
    # keeping it would violate the same RULE that retired the settings
    # filter above. RULE: when a code path that triggers a warning is
    # deleted, remove the warning filter in the same PR so pyproject.toml
    # never references code that no longer triggers it.
    # pytest-benchmark emits a PytestBenchmarkWarning on every xdist
    # worker startup ("Benchmarks are automatically disabled because
    # xdist plugin is active"). The warning is informational —
    # benchmarks are intentionally skipped under -n auto (C-TEST-3)
    # via @pytest.mark.skipif in tests/test_benchmarks.py. Silencing
    # the plugin's own startup warning keeps CI logs clean without
    # hiding any real test issues.
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
    # Deprecation-warning ratchet: any DeprecationWarning whose source
    # module is under ``voice_typer`` is promoted to an error. This is a
    # ratchet — once a voice_typer deprecation is fixed it can never
    # silently regress. The filter is scoped to ``voice_typer`` (the
    # ``module`` regex field) so third-party DeprecationWarnings (e.g.
    # from torch, sounddevice, faster_whisper) are NOT affected — only
    # warnings raised by code inside the ``voice_typer`` package itself.
    # Listed LAST so it takes precedence (pytest prepends filters in
    # list order; the last entry is checked first by the warnings
    # machinery), ensuring a voice_tyer-originated DeprecationWarning is
    # never swallowed by an earlier ignore rule.
    "error::DeprecationWarning:voice_typer",
]

# ── Python version matrix (intentional divergence) ───────────────────────
# The Python language level is configured DIFFERENTLY across the three
# type-checkers / linters, and the runtime / `.python-version` pin is
# different again. This is intentional — each tool's level is chosen
# for a concrete reason, and aligning them would either break the
# project's stated support window or cause spurious errors:
#
#   Tool / file            | Python level | Why
#   -----------------------+--------------+-------------------------------
#   `.python-version`      | 3.13.7       | The interpreter `uv` installs
#                          |              | for local dev + CI. Matches the
#                          |              | `python-build-standalone`
#                          |              | release used by the Nuitka
#                          |              | sidecar builds (ADR-0020 §4).
#   `[project].requires-`  | >=3.10       | The project's stated support
#   `python`               |              | window (3.10-3.14). Users on
#                          |              | 3.10/3.11 must be able to
#                          |              | install + run the Electron path.
#   `[tool.ruff].target-`  | py310        | Lint at the LOWEST supported
#   `version`              |              | version so syntax we accept
#                          |              | (PEP 604 unions, etc.) is
#                          |              | flagged if it requires 3.10+.
#   `[tool.mypy].python_`  | 3.10         | Type-check at the LOWEST
#   `version`              |              | supported version so mypy
#                          |              | catches 3.11+-only typing
#                          |              | constructs before they ship
#                          |              | (see CQ-058 comment below).
#   `[tool.pyrefly].python`| 3.12         | Pyrefly's `type` statement
#   `-version`             |              | support (PEP 695) + numpy 2.x
#                          |              | stubs require 3.12+ to parse.
#                          |              | Pyrefly is a SOFT CI gate; its
#                          |              | baseline is regenerated at
#                          |              | 3.12 (see [tool.pyrefly].baseline).
#
# Do NOT "fix" this divergence by aligning all three to 3.12 — that
# would let 3.11+-only typing slip through ruff/mypy and break 3.10
# installs at runtime. Conversely, dropping pyrefly to 3.10 would
# prevent it from parsing the numpy 2.x stubs it needs to type-check
# the audio pipeline. The matrix is the minimum-divergence set.
#
# numpy 2.x is the wrinkle mypy cannot dodge: its stubs use 3.12-only
# `type` syntax and mypy cannot even parse them at 3.10 (see CQ-058
# comment on [tool.mypy]). Rather than raise mypy to 3.12, numpy is
# shadowed by a local Any-stub (`voice_typer/mypy_stubs/` via
# `mypy_path`) so the 3.10 floor stays intact for the project's own
# code, and the ~700 latent typing-debt errors that surface once numpy
# resolves are tracked by the count-based ratchet
# (`mypy-baseline.json` + `scripts/mypy_ratchet_check.py`).

[tool.ruff]
target-version = "py310"
# ERR-ERR-006: configure line-length explicitly rather than blanket-ignoring
# E501. 120 matches the existing codebase style (most lines are 100-120 chars);
# only lines exceeding 120 need wrapping. Do NOT raise this further.
line-length = 120
# CQ-018: src paths for ruff to resolve first-party imports correctly
src = ["voice_typer", "tests"]

[tool.ruff.lint]
# CQ-018: extended select beyond basic E/F/W/I
# TRY400 (AP-47 fix): ``log.error`` inside an ``except`` block must be
# ``log.exception`` so the traceback rides the log record - the single
# most important diagnostic field for remote triage. The sweep that
# enabled this rule converted all flagged sites; new in-except
# log.error calls now fail lint instead of regressing silently.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TRY400"]
# ERR-ERR-006: do not blanket-disable E501. The line-length=120 above governs
# the limit; lines that exceed 120 are wrapped manually or split with `\`.
ignore = []

# VP-13: combine same-module import-from statements that differ only by
# an `as` alias (e.g. privacy.py imported _GDPR_PERSONAL_FILES and
# _GDPR_PERSONAL_GLOBS as ... from the same module on consecutive
# statements). Without combine-as-imports, ruff/isort forces a split.
[tool.ruff.lint.isort]
combine-as-imports = true


# SEC-audit-005: model_hashes.json is a data manifest, not source
# code. Ruff parses it as Python (B018 "useless expression" on the top-level
# dict literal, E501 on the single-line _comment). JSON has no multi-line
# string syntax, so the _comment must be one line. Excluding all rules for
# this specific data file is the correct fix — it is not Python source code.
# This is a targeted per-file override, not a global rule disable.
[tool.ruff.lint.per-file-ignores]
"voice_typer/server/model_hashes.json" = ["ALL"]
# scripts/append_review_findings.py is a one-off Phase-3 review-compilation
# tool whose FINDINGS tuples embed multi-hundred-char prose strings (the
# script body is data, not style-governed code). E501 on those lines is
# noise; the ratchet baseline (ruff-baseline.json) predates this file.
"scripts/append_review_findings.py" = ["E501"]
# tests/server/*.py: pytest fixtures (server, mock_app, etc.) are used
# as test-method parameters, which shadow the explicit imports kept
# for IDE type hints. F811 (redefinition) is a false positive for this
# pytest pattern. The DT-37 split test files intentionally use this
# style — see tests/server/conftest.py for the fixture definitions.
"tests/server/*.py" = ["F811"]

[tool.mypy]
# CQ-058: keep at 3.10 (the project's minimum) despite Python 3.12 runtime.
# numpy 2.x `.pyi` uses `type` statement (3.12+): mypy cannot even PARSE the
# real numpy 2.x stubs at the 3.10 language level (a parse error cannot be
# suppressed by ignore_errors / follow_imports). numpy is therefore shadowed
# by a local Any-stub (see `voice_typer/mypy_stubs/numpy/` + `mypy_path`
# below) — it behaves exactly as it effectively did when the stubs failed
# to parse. The project's own typing debt in numpy-dependent modules is
# tracked by the count-based ratchet (see `scripts/mypy_ratchet_check.py`
# + `mypy-baseline.json`), so `make typecheck` stays green while blocking
# NEW errors.
python_version = "3.10"
mypy_path = ["voice_typer/mypy_stubs"]
warn_return_any = true
warn_unused_configs = true
# CQ-018: disallow untyped defs is off by default — the codebase has many
# untyped functions. Enable incrementally per-module if desired.
disallow_untyped_defs = false
# ERR-ERR-006: do not blanket-disable missing-import checking. Per-module
# overrides below enumerate the libraries that genuinely lack type stubs.
ignore_missing_imports = false

# ERR-ERR-006: each module listed here has been verified to ship without
# py.typed marker or stub package. Add new entries only after confirming
# on https://pypi.org that no stub package exists.
[[tool.mypy.overrides]]
# CQ-058: numpy 2.x stubs use `type` (Python 3.12+), but project min is 3.10.
# The real numpy stubs are shadowed by the Any-stub in `voice_typer/mypy_stubs`
# (see `mypy_path` above), so this override only guards the shadow itself.
# Belt-and-braces: if the shadow is ever removed, `ignore_errors` at least
# suppresses semantic errors (though NOT the parse error — see the comment
# on `[tool.mypy]`).
module = ["numpy.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "faster_whisper",
    "pystray",
    "pynput.*",
    "pyperclip",
    "psutil",
    "pyrnnoise",
    # ADR 0007: noisereduce removed (post-capture denoise deleted).
    # DeepFilterNet is optional (deepfilternet extra).
    "df",
    "df.enhance",
    "pycaw.*",
    "comtypes.*",
    "CoreAudio.*",
    "CoreFoundation.*",
    "ApplicationServices.*",
    "Foundation.*",
    "AppKit.*",
    "ctypes.*",
    "ctypes.wintypes",
    # 3.13 mypy gate: modules that ship without py.typed markers.
    # NOTE (ERR-ERR-006 deviation): typeshed stubs DO exist for regex
    # (types-regex) and pywin32 (types-pywin32) — installing them as dev
    # deps would be the stricter route, but the ignore override is the
    # pragmatic repo-wide fix: mypy is a LOCAL-only convenience gate (CI
    # skips it), and the existing list already takes the pragmatic route
    # for libs with partial stubs (e.g. psutil). scipy/ctranslate2 are
    # core deps; win32gui/win32com are platform-only; dbus/pyatspi are
    # optional Linux deps not installed on this host.
    "scipy.*",
    "regex",
    "ctranslate2",
    "win32gui",
    "win32com.*",
    "dbus",
    "pyatspi",
    # ERR-ERR-006 verification (PyPI, 2026-09-07): no stub packages
    # exist for onnxruntime (types-onnxruntime / onnxruntime-stubs /
    # onnxruntime-types all 404) or faster-whisper (types-faster-whisper /
    # faster-whisper-stubs 404), and neither distribution ships a
    # py.typed marker — the import-untyped errors are genuine.
    # `faster_whisper.*` (alongside the exact-module entry above)
    # covers submodule imports such as
    # `faster_whisper.feature_extractor` that the exact entry alone
    # does not match. onnx-asr and tokenizers are deliberately NOT
    # listed: both installed distributions ship py.typed markers, so
    # they resolve as typed modules and need no override.
    "onnxruntime",
    "faster_whisper.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["voice_typer"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 65  # TEST-011 + COV-001: minimum coverage threshold (was 60, raised after consolidation)
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
