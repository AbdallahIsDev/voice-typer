[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-typer"
version = "1.0.0"
description = "Background voice-to-text utility with system tray"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0,<2.0",
    "sounddevice>=0.5,<1.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "pyperclip>=1.8,<2.0",
    "pystray>=0.19,<1.0",
    "Pillow>=9.0,<13.0",
    "pynput>=1.7,<2.0",
    "transformers>=4.40,<6.0",
    "accelerate>=0.26,<2.0",
    # SUPPLY-001: psutil is used by _another_voice_typer_alive
    # (ARCH-012) and is required for process scanning on all platforms.
    "psutil>=5.9,<7.0",
    # Volume ducking on Windows (pycaw + comtypes).
    # Lazy-imported in WinVolumeBackend — safe on other platforms.
    "pycaw>=20230407; sys_platform == 'win32'",
    "comtypes>=1.1; sys_platform == 'win32'",
    # Volume ducking on macOS (CoreAudio via pyobjc).
    # Lazy-imported in MacVolumeBackend — safe on other platforms.
    "pyobjc-core>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreAudio>=9.0; sys_platform == 'darwin'",
]

[project.scripts]
voice-typer = "voice_typer.server.app:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mock"]
# Windows volume ducking — kept as alias for explicit pip install .[windows]
windows = ["pycaw>=20230407", "comtypes>=1.1"]
# macOS volume ducking — kept as alias for explicit pip install .[macos]
macos = ["pyobjc-core>=9.0", "pyobjc-framework-CoreAudio>=9.0"]
# Noise filtering (optional — high-pass + gate use scipy which is already a dep)
noise-filter = [
    "noisereduce>=3.0",
    # rnnoise-webrtc provides prebuilt wheels for win/mac/linux
    "rnnoise-webrtc>=1.0; platform_machine != 'arm64' or sys_platform != 'darwin'",
]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["voice_typer", "tests"]

[tool.setuptools.packages.find]
include = ["voice_typer*"]

[tool.setuptools.package-data]
"voice_typer.server" = ["assets/fonts/hgi-stroke-rounded.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["voice_typer"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
