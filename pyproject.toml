[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-typer"
version = "1.0.0"
description = "Background voice-to-text utility with system tray"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0,<2.0",
    "sounddevice>=0.5,<1.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "pyperclip>=1.8,<2.0",
    "pystray>=0.19,<1.0",
    "Pillow>=9.0,<13.0",
    "pynput>=1.7,<2.0",
    "flet>=0.25,<1.0",
    "transformers>=4.40,<6.0",
    "accelerate>=0.26,<2.0",
]

[project.scripts]
voice-typer = "voice_typer.server.app:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mock"]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["voice_typer", "tests"]

[tool.setuptools.packages.find]
include = ["voice_typer*"]

[tool.setuptools.package-data]
"voice_typer.server" = ["assets/fonts/hgi-stroke-rounded.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["voice_typer"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
