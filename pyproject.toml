[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-typer"
version = "1.0.0"
description = "Background voice-to-text utility with system tray"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0,<2.0",
    "sounddevice>=0.5,<1.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "pyperclip>=1.8,<2.0",
    "pystray>=0.19,<1.0",
    "Pillow>=9.0,<12.0",
    "pynput>=1.7,<2.0",
    "flet>=0.25,<1.0",
]

[project.scripts]
voice-typer = "voice_typer.app:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mock"]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["voice_typer", "tests"]

[tool.setuptools.packages.find]
include = ["voice_typer*"]

[tool.setuptools.package-data]
voice_typer = ["assets/fonts/hgi-stroke-rounded.ttf"]
